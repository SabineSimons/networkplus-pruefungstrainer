const BANK=[{"n":7,"prompt":"Welcher der folgenden Schritte der Fehlerbehebungsmethodik würde am ehesten das Prüfen jeder Ebene des OSI-Modells beinhalten, nachdem das Problem identifiziert wurde?","options":[["A","Eine Theorie aufstellen."],["B","Die Lösung umsetzen."],["C","Einen Maßnahmenplan erstellen."],["D","Die Funktionalität überprüfen."]],"answers":["A"],"explanation":"Nach der Problembeschreibung wird zuerst eine wahrscheinliche Ursache als Theorie aufgestellt. Das systematische Prüfen der OSI-Schichten hilft dabei, diese Theorie einzugrenzen.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":8,"prompt":"Bei der Fehlerbehebung einer VoIP-Telefonverbindung kann der Laptop eines Technikers über denselben Port erfolgreich auf Netzwerkressourcen zugreifen. Der Techniker muss den Port am Switch identifizieren. Welche der folgenden Technologien sollte der Techniker verwenden, um Switch und Port zu bestimmen?","options":[["A","LLDP"],["B","IKE"],["C","VLAN"],["D","netstat"]],"answers":["A"],"explanation":"LLDP meldet Nachbargeräte sowie den lokalen Switchport. Damit lässt sich erkennen, an welchem Switch und an welcher Schnittstelle das VoIP-Telefon angeschlossen ist.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":9,"prompt":"Ein Netzwerkadministrator muss einen Dateiserver einrichten, auf den Benutzer zugreifen können. Die Organisation verwendet DHCP zur Vergabe von IP-Adressen. Welche der folgenden Lösungen sollte der Administrator am besten einrichten?","options":[["A","Einen separaten Scope für den Dateiserver mit einem /32-Subnetz"],["B","Eine Reservierung für den Server anhand der MAC-Adresse"],["C","Eine statische IP-Adresse innerhalb des DHCP-Adressbereichs"],["D","SLAAC für den Server"]],"answers":["B"],"explanation":"Eine DHCP-Reservierung koppelt immer dieselbe IP-Adresse an die MAC-Adresse des Servers. Der Server bleibt dadurch zuverlässig erreichbar, ohne eine statische Adresse innerhalb des dynamischen Pools zu verwenden.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":10,"prompt":"Mit welcher der folgenden Technologien werden X.509-Zertifikate am häufigsten in Verbindung gebracht?","options":[["A","PKI"],["B","VLAN-Tagging"],["C","LDAP"],["D","MFA"]],"answers":["A"],"explanation":"X.509-Zertifikate gehören zur Public-Key-Infrastruktur. Eine PKI stellt Zertifikate aus, verwaltet sie und prüft die Vertrauenskette.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":11,"prompt":"Ein Netzwerkadministrator möchte einen Authentifizierungsprozess für einen temporären Zugang zum Netzwerk einer Organisation einrichten. Welche der folgenden Technologien würde diesen Prozess ermöglichen?","options":[["A","Captive Portal"],["B","Enterprise Authentication"],["C","Ad-hoc-Netzwerk"],["D","WPA3"]],"answers":["A"],"explanation":"Ein Captive Portal leitet neue Benutzer zunächst auf eine Anmelde- oder Bestätigungsseite. Der Zugriff kann anschließend zeitlich begrenzt freigeschaltet werden.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":12,"prompt":"Ein Benutzer kann eine Website nicht aufrufen, weil die angegebene URL nicht in die richtige IP-Adresse aufgelöst wird. Andere Benutzer können die gewünschte Website ohne Probleme aufrufen. Was verursacht dieses Problem am wahrscheinlichsten?","options":[["A","Hosts-Datei"],["B","Selbstsigniertes Zertifikat"],["C","Nameserver-Eintrag"],["D","IP Helper"]],"answers":["A"],"explanation":"Wenn nur ein einzelner Rechner den Namen falsch auflöst, ist ein lokaler Eintrag wahrscheinlich. Die Hosts-Datei kann DNS für genau diesen Rechner überschreiben.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":13,"prompt":"Ein Netzwerkadministrator plant, eine Unternehmensanwendung in der Cloud zu hosten und sie allen internen Benutzern sowie Benutzern von Drittanbietern zur Verfügung zu stellen. Welches der folgenden Konzepte beschreibt diese Anordnung?","options":[["A","Multitenancy"],["B","VPC"],["C","NFV"],["D","SaaS"]],"answers":["A"],"explanation":"Mandantenfähigkeit erlaubt mehreren getrennten Benutzergruppen, dieselbe Cloudanwendung gemeinsam zu nutzen. Ihre Daten und Berechtigungen bleiben dabei logisch voneinander getrennt.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":14,"prompt":"Welche der folgenden Möglichkeiten sollte verwendet werden, um Remotezugriff auf ein Netzwerkgerät zu erhalten, das nicht ordnungsgemäß gestartet ist?","options":[["A","Crash Cart"],["B","Jump Box"],["C","Secure Shell"],["D","Out-of-Band-Management"]],"answers":["D"],"explanation":"Out-of-Band-Management nutzt einen unabhängigen Verwaltungsweg. Damit bleibt ein Gerät erreichbar, auch wenn sein Betriebssystem oder das normale Produktionsnetz nicht funktioniert.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":15,"prompt":"Welcher der folgenden Angriffe verwendet ein Netzwerkpaket, das mehrere Netzwerk-Tags enthält?","options":[["A","MAC Flooding"],["B","VLAN Hopping"],["C","DNS Spoofing"],["D","ARP Poisoning"]],"answers":["B"],"explanation":"Beim VLAN-Hopping werden manipulierte Frames mit mehreren 802.1Q-Tags eingesetzt. Dadurch soll Verkehr unerlaubt in ein anderes VLAN gelangen.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":16,"prompt":"Ein Netzwerkadministrator konfiguriert einen neuen Switch und möchte zwei Ports mit dem Core-Switch verbinden, um Redundanz sicherzustellen. Welche der folgenden Konfigurationen erfüllt diese Anforderung?","options":[["A","Full Duplex"],["B","802.1Q-Tagging"],["C","Native VLAN"],["D","Link Aggregation"]],"answers":["D"],"explanation":"Link Aggregation bündelt mehrere physische Ports zu einer logischen Verbindung. Das erhöht die verfügbare Bandbreite und bietet Redundanz bei einem Linkausfall.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":17,"prompt":"Welcher der folgenden Ports wird für sicheren E-Mail-Verkehr verwendet?","options":[["A","25"],["B","110"],["C","143"],["D","587"]],"answers":["D"],"explanation":"Port 587 wird für die authentifizierte Mailübermittlung durch Clients verwendet und normalerweise mit STARTTLS abgesichert.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":18,"prompt":"Ein Kunde möchte nach einem kürzlich erfolgten Sicherheitsvorfall die allgemeine Sicherheit erhöhen. Welche der folgenden Maßnahmen sollten am besten umgesetzt werden? (Wähle zwei.)","options":[["A","Netzwerkzugriff nach dem Least-Privilege-Prinzip"],["B","Dynamische Inventarisierung"],["C","Zentrale Richtlinienverwaltung"],["D","Zero-Touch-Provisioning"],["E","Verhindern von Configuration Drift"],["F","Begrenzung von Subnetzbereichen"]],"answers":["A","C"],"explanation":"Least Privilege begrenzt jeden Benutzer auf die wirklich benötigten Rechte. Eine zentrale Richtlinienverwaltung sorgt dafür, dass diese Regeln einheitlich und kontrollierbar umgesetzt werden.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":19,"prompt":"Welcher der folgenden Punkte ist ein kosteneffizienter Vorteil eines Split-Tunnel-VPNs?","options":[["A","Webverkehr wird durch einen Webfilter geleitet."],["B","Für die Internetverbindung des Unternehmens wird mehr Bandbreite benötigt."],["C","Die Überwachung erkennt unsichere Geräte im Unternehmensnetzwerk."],["D","Cloud-basierter Datenverkehr fließt außerhalb des Unternehmensnetzwerks."]],"answers":["D"],"explanation":"Beim Split Tunnel geht nur Unternehmensverkehr durch das VPN. Direkter Cloud- und Internetverkehr belastet die Unternehmensleitung deshalb nicht zusätzlich.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":20,"prompt":"Ein Netzwerktechniker untersucht die schlechte Leistung einer Webanwendung. Das Büro verfügt über zwei Internetverbindungen, die sich die Verkehrslast teilen. Welches der folgenden Tools sollte der Techniker verwenden, um festzustellen, welche Verbindung für die Webanwendung verwendet wird?","options":[["A","netstat"],["B","nslookup"],["C","ping"],["D","tracert"]],"answers":["D"],"explanation":"tracert zeigt die Routerstationen auf dem Weg zum Ziel. So lässt sich erkennen, über welche der beiden Internetverbindungen die Webanwendung erreicht wird.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":21,"prompt":"Welcher der folgenden Angriffe kann dazu führen, dass Benutzer, die auf die Website eines Unternehmens zugreifen möchten, auf eine vollständig andere Website umgeleitet werden?","options":[["A","DNS Poisoning"],["B","Denial-of-Service"],["C","Social Engineering"],["D","ARP Spoofing"]],"answers":["A"],"explanation":"DNS-Poisoning manipuliert Namensauflösungen. Benutzer werden dadurch trotz richtiger Webadresse zu einer falschen IP-Adresse und damit zu einer anderen Website geleitet.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":22,"prompt":"Im Rahmen eines Angriffs bringt ein Angreifer die Content-Addressable-Memory-(CAM)-Tabelle eines Switches absichtlich zum Überlaufen. Für welche Art von Angriff ist dieses Szenario ein Beispiel?","options":[["A","ARP Spoofing"],["B","Evil Twin"],["C","MAC Flooding"],["D","DNS Poisoning"]],"answers":["C"],"explanation":"Beim MAC-Flooding wird die CAM-Tabelle mit vielen gefälschten MAC-Adressen gefüllt. Der Switch kann anschließend Verkehr wie ein Hub an mehrere Ports weiterleiten.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":23,"prompt":"Ein Unternehmensbüro verfügt über öffentlich zugängliche Besprechungsräume mit Netzwerkanschlüssen. Ein kürzlich durchgeführtes Audit ergab, dass Besucher auf das Unternehmensnetzwerk zugreifen konnten, indem sie private Laptops an freie Netzwerkports anschlossen. Welche der folgenden Maßnahmen sollte das Unternehmen einführen, um dies künftig zu verhindern?","options":[["A","URL-Filter"],["B","VPN"],["C","ACLs"],["D","NAC"]],"answers":["D"],"explanation":"Network Access Control prüft Gerät und Benutzer, bevor ein Netzwerkport freigegeben wird. Ein fremder Laptop erhält dadurch nicht automatisch Zugang zum Unternehmensnetz.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":24,"prompt":"Ein Benutzer informiert einen Netzwerkadministrator darüber, dass er den Zugriff auf einen entfernten Dateiserver verloren hat. Der Netzwerkadministrator kann den Server anpingen und stellt fest, dass die aktuellen Firewallregeln den Zugriff auf die Netzwerkfreigabe nicht blockieren. Welches der folgenden Tools würde helfen festzustellen, welche Ports auf dem entfernten Dateiserver geöffnet sind?","options":[["A","dig"],["B","nmap"],["C","tracert"],["D","nslookup"]],"answers":["B"],"explanation":"nmap scannt einen entfernten Host auf erreichbare Ports und Dienste. Damit lässt sich prüfen, ob der Dateifreigabedienst überhaupt geöffnet ist.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":25,"prompt":"Welche der folgenden Technologien ist die beste Wahl, um Anfragen entgegenzunehmen und den Benutzerverkehr auf mehrere Webserver zu verteilen?","options":[["A","Router"],["B","Switch"],["C","Firewall"],["D","Load Balancer"]],"answers":["D"],"explanation":"Ein Load Balancer nimmt Anfragen entgegen und verteilt sie auf mehrere Webserver. Das verbessert Auslastung, Leistung und Verfügbarkeit.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":26,"prompt":"Ein Unternehmen betreibt einen sicheren Server, bei dem sämtliche Verbindungen zum Server verschlüsselt sein müssen. Ein Junior-Administrator muss den Webserver härten. Auf dem Webserver sind folgende Ports geöffnet. Welcher der folgenden Ports sollte deaktiviert werden?","options":[["A","22"],["B","80"],["C","443"],["D","587"]],"answers":["B"],"explanation":"Port 80 steht für unverschlüsseltes HTTP. Wenn ausschließlich verschlüsselte Webverbindungen erlaubt sein sollen, muss HTTP deaktiviert und HTTPS verwendet werden.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":27,"prompt":"Welcher der folgenden Schritte ist als Nächstes durchzuführen, nachdem eine Theorie zur Ursache eines Problems erfolgreich getestet wurde?","options":[["A","Schritte zur Behebung festlegen."],["B","Das Problem in einer Laborumgebung reproduzieren."],["C","Die Theorie zur Genehmigung vorlegen."],["D","Die Lösung für das Problem umsetzen."]],"answers":["A"],"explanation":"Nach einer bestätigten Ursache werden die konkreten Lösungsschritte und ihre möglichen Auswirkungen geplant, bevor Änderungen umgesetzt werden.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":28,"prompt":"Ein Netzwerkadministrator konfiguriert einen neuen Switch und möchte sicherstellen, dass nur zugewiesene Geräte eine Verbindung mit dem Switch herstellen können. Was sollte der Administrator tun?","options":[["A","ACLs konfigurieren."],["B","Ein Captive Portal implementieren."],["C","Port Security aktivieren."],["D","Nicht benötigte Dienste deaktivieren."]],"answers":["C"],"explanation":"Port Security beschränkt einen Switchport auf erlaubte MAC-Adressen oder eine festgelegte Anzahl von Geräten. Unbekannte Geräte können dadurch blockiert werden.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":29,"prompt":"Ein Kunde benötigt sechs nutzbare IP-Adressen. Welche der folgenden Optionen erfüllt diese Anforderung am besten?","options":[["A","255.255.255.128"],["B","255.255.255.192"],["C","255.255.255.224"],["D","255.255.255.240"]],"answers":["D"],"explanation":"255.255.255.240 entspricht /28 und bietet 14 nutzbare Hostadressen. Ein /29 mit genau sechs nutzbaren Hosts wäre noch effizienter, steht hier aber nicht zur Auswahl; /28 ist deshalb die kleinste angebotene passende Maske.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":30,"prompt":"Ein Benutzer mit der IP-Adresse 192.168.1.10/24 und dem Standardgateway 192.168.1.254 meldet sporadische Verbindungsprobleme. In der ARP-/Port-Tabelle des Switches erscheint 192.168.1.10 in VLAN 10 mit zwei verschiedenen MAC-Adressen an eth4 und eth6. Was ist die wahrscheinlichste Ursache?","options":[["A","Ein Port mit falsch zugewiesenem VLAN"],["B","Ein Switch mit einem Spanning-Tree-Konflikt"],["C","Ein anderer PC mit manuell konfigurierter IP-Adresse"],["D","Ein Router mit sich überschneidenden Routingtabellen"]],"answers":["C"],"explanation":"Wenn dieselbe IPv4-Adresse mit unterschiedlichen MAC-Adressen auftaucht, verwenden sehr wahrscheinlich zwei Endgeräte dieselbe Adresse. Eine manuell konfigurierte, bereits belegte IP-Adresse verursacht dann den sporadischen Adresskonflikt.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":31,"prompt":"Welche der folgenden Darstellungen wird erstellt, um die Wirksamkeit der WLAN-Abdeckung in einem Gebäude zu veranschaulichen?","options":[["A","Logisches Diagramm"],["B","Layer-3-Netzwerkdiagramm"],["C","Service Level Agreement"],["D","Heatmap"]],"answers":["D"],"explanation":"Eine WLAN-Heatmap stellt Signalstärke und Abdeckung räumlich dar. Schwache Bereiche und mögliche Funklöcher werden dadurch sichtbar.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":32,"prompt":"Welches der folgenden Cloud-Bereitstellungsmodelle wird am häufigsten mit Multitenancy in Verbindung gebracht und in der Regel von einem Dienstanbieter angeboten?","options":[["A","Private Cloud"],["B","Community Cloud"],["C","Public Cloud"],["D","Hybrid Cloud"]],"answers":["C"],"explanation":"Eine Public Cloud wird von einem Anbieter für viele Kunden betrieben. Die gemeinsame Infrastruktur mit logischer Trennung ist typische Mandantenfähigkeit.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":33,"prompt":"Ein Netzwerkadministrator muss auf einem Layer-3-fähigen Gerät ein SVI erstellen, um Sprach- und Datenverkehr voneinander zu trennen. Welche der folgenden Aussagen beschreibt diesen Anwendungsfall am besten?","options":[["A","Ein physisches Interface zum Trunking logischer Ports"],["B","Ein physisches Interface für den Managementzugriff"],["C","Ein logisches Interface zum Routing von VLANs"],["D","Ein logisches Interface, das verwendet wird, wenn nicht genügend physische Ports vorhanden sind"]],"answers":["C"],"explanation":"Ein SVI ist die logische Layer-3-Schnittstelle eines VLANs. Es stellt meist das Standardgateway bereit und ermöglicht Routing zwischen VLANs.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":34,"prompt":"Ein Netzwerkadministrator modernisiert eine WLAN-Umgebung. Bei der Platzierung der Access Points überlappen sich deren Funkbereiche geringfügig. Welche der folgenden 2,4-GHz-Kanäle sollten gewählt werden, damit sie sich nicht gegenseitig stören?","options":[["A","1, 3, 5"],["B","1, 6, 11"],["C","2, 6, 10"],["D","3, 6, 9"]],"answers":["B"],"explanation":"Bei 20 MHz Kanalbreite überlappen sich im 2,4-GHz-Band die Kanäle 1, 6 und 11 nicht. Diese Kombination reduziert Gleichkanalstörungen.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":35,"prompt":"Bei welchem der folgenden Netzwerkkabel wird Licht an einer schützenden Ummantelung reflektiert?","options":[["A","Twinaxial"],["B","Koaxial"],["C","Singlemode"],["D","Multimode"]],"answers":["D"],"explanation":"In Multimode-Glasfaser breitet sich Licht über mehrere Ausbreitungswege aus und wird im Kern geführt. Sie eignet sich vor allem für kürzere Strecken.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":36,"prompt":"Welche der folgenden Lösungen würde es einem Netzwerkadministrator ermöglichen, Angriffe aus dem Internet zu analysieren, ohne die Latenz zu beeinflussen?","options":[["A","IPS"],["B","IDS"],["C","Load Balancer"],["D","Firewall"]],"answers":["B"],"explanation":"Ein passives IDS analysiert eine Kopie des Datenverkehrs und liegt nicht direkt im Datenpfad. Dadurch erkennt es Angriffe, ohne zusätzliche Weiterleitungslatenz zu verursachen.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":37,"prompt":"Ein Techniker untersucht WLAN-Verbindungsprobleme in der Nähe eines Pausenraums. Immer wenn ein Benutzer die Mikrowelle einschaltet, verliert dessen Laptop die Verbindung. Welches der folgenden Frequenzbänder verwendet der Laptop am wahrscheinlichsten?","options":[["A","2,4 GHz"],["B","5 GHz"],["C","6 GHz"],["D","900 MHz"]],"answers":["A"],"explanation":"Mikrowellen arbeiten ungefähr im 2,4-GHz-Bereich. Deshalb können sie WLAN-Verbindungen in diesem Frequenzband stark stören.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":38,"prompt":"Ein Netzwerkadministrator muss Routing-Funktionen in einem Hypervisor implementieren. Welche der folgenden Technologien sollte der Administrator am wahrscheinlichsten einsetzen?","options":[["A","VPC"],["B","Firewall"],["C","NFV"],["D","IaaS"]],"answers":["C"],"explanation":"Network Functions Virtualization bildet Funktionen wie Routing, Firewall oder Load Balancing als Software auf virtualisierter Hardware ab.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":39,"prompt":"Ein Netzwerktechniker muss Patchkabel vom UTP-Patchpanel zum Access-Switch für neu bezogene Büroräume installieren. Das Patchpanel ist nicht beschriftet, sodass sich die Buchsen nicht einfach zuordnen lassen. Welches der folgenden Werkzeuge ermöglicht am einfachsten die Identifizierung des passenden Patchpanel-Ports?","options":[["A","Tongenerator"],["B","Laptop"],["C","Kabeltester"],["D","Visual Fault Locator"]],"answers":["A"],"explanation":"Ein Tongenerator speist ein Signal in die Leitung ein; mit der Sonde wird es am Patchpanel gefunden. So kann ein unbeschriftetes Kabel eindeutig zugeordnet werden.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":40,"prompt":"Ein Netzwerkadministrator erhält Beschwerden über sporadische Netzwerkverbindungsprobleme. Bei der Untersuchung stellt er fest, dass das Netzwerkdesign mögliche Schleifen enthält. Was sollte der Administrator tun?","options":[["A","Spanning Tree aktivieren."],["B","Port Security konfigurieren."],["C","Die Geschwindigkeitsbegrenzungen der Switchports ändern."],["D","802.1Q-Tagging erzwingen."]],"answers":["A"],"explanation":"Spanning Tree erkennt redundante Layer-2-Wege und blockiert einen davon logisch. Dadurch werden Switching-Schleifen und Broadcast-Stürme verhindert.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":41,"prompt":"Welche der folgenden Routing-Technologien verwendet einen Successor und einen Feasible Successor?","options":[["A","IS-IS"],["B","OSPF"],["C","BGP"],["D","EIGRP"]],"answers":["D"],"explanation":"EIGRP berechnet einen Successor als besten Weg und kann einen Feasible Successor als sofort nutzbaren, schleifenfreien Ersatzweg bereithalten.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":42,"prompt":"Welche der folgenden Aussagen beschreibt am besten, wofür eine Organisation Port Address Translation verwenden würde?","options":[["A","VLANs am Netzwerkrand"],["B","Eine öffentliche Adresse pro internem Endgerät"],["C","Viele private Adressen über eine öffentliche Adresse am Perimeter-Router"],["D","Server am Netzwerkrand"]],"answers":["C"],"explanation":"PAT übersetzt viele private, nicht öffentlich routbare Quelladressen auf eine gemeinsame öffentliche Adresse. Unterschiedliche Portnummern halten die einzelnen Verbindungen auseinander.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":43,"prompt":"Ein Unternehmen implementiert eine WLAN-Lösung in einer Umgebung mit sehr hoher Gerätedichte. Welcher der folgenden 802.11-Standards wird verwendet, wenn das Unternehmen insbesondere auf Gerätesättigung und Abdeckung achten muss?","options":[["A","802.11ac"],["B","802.11ax"],["C","802.11g"],["D","802.11n"]],"answers":["B"],"explanation":"802.11ax beziehungsweise Wi-Fi 6 wurde für hohe Gerätedichte optimiert. OFDMA und weitere Verfahren verbessern Kapazität und Effizienz in stark belegten WLANs.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":44,"prompt":"Welche der folgenden Arten von Netzwerkverkehr wird an alle Knoten im Netzwerk gesendet?","options":[["A","Unicast"],["B","Broadcast"],["C","Multicast"],["D","Anycast"]],"answers":["B"],"explanation":"Broadcast-Verkehr wird an alle Geräte innerhalb derselben Broadcast-Domäne gesendet.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":45,"prompt":"Welcher der folgenden Kabeltypen bietet die höchstmögliche Übertragungsgeschwindigkeit?","options":[["A","Plenum"],["B","Ethernet"],["C","Glasfaser"],["D","DAC"]],"answers":["C"],"explanation":"Glasfaser bietet sehr hohe Bandbreite, große Reichweite und ist unempfindlich gegen elektromagnetische Störungen.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":46,"prompt":"Welche der folgenden Schichten des OSI-Modells ist für Ende-zu-Ende-Verschlüsselung zuständig?","options":[["A","Darstellungsschicht"],["B","Anwendungsschicht"],["C","Sitzungsschicht"],["D","Transportschicht"]],"answers":["A"],"explanation":"Im klassischen OSI-Modell ist die Darstellungsschicht für Formatierung, Komprimierung und Verschlüsselung von Daten zuständig.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":47,"prompt":"Ein Netzwerksicherheitsadministrator muss die Inhalte von Daten überwachen, die zwischen einem sicheren Netzwerk und dem übrigen Unternehmen übertragen werden. Welche der folgenden Überwachungsmethoden erfüllt diese Aufgabe?","options":[["A","Port Mirroring"],["B","Flow-Daten"],["C","Syslog-Einträge"],["D","SNMP-Traps"]],"answers":["A"],"explanation":"Port Mirroring kopiert den Verkehr eines Ports oder VLANs zu einem Analyseport. Dort kann ein Sensor den vollständigen Inhalt untersuchen.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":48,"prompt":"Was stellt ein Full-Tunnel-VPN bereit?","options":[["A","Geringeren Bandbreitenbedarf"],["B","Die Möglichkeit, lokale Computerkennwörter zurückzusetzen"],["C","Unternehmensseitige Prüfung des gesamten Netzwerkverkehrs"],["D","Zugriff auf gesperrte Websites"]],"answers":["C"],"explanation":"Beim Full Tunnel läuft der gesamte Verkehr des Clients durch das Unternehmens-VPN. Das Unternehmen kann ihn dadurch zentral prüfen und filtern.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":49,"prompt":"Welche Eigenschaft stellt ein Hash bereit?","options":[["A","Nichtabstreitbarkeit"],["B","Integrität"],["C","Vertraulichkeit"],["D","Verfügbarkeit"]],"answers":["B"],"explanation":"Ein Hashwert macht Veränderungen an Daten erkennbar. Stimmen die Hashwerte nicht überein, wurde die Integrität verletzt.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":50,"prompt":"Ein Unternehmen möchte für nicht kritische Anwendungen einen Disaster-Recovery-Standort einrichten, bei dem eine kurze Ausfallzeit toleriert werden kann. Welche Art von Standort sollte das Unternehmen wählen?","options":[["A","Hot Site"],["B","Cold Site"],["C","Warm Site"],["D","Passive Site"]],"answers":["C"],"explanation":"Eine Warm Site besitzt bereits Teile der Infrastruktur, muss aber noch fertig eingerichtet oder mit Daten versorgt werden. Sie passt zu Anwendungen, die eine begrenzte Ausfallzeit vertragen.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":51,"prompt":"Welches der folgenden XML-basierten Sicherheitskonzepte funktioniert, indem sensible Informationen über Benutzer, z. B. Anmeldeinformationen und Attribute, an Anbieter weitergegeben werden?","options":[["A","IAM"],["B","MFA"],["C","RADIUS"],["D","SAML"]],"answers":["D"],"explanation":"SAML ist ein XML-basiertes Verfahren zum Austausch von Authentifizierungs- und Attributinformationen zwischen Identity Provider und Service Provider.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":52,"prompt":"Welche Routing-Technologie unterstützt Load Balancing über Pfade mit ungleichen Kosten und verwendet die IP-Protokollnummer 88?","options":[["A","EIGRP"],["B","BGP"],["C","RIP"],["D","OSPF"]],"answers":["A"],"explanation":"EIGRP unterstützt Lastverteilung über Pfade mit ungleichen Kosten. Es verwendet IP-Protokollnummer 88; das ist keine TCP- oder UDP-Portnummer.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":53,"prompt":"Ein WLAN-Berater stellt eine große Anzahl von WAPs bereit und möchte sie zentral über einen einzelnen Wireless-LAN-Controller steuern. Welchen der folgenden Netzwerktypen sollte der Berater einsetzen?","options":[["A","Mesh"],["B","Infrastructure"],["C","Point-to-Point"],["D","Ad hoc"]],"answers":["B"],"explanation":"Im Infrastructure Mode verbinden sich Clients über Access Points. Viele APs können dabei zentral durch einen Wireless-LAN-Controller verwaltet werden.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":54,"prompt":"Bei welcher der folgenden Netzwerktopologien wird der gesamte Datenverkehr über einen einzigen zentralen Punkt geleitet?","options":[["A","Mesh"],["B","Hybrid"],["C","Hub-and-Spoke"],["D","Point-to-Point"]],"answers":["C"],"explanation":"Bei Hub-and-Spoke führt der Verkehr der Außenstellen über einen zentralen Hub. Die Spokes besitzen normalerweise keine direkten Verbindungen untereinander.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":55,"prompt":"Welche der folgenden Funktionen wird verwendet, um Netzwerkverkehr anhand seiner Art zu priorisieren?","options":[["A","QoS"],["B","VPN"],["C","CDN"],["D","TTL"]],"answers":["A"],"explanation":"Quality of Service klassifiziert und priorisiert zeitkritischen Verkehr wie Sprache oder Video gegenüber weniger empfindlichen Daten.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":56,"prompt":"Welche der folgenden Faktoren bestimmen am wahrscheinlichsten die erforderliche Größe eines Racks für eine Installation? (Wähle zwei.)","options":[["A","Größe des KVM"],["B","Tiefe des Switches"],["C","Größe der Festplatte"],["D","Geschwindigkeit des Lüfters"],["E","Stromstärke der Steckdose"],["F","Höhe des Servers"]],"answers":["B","F"],"explanation":"Die Höhe eines Racks wird in Höheneinheiten für die Server bestimmt; seine Tiefe muss zu den längsten Geräten wie Switches oder Servern passen.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":57,"prompt":"Ein Netzwerkadministrator plant die Einführung einer Geräteüberwachung, um die Transparenz im Netzwerk zu verbessern. Das Sicherheitsteam verlangt, dass die Lösung Authentifizierung und Verschlüsselung bereitstellt. Welche der folgenden Lösungen erfüllt diese Anforderungen?","options":[["A","SIEM"],["B","Syslog"],["C","NetFlow"],["D","SNMPv3"]],"answers":["D"],"explanation":"SNMPv3 unterstützt Benutzerauthentifizierung sowie Verschlüsselung. Frühere SNMP-Versionen übertragen Community Strings ohne vergleichbaren Schutz.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":58,"prompt":"Ein Netzwerkadministrator muss ändern, wo die externen DNS-Einträge gehostet werden. Welchen der folgenden Einträge sollte der Administrator beim Registrar ändern, um dies zu erreichen?","options":[["A","NS"],["B","SOA"],["C","PTR"],["D","CNAME"]],"answers":["A"],"explanation":"NS-Einträge legen fest, welche autoritativen Nameserver eine DNS-Zone hosten. Beim Wechsel des DNS-Anbieters werden diese Angaben beim Registrar geändert.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":59,"prompt":"Ein Supportmitarbeiter erhält die Meldung, dass die kabelgebundenen Geräte eines entfernten Benutzers ständig die Verbindung verlieren und nur geringe Geschwindigkeiten erreichen. Bei der Überprüfung stellt der Mitarbeiter fest, dass das Koaxialmodem des Benutzers eine Signalleistung von -97 dB aufweist. Welche Maßnahme sollte der Supportmitarbeiter zur Fehlerbehebung empfehlen?","options":[["A","Alle an die Leitung angeschlossenen Splitter entfernen."],["B","Die Geräte auf WLAN umstellen."],["C","Die Geräte näher an das Modem stellen."],["D","Die Netzwerkgeschwindigkeit verringern."]],"answers":["A"],"explanation":"Jeder Koaxial-Splitter schwächt das Signal. Bei bereits sehr niedriger Signalleistung sollten unnötige Splitter zuerst entfernt werden.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":60,"prompt":"Welche Art der Übertragung verwendet OSPF zur Kommunikation von Routing-Updates?","options":[["A","Unicast"],["B","Anycast"],["C","Multicast"],["D","Broadcast"]],"answers":["C"],"explanation":"OSPF verwendet Multicast-Adressen, um Hello- und Routinginformationen effizient an OSPF-Router im lokalen Segment zu senden.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":61,"prompt":"Ein Speichernetzwerk benötigt weniger Overhead und eine höhere Effizienz für die übertragene Datenmenge. Welche der folgenden Einstellungen sollte ein Techniker am wahrscheinlichsten konfigurieren, um diese Anforderungen zu erfüllen?","options":[["A","Link-Geschwindigkeit"],["B","Jumbo Frames"],["C","QoS"],["D","802.1Q-Tagging"]],"answers":["B"],"explanation":"Jumbo Frames transportieren mehr Nutzdaten pro Ethernet-Frame. Dadurch sinkt der relative Header- und Verarbeitungsaufwand bei großen Speicherübertragungen.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":62,"prompt":"Ein Sicherheitsadministrator erstellt ein neues Firewall-Objekt für ein Gerät mit der IP-Adresse 192.168.100.1/25. Die Firewallsoftware akzeptiert in den Konfigurationsfeldern jedoch nur die dezimale Punktnotation. Welche der folgenden Subnetzmasken ist korrekt?","options":[["A","255.255.254.0"],["B","255.255.255.1"],["C","255.255.255.128"],["D","255.255.255.192"]],"answers":["C"],"explanation":"/25 entspricht der Punkt-Dezimalmaske 255.255.255.128.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":63,"prompt":"Welche der folgenden Disaster-Recovery-Kennzahlen beschreibt die durchschnittliche Zeitspanne, über die ein Gerät voraussichtlich normal arbeiten kann?","options":[["A","RPO"],["B","RTO"],["C","MTTR"],["D","MTBF"]],"answers":["D"],"explanation":"MTBF gibt die durchschnittliche Betriebsdauer zwischen zwei Ausfällen an und beschreibt damit die erwartete Zuverlässigkeit eines Geräts.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":64,"prompt":"Ein Netzwerkadministrator meldet sich an einem Router an und sieht ein Interface mit der IP-Adresse 10.61.52.34 und der Subnetzmaske 255.255.255.252. Welche der folgenden Aussagen beschreibt am besten, wie diese Interface-IP-Adresse verwendet wird?","options":[["A","Als Point-to-Point-Verbindung"],["B","Zur Verbindung mit dem Internet"],["C","Als virtuelle Adresse für Redundanz"],["D","Für Out-of-Band-Management"]],"answers":["A"],"explanation":"Die Maske /30 stellt genau zwei nutzbare Hostadressen bereit. Das ist typisch für eine klassische Punkt-zu-Punkt-Verbindung zwischen zwei Routern.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":65,"prompt":"Ein Netzwerktechniker führt eine Fehlerbehebung an einer defekten Netzwerkkarte durch und testet seine Theorie. Was sollte der Techniker als Nächstes tun?","options":[["A","Eine Theorie entwickeln."],["B","Einen Maßnahmenplan erstellen."],["C","Die Lösung umsetzen."],["D","Die Ergebnisse dokumentieren."]],"answers":["B"],"explanation":"Nach dem erfolgreichen Test der Theorie wird ein Maßnahmenplan erstellt. Erst danach wird die Lösung kontrolliert umgesetzt.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":66,"prompt":"Ein Netzwerkadministrator konfiguriert Access Points für die Installation in einer Umgebung mit hoher Gerätedichte, in der sich die Funkabdeckung häufig überschneidet. Welche der folgenden Kanalbreiten sollte der Administrator wählen, um Störungen im 2,4-GHz-Spektrum zu minimieren?","options":[["A","11 MHz"],["B","20 MHz"],["C","40 MHz"],["D","80 MHz"],["E","160 MHz"]],"answers":["B"],"explanation":"20 MHz beansprucht im 2,4-GHz-Band weniger Spektrum als 40 MHz. Das reduziert Überlappung in Umgebungen mit vielen Access Points.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":67,"prompt":"Ein Netzwerkmanager möchte den Netzwerkverkehr der an einen Switch angeschlossenen Geräte einsehen. Ein Netzwerktechniker verbindet ein Analysegerät mit einem freien Port des Switches und muss den Switchport konfigurieren, an dem das Gerät angeschlossen ist. Welche der folgenden Optionen sollte der Techniker am besten aktivieren?","options":[["A","Trunking"],["B","Port Mirroring"],["C","Full Duplex"],["D","SNMP"]],"answers":["B"],"explanation":"Port Mirroring kopiert den Verkehr ausgewählter Switchports auf den Anschluss des Analysegeräts.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":68,"prompt":"Ein Netzwerkadministrator installiert 35 PoE-Sicherheitskameras. Nachdem die neuen Kabel installiert und getestet wurden, montiert er die Kameras. Eine kleine Anzahl der Kameras funktioniert jedoch nicht. Was ist die wahrscheinlichste Ursache?","options":[["A","Falscher Verdrahtungsstandard"],["B","PoE-Leistungsbudget überschritten"],["C","Signaldämpfung"],["D","Falsche Spannung"]],"answers":["B"],"explanation":"Ein PoE-Switch kann nur eine begrenzte Gesamtleistung liefern. Ist das PoE-Budget ausgeschöpft, bleiben weitere Kameras trotz intakter Verkabelung ohne Strom.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":69,"prompt":"Ein Netzwerkadministrator untersucht nach einer Firewall-Änderung ein Problem mit einer Anwendung. Er hat bestätigt, dass Port und Protokoll für den Benutzer erreichbar sind, die Anwendung funktioniert jedoch weiterhin nicht richtig. Welches der folgenden Tools ermöglicht es dem Administrator, den Datenverkehr auf der Anwendungsschicht des OSI-Modells zu untersuchen?","options":[["A","ifconfig"],["B","tcpdump"],["C","nslookup"],["D","traceroute"]],"answers":["B"],"explanation":"tcpdump zeichnet Pakete samt Protokolldetails auf. Damit kann der Administrator den Anwendungsverkehr untersuchen, obwohl Port und Erreichbarkeit grundsätzlich funktionieren.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":70,"prompt":"Welchen der folgenden Ports sollte ein Netzwerkadministrator für eine verschlüsselte Anmeldung an einem Netzwerk-Switch aktivieren?","options":[["A","22"],["B","23"],["C","80"],["D","123"]],"answers":["A"],"explanation":"SSH verwendet standardmäßig TCP-Port 22 und ermöglicht eine verschlüsselte Anmeldung an Netzwerkgeräten.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":71,"prompt":"Welche der folgenden Technologien wird verwendet, um Kopien einer Website näher an geografisch verteilten Benutzern bereitzustellen?","options":[["A","VPN"],["B","CDN"],["C","SAN"],["D","SDN"]],"answers":["B"],"explanation":"Ein Content Delivery Network hält Kopien von Inhalten an geografisch verteilten Standorten bereit. Benutzer laden sie von einem näheren Knoten.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":72,"prompt":"Welches der folgenden Geräte stellt Benutzern eine erweiterte Funkabdeckung bereit, sodass sich mehrere Geräte innerhalb eines bestimmten WLANs verbinden können?","options":[["A","Router"],["B","Switch"],["C","Access Point"],["D","Firewall"]],"answers":["C"],"explanation":"Ein Access Point verbindet mehrere WLAN-Clients mit dem kabelgebundenen Netz und erweitert die Funkabdeckung innerhalb der vorgesehenen Zelle.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":73,"prompt":"Ein Administrator konfiguriert einen Switch, der in einem für Kunden zugänglichen Bereich des Büros aufgestellt werden soll. Wie kann der Administrator am besten verhindern, dass unbekannte Geräte eine Verbindung zum Netzwerk herstellen?","options":[["A","SSE"],["B","ACL"],["C","Perimeter-Netzwerk"],["D","802.1X"]],"answers":["D"],"explanation":"802.1X verlangt eine portbasierte Authentifizierung, bevor ein Gerät normalen Netzwerkzugriff erhält.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":74,"prompt":"Welches der folgenden Diagramme würde am wahrscheinlichsten Angaben zu Glasfaser-Steckertypen enthalten?","options":[["A","Logisches Diagramm"],["B","Physisches Diagramm"],["C","Rack-Diagramm"],["D","Routing-Diagramm"]],"answers":["B"],"explanation":"Ein physisches Netzwerkdiagramm zeigt reale Geräte, Leitungen, Patchfelder und Steckverbindertypen. Ein logisches Diagramm konzentriert sich dagegen auf Netze und Datenflüsse.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":75,"prompt":"Was ist der wahrscheinlichste Grund dafür, dass ein Versicherungsmaklerunternehmen die Nutzung eines VPNs verbindlich vorschreibt?","options":[["A","Um sensible Daten während der Übertragung zu verschlüsseln"],["B","Um die Endgeräte abzusichern"],["C","Um vertragliche Vereinbarungen einzuhalten"],["D","Um Anforderungen an die Datenaufbewahrung zu erfüllen"]],"answers":["A"],"explanation":"Ein VPN verschlüsselt sensible Daten während der Übertragung durch ein nicht vertrauenswürdiges Netz.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":76,"prompt":"Eine Organisation ist zu neuen autoritativen DNS-Servern mit anderen Hostnamen gewechselt. Seit dieser Änderung können Kunden die Website der Organisation nicht mehr aufrufen. Welcher DNS-Record muss in der Delegation aktualisiert werden?","options":[["A","AAAA"],["B","CNAME"],["C","MX"],["D","NS"]],"answers":["D"],"explanation":"NS-Records nennen die autoritativen Nameserver einer Zone. Ändern sich deren Hostnamen, muss die Delegation auf die neuen NS-Ziele zeigen; bei In-Bailiwick-Nameservern sind zusätzlich passende Glue Records erforderlich.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":77,"prompt":"Welche der folgenden Umgebungsfaktoren sollten bei der Installation von Geräten in einem Gebäude berücksichtigt werden? (Wähle zwei.)","options":[["A","Brandunterdrückungssystem"],["B","Standort der USV"],["C","Feuchtigkeitsregelung"],["D","Stromlast"],["E","Art der Bodenkonstruktion"],["F","Entfernung zum nächstgelegenen MDF"]],"answers":["A","C"],"explanation":"Brandunterdrückung schützt Geräte bei einem Feuer, und geregelte Luftfeuchtigkeit verhindert statische Entladungen sowie Kondensation.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":78,"prompt":"Ein Kunde hat die Verbindung zu seinem Telefonsystem verloren. Die Administrationskonsole ist mit mehreren Netzwerkschnittstellen konfiguriert und mit mehreren Switches verbunden. Der Netzwerkadministrator führt eine Fehlerbehebung durch und stellt Folgendes fest: • Das Supportteam kann sich remote mit der Administrationskonsole verbinden. • Nach dem Neustart des Switches leuchten Link- und Aktivitätsanzeigen dauerhaft, selbst an ungenutzten Ports. • Ein Neustart des Telefonsystems bringt das System nicht wieder online. • Die Konsole kann erfolgreich direkt mit einzelnen Modulen kommunizieren. Was ist die wahrscheinlichste Ursache für den Verbindungsverlust?","options":[["A","Ein Switch ist ausgefallen."],["B","Die Konsolensoftware muss neu installiert werden."],["C","Die Kabel zu den Modulen müssen ersetzt werden."],["D","Ein Modul ist ausgefallen."]],"answers":["A"],"explanation":"Die Administrationskonsole und die einzelnen Telefonmodule reagieren, das Gesamtsystem verliert aber die Verbindung. Dauerhaft leuchtende Link-/Aktivitätsanzeigen sogar an unbenutzten Switchports sprechen für einen fehlerhaften Switch beziehungsweise eine gestörte Switching-Funktion – nicht für den Ausfall eines einzelnen Telefonmoduls.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":79,"prompt":"Ein Systemadministrator konfiguriert ein neues Gerät, das zum Netzwerk hinzugefügt werden soll. Vor dem Anschluss möchte er das Gerät härten. Welche Maßnahme sollte der Administrator zuerst durchführen?","options":[["A","Die Netzwerk-ACLs aktualisieren."],["B","Das Gerät in einem Screened Subnet platzieren."],["C","Content Filtering aktivieren."],["D","Die Standard-Administratorkennwörter ändern."]],"answers":["D"],"explanation":"Standard-Administratorkennwörter sind öffentlich bekannt und werden automatisiert angegriffen. Sie müssen vor dem Anschluss des Geräts geändert werden.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":80,"prompt":"Ein Netzwerkadministrator muss zwei Netzwerkschränke miteinander verbinden, die 492 Fuß (150 m) voneinander entfernt sind. Welchen Kabeltyp sollte der Administrator zwischen den Schränken installieren?","options":[["A","Singlemode-Glasfaser"],["B","Koaxialkabel"],["C","DAC"],["D","STP"]],"answers":["A"],"explanation":"Für 150 Meter ist Singlemode-Glasfaser eine sichere Wahl mit großer Reichweite und hoher Bandbreite; Kupfer-Ethernet ist normalerweise auf 100 Meter begrenzt.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":81,"prompt":"Ein IT-Manager muss zehn Standorte in einem Mesh-Netzwerk verbinden. Jeder Standort soll abgesichert sein und die Bereitstellungszeit soll möglichst gering sein. Welche der folgenden Technologien erfüllt diese Anforderung am besten?","options":[["A","SD-WAN"],["B","VXLAN"],["C","VPN"],["D","NFV"]],"answers":["A"],"explanation":"SD-WAN verbindet viele Standorte zentral gesteuert und kann sichere Tunnel sowie Richtlinien weitgehend automatisiert bereitstellen.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":82,"prompt":"Welche der folgenden Regelungen ist am ehesten für die Sicherheit und den Umgang mit personenbezogenen Daten in Europa zuständig?","options":[["A","GDPR"],["B","SCADA"],["C","SAML"],["D","PCI DSS"]],"answers":["A"],"explanation":"Die Datenschutz-Grundverordnung regelt Schutz und Verarbeitung personenbezogener Daten in der Europäischen Union.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":83,"prompt":"Eine Organisation hat die Sicherheitsanforderung, dass jede Netzwerkverbindung einem bestimmten Benutzer zugeordnet werden kann. Ein Netzwerkadministrator muss eine passende Lösung für das WLAN bestimmen. Welche Lösung ist am besten geeignet?","options":[["A","Enterprise Authentication implementieren"],["B","Die Nutzung von PSKs vorschreiben"],["C","Ein Captive Portal für Benutzer konfigurieren"],["D","Wired Equivalent Protection erzwingen"]],"answers":["A"],"explanation":"WPA-Enterprise mit zentraler Authentifizierung ordnet jede Verbindung einem individuellen Benutzerkonto zu und liefert nachvollziehbare Protokolle.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":84,"prompt":"Ein Kunde richtet zwischen benachbarten Gebäuden eine Glasfaserverbindung ein. Ein Techniker terminiert das Multimode-Kabel am Glasfaser-Patchpanel. Nachdem das Glasfaser-Patchkabel angeschlossen wurde, leuchtet die Anzeige nicht auf. Welche Maßnahme sollte der Techniker zur Fehlerbehebung zuerst versuchen?","options":[["A","Die Fasern vertauschen."],["B","Die Fasern neu terminieren."],["C","Die Fasergröße überprüfen."],["D","Die Kabelstrecken visuell auf Fehler untersuchen."]],"answers":["A"],"explanation":"Bei einer Duplex-Glasfaserverbindung müssen Sende- und Empfangsfaser gekreuzt sein. Bleibt der Link dunkel, ist ein Vertauschen der beiden Fasern der schnellste erste Test.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":85,"prompt":"Benutzer können die interne Website 10.249.3.76 nicht erreichen. Die Befehlsausgabe zeigt nacheinander die Hops 192.168.25.234, 192.168.3.100 und 10.249.3.1; ab Hop 4 erscheinen nur noch Zeitüberschreitungen. Welches Kommandozeilentool erzeugt eine solche Ausgabe?","options":[["A","tracert"],["B","netstat"],["C","tcpdump"],["D","nmap"]],"answers":["A"],"explanation":"tracert zeigt jeden Router-Hop auf dem Weg zum Ziel und kennzeichnet ausbleibende Antworten mit Zeitüberschreitungen. So lässt sich eingrenzen, ab welchem Abschnitt der Pfad unterbrochen ist.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":86,"prompt":"Nach der Installation eines Cat-8-Kabels mit Passthrough-Steckern stellt ein Elektriker fest, dass die angeschlossenen Kabel starkes Übersprechen aufweisen. Welche Maßnahme sollte der Elektriker zuerst zur Fehlerbehebung durchführen?","options":[["A","Die Stecker auf sich berührende oder freiliegende Adern überprüfen."],["B","Die Standardeinstellungen der angeschlossenen Geräte wiederherstellen."],["C","Die Verbindungen erneut terminieren."],["D","Die Umgebung auf Hochfrequenzstörungen prüfen."]],"answers":["A"],"explanation":"Durchführungsstecker können freiliegende oder sich berührende Leiter hinterlassen. Diese verursachen Störungen oder Kurzschlüsse und sollten zuerst geprüft werden.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":87,"prompt":"Ein Techniker untersucht einen Laptop, der keine Verbindung zu einem Unternehmensserver herstellen kann. Der Techniker vermutet ein Routingproblem. Welchen der folgenden Befehle sollte er zur Identifizierung des Problems verwenden?","options":[["A","tcpdump"],["B","dig"],["C","tracert"],["D","arp"]],"answers":["C"],"explanation":"tracert verfolgt den Weg über die Router zum Ziel. Damit lassen sich Routingabbrüche oder ungewöhnliche Umwege erkennen.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":88,"prompt":"Nach der Installation mehrerer Cat-8-Keystones stellt ein Rechenzentrumsarchitekt bei Tests überdurchschnittlich hohe Störungen fest. Welche Maßnahme sollte er zur Fehlerbehebung durchführen?","options":[["A","Prüfen, ob die Endanschlüsse vor der Terminierung mit Kupferband umwickelt wurden."],["B","Passthrough-Modular-Crimpstecker statt herkömmlicher Crimpstecker verwenden."],["C","RX/TX-Adern mit anderen Pins verbinden."],["D","Einen Geschwindigkeitstest mit einem Gerät durchführen, das höchstens 100 Mbit/s erreicht."]],"answers":["A"],"explanation":"Cat-8-Verbindungen sind stark geschirmt. Eine unsaubere Schirmanbindung an den Enden kann Interferenzen und Übersprechen verursachen.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":89,"prompt":"Ein kleines Unternehmen führt neue Telefone ein. Einige Geräte verfügen über Full-HD-Videokonferenzfunktionen. Der CIO befürchtet, dass das Netzwerk den Datenverkehr ab einem bestimmten Schwellenwert möglicherweise nicht bewältigen kann. Welche der folgenden Einstellungen kann der Netzwerktechniker konfigurieren, um diese Bedenken zu verringern?","options":[["A","Ein VLAN mit einer Geschwindigkeitsbegrenzung von 100 Mbit/s"],["B","Einen IP Helper zur Weiterleitung des VoIP-Verkehrs"],["C","Eine kleinere Subnetzmaske"],["D","Full Duplex auf allen Benutzerports"]],"answers":["A"],"explanation":"Ein eigenes VLAN mit Rate Limit begrenzt den Videoverkehr auf die festgelegte Bandbreite und schützt andere Netzwerkdienste vor Überlastung.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":90,"prompt":"Eine virtuelle Maschine hat folgende Konfiguration: • IPv4-Adresse: 169.254.10.10 • Subnetzmaske: 255.255.0.0 Die virtuelle Maschine kann Systeme am selben Standort erreichen, jedoch keine externen Internetadressen. Was ist die wahrscheinlichste Ursache?","options":[["A","Die Subnetzmaske ist falsch."],["B","Der DHCP-Server ist offline."],["C","Die IP-Adresse ist eine private RFC1918-Adresse."],["D","Der DNS-Server ist nicht erreichbar."]],"answers":["B"],"explanation":"169.254.0.0/16 ist eine automatisch vergebene APIPA-Adresse. Sie erscheint typischerweise, wenn kein DHCP-Server erreicht wird.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":91,"prompt":"Welche der folgenden Kennzahlen wird verwendet, um die durchschnittliche Lebensdauer eines Geräts abzuschätzen?","options":[["A","RPO"],["B","RTO"],["C","MTTR"],["D","MTBF"]],"answers":["D"],"explanation":"MTBF beschreibt die mittlere Zeit zwischen Ausfällen und dient als Kennzahl für die erwartete Lebensdauer beziehungsweise Zuverlässigkeit.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":92,"prompt":"Welche der folgenden Möglichkeiten ist die sicherste Methode für Site-to-Site-Konnektivität?","options":[["A","VXLAN"],["B","IKE"],["C","GRE"],["D","IPSec"]],"answers":["D"],"explanation":"IPSec schützt Standort-zu-Standort-Verbindungen mit Authentifizierung und Verschlüsselung auf der Netzwerkschicht.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":93,"prompt":"Ein Netzwerktechniker terminiert ein Kabel an einem Glasfaser-Patchpanel im MDF. Welcher Steckertyp wird am wahrscheinlichsten verwendet?","options":[["A","F-Type"],["B","RJ11"],["C","BNC"],["D","SC"]],"answers":["D"],"explanation":"SC-Stecker werden häufig an Glasfaser-Patchfeldern eingesetzt. Sie besitzen einen robusten Push-Pull-Mechanismus.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":94,"prompt":"Ein Netzwerkadministrator verbindet zwei Layer-2-Switches in einem Netzwerk. Diese Switches müssen Daten aus mehreren Netzwerken übertragen. Welche der folgenden Technologien erfüllt diese Anforderung?","options":[["A","Jumbo Frames"],["B","802.1Q-Tagging"],["C","Native VLAN"],["D","Link Aggregation"]],"answers":["B"],"explanation":"802.1Q fügt VLAN-Tags in Ethernet-Frames ein. Ein Trunk kann dadurch Verkehr mehrerer VLANs über eine gemeinsame Verbindung übertragen.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":95,"prompt":"Ein Netzwerkadministrator möchte, dass Benutzer sich beim Zugriff über kabelgebundene und drahtlose Geräte mithilfe eines portbasierten Authentifizierungs-Frameworks am Unternehmensnetzwerk authentifizieren können. Welche Sicherheitsfunktion ist dafür am besten geeignet?","options":[["A","802.1X"],["B","Access Control List"],["C","Port Security"],["D","MAC Filtering"]],"answers":["A"],"explanation":"802.1X ist das portbasierte Authentifizierungsframework für kabelgebundene Switchports und Enterprise-WLANs.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":96,"prompt":"Welche der folgenden Lösungen ist am engsten mit einer dedizierten Verbindung zu einer Cloud-Umgebung verbunden und beinhaltet möglicherweise keine Verschlüsselung?","options":[["A","Direct Connect"],["B","Internet Gateway"],["C","Captive Portal"],["D","VPN"]],"answers":["A"],"explanation":"Direct Connect bezeichnet eine dedizierte private Verbindung zu einem Cloudanbieter. Privat bedeutet dabei nicht automatisch verschlüsselt.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":97,"prompt":"Ein Systemadministrator untersucht, warum Benutzer einen Linux-Webserver nicht mit einem Browser erreichen können, den Server aber anpingen können. Der Server ist online, der Webserverprozess läuft und die Verbindung zum Switch ist aktiv. Welchen der folgenden Befehle sollte der Administrator zuerst auf dem Server ausführen?","options":[["A","traceroute"],["B","netstat"],["C","tcpdump"],["D","arp"]],"answers":["B"],"explanation":"netstat zeigt lauschende Ports und aktive Verbindungen. So lässt sich zuerst prüfen, ob der Webserver tatsächlich auf dem erwarteten TCP-Port lauscht.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":98,"prompt":"Welches der folgenden Geräte kann auf mehreren Schichten des OSI-Modells arbeiten?","options":[["A","Hub"],["B","Multilayer-Switch"],["C","Transceiver"],["D","Modem"]],"answers":["B"],"explanation":"Ein Multilayer-Switch schaltet Frames auf Layer 2 und kann zusätzlich Routingfunktionen auf Layer 3 übernehmen.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":99,"prompt":"Bevor ein Gastnetzwerk verwendet werden darf, verlangt ein Administrator, dass Benutzer den Nutzungsbedingungen zustimmen. Wie lässt sich dieses Ziel am besten erreichen?","options":[["A","Pre-Shared Key"],["B","Autonomer Access Point"],["C","Captive Portal"],["D","WPA2-Verschlüsselung"]],"answers":["C"],"explanation":"Ein Captive Portal zeigt Gästen vor der Freigabe eine Webseite mit Anmeldung oder Nutzungsbedingungen.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":100,"prompt":"Ein Netzwerkadministrator eines kleinen Büros fügt dem Netzwerk-Switch ein passives IDS hinzu, um Netzwerkverkehr zu untersuchen. Welche der folgenden Funktionen sollte der Administrator verwenden?","options":[["A","SNMP Trap"],["B","Port Mirroring"],["C","Syslog-Sammlung"],["D","API-Integration"]],"answers":["B"],"explanation":"Ein passives IDS benötigt eine Kopie des Datenverkehrs. Port Mirroring liefert diese Kopie, ohne dass das IDS inline geschaltet wird.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":101,"prompt":"Welche der folgenden Situationen erfordert am wahrscheinlichsten die Verwendung von Subinterfaces?","options":[["A","Ein Router mit nur einem verfügbaren LAN-Port"],["B","Eine Firewall mit Deep Packet Inspection"],["C","Ein Hub mit Jumbo Frames"],["D","Ein Switch mit Spanning Tree Protocol"]],"answers":["A"],"explanation":"Subinterfaces teilen eine physische Routerschnittstelle logisch in mehrere VLAN-Schnittstellen auf. Das ist typisch für Router-on-a-Stick, wenn nur ein LAN-Port verfügbar ist.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":102,"prompt":"Ein Unternehmen erhält von seinem ISP eine Unterlassungsaufforderung wegen verbotener Torrent-Aktivitäten. Welche der folgenden Maßnahmen sollte umgesetzt werden, um der Aufforderung nachzukommen?","options":[["A","MAC Security"],["B","Content Filtering"],["C","Screened Subnet"],["D","Perimeter-Netzwerk"]],"answers":["B"],"explanation":"Inhaltsfilterung kann Torrent-Protokolle, Kategorien oder bekannte Ziele blockieren und damit die verbotene Nutzung unterbinden.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":103,"prompt":"Welche der folgenden Lösungen erfordert, dass Netzwerkgeräte über einen separaten Satz von IP-Adressen verwaltet werden?","options":[["A","Console"],["B","Split Tunnel"],["C","Jump Box"],["D","Out-of-Band"]],"answers":["D"],"explanation":"Out-of-Band-Management verwendet ein separates Verwaltungsnetz mit eigenen IP-Adressen, unabhängig vom Produktionsnetz.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":104,"prompt":"Ein Netzwerkadministrator möchte eine Backup-Route konfigurieren, falls die primäre Route ausfällt. Auf dem Router ist kein dynamisches Routingprotokoll installiert. Welche Routing-Eigenschaft sollte der Administrator verwenden?","options":[["A","Neighbor Adjacency"],["B","Link-State-Flooding"],["C","Administrative Distance"],["D","Hop Count"]],"answers":["C"],"explanation":"Über die administrative Distanz kann eine statische Ersatzroute mit höherem Wert als Floating Static Route eingerichtet werden. Sie wird erst genutzt, wenn die primäre Route ausfällt.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":105,"prompt":"Welchen Schritt der Fehlerbehebungsmethodik sollte ein Techniker durchführen, um eine Theorie zu bestätigen?","options":[["A","Das Problem reproduzieren."],["B","Die Symptome identifizieren."],["C","Informationen sammeln."],["D","Änderungen feststellen."]],"answers":["A"],"explanation":"Durch Reproduzieren und gezieltes Testen wird geprüft, ob die aufgestellte Ursache das Problem tatsächlich erklärt.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":106,"prompt":"Ein Netzwerkadministrator stellt einen neuen Switch bereit und möchte sicherstellen, dass der Standard-Prioritätswert für Spanning Tree gesetzt ist. Welchen Wert würde der Administrator erwarten?","options":[["A","4096"],["B","8192"],["C","32768"],["D","36684"]],"answers":["C"],"explanation":"Die Standard-Bridge-Priority bei STP beträgt 32768. Niedrigere Werte erhöhen die Chance, Root Bridge zu werden.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":107,"prompt":"Ein Netzwerkadministrator konfiguriert ein WLAN mit einer ESSID. Welchen Vorteil hat eine ESSID gegenüber einer SSID für den Benutzer?","options":[["A","Stärkere WLAN-Verbindung"],["B","Roaming zwischen Access Points"],["C","Erweiterte Sicherheit"],["D","Höherer Durchsatz"]],"answers":["B"],"explanation":"Eine ESS verbindet mehrere Access Points unter einem gemeinsamen WLAN-Namen. Clients können deshalb zwischen den APs roamen.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":108,"prompt":"Ein Netzwerkadministrator muss zwei Router in einer Point-to-Point-Konfiguration verbinden und dabei IP-Adressraum sparen. Welches der folgenden Subnetze sollte er verwenden?","options":[["A","/24"],["B","/26"],["C","/28"],["D","/30"]],"answers":["D"],"explanation":"Ein /30-Netz besitzt vier Adressen und zwei nutzbare Hostadressen. Das genügt für zwei Router und spart IPv4-Adressraum.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":109,"prompt":"Ein Angreifer folgt einem Mitarbeiter durch eine per Ausweis gesicherte Tür, bevor sich die Tür schließt. Welche Art von Angriff liegt vor?","options":[["A","Shoulder Surfing"],["B","Tailgating"],["C","Phishing"],["D","On-Path"]],"answers":["B"],"explanation":"Tailgating bedeutet, dass ein Angreifer einer berechtigten Person ohne eigene Authentifizierung durch eine gesicherte Tür folgt.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":110,"prompt":"Eine Forschungseinrichtung erwartet in naher Zukunft einen exponentiellen Anstieg des weltweiten Netzwerkverkehrs. Die Büros verfügen über 2,5-Gbit/s-Glasfaseranschlüsse des ISP, nutzen derzeit jedoch nur 1-Gbit/s-Verbindungen. Was müsste konfiguriert werden, um die Verbindungsgeschwindigkeit des ISP nutzen zu können?","options":[["A","802.1Q-Tagging"],["B","Network Address Translation"],["C","Port Duplex"],["D","Link Aggregation"]],"answers":["D"],"explanation":"Link Aggregation bündelt mehrere 1-Gbit/s-Verbindungen und erhöht dadurch die verfügbare Gesamtkapazität für mehrere parallele Datenströme. Eine einzelne Sitzung bleibt dabei grundsätzlich auf die Bandbreite eines Mitgliedslinks begrenzt.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":111,"prompt":"Ein VoIP-Telefon ist an einen Port angeschlossen, kann jedoch keine Anrufe empfangen. Was muss am Port konfiguriert werden, um das Problem zu beheben?","options":[["A","Alle VLANs am Port als Trunk konfigurieren."],["B","Das Native VLAN konfigurieren."],["C","Den Datenverkehr mit dem Voice-VLAN taggen."],["D","VLANs deaktivieren."]],"answers":["C"],"explanation":"Ein VoIP-Telefon benötigt die richtige Voice-VLAN-Zuweisung. Das Tagging trennt Sprach- und Datenverkehr am gemeinsamen Switchport.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":112,"prompt":"Welches der folgenden Geräte kann Jumbo Frames unterstützen?","options":[["A","Access Point"],["B","Bridge"],["C","Hub"],["D","Switch"]],"answers":["D"],"explanation":"Ein Switch kann Jumbo Frames weiterleiten, sofern MTU beziehungsweise System-MTU auf allen beteiligten Geräten passend konfiguriert ist.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":113,"prompt":"Ein Netzwerkmanager möchte ein SIEM-System implementieren, um Systemereignisse zu korrelieren. Welches Protokoll sollte er überprüfen?","options":[["A","NTP"],["B","DNS"],["C","LDAP"],["D","DHCP"]],"answers":["A"],"explanation":"Für die Korrelation von Ereignissen müssen die Zeitstempel aller Geräte übereinstimmen. NTP synchronisiert deren Uhren.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":114,"prompt":"Ein Netzwerktechniker entwirft eine sichere Kommunikationsverbindung zwischen zwei Standorten. Der gesamte Datenstrom muss vertraulich bleiben. Welche der folgenden Technologien erreicht dieses Ziel?","options":[["A","GRE"],["B","IKE"],["C","ESP"],["D","AH"]],"answers":["C"],"explanation":"ESP ist der IPSec-Bestandteil, der die Nutzdaten verschlüsselt und damit Vertraulichkeit bereitstellt.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":115,"prompt":"Welches der folgenden Protokolle hat standardmäßig eine Administrative Distance von 90?","options":[["A","RIP"],["B","EIGRP"],["C","OSPF"],["D","BGP"]],"answers":["B"],"explanation":"Interne EIGRP-Routen besitzen auf Cisco-Geräten standardmäßig die administrative Distanz 90.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":116,"prompt":"In einem Büro treten sporadische Verbindungsprobleme auf. Ein Netzwerktechniker stellt fest, dass das Problem immer dann auftritt, wenn jemand das an einen Switch angeschlossene Faxgerät benutzt. Welche Maßnahme sollte der Techniker zuerst ergreifen?","options":[["A","Eine neue Cat-5-Leitung verlegen."],["B","802.1Q-Tagging aktivieren."],["C","Die MTU ändern."],["D","Ein VLAN konfigurieren."]],"answers":["D"],"explanation":"Ein eigenes VLAN trennt das Faxgerät logisch vom übrigen Büroverkehr. Dadurch werden störende Broadcasts oder fehlerhafte Gerätewirkungen eingegrenzt.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":117,"prompt":"Ein Netzwerktechniker erhält vom Hersteller eine Warnung zu einer Schwachstelle in der CPU eines Routers. Was sollte der Techniker tun, um das Problem zu beheben?","options":[["A","Die Firmware aktualisieren."],["B","Das Systemboard ersetzen."],["C","Das Betriebssystem patchen."],["D","Das System isolieren."]],"answers":["A"],"explanation":"CPU-Microcode und andere gerätespezifische Fehlerbehebungen werden bei Routern typischerweise über ein freigegebenes Firmware-Update geliefert.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":118,"prompt":"Welcher der folgenden Glasfaser-Steckertypen wird am wahrscheinlichsten an einer Netzwerkkarte verwendet?","options":[["A","LC"],["B","SC"],["C","ST"],["D","MPO"]],"answers":["A"],"explanation":"LC ist ein kompakter Glasfaserstecker und wird häufig direkt an Netzwerkkarten beziehungsweise SFP-Modulen verwendet.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":119,"prompt":"Welcher der folgenden Stecker ermöglicht Konsolenzugriff auf einen Switch?","options":[["A","ST"],["B","RJ45"],["C","BNC"],["D","SFP"]],"answers":["B"],"explanation":"Viele Netzwerkgeräte besitzen einen RJ45-Konsolenanschluss für ein serielles Rollover-Kabel.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":120,"prompt":"Ein Netzwerkadministrator stellt Störungen durch industrielle Geräte im 2,4-GHz-Bereich fest. Welche der folgenden Technologien würden dieses Problem am wahrscheinlichsten verringern? (Wähle zwei.)","options":[["A","Mesh-Netzwerk"],["B","5-GHz-Frequenz"],["C","Rundstrahlantenne"],["D","Nicht überlappender Kanal"],["E","Captive Portal"],["F","Ad-hoc-Netzwerk"]],"answers":["B","D"],"explanation":"Der Wechsel auf 5 GHz umgeht die Störquelle im 2,4-GHz-Band. Zusätzlich verhindert ein nicht überlappender Kanal gegenseitige WLAN-Störungen.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":121,"prompt":"Welche der folgenden Netzwerktopologien besitzt eine direkte Verbindung zwischen jedem einzelnen Knoten des Netzwerks?","options":[["A","Mesh"],["B","Star"],["C","Hub-and-Spoke"],["D","Point-to-Point"]],"answers":["A"],"explanation":"In einer Full-Mesh-Topologie ist jeder Knoten direkt mit jedem anderen Knoten verbunden.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":122,"prompt":"Ein Netzwerkarchitekt muss ein drahtloses Feldnetzwerk erstellen, das Einsatzfahrzeugen der öffentlichen Sicherheit zuverlässigen Dienst bietet. Welcher Netzwerktyp ist dafür die beste Lösung?","options":[["A","Mesh"],["B","Ad hoc"],["C","Point-to-Point"],["D","Infrastructure"]],"answers":["A"],"explanation":"Ein drahtloses Mesh kann Daten über mehrere Knoten weiterreichen und bietet beweglichen Einsatzfahrzeugen alternative Funkwege.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":123,"prompt":"Ein Manager bewertet das Umgebungsdesign eines Rechenzentrums. Welche Anordnung sollte er wählen, wenn die maximale Wärmeabfuhr höchste Priorität hat?","options":[["A","Blue-Green"],["B","Hot-Cold"],["C","East-West"],["D","Active-Passive"]],"answers":["B"],"explanation":"Hot- und Cold-Aisle-Anordnung trennt warme Abluft von kalter Zuluft und verbessert dadurch die Wärmeabfuhr im Rechenzentrum.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":124,"prompt":"Ein Netzwerkadministrator hat ein Router-Interface mit 10.0.0.95 255.255.255.240 konfiguriert. Er stellt fest, dass der Router keine Pakete an einen Webserver mit der IP-Adresse 10.0.0.81/28 routet. Was ist die beste Erklärung?","options":[["A","Der Webserver befindet sich in einem anderen Subnetz."],["B","Das Router-Interface verwendet eine Broadcast-Adresse."],["C","Der IP-Adressraum ist ein Class-A-Netzwerk."],["D","Das Subnetz befindet sich in einem privaten Adressbereich."]],"answers":["B"],"explanation":"Bei /28 reicht das Netz von 10.0.0.80 bis 10.0.0.95. Die Adresse 10.0.0.95 ist die Broadcast-Adresse und darf keiner Routerschnittstelle zugewiesen werden.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":125,"prompt":"Ein Netzwerkadministrator wird darüber informiert, dass ein Benutzer nicht auf Netzwerkressourcen zugreifen kann. Er überprüft die physischen Verbindungen zur Workstation „User 3“ und sieht, dass das Ethernetkabel korrekt angeschlossen ist. Die Kontrollleuchten der Netzwerkschnittstelle blinken jedoch weder am Computer noch am Switch. Was ist die wahrscheinlichste Ursache?","options":[["A","Der Switch ist ausgefallen."],["B","Das Standardgateway ist falsch."],["C","Der Port ist heruntergefahren."],["D","Die VLAN-Zuweisung ist falsch."]],"answers":["C"],"explanation":"Fehlen Linkanzeigen an Netzwerkkarte und Switch trotz gestecktem Kabel, ist der Switchport wahrscheinlich administrativ heruntergefahren.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":126,"prompt":"Welches der folgenden internen Routingprotokolle zeichnet sich am besten durch schnelle Konvergenz und Schleifenfreiheit aus?","options":[["A","BGP"],["B","STP"],["C","OSPF"],["D","RIP"]],"answers":["C"],"explanation":"OSPF ist ein Link-State-IGP mit schneller Konvergenz. Die SPF-Berechnung erzeugt schleifenfreie Pfade.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":127,"prompt":"Ein Administrator richtet einen SNMP-Server für das Unternehmensnetzwerk ein und muss Geräte-IDs innerhalb einer MIB erstellen. Welche der folgenden Aussagen beschreibt die Funktion einer MIB?","options":[["A","DHCP-Relay-Gerät"],["B","Policy Enforcement Point"],["C","Definitionsdatei zur Übersetzung von Ereignissen"],["D","Network Access Controller"]],"answers":["C"],"explanation":"Eine MIB definiert verwaltete Objekte und ihre Object Identifier. SNMP-Systeme wissen dadurch, welche Messwerte ein Gerät bereitstellt.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":128,"prompt":"Ein kritischer Infrastruktur-Switch wurde als End-of-Support identifiziert. Was ist der beste nächste Schritt, um die Sicherheit zu gewährleisten?","options":[["A","Die neuesten Patches und Fehlerkorrekturen installieren."],["B","Den Switch außer Betrieb nehmen und ersetzen."],["C","Sicherstellen, dass die aktuelle Firmware keine Probleme aufweist."],["D","Den Switch vom Netzwerk isolieren."]],"answers":["B"],"explanation":"Nach End of Support fehlen Sicherheitsupdates und Herstellerhilfe. Kritische Infrastruktur sollte deshalb geplant außer Betrieb genommen und ersetzt werden.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":129,"prompt":"Das Marketingteam möchte für newapplication.comptia.org einen DNS-Eintrag anlegen, der immer auf denselben Zielnamen wie www.comptia.org verweist. Welcher Record-Typ ist dafür geeignet?","options":[["A","SOA"],["B","MX"],["C","CNAME"],["D","NS"]],"answers":["C"],"explanation":"Ein CNAME legt einen Alias für einen vorhandenen DNS-Namen an. Änderungen am Zielnamen gelten dadurch automatisch auch für den Alias.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":130,"prompt":"Ein Netzwerkadministrator möchte im Unternehmensnetzwerk Sicherheitszonen implementieren, um den Zugriff ausschließlich auf Personen innerhalb des Unternehmens zu beschränken. Welche Sicherheitszone ist die beste Lösung?","options":[["A","Extranet"],["B","Trusted"],["C","VPN"],["D","Public"]],"answers":["B"],"explanation":"Eine Trusted Zone ist für interne, kontrollierte Systeme vorgesehen und kann den Zugriff auf Unternehmensangehörige beschränken.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":131,"prompt":"Welches der folgenden Netzwerkgeräte wandelt drahtlose Signale in elektronische Signale um?","options":[["A","Router"],["B","Firewall"],["C","Access Point"],["D","Load Balancer"]],"answers":["C"],"explanation":"Ein Access Point empfängt Funksignale von WLAN-Clients und setzt sie in Ethernetverkehr für das kabelgebundene Netz um.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":132,"prompt":"Ein Netzwerkadministrator hat im Büro WLAN eingerichtet. Wenn Benutzer auf die Außenterrasse gehen und E-Mails mit großen Anhängen herunterladen oder Schulungsvideos streamen, treten Pufferprobleme auf. Was ist die wahrscheinlichste Ursache?","options":[["A","Netzwerküberlastung"],["B","WLAN-Störungen"],["C","Signalverschlechterung"],["D","Trennung des Clients vom Access Point"]],"answers":["C"],"explanation":"Außerhalb des vorgesehenen Abdeckungsbereichs wird das Signal schwächer. Diese Dämpfung senkt Datenrate und Stabilität, wodurch große Übertragungen puffern.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":133,"prompt":"Bei welcher der folgenden Aktivitäten würden Gruppen aus verschiedenen Abteilungen gemeinsam den Disaster-Recovery-Prozess bewerten?","options":[["A","Validierungstest"],["B","SLA-Abstimmung"],["C","Tabletop-Übungen"],["D","Active-Active-Ansatz"]],"answers":["C"],"explanation":"Bei einer Tabletop-Übung sprechen Vertreter verschiedener Abteilungen ein Notfallszenario und ihre Rollen gemeinsam durch.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":134,"prompt":"Welches der folgenden Routingprotokolle verwendet eine Autonomous-System-Nummer?","options":[["A","IS-IS"],["B","OSPF"],["C","BGP"],["D","EIGRP"]],"answers":["C"],"explanation":"BGP verwendet Autonomous System Numbers, um Netze und Routingrichtlinien zwischen autonomen Systemen zu unterscheiden.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":135,"prompt":"Welche der folgenden Aussagen ist eine Eigenschaft der Anwendungsschicht?","options":[["A","Sie ist für die Zustellung von Paketen auf andere Schichten angewiesen."],["B","Sie prüft eigenständig auf Paketverlust."],["C","Sie verschlüsselt Daten während der Übertragung."],["D","Sie führt Adressübersetzung durch."]],"answers":["A"],"explanation":"Die Anwendungsschicht stellt Netzwerkdienste für Programme bereit, benötigt für die eigentliche Übertragung aber die darunterliegenden Schichten.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":136,"prompt":"Welcher der folgenden IP-Übertragungstypen verschlüsselt sämtliche übertragenen Daten?","options":[["A","ESP"],["B","AH"],["C","GRE"],["D","UDP"],["E","TCP"]],"answers":["A"],"explanation":"ESP verschlüsselt bei IPSec die übertragenen Nutzdaten. AH bietet Authentizität und Integrität, aber keine Verschlüsselung.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":137,"prompt":"Welche der folgenden Technologien sollte konfiguriert werden, damit sich Benutzer mit ihren Unternehmenszugangsdaten an einem WLAN authentifizieren können?","options":[["A","SSO"],["B","SAML"],["C","MFA"],["D","RADIUS"]],"answers":["D"],"explanation":"RADIUS stellt zentralisierte Authentifizierung, Autorisierung und Accounting für Enterprise-WLANs bereit.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":138,"prompt":"Ein Netzwerktechniker hat eine Migration auf einen neuen Mailserver durchgeführt. Er änderte den MX-Eintrag, überprüfte die Änderung auf Richtigkeit und bestätigte, dass der neue Mailserver über die IP-Adresse im A-Record erreichbar ist. Benutzer empfangen jedoch keine E-Mails. Was hätte der Techniker tun sollen, um das Problem zu verhindern?","options":[["A","Die Konfiguration der E-Mail-Clients an den MX-Eintrag anpassen."],["B","Vor der Änderung des MX-Eintrags die TTL reduzieren."],["C","Vor der Änderung des MX-Eintrags einen DNS-Zonentransfer durchführen."],["D","Den NS-Eintrag entsprechend der IP-Adressänderung aktualisieren."]],"answers":["B"],"explanation":"Eine frühzeitige Senkung der TTL sorgt dafür, dass alte MX-Antworten schneller aus DNS-Caches verschwinden. Die Umstellung wird dadurch zeitnah wirksam.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":139,"prompt":"Welche der folgenden Maßnahmen sollte ein Netzwerkadministrator konfigurieren, wenn OT-Geräte in die Architektur einer Organisation aufgenommen werden?","options":[["A","Honeynet"],["B","Verschlüsselung ruhender Daten"],["C","Zeitbasierte Authentifizierung"],["D","Netzwerksegmentierung"]],"answers":["D"],"explanation":"OT-Geräte sollten in eigene Netzwerksegmente beziehungsweise VLANs getrennt werden. Das begrenzt Zugriffe und die Ausbreitung eines Angriffs.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":140,"prompt":"Um Kosten zu senken und die Mobilität zu erhöhen, möchte ein CTO Cloud-Dienste für die Organisation und ihre verbundenen Unternehmen einführen. Um die Auswirkungen für Benutzer zu minimieren, sollen zentrale Dienste weiterhin im lokalen Rechenzentrum und Unternehmensdienste in der Cloud betrieben werden. Welches Bereitstellungsmodell ist die beste Wahl?","options":[["A","Public"],["B","Hybrid"],["C","SaaS"],["D","Private"]],"answers":["B"],"explanation":"Eine Hybrid Cloud kombiniert lokale beziehungsweise private Ressourcen mit Diensten einer Public Cloud.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":141,"prompt":"Welche der folgenden Kennzahlen beschreibt die durchschnittliche Dauer eines Ausfalls bei einem bestimmten Dienst?","options":[["A","RPO"],["B","MTTR"],["C","RTO"],["D","MTBF"]],"answers":["B"],"explanation":"MTTR bezeichnet die durchschnittliche Zeit, die benötigt wird, um ein System zu reparieren oder einen Dienst nach einem Ausfall wiederherzustellen. Die Kennzahl beschreibt also, wie lange die Wiederherstellung nach einem Fehler typischerweise dauert, bis der Normalbetrieb fortgesetzt werden kann.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":142,"prompt":"Ein Netzwerktechniker richtet für einen Kunden ein neues VoIP-Netzwerk ein. Das vorhandene Netzwerk ist bisher nur in Netze für Computer und Server segmentiert. Für das neue Netzwerk können keine zusätzlichen Switchports verwendet werden. Was muss der Techniker tun, um das Netzwerk korrekt zu konfigurieren? (Wähle zwei.)","options":[["A","Die Definitionen für Network Translation ändern."],["B","802.1Q aktivieren."],["C","Ein Routingprotokoll implementieren."],["D","Voice-VLANs einrichten."],["E","DNS neu konfigurieren."],["F","Geräte im Perimeter-Netzwerk platzieren."]],"answers":["B","D"],"explanation":"802.1Q ist der Standard für VLAN-Tagging in Ethernet-Frames. Dadurch können mehrere VLANs über einen einzigen Switchport übertragen werden. 802.1Q ist notwendig, um Sprach- und Datenverkehr über dieselbe physische Infrastruktur zu trennen. Voice-VLANs ermöglichen es, Sprachverkehr vom normalen Datenverkehr zu trennen und zu priorisieren. Dadurch lässt sich eine bessere Quality of Service (QoS) für VoIP-Kommunikation erreichen, die Leistung verbessern und die Beeinflussung durch normalen Datenverkehr verringern.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":143,"prompt":"In einem Netzwerkrack befinden sich vier Server und vier Switches mit jeweils redundanten Netzteilen. Im Rack ist nur eine intelligente PDU installiert. Warum sollte eine zweite PDU hinzugefügt werden?","options":[["A","Stromversorgungsredundanz"],["B","Überwachung ausgefallener Netzteile"],["C","Überspannungsschutz"],["D","Stromsparen"]],"answers":["A"],"explanation":"Eine zweite Power Distribution Unit (PDU) stellt Redundanz bei der Stromversorgung bereit. Fällt eine PDU oder eine Stromquelle aus, kann die zweite weiterhin die kritischen Geräte wie Server und Switches versorgen. Das ist wichtig, um die Verfügbarkeit aufrechtzuerhalten und Ausfälle bei Stromproblemen zu vermeiden.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":144,"prompt":"Welche der folgenden Lösungen ermöglicht einem Benutzer die Verbindung mit einem isolierten Gerät in einem eigenständigen Netzwerk?","options":[["A","Jump Box"],["B","API Gateway"],["C","Secure Shell"],["D","Clientless VPN"]],"answers":["A"],"explanation":"Eine Jump Box bzw. ein Jump Server ist ein abgesichertes System, über das ein Benutzer auf ein isoliertes Netzwerk oder Gerät zugreifen kann, das ansonsten nicht direkt erreichbar ist. Sie dient als kontrollierte Zwischenstation zwischen Benutzer und Zielgerät und ermöglicht eine sichere Administration oder Fehlerbehebung in eigenständigen bzw. eingeschränkten Netzen.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":145,"prompt":"Früh am Morgen installiert ein Administrator einen neuen DHCP-Server. Am Nachmittag melden einige Benutzer Netzwerkausfälle. Was ist die wahrscheinlichste Ursache?","options":[["A","Der Administrator hat nicht genügen
