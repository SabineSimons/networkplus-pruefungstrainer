ark mit Kanal 1 und verursacht Interferenzen.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":701,"prompt":"Ein Netzwerkadministrator benötigt einen Tunnel, der: • Paketheader authentifizieren kann, • Verschlüsselungsschlüssel über das Netzwerk austauscht, • verschlüsselte Nutzdaten überträgt. Welche Technologie sollte verwendet werden?","options":[["A","IPsec"],["B","ESP"],["C","AH"],["D","GRE"]],"answers":["A"],"explanation":"IPsec ist der übergeordnete Sicherheitsrahmen, der Authentifizierung, Schlüsselaustausch über IKE und verschlüsselte Nutzdatenübertragung über passende IPsec-Protokolle ermöglicht.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":702,"prompt":"Welche Lösung eignet sich am besten zur stärkeren Überprüfung von Zugangsdaten beziehungsweise Benutzeridentität?","options":[["A","MFA"],["B","ACL"],["C","Rollenbasierte Zugriffskontrolle"],["D","Least Privilege"]],"answers":["A"],"explanation":"MFA fordert mehr als einen unabhängigen Authentifizierungsfaktor und stärkt dadurch die Identitätsprüfung.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":703,"prompt":"Ein Flughafen betreibt ein Gast-WLAN mit überwiegend kurzzeitig anwesenden Benutzern und einem begrenzten DHCP-Adresspool. Welche DHCP-Eigenschaft sollte angepasst werden, damit der Pool nicht so schnell erschöpft ist?","options":[["A","Exclusions"],["B","IP Helper"],["C","Reservations"],["D","Lease Time"]],"answers":["D"],"explanation":"Eine kürzere Lease-Zeit gibt Adressen ehemaliger Gäste schneller an den verfügbaren Pool zurück.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":704,"prompt":"Ein Benutzer hat Probleme mit einer Cat-6-Ethernetverbindung. Der Techniker sieht, dass das Kabel mechanisch sauber terminiert wurde, aber die Farbcodierung falsch ist. Was sollte er als Nächstes tun?","options":[["A","Glasfaser einsetzen."],["B","Ethernetkabel sofort ersetzen."],["C","Switchport-Geschwindigkeit ändern."],["D","Einen Kabeltester verwenden."]],"answers":["D"],"explanation":"Ein Kabeltester sollte prüfen, ob Pinout, Durchgang und Paarzuordnung trotz der ungewöhnlichen Farbcodierung tatsächlich korrekt sind.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":705,"prompt":"Benutzer erleben geringen Netzwerkdurchsatz. Ein Techniker möchte den Durchsatz erhöhen, ohne Switch-Hardware auszutauschen. Welche Lösung sollte er implementieren?","options":[["A","SVI-Konfiguration"],["B","VLAN-Trunking"],["C","802.1Q-Tagging"],["D","Link Aggregation"]],"answers":["D"],"explanation":"Link Aggregation bündelt mehrere physische Links zu einer logischen Verbindung und erhöht die verfügbare Gesamtkapazität ohne neue Switches.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":706,"prompt":"Eine Mailserver-Migration läuft. Der vollständig abgelöste interne Alt-Relay nahm unverschlüsselte Client-Einlieferungen auf TCP-Port 25 an; externe Server-zu-Server-Zustellung läuft über ein separates Mail-Gateway. Das neue System verwendet authentifizierte, TLS-geschützte Client-Einlieferung. Welchen internen Port kann der Administrator nun schließen?","options":[["A","22"],["B","23"],["C","25"],["D","443"],["E","587"]],"answers":["C"],"explanation":"Der interne TCP-Port 25 des abgelösten Alt-Relays wird für die unverschlüsselte Client-Einlieferung nicht mehr benötigt und kann geschlossen werden. Das neue System nimmt authentifizierte Client-Sitzungen TLS-geschützt an; das separate Mail-Gateway behält Port 25 für die externe Server-zu-Server-Zustellung.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":707,"prompt":"Ein Netzwerkadministrator migriert eine Domain zu einem anderen Anbieter. Der neue Anbieter verlangt einen DNS-basierten Nachweis des Domainbesitzes. Welchen Record muss der Administrator wahrscheinlich anlegen?","options":[["A","A"],["B","CNAME"],["C","PTR"],["D","TXT"]],"answers":["D"],"explanation":"Ein TXT-Record wird häufig verwendet, um einen vom Anbieter vorgegebenen Prüfwert im DNS zu veröffentlichen und damit den Domainbesitz nachzuweisen.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":708,"prompt":"Ein Netzwerkadministrator richtet zwei neue Firewalls redundant ein und benötigt zusätzlich eine redundante Internetanbindung. Welche Routingtechnologie wird er am ehesten verwenden?","options":[["A","EIGRP"],["B","RIPv2"],["C","OSPF"],["D","BGP"]],"answers":["D"],"explanation":"BGP wird typischerweise eingesetzt, um mit einem oder mehreren ISPs Routinginformationen auszutauschen und redundante externe Pfade bereitzustellen.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":709,"prompt":"Welche Cloud-Eigenschaft ist für einen spezialisierten und sehr teuren Quantum-Computing-Host besonders wichtig, wenn mehrere Kunden die Ressource wirtschaftlich gemeinsam nutzen sollen?","options":[["A","Skalierbarkeit"],["B","Elastizität"],["C","Multitenancy"],["D","Kosten"]],"answers":["C"],"explanation":"Multitenancy ermöglicht mehreren voneinander isolierten Kunden oder Workloads die gemeinsame Nutzung derselben teuren Plattform. Dadurch wird die spezialisierte Ressource besser ausgelastet.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":710,"prompt":"Ein Netzwerkingenieur sieht Verkehr zur IPv4-Adresse 224.7.8.99. Welche Verkehrsart ist dies?","options":[["A","Broadcast"],["B","Unicast"],["C","Multicast"],["D","Anycast"]],"answers":["C"],"explanation":"Der Bereich 224.0.0.0 bis 239.255.255.255 ist für IPv4-Multicast reserviert.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":711,"prompt":"Core-Switches sollen große Datenübertragungen effizient bearbeiten, Ressourcenverbrauch reduzieren und Fragmentierung minimieren. Welche Funktion sollte aktiviert werden?","options":[["A","802.1Q-Tagging"],["B","Link Aggregation"],["C","Spanning Tree"],["D","Jumbo Frames"]],"answers":["D"],"explanation":"Jumbo Frames transportieren mehr Nutzdaten pro Ethernet-Frame und reduzieren dadurch Header- und CPU-Overhead bei großen Datenmengen, sofern sie Ende-zu-Ende unterstützt werden.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":712,"prompt":"Welcher Steckverbindertyp überträgt Netzwerkdaten über ein Koaxialkabel?","options":[["A","SC"],["B","MPO"],["C","BNC"],["D","RJ11"]],"answers":["C"],"explanation":"BNC ist ein typischer Steckverbinder für Koaxialkabel.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":713,"prompt":"Was ist ein Vorteil einer Spine-and-Leaf-Architektur gegenüber einem klassischen dreistufigen Modell?","options":[["A","Einfachere Wartung"],["B","Modularer Aufbau"],["C","Konsistenter Verkehrsfluss"],["D","Minimale Broadcast-Stürme"]],"answers":["C"],"explanation":"Da jeder Leaf-Switch mit jedem Spine-Switch verbunden ist, entstehen vorhersehbare, gleichmäßige Pfade für East-West-Traffic und damit ein konsistenter Verkehrsfluss.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":714,"prompt":"Der Internetzugang eines Unternehmens fällt aus, als die primäre Firewall abstürzt. Die sekundäre Firewall sollte automatisch übernehmen, kann dies aber wegen eines administrativ deaktivierten verbundenen Switchports nicht. Welche Art von Monitoring-Fehler beschreibt dies am besten?","options":[["A","Anomaly Alerting"],["B","Availability"],["C","Performance"],["D","Log Capture"]],"answers":["B"],"explanation":"Die Störung betrifft die Verfügbarkeit des Dienstes, weil die redundante Firewall nicht übernehmen konnte und der Internetzugang dadurch ausfiel.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":715,"prompt":"Was ist Best Practice, wenn ein Hardwaregerät sein End of Life (EOL) erreicht?","options":[["A","Erweiterte Garantie kaufen."],["B","Gerät außer Betrieb nehmen und ersetzen."],["C","Gerät verkaufen oder spenden."],["D","Gerät dauerhaft für Schulungen weiterverwenden."]],"answers":["B"],"explanation":"Nach EOL enden häufig Updates, Patches und Herstellersupport. Deshalb sollte das Gerät dekommissioniert und ersetzt werden, um Sicherheits- und Zuverlässigkeitsrisiken zu vermeiden.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":716,"prompt":"Welche Lösung sollte implementiert werden, damit aus einem sensiblen Unternehmens-Subnetz nur ausdrücklich erlaubte externe HTTPS-Ziele erreichbar sind?","options":[["A","CDN"],["B","IPS"],["C","Proxy"],["D","Load Balancer"]],"answers":["C"],"explanation":"Ein Proxy kann ausgehenden Webverkehr zentral kontrollieren und HTTPS-Verbindungen nur zu genehmigten externen Zielen zulassen.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":717,"prompt":"Ein Netzwerkingenieur möchte den Durchsatz eines High-Performance-Computing-Clusters optimieren. Welche Funktion bietet die höchste Effizienz pro Datenstrom?","options":[["A","Link Aggregation"],["B","Traffic Shaping"],["C","QoS Policing"],["D","Jumbo Frames"]],"answers":["D"],"explanation":"Jumbo Frames transportieren mehr Nutzdaten pro Frame und verringern dadurch Protokoll- und CPU-Overhead bei großen Datenströmen.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":718,"prompt":"Ein Laptop kann nicht auf gemeinsame Unternehmensressourcen zugreifen. Es erscheint die Fehlermeldung „IP address conflict detected“. Welcher Befehl hilft einem Netzwerkadministrator am effizientesten bei der Fehlersuche?","options":[["A","arp"],["B","nslookup"],["C","tcpdump"],["D","netstat"]],"answers":["A"],"explanation":"Mit arp können IP-zu-MAC-Zuordnungen betrachtet und mögliche doppelte IP-Nutzungen weiter untersucht werden.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":719,"prompt":"Ein Laptop hat sporadische WLAN-Probleme. In der Konfiguration nutzt CompTIA_1 Kanal 6, CompTIA_3 Kanal 11 und CompTIA_2 Kanal 5 mit 40 MHz Kanalbreite. Was sollte der Techniker tun?","options":[["A","Roaming zwischen den APs konfigurieren."],["B","Sendeleistung von CompTIA_2 verändern."],["C","Sendeleistung von CompTIA_3 verändern."],["D","CompTIA_2 auf Kanal 1 mit 20 MHz Kanalbreite umstellen."]],"answers":["D"],"explanation":"Im 2,4-GHz-Band sind die 20-MHz-Kanäle 1, 6 und 11 die üblichen nicht überlappenden Kombinationen. Kanal 5 mit 40 MHz überlappt stark mit beiden Nachbarn; Kanal 1 bei 20 MHz beseitigt diese Fehlplanung.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":720,"prompt":"Welches Routingprotokoll ist effizient und bietet zugleich die beste Interoperabilität zwischen Geräten verschiedener Hersteller?","options":[["A","RIP"],["B","EIGRP"],["C","RSTP"],["D","OSPF"]],"answers":["D"],"explanation":"OSPF ist ein offener Link-State-Standard mit breiter Herstellerunterstützung, schneller Konvergenz und guter Skalierbarkeit.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":721,"prompt":"Ein Techniker möchte Switchports einsparen und verbindet Benutzer-Laptops durch die Ethernet-Passthrough-Ports von VoIP-Telefonen. Danach haben Benutzer Probleme beim Drucken und beim Zugriff auf andere Netzwerkressourcen. Was ist die wahrscheinlichste Ursache?","options":[["A","Falsche Subnetzmaske"],["B","VLAN-Zuweisung"],["C","DHCP-Pool erschöpft"],["D","Doppelte IP-Adressen"]],"answers":["B"],"explanation":"VoIP-Telefone verwenden häufig ein Voice-VLAN, während der angeschlossene Laptop im Data-VLAN bleiben muss. Eine falsche VLAN-Zuweisung am Switchport oder Telefon-Passthrough kann den Laptop ins falsche VLAN bringen.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":722,"prompt":"Welche Route wird bei gleicher Zielpräfixlänge aufgrund ihrer typischen Administrative Distance bevorzugt?","options":[["A","Static"],["B","BGP"],["C","OSPF"],["D","Default"]],"answers":["A"],"explanation":"Eine normale statische Route besitzt typischerweise eine niedrigere Administrative Distance als OSPF- oder BGP-Routen und wird deshalb bei derselben Zielpräfixlänge bevorzugt. Eine Default Route ist weniger spezifisch.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":723,"prompt":"Ein Netzwerktechniker möchte eine redundante Remote-Verwaltungsmöglichkeit besitzen, falls ein Switch über SSH nicht mehr erreichbar ist. Was sollte er tun?","options":[["A","Jump Host bereitstellen."],["B","Out-of-Band-Management einsetzen."],["C","Administrative GUI aktivieren."],["D","Ein physisches Konsolenkabel anschließen."]],"answers":["B"],"explanation":"Out-of-Band-Management stellt einen separaten Managementpfad bereit, der auch dann erreichbar bleiben kann, wenn das Produktionsnetz oder SSH über die normale Netzverbindung ausgefallen ist.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":724,"prompt":"Welche Methode gilt unter den genannten Optionen als die sicherste zur Kontrolle der Geräteauthentifizierung?","options":[["A","PKI"],["B","MFA"],["C","SAML"],["D","SSO"]],"answers":["A"],"explanation":"PKI ermöglicht zertifikatsbasierte Geräteauthentifizierung mit kryptografischen Schlüsseln und vermeidet die alleinige Abhängigkeit von gemeinsam genutzten Passwörtern.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"}];

{id:'pbq4',n:4,title:'Netzwerkgeräte für zwei Gebäude',prompt:'Beide Gebäude brauchen Internet. Internetverkehr muss geprüft werden, Desktops sollen fremden Unicast-Verkehr nicht sehen und zwischen den Gebäuden gibt es keine Leitung.',fields:[

{id:'pbq513',n:513,title:'VLAN 20 über den Trunk transportieren',prompt:'PC3 in VLAN 10 erreicht das Internet, aber nicht File- und Webserver in VLAN 20. Stelle den Trunk zwischen beiden Switches wieder her.',fields:[

],solution:'Firewall → Router/NAT → Managed Switch; WAP in Gebäude A und Range Extender in Gebäude B.',explanation:'Alle zentralen Geräte bleiben verwaltbar in Gebäude A. Der Switch segmentiert Ports, die Firewall prüft Internetverkehr, und die Funkbrücke überwindet die fehlende Gebäudeverkabelung.'},

function renderTraining(){let it=training.items[training.index],q=it.q,multi=q.answers.length>1,later=progress().later.includes(q.n),label=training.mode==='errors'?(training.scope==='errors'?'NUR FEHLER':`NUR FEHLER · ${training.scope}`):training.mode==='later'?(training.scope==='later'?'FÜR SPÄTER':`FÜR SPÄTER · ${training.scope}`):(training.mode==='continue'?(training.scope==='all'?'NUR OFFENE':`NUR OFFENE · ${training.scope}`):(training.scope==='all'?'Alle Fragen':training.scope));app.innerHTML=`<section class="card"><div class="trainstat">${esc(label)} · Frage ${training.index+1} von ${training.items.length} · bisher ${training.correct} richtig</div><div class="qhead"><div><div class="qnum">ORIGINAL-FRAGE ${q.n} · ${esc(q.topic)}</div></div><span class="type">${multi?`Mehrfachauswahl · ${q.answers.length}`:'Einzelauswahl'}</span></div><div class="qtext">${esc(q.prompt)}</div>${multi?`<div class="hint">Wähle genau ${q.answers.length} Antworten.</div>`:''}<div>${it.order.map((key,i)=>trainingOption(it,key,i)).join('')}</div>${it.checked?trainingFeedback(q,it):''}<div class="nav"><div class="navgroup"><button class="btn secondary" onclick="home()">← Hauptmenü</button><button class="btn secondary speakbtn" onclick="speakTraining()">🔊 Vorlesen</button><button class="btn flag ${later?'on':''}" onclick="toggleLater(${q.n})">⭐ ${later?'Für später gespeichert':'Für später'}</button></div><div class="navgroup">${it.checked?'<button class="btn primary" onclick="nextTraining()">Nächste Frage →</button>':'<button class="btn primary" onclick="checkTraining()">Antwort prüfen</button>'}</div></div></section>`;maybeAutoSpeakTrainingQuestion()}
function trainingOption(it,key,index){let q=it.q,text=q.options.find(o=>o[0]===key)?.[1]||'',selected=it.selected.includes(key),cls=selected?' selected':'';if(it.checked){if(q.answers.includes(key))cls+=' correct';else if(selected)cls+=' wrong'}return `<label class="option${cls}"><input type="${q.answers.length>1?'checkbox':'radio'}" name="trainAnswer" ${selected?'checked':''} ${it.checked?'disabled':''} onchange="pickTraining('${key}',this.checked)"><span class="letter">${String.fromCharCode(65+index)}.</span><span>${esc(text)}</span></label>`}
function pickTraining(key,checked){let it=training.items[training.index];if(it.checked)return;if(it.q.answers.length>1)it.selected=checked?[...new Set([...it.selected,key])]:it.selected.filter(x=>x!==key);else it.selected=[key];renderTraining()}
function checkTraining(){let it=training.items[training.index];if(!it.selected.length)return alert('Bitte erst eine Antwort auswählen.');it.checked=true;it.ok=eq(it.selected,it.q.answers);if(it.ok)training.correct++;markQuestion(it.q,it.ok);renderTraining();maybeAutoSpeakTrainingFeedback();scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function answerTexts(q){return q.answers.map(key=>q.options.find(o=>o[0]===key)?.[1]||key)}
function memoryLine(q){let values=answerTexts(q);return values.length===1?`Merke: ${values[0]}`:`Merke dir diese Kombination: ${values.join(' + ')}`}
function trainingFeedback(q,it){return `<div class="feedback ${it.ok?'good':'bad'}"><b>${it.ok?'✅ Richtig':'❌ Falsch'}</b><div class="correctline">Richtige Antwort: ${esc(answerTexts(q).join(' · '))}</div><div class="explain">${esc(q.explanation)}</div><div class="memory">💡 ${esc(memoryLine(q))}</div><div class="actions"><button class="btn smallbtn secondary speakbtn" onclick="speakFeedback()">🔊 Erklärung vorlesen</button></div></div>`}
function nextTraining(){training.index++;if(training.index>=training.items.length)return trainingDone();renderTraining();scrollTo(0,0)}
function trainingDone(){let total=training.items.length,rawPct=training.correct/total*100,pct=Math.round(rawPct),passed=rawPct>=TRAIN_GOAL,needed=Math.ceil(total*TRAIN_GOAL/100),scope=training.scope,encoded=['all','errors','later'].includes(scope)?scope:encodeURIComponent(scope),next=training.direct?'<button class="btn primary" onclick="home()">Zurück zur Fragenauswahl</button>':training.mode==='errors'?`<button class="btn primary" onclick="startTraining('${encoded}','errors')">Weitere Fehler</button>`:training.mode==='later'?`<button class="btn primary" onclick="startTraining('${encoded}','later')">Gemerkte wiederholen</button>`:`<button class="btn primary" onclick="startTraining('${encoded}','continue')">NÄCHSTE OFFENE</button>`;app.innerHTML=`<section class="card resultbox"><div class="qnum">LERNPÄCKCHEN FERTIG</div><div class="score ${passed?'pass':'fail'}">${pct}%</div><h2>${training.correct} von ${total} richtig</h2><p><b>${passed?'✅ Sicherheitsziel erreicht':'Sicherheitsziel noch nicht erreicht'}</b> · Ziel ${TRAIN_GOAL}% (ab ${needed} von ${total})</p><p>Der Fortschritt und alle Fehler sind gespeichert. Später richtig beantwortete Fehler gelten wieder als beherrscht.</p><div class="actions">${next}<button class="btn warning" onclick="startTraining('errors','errors')" ${progress().errors.length?'':'disabled'}>NUR FEHLER (${progress().errors.length})</button><button class="btn flag" onclick="startTraining('later','later')" ${progress().later.length?'':'disabled'}>⭐ FÜR SPÄTER (${progress().later.length})</button><button class="btn secondary" onclick="home()">Hauptmenü</button></div></section>`}
function speak(text){if(!('speechSynthesis'in window))return alert('Vorlesen wird von diesem Browser leider nicht unterstützt.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=.94;speechSynthesis.speak(u)}
function speakTraining(){let it=training.items[training.index],q=it.q,opts=it.order.map((key,i)=>`${String.fromCharCode(65+i)}. ${q.options.find(o=>o[0]===key)?.[1]||''}`).join('. ');speak(`Frage ${q.n}. ${q.prompt}. ${opts}`)}
function speakFeedback(){let it=training.items[training.index],q=it.q;speak(`${it.ok?'Richtig':'Falsch'}. Richtige Antwort: ${answerTexts(q).join(' und ')}. ${q.explanation}. ${memoryLine(q)}`)}
function maybeAutoSpeakTrainingQuestion(){if(!settings().autoRead||!training)return;let it=training.items[training.index],key=`${training.index}:${it.q.n}`;if(training.spokenQuestion===key)return;training.spokenQuestion=key;setTimeout(speakTraining,0)}

function selectField(sim,field,value,context){let fieldId=`${context}-${sim.id}-${field.key}`;return `<div class="field"><label for="${fieldId}">${esc(field.label)}</label><select id="${fieldId}" onchange="setSimValue('${context}','${sim.id}','${field.key}',this.value)"><option value="">— auswählen —</option>${shuffleStable(field.options,sim.id+field.key).map(opt=>`<option value="${esc(opt)}" ${value===opt?'selected':''}>${esc(opt)}</option>`).join('')}</select></div>`}
function hashText(text){let h=2166136261;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function shuffleStable(values,seed){let a=[...values],x=hashText(seed);for(let i=a.length-1;i>0;i--){x=(Math.imul(x,1664525)+1013904223)>>>0;let j=x%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function renderSimFields(sim,answers,context){let last='';return `<div class="pbqgrid">${sim.fields.map(f=>{let title=f.group&&f.group!==last?`<div class="groupTitle">${esc(f.group)}</div>`:'';if(f.group)last=f.group;return title+selectField(sim,f,answers[f.key],context)}).join('')}</div>`}
function setSimValue(context,id,key,value){if(context==='train'){simTraining.answers[id]=simTraining.answers[id]||{};simTraining.answers[id][key]=value}else{exam.answers[id]=exam.answers[id]||{};exam.answers[id][key]=value;saveExam()}}
function gradeSim(sim,answers){return sim.fields.every(f=>answers&&answers[f.key]===f.answer)}
function answeredSim(sim,answers){return sim.fields.every(f=>answers&&answers[f.key])}
function simCorrectDetails(sim){return sim.fields.map(f=>`${f.label}: ${f.answer}`).join(' · ')}
function startSimulationTraining(ids=null){hideExamTop();let items=ids?ids.map(simById).filter(Boolean):shuffle(PBQS);if(!items.length){app.innerHTML=`<section class="card hero"><h2>Keine PBQ-Fehler gespeichert 🎉</h2><div class="actions"><button class="btn primary" onclick="startSimulationTraining()">Alle Simulationen</button><button class="btn secondary" onclick="home()">Hauptmenü</button></div></section>`;return}simTraining={items,index:0,answers:{},checked:false,spokenQuestion:'',spokenFeedback:''};renderSimulationTraining()}
function startSimulationErrors(){startSimulationTraining(progress().simErrors)}
function openSimulation(id){startSimulationTraining([id])}
function renderSimulationTraining(){let sim=simTraining.items[simTraining.index],a=simTraining.answers[sim.id]||{};app.innerHTML=`<section class="card pbq"><div class="qhead"><div><div class="qnum">SIMULATION ${simTraining.index+1} VON ${simTraining.items.length} · ORIGINAL-NR. ${sim.n}</div><div class="qtext">${esc(sim.title)}</div></div><span class="type">PBQ / HOTSPOT</span></div><p>${esc(sim.prompt)}</p>${sim.reconstructed?'<div class="info"><b>Saubere Übungsrekonstruktion:</b> Einzelne Angaben lagen nur als Bildschirmabbildung vor oder waren widersprüchlich. Diese Fassung ist vollständig klickbar und technisch prüfbar.</div>':''}${simVisual(sim)}${renderSimFields(sim,a,'train')}<div id="simFeedback">${simTraining.checked?simFeedback(sim,a):''}</div><div class="nav"><div class="navgroup"><button class="btn secondary" onclick="home()">← Hauptmenü</button><button class="btn secondary speakbtn" onclick="speakSimulation()">🔊 Vorlesen</button></div><div class="navgroup">${simTraining.checked?'<button class="btn primary" onclick="nextSimulation()">Nächste Simulation →</button>':'<button class="btn primary" onclick="checkSimulation()">Simulation prüfen</button>'}</div></div></section>`;maybeAutoSpeakSimulationQuestion()}
function speakSimulation(){let sim=simTraining.items[simTraining.index];speak(`Simulation ${sim.n}. ${sim.title}. ${sim.prompt}. ${sim.fields.map(f=>f.label).join('. ')}`)}
function speakSimulationFeedback(){let sim=simTraining.items[simTraining.index],a=simTraining.answers[sim.id]||{},ok=gradeSim(sim,a);speak(`${ok?'Richtig gelöst':'Noch nicht vollständig richtig'}. Lösung: ${sim.solution}. ${sim.explanation}`)}
function maybeAutoSpeakSimulationQuestion(){if(!settings().autoRead||!simTraining)return;let sim=simTraining.items[simTraining.index],key=`${simTraining.index}:${sim.id}`;if(simTraining.spokenQuestion===key)return;simTraining.spokenQuestion=key;setTimeout(speakSimulation,0)}

function checkSimulation(){let sim=simTraining.items[simTraining.index],a=simTraining.answers[sim.id]||{};if(!answeredSim(sim,a))return alert('Bitte erst alle Felder ausfüllen.');simTraining.checked=true;markSimulation(sim,gradeSim(sim,a));renderSimulationTraining();maybeAutoSpeakSimulationFeedback();scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function simFeedback(sim,a){let ok=gradeSim(sim,a);return `<div class="feedback ${ok?'good':'bad'}"><b>${ok?'✅ Simulation richtig gelöst':'❌ Noch nicht vollständig richtig'}</b><div class="correctline">Lösung: ${esc(sim.solution)}</div><div class="explain">${esc(sim.explanation)}</div></div>`}
function nextSimulation(){simTraining.index++;simTraining.checked=false;if(simTraining.index>=simTraining.items.length){app.innerHTML=`<section class="card hero"><h2>Simulationen geschafft 🎯</h2><p>Dein PBQ-Fortschritt ist gespeichert.</p><div class="actions"><button class="btn teal" onclick="startSimulationTraining()">Alle neu mischen</button><button class="btn secondary" onclick="startSimulationErrors()">Nur PBQ-Fehler</button><button class="btn secondary" onclick="home()">Hauptmenü</button></div></section>`;return}renderSimulationTraining();scrollTo(0,0)}

function newExam(){let old=loadJSON(STORE_EXAM,null);if(['running','paused'].includes(old?.status)&&!confirm('Die gespeicherte Prüfung wirklich verwerfen und neu starten?'))return;let sims=shuffle(PBQS).slice(0,EXAM_SIM_COUNT).map(s=>({id:s.id,n:s.n,kind:'pbq'})),mcs=shuffle(BANK).slice(0,EXAM_COUNT-EXAM_SIM_COUNT).map(q=>({id:'q'+q.n,n:q.n,kind:'mc',order:shuffle(q.options.map(o=>o[0]))}));exam={version:1,status:'running',created:Date.now(),end:Date.now()+DURATION,index:0,items:shuffle([...sims,...mcs]),answers:{},flags:{}};examSpokenKey='';saveExam();startExamUI()}
function resumeExam(){exam=loadJSON(STORE_EXAM,null);if(!validActiveExam(exam)){localStorage.removeItem(STORE_EXAM);exam=null;return home()}if(exam.status==='paused'){exam.end=Date.now()+exam.remaining;exam.status='running';delete exam.remaining;saveExam()}examSpokenKey='';startExamUI()}
function saveExam(){localStorage.setItem(STORE_EXAM,JSON.stringify(exam))}
function startExamUI(){$('#examTop').classList.remove('hidden');startTimer();renderExam()}
function startTimer(){stopTimer();updateTimer();tick=setInterval(updateTimer,1000)}
function updateTimer(){if(!exam||exam.status!=='running')return;let ms=exam.end-Date.now();if(ms<=0){$('#timer').textContent='00:00';submitExam(true);return}let sec=Math.ceil(ms/1000),m=Math.floor(sec/60),s=sec%60;$('#timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('#timer').classList.toggle('low',sec<=600)}
function renderExam(){if(!exam)return home();if(exam.status==='done')return examResults();if(exam.status==='paused')return home();let item=exam.items[exam.index],total=exam.items.length;$('#counter').textContent=`${exam.index+1} / ${total}`;$('#examProg').style.width=`${(exam.index+1)/total*100}%`;if(item.kind==='mc')renderExamMC(item);else renderExamPBQ(item);maybeAutoSpeakExam()}
function renderExamMC(item){let q=qByNumber(item.n),selected=exam.answers[item.id]||[];app.innerHTML=`<section class="card"><div class="qhead"><div class="qnum">FRAGE ${exam.index+1} VON ${exam.items.length} · ORIGINAL-NR. ${q.n}</div><span class="type">${q.answers.length>1?`Mehrfachauswahl · ${q.answers.length}`:'Einzelauswahl'}</span></div><div class="qtext">${esc(q.prompt)}</div>${q.answers.length>1?`<div class="hint">Wähle genau ${q.answers.length} Antworten.</div>`:''}${item.order.map((key,i)=>{let text=q.options.find(o=>o[0]===key)?.[1]||'';return `<label class="option ${selected.includes(key)?'selected':''}"><input type="${q.answers.length>1?'checkbox':'radio'}" name="examAns" ${selected.includes(key)?'checked':''} onchange="pickExam('${item.id}','${key}',this.checked,${q.answers.length>1})"><span class="letter">${String.fromCharCode(65+i)}.</span><span>${esc(text)}</span></label>`}).join('')}${examNav(item.id)}</section>`}
function pickExam(id,key,checked,multi){let a=exam.answers[id]||[];exam.answers[id]=multi?(checked?[...new Set([...a,key])]:a.filter(x=>x!==key)):[key];saveExam();renderExam()}
function renderExamPBQ(item){let sim=simById(item.id),a=exam.answers[item.id]||{};app.innerHTML=`<section class="card pbq"><div class="qhead"><div><div class="qnum">FRAGE ${exam.index+1} VON ${exam.items.length} · ORIGINAL-NR. ${sim.n}</div><div class="qtext">${esc(sim.title)}</div></div><span class="type">SIMULATION / PBQ</span></div><p>${esc(sim.prompt)}</p>${simVisual(sim)}${renderSimFields(sim,a,'exam')}${examNav(item.id)}</section>`}
function examNav(id){let flag=!!exam.flags[id];return `<div class="nav"><div class="navgroup"><button class="btn secondary" onclick="examPrev()" ${exam.index===0?'disabled':''}>← Zurück</button><button class="btn flag ${flag?'on':''}" onclick="toggleFlag('${id}')">⚑ ${flag?'Markiert':'Frage merken'}</button><button class="btn secondary speakbtn" onclick="speakExamItem()">🔊 Vorlesen</button></div><div class="navgroup"><button class="btn secondary" onclick="pauseExam()">⏸ Pausieren</button><button class="btn secondary" onclick="examOverview()">Übersicht</button><button class="btn danger" onclick="askSubmitExam()">Prüfung abgeben</button>${exam.index<exam.items.length-1?'<button class="btn primary" onclick="examNext()">Weiter →</button>':''}</div></div>`}
function speakExamItem(){let item=exam.items[exam.index];if(item.kind==='mc'){let q=qByNumber(item.n),opts=item.order.map((key,i)=>`${String.fromCharCode(65+i)}. ${q.options.find(o=>o[0]===key)?.[1]||''}`).join('. ');return speak(`Frage ${exam.index+1}. ${q.prompt}. ${opts}`)}let sim=simById(item.id);speak(`Simulation ${exam.index+1}. ${sim.title}. ${sim.prompt}. ${sim.fields.map(f=>f.label).join('. ')}`)}
function maybeAutoSpeakExam(){if(!settings().autoRead||!exam||exam.status!=='running')return;let item=exam.items[exam.index],key=`${exam.index}:${item.id}`;if(examSpokenKey===key)return;examSpokenKey=key;setTimeout(speakExamItem,0)}
function toggleFlag(id){exam.flags[id]=!exam.flags[id];saveExam();renderExam()}function examPrev(){if(exam.index>0){exam.index--;saveExam();renderExam();scrollTo(0,0)}}function examNext(){if(exam.index<exam.items.length-1){exam.index++;saveExam();renderExam();scrollTo(0,0)}else examOverview()}
function itemAnswered(item){let a=exam.answers[item.id];return item.kind==='mc'?Array.isArray(a)&&a.length>0:answeredSim(simById(item.id),a)}
function examOverview(){let done=exam.items.filter(itemAnswered).length,flags=Object.values(exam.flags).filter(Boolean).length;app.innerHTML=`<section class="card"><div class="qnum">PRÜFUNGSÜBERSICHT</div><div class="qtext">${done} von ${exam.items.length} beantwortet · ${flags} markiert</div><div class="legend"><span><i class="dot" style="background:var(--goodbg)"></i>beantwortet</span><span><i class="dot" style="background:var(--badbg)"></i>offen</span><span>⚑ markiert</span></div><div class="reviewgrid">${exam.items.map((it,i)=>`<button class="qchip ${itemAnswered(it)?'done':'empty'} ${exam.flags[it.id]?'flagged':''}" onclick="examJump(${i})">${i+1}</button>`).join('')}</div><div class="actions"><button class="btn secondary" onclick="renderExam()">← Zur Frage</button><button class="btn secondary" onclick="pauseExam()">⏸ Prüfung pausieren</button><button class="btn primary" onclick="askSubmitExam()">Prüfung endgültig abgeben</button></div></section>`}
function pauseExam(){if(!exam||exam.status!=='running')return;let remaining=Math.max(0,exam.end-Date.now());if(!remaining)return submitExam(true);exam.remaining=remaining;exam.status='paused';saveExam();home()}
function examJump(i){exam.index=i;saveExam();renderExam();scrollTo(0,0)}
function askSubmitExam(){let open=exam.items.filter(it=>!itemAnswered(it)).length;if(confirm(`Prüfung jetzt abgeben?${open?` Noch ${open} Aufgabe(n) sind unbeantwortet.`:''}`))submitExam(false)}
function submitExam(auto=false){if(!exam||exam.status!=='running')return;exam.status='done';exam.auto=auto;exam.finished=Date.now();exam.grades={};exam.correct=0;for(let item of exam.items){let ok=item.kind==='mc'?eq(exam.answers[item.id],qByNumber(item.n).answers):gradeSim(simById(item.id),exam.answers[item.id]);exam.grades[item.id]=ok;if(ok)exam.correct++;if(item.kind==='mc')markQuestion(qByNumber(item.n),ok);else markSimulation(simById(item.id),ok)}recordExamResult();saveExam();stopTimer();examResults()}
function examResults(){hideExamTop();let total=exam.items.length,rawPct=exam.correct/total*100,pct=Math.round(rawPct),passed=rawPct>=TRAIN_GOAL,needed=Math.ceil(total*TRAIN_GOAL/100),wrong=exam.items.filter(it=>!exam.grades[it.id]);app.innerHTML=`<section class="card resultbox"><div class="qnum">AUSWERTUNG</div><div class="score ${passed?'pass':'fail'}">${pct}%</div><h2>${exam.correct} von ${total} richtig</h2><p><b>${passed?'✅ Sicherheitsziel erreicht':'Sicherheitsziel noch nicht erreicht'}</b> · ${exam.auto?'Die 90 Minuten sind abgelaufen und die Prüfung wurde automatisch abgegeben.':'Prüfung abgegeben.'}</p><div class="info"><b>Prüfungsorientierung: etwa 77–80 % richtige Antworten. Sicherheitsziel dieses Trainers: ${TRAIN_GOAL}% = mindestens ${needed} von ${total} Aufgaben.</b><br>Offiziell bestanden ab 720/900 Skalenpunkten; CompTIA veröffentlicht keinen festen Prozentsatz richtiger Antworten.</div><div class="actions"><button class="btn primary" onclick="newExamFromResult()">Neue Prüfung</button><button class="btn secondary" onclick="examReview(false)">Alle Aufgaben (${total})</button><button class="btn warning" onclick="examReview(true)" ${wrong.length?'':'disabled'}>NUR FEHLER (${wrong.length})</button><button class="btn secondary" onclick="home()">Hauptmenü</button></div></section>`}
function examReview(onlyWrong){let list=onlyWrong?exam.items.filter(it=>!exam.grades[it.id]):exam.items;app.innerHTML=`<section class="card"><div class="qnum">${onlyWrong?'FEHLERANALYSE':'ALLE PRÜFUNGSAUFGABEN'}</div><div class="qtext">${list.length} Aufgabe(n) mit Lösung</div><div class="resultlist">${list.map((it,i)=>{let ok=exam.grades[it.id];if(it.kind==='mc'){let q=qByNumber(it.n);return `<article class="resitem ${ok?'good':'bad'}"><b>${i+1}. ${esc(q.prompt)}</b><div><b>${ok?'✅ Richtig':'❌ Falsch / unbeantwortet'}</b></div><div class="solution">Richtig: ${esc(answerTexts(q).join(' · '))}</div><div class="explain">${esc(q.explanation)}</div></article>`}let sim=simById(it.id);return `<article class="resitem ${ok?'good':'bad'}"><b>${i+1}. Simulation ${sim.n}: ${esc(sim.title)}</b><div><b>${ok?'✅ Richtig':'❌ Falsch / unvollständig'}</b></div><div class="solution">${esc(sim.solution)}</div><div class="explain">${esc(sim.explanation)}</div></article>`}).join('')}</div><div class="actions"><button class="btn secondary" onclick="examResults()">← Auswertung</button><button class="btn primary" onclick="examReview(${!onlyWrong})">${onlyWrong?'Alle Aufgaben':'Nur Fehler'}</button></div></section>`}
function newExamFromResult(){localStorage.removeItem(STORE_EXAM);exam=null;newExam()}

function openQuestion(event){event.preventDefault();let n=Number($('#qsearch').value);let sim=PBQS.find(s=>s.n===n);if(sim)return openSimulation(sim.id);let q=qByNumber(n);if(q)return startTraining('all','all',n);alert('Diese Fragennummer wurde nicht gefunden.')}
function exportProgress(){let payload={kind:'sabine-networkplus-progress',version:1,created:new Date().toISOString(),progress:progress(),exam:loadJSON(STORE_EXAM,null),history:examHistory(),settings:settings()};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Sabine_NetworkPlus_Fortschritt.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('#importFile').addEventListener('change',event=>{let file=event.target.files?.[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(data.kind!=='sabine-networkplus-progress'||data.version!==1||!data.progress||typeof data.progress!=='object'||Array.isArray(data.progress))throw new Error('wrong file');let restoredProgress=normalizeProgress(data.progress),restoredExam=data.exam&&['running','paused'].includes(data.exam.status)?data.exam:null,restoredHistory=data.history===undefined?examHistory():normalizeExamHistory(data.history),restoredSettings=data.settings===undefined?settings():normalizeSettings(data.settings);if(restoredExam&&!validActiveExam(restoredExam))throw new Error('invalid exam');if(!confirm('Gesicherten Lernstand jetzt einlesen und den aktuellen Stand ersetzen?'))return;saveProgress(restoredProgress);saveExamHistory(restoredHistory);saveSettings(restoredSettings);if(restoredExam)localStorage.setItem(STORE_EXAM,JSON.stringify(restoredExam));else localStorage.removeItem(STORE_EXAM);home()}catch{alert('Das ist keine gültige Network+-Fortschrittsdatei.')}finally{event.target.value=''}};reader.readAsText(file)})

home();
</script>
</body>
</html>
