d IP-Adressen bereitgestellt."],["B","Der Administrator hat ein falsches Standardgateway konfiguriert."],["C","Der Administrator hat nicht genügend Routen bereitgestellt."],["D","Der Administrator hat nicht genügend MAC-Adressen bereitgestellt."]],"answers":["A"],"explanation":"Wenn ein neuer DHCP-Server installiert wurde und später einige Benutzer Verbindungsprobleme melden, ist es am wahrscheinlichsten, dass der DHCP-Pool zu wenige IP-Adressen enthält. Sobald alle verfügbaren Adressen vergeben sind, können neue Geräte keine IP-Adresse mehr beziehen und verlieren dadurch die Netzwerkkonnektivität.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":146,"prompt":"Ein Unternehmen führt eine Richtlinie ein, nach der Mitarbeiter keine privaten Geräte mit ins Büro bringen und mit dem WLAN verbinden dürfen. Wie lässt sich diese Richtlinie am besten durchsetzen?","options":[["A","MAC Filtering"],["B","802.1X"],["C","Port Security"],["D","ACL"]],"answers":["B"],"explanation":"802.1X ist ein Protokoll zur Netzwerkzugangskontrolle, mit dem Geräte vor dem Verbindungsaufbau authentifiziert werden. Das Unternehmen kann dadurch verlangen, dass sich nur autorisierte, beispielsweise vom Unternehmen bereitgestellte Geräte authentifizieren dürfen, bevor sie Zugriff erhalten. So lässt sich der Zugang privater Geräte effektiv verhindern. MAC Filtering oder ACLs lassen sich leichter umgehen; Port Security wird typischerweise stärker in kabelgebundenen Netzen eingesetzt.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":147,"prompt":"Ein Netzwerktechniker untersucht ein Problem in einem VoIP-Netzwerk. Die Analyse zeigt, dass die Sprachqualität stark abnimmt, sobald Benutzer große Dateien hochladen. Wenn kein anderer Netzwerkverkehr vorhanden ist, ist die Sprachqualität einwandfrei. Was sollte der Techniker am wahrscheinlichsten tun, um das Problem zu beheben?","options":[["A","MAC Filtering aktivieren."],["B","Die VLAN-Datenbank verkleinern."],["C","QoS auf dem Router konfigurieren."],["D","ACLs implementieren."]],"answers":["C"],"explanation":"Quality of Service (QoS) priorisiert bestimmte Arten von Netzwerkverkehr. In diesem Fall sollte der Router so konfiguriert werden, dass Sprachverkehr gegenüber normalem Datenverkehr wie großen Datei-Uploads bevorzugt wird. Dadurch bleibt die VoIP-Qualität auch bei hoher Netzauslastung erhalten.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":148,"prompt":"Welche der folgenden Disaster-Recovery-Kennzahlen beschreibt die Datenmenge, die seit der letzten Sicherung verloren geht?","options":[["A","MTTR"],["B","RTO"],["C","RPO"],["D","MTBF"]],"answers":["C"],"explanation":"Der Recovery Point Objective (RPO) beschreibt den maximal akzeptablen Datenverlust, gemessen als Zeitraum. Er gibt den Zeitpunkt an, bis zu dem Daten nach einem Ausfall wiederhergestellt werden müssen, und hilft damit festzulegen, wie häufig Sicherungen durchgeführt werden müssen.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":149,"prompt":"Ein Netzwerkadministrator muss die Netzwerküberwachung verbessern. Was sollte er zuerst tun?","options":[["A","Baseline-Messwerte festlegen."],["B","Ein SIEM implementieren."],["C","Regelmäßig Pakete mitschneiden."],["D","Verfügbarkeitsüberwachung durchführen."]],"answers":["A"],"explanation":"Bevor die Netzwerküberwachung verbessert wird, sollten zunächst Baseline-Messwerte für das normale Verhalten des Netzwerks erfasst werden, z. B. Bandbreitennutzung, Latenz, Paketverlust und weitere wichtige Kennzahlen. Eine solche Ausgangsbasis ermöglicht es, Abweichungen und Leistungsprobleme zu erkennen und die Auswirkungen späterer Änderungen zu bewerten.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":150,"prompt":"Ein Netzwerkadministrator untersucht Probleme mit einem DHCP-Server an einer Universität. In letzter Zeit sind mehr Studierende auf dem Campus angekommen, und Benutzer können keine IP-Adresse mehr beziehen. Was sollte der Administrator tun?","options":[["A","IP Helper aktivieren."],["B","Die Subnetzmaske ändern."],["C","Die Größe des DHCP-Scopes erhöhen."],["D","Adressausschlüsse hinzufügen."]],"answers":["C"],"explanation":"Wenn nach dem Eintreffen zusätzlicher Benutzer keine IP-Adressen mehr vergeben werden können, ist der verfügbare DHCP-Adresspool wahrscheinlich ausgeschöpft. Durch das Vergrößern des Scopes wird der Bereich verfügbarer IP-Adressen erweitert, sodass mehr Geräte eine Adresse erhalten und sich mit dem Netzwerk verbinden können.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":151,"prompt":"Welche der folgenden Lösungen ist dafür ausgelegt, Netzwerkverkehr abhängig von der Verkehrsmenge auf mehrere Geräte zu verteilen?","options":[["A","Load Balancer"],["B","Router"],["C","Proxy"],["D","Switch"]],"answers":["A"],"explanation":"Ein Load Balancer verteilt Netzwerkverkehr auf mehrere Geräte, beispielsweise Server, abhängig von Faktoren wie Verkehrsmenge oder Serverauslastung. Dadurch werden Ressourcen effizienter genutzt, einzelne Geräte vor Überlastung geschützt und Leistung sowie Zuverlässigkeit verbessert.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":152,"prompt":"Ein Benutzer hat seine Workstation kürzlich in einen anderen Bereich des Büros verlegt. Er kann auf das Internet zugreifen und drucken, jedoch nicht auf Serverressourcen. Was ist die wahrscheinlichste Ursache?","options":[["A","Falsches Standardgateway"],["B","Falsche VLAN-Zuweisung"],["C","Error-disabled Port"],["D","Doppelte IP-Adresse"]],"answers":["B"],"explanation":"Wenn Internetzugriff und Drucken funktionieren, Serverressourcen jedoch nicht erreichbar sind, ist die Workstation wahrscheinlich dem falschen VLAN zugeordnet. VLANs segmentieren Netzwerkverkehr. Befindet sich die Workstation in einem anderen VLAN als die Server und ist kein passendes Inter-VLAN-Routing vorhanden, kann sie die Serverressourcen nicht erreichen.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":153,"prompt":"Ein Techniker plant den Einbau von Geräten in ein Rack eines Rechenzentrums mit Hot-Aisle-/Cold-Aisle-Belüftung. In welche Richtung sollte die Abluft der Geräte zeigen?","options":[["A","Zu den Seiten"],["B","Nach oben"],["C","Nach vorn"],["D","Nach hinten"]],"answers":["D"],"explanation":"Bei Hot-Aisle-/Cold-Aisle-Konzepten wird kühle Luft typischerweise an der Vorderseite der Geräte aus dem Cold Aisle angesaugt und warme Abluft an der Rückseite in den Hot Aisle abgegeben. Diese Anordnung verbessert Luftstrom und Kühlungseffizienz.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":154,"prompt":"Ein Netzwerkadministrator muss dem Netzwerk 255 nutzbare IP-Adressen hinzufügen. Derzeit wird ein /24 verwendet. Welches der folgenden Präfixe erfüllt diese Anforderung?","options":[["A","/23"],["B","/25"],["C","/29"],["D","/32"]],"answers":["A"],"explanation":"Ein /23-Subnetz enthält 512 IP-Adressen, davon 510 nutzbare Adressen nach Abzug von Netzwerk- und Broadcastadresse. Ein /24 bietet nur 254 nutzbare Adressen. Der Wechsel auf /23 verdoppelt den verfügbaren Adressraum und erfüllt damit die Anforderung.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":155,"prompt":"Welche der folgenden Technologien ermöglicht es einer Organisation, mehrere interne Geräte auf eine einzige extern sichtbare IP-Adresse abzubilden?","options":[["A","NAT"],["B","BGP"],["C","OSPF"],["D","FHRP"]],"answers":["A"],"explanation":"NAT ermöglicht es, mehrere interne Geräte mit privaten IP-Adressen über eine öffentliche IP-Adresse nach außen kommunizieren zu lassen. Dadurch werden öffentliche IP-Adressen eingespart und interne Geräte können über eine gemeinsame externe Adresse mit externen Netzen wie dem Internet kommunizieren.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":156,"prompt":"Welcher der folgenden Schritte der Fehlerbehebungsmethodik beinhaltet das Prüfen von Protokollen auf kürzlich vorgenommene Änderungen?","options":[["A","Das Problem identifizieren."],["B","Ergebnisse und Resultate dokumentieren."],["C","Die Theorie testen, um die Ursache festzustellen."],["D","Einen Maßnahmenplan erstellen."]],"answers":["A"],"explanation":"Beim Schritt Problem identifizieren gehört das Prüfen von Logs auf kürzlich erfolgte Änderungen zur Informationssammlung. So lässt sich feststellen, ob neue Konfigurationen, Updates oder andere Änderungen mit dem Problem zusammenhängen könnten.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":157,"prompt":"Welche der folgenden Konfigurationen verhindert, dass Internetverkehr durch ein VPN geleitet wird?","options":[["A","Client-to-Site"],["B","Active-Passive"],["C","Split Tunnel"],["D","Out-of-Band"]],"answers":["C"],"explanation":"Bei einem Split Tunnel wird nur der für das interne Netzwerk bestimmte Verkehr durch den VPN-Tunnel geleitet. Internetverkehr kann direkt über die lokale Internetverbindung laufen. Dadurch wird die VPN-Verbindung entlastet.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":158,"prompt":"Welcher der folgenden Ports stellt eine sichere Verbindung zu einem Verzeichnisdienst her?","options":[["A","22"],["B","389"],["C","445"],["D","636"]],"answers":["D"],"explanation":"Port 636 wird für LDAPS verwendet. Dabei wird LDAP über SSL/TLS verschlüsselt. Normales, unverschlüsseltes LDAP verwendet üblicherweise Port 389.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":159,"prompt":"Ein Techniker verbindet einen neuen Switch über zwei redundante Links mit einem bestehenden Switch. Unmittelbar danach verlieren Benutzer die Verbindung. Die Spanning-Tree-Anzeige weist auf beiden Switches Port 1 und Port 2 mit Kostenwert 2 als FORWARDING aus. Welche Maßnahme beschreibt die beste Behebung?","options":[["A","Die Portkosten sollten nicht identisch sein."],["B","Die Ports sollten Link Aggregation verwenden."],["C","Eine Root Bridge muss festgelegt werden."],["D","Der Switch sollte für RSTP konfiguriert werden."]],"answers":["D"],"explanation":"Zwei gleichzeitig weiterleitende Layer-2-Verbindungen erzeugen ohne wirksame Schleifenvermeidung eine Switching-Schleife. RSTP erkennt die redundante Topologie und blockiert einen Pfad, konvergiert dabei schneller als klassisches STP.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":160,"prompt":"Ein Netzwerkadministrator richtet für jede Abteilung Sicherheitszonen ein. Welche der folgenden Technologien sollte er dafür verwenden?","options":[["A","ACLs"],["B","Port Security"],["C","Content Filtering"],["D","NAC"]],"answers":["A"],"explanation":"Access Control Lists (ACLs) definieren Regeln, die Datenverkehr zwischen verschiedenen Netzwerkzonen erlauben oder verweigern. Auf Routern oder Firewalls können ACLs den Verkehr zwischen Abteilungen kontrollieren, Sicherheitsrichtlinien durchsetzen und Bereiche voneinander isolieren.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":161,"prompt":"Welches der folgenden Protokolle wird für das Routing im öffentlichen Internet verwendet?","options":[["A","BGP"],["B","OSPF"],["C","EIGRP"],["D","RIP"]],"answers":["A"],"explanation":"BGP (Border Gateway Protocol) wird zum Routing zwischen autonomen Systemen im öffentlichen Internet verwendet. Es wählt anhand verschiedener Attribute und Richtlinien geeignete Pfade zwischen unterschiedlichen Netzen aus und bildet damit einen wesentlichen Bestandteil des weltweiten Internet-Routings.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":162,"prompt":"Welches der folgenden Protokolle ermöglicht Remotezugriff über Port 22?","options":[["A","SSH"],["B","Telnet"],["C","TLS"],["D","RDP"]],"answers":["A"],"explanation":"SSH (Secure Shell) verwendet standardmäßig Port 22 und ermöglicht verschlüsselten Remotezugriff auf Server und Netzwerkgeräte.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":163,"prompt":"Nach Änderungen an einer Firewall können Benutzer nicht mehr auf einen Webserver zugreifen. Ein Netzwerkadministrator möchte prüfen, ob die Ports 80 und 443 des Webservers weiterhin aus dem IP-Bereich der Benutzer erreichbar sind. Welcher Befehl eignet sich am besten für diesen Test?","options":[["A","dig"],["B","ifconfig"],["C","ping"],["D","nmap"]],"answers":["D"],"explanation":"nmap eignet sich zur Prüfung, ob bestimmte Ports wie 80 für HTTP und 443 für HTTPS auf einem Zielsystem geöffnet und erreichbar sind. Beispiel: `nmap -p 80,443 \u003cweb_server_IP>` Dieser Befehl prüft gezielt den Status der beiden Ports am angegebenen Webserver.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":164,"prompt":"Welcher der folgenden Angriffe würde am wahrscheinlichsten zu doppelten IP-Adressen in einem Netzwerk führen?","options":[["A","Rogue DHCP Server"],["B","DNS Poisoning"],["C","Social Engineering"],["D","Denial-of-Service"]],"answers":["A"],"explanation":"Ein Rogue DHCP Server kann IP-Adressen vergeben, die sich mit dem Adressbereich des legitimen DHCP-Servers überschneiden. Dadurch können doppelte IP-Adressen entstehen, was zu Verbindungsproblemen bei den betroffenen Geräten führt.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":165,"prompt":"Eine Organisation möchte eine bessere Transparenz über ihr Netzwerk. Die Anforderungen umfassen: • Überwachung mehrerer Hersteller und Betriebssysteme • Datensammlung in Echtzeit • Korrelation von Daten Welche der folgenden Lösungen erfüllt diese Anforderungen?","options":[["A","SNMP"],["B","SIEM"],["C","Nmap"],["D","Syslog"]],"answers":["B"],"explanation":"Ein SIEM (Security Information and Event Management) kann Daten aus unterschiedlichen Herstellersystemen und Betriebssystemen sammeln, Ereignisse in Echtzeit überwachen und protokollieren sowie Daten aus mehreren Geräten und Systemen korrelieren, um Muster, Abweichungen und Sicherheitsereignisse zu erkennen.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":166,"prompt":"Ein Administrator bewertet die Verwendung von Authentifizierung innerhalb von SNMP. Welche der folgenden Möglichkeiten ist die sicherste Methode, Geräte ausschließlich mithilfe von SNMP zu authentifizieren?","options":[["A","SNMPv1 verwenden und einen Community String als PSK einsetzen."],["B","SNMPv3 verwenden und Trap-Meldungen für kritische Netzwerkereignisse einrichten."],["C","SNMPv2c verwenden und Informs zur Validierung der Geräteauthentifizierung einsetzen."],["D","SNMPv2u verwenden, um Geräte für die Netzwerküberwachung zu authentifizieren."]],"answers":["B"],"explanation":"SNMPv3 bietet im Vergleich zu früheren Versionen erweiterte Sicherheitsfunktionen wie Benutzerauthentifizierung und Verschlüsselung. Zusätzlich können Trap-Meldungen für kritische Ereignisse eingerichtet werden, um Administratoren in Echtzeit zu informieren.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":167,"prompt":"Ein Unternehmen hat einen Anstieg der Zugriffe auf Glücksspiel-Websites festgestellt und möchte dieses Verhalten auf Arbeitscomputern einschränken. Welche der folgenden Lösungen sollte das Unternehmen am wahrscheinlichsten implementieren?","options":[["A","ACLs"],["B","Content Filter"],["C","Port Security"],["D","Screened Subnet"]],"answers":["B"],"explanation":"Ein Content Filter kann den Zugriff auf bestimmte Websites oder Inhaltskategorien anhand vorgegebener Regeln blockieren. Er kann beispielsweise auf einer Firewall, einem Proxyserver oder als spezialisierte Filtersoftware eingesetzt werden.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":168,"prompt":"Nach einem Brand in einem Rechenzentrum wurde die Verkabelung ersetzt. Kurz danach stellt ein Administrator Netzwerkprobleme fest. Welche der folgenden Ursachen sind am wahrscheinlichsten? (Wähle zwei.)","options":[["A","Die Switches haben nicht die richtige Spannung."],["B","Das HVAC-System wurde nach dem Brand nicht auf vollständige Funktion geprüft."],["C","Die VLAN-Datenbank wurde vor der Wiederinbetriebnahme der Geräte nicht gelöscht."],["D","Die RJ45-Kabel wurden durch ungeschirmte Kabel ersetzt."],["E","Für die neue Terminierung wurde der falsche Transceiver-Typ verwendet."],["F","Die neuen RJ45-Kabel gehören einer höheren Kategorie an als die alten."]],"answers":["D","E"],"explanation":"Ungeschirmte RJ45-Kabel: In Umgebungen mit hoher elektromagnetischer Beeinflussung können ungeschirmte Kabel wie UTP Störungen verursachen. Geschirmte Kabel wie STP oder FTP reduzieren solche Einflüsse. Falscher Transceiver-Typ: Ein nicht passender Transceiver, beispielsweise durch Verwechslung von Singlemode und Multimode oder durch einen falschen Steckertyp, kann dazu führen, dass keine Verbindung aufgebaut wird oder die Signalqualität schlecht ist.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":169,"prompt":"Cloud Computing kann die bereitgestellte Recheninfrastruktur für kurze Zeiträume an steigende oder sinkende Anforderungen anpassen. Welche Eigenschaft beschreibt dies am besten?","options":[["A","Effizienz"],["B","Elastizität"],["C","Multitenancy"],["D","Skalierbarkeit"]],"answers":["B"],"explanation":"Elastizität bezeichnet die Fähigkeit einer Cloud-Umgebung, Ressourcen abhängig vom aktuellen Bedarf automatisch zu erhöhen oder zu reduzieren. So können kurzfristige Lastspitzen bewältigt werden, ohne dauerhaft zu viele Ressourcen bereitzustellen.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":170,"prompt":"Welche der folgenden Technologien kann bei ihrer Implementierung zusätzlich eine Sicherheitsfunktion bieten?","options":[["A","NAT"],["B","BGP"],["C","FHRP"],["D","EIGRP"]],"answers":["A"],"explanation":"NAT verbirgt interne private IP-Adressen gegenüber externen Netzen, indem sie für den Internetzugriff in öffentliche Adressen übersetzt werden. Dadurch sind interne Geräte von außen nicht direkt über ihre privaten Adressen sichtbar.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":171,"prompt":"Welche der folgenden Bezeichnungen beschreibt das Übertragungsformat auf der Transportschicht bei verbindungsloser Kommunikation am besten?","options":[["A","Datagramm"],["B","Segment"],["C","Frames"],["D","Pakete"]],"answers":["A"],"explanation":"Bei verbindungsloser Kommunikation auf der Transportschicht, beispielsweise mit UDP, werden die Dateneinheiten als Datagramme bezeichnet. Sie werden unabhängig voneinander übertragen, ohne dass zuvor eine feste Verbindung aufgebaut wird.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":172,"prompt":"Welche der folgenden Lösungen arbeitet am wahrscheinlichsten mit einer FC-Verbindung und bietet eine höhere Skalierbarkeit?","options":[["A","DAS"],["B","SAN"],["C","SSE"],["D","NAS"]],"answers":["B"],"explanation":"Ein SAN (Storage Area Network) verwendet häufig Fibre Channel (FC), um Servern schnellen blockbasierten Speicher bereitzustellen. SANs lassen sich gut skalieren, indem weitere Speichersysteme oder Geräte ergänzt werden.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":173,"prompt":"Ein Unternehmen wechselt zu einem Hybrid-Cloud-Modell. Im Rahmen dieser Umstellung wird der Mailserver in die Cloud verschoben. Der Systemadministrator muss sicherstellen, dass der Mailserver weiterhin E-Mails empfängt. Welchen DNS-Record sollte der Administrator aktualisieren?","options":[["A","NS"],["B","PTR"],["C","MX"],["D","A"]],"answers":["C"],"explanation":"MX-Records geben an, welche Mailserver E-Mails für eine Domain empfangen. Beim Umzug des Mailservers in die Cloud muss der MX-Eintrag auf den neuen Server verweisen, damit eingehende E-Mails korrekt zugestellt werden.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":174,"prompt":"Ein Netzwerktechniker konfiguriert Netzwerkports in einem öffentlich zugänglichen Büro. Zur Erhöhung der Sicherheit sollen die Ports erst nach erfolgreicher Authentifizierung eine Netzwerkverbindung zulassen. Welche Sicherheitsfunktion sollte verwendet werden?","options":[["A","Port Security"],["B","802.1X"],["C","MAC Filtering"],["D","Access Control List"]],"answers":["B"],"explanation":"802.1X stellt portbasierte Netzwerkzugangskontrolle bereit. Geräte müssen sich mit geeigneten Anmeldedaten oder Zertifikaten authentifizieren, bevor ein Switch oder Access Point Netzwerkzugriff gewährt.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":175,"prompt":"Ein Netzwerkadministrator erweitert ein Netzwerk und möchte sicherstellen, dass keine unautorisierten redundanten Verbindungen vorhanden sind. Welche Technologie sollte er verwenden, um redundante Verbindungen zu erkennen und zu blockieren?","options":[["A","SDN"],["B","STP"],["C","LLDP"],["D","OSPF"]],"answers":["B"],"explanation":"Spanning Tree Protocol (STP) erkennt redundante Pfade in Ethernet-Netzen und versetzt überflüssige Verbindungen in einen blockierenden Zustand. Dadurch werden Schleifen und Broadcast-Stürme verhindert.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":176,"prompt":"Ein Netzwerkadministrator bemerkt ungewöhnliche Kommunikation zwischen virtuellen Maschinen über ephemere Ports im selben Subnetz. Er befürchtet, dass sich dieser Verkehr lateral innerhalb des Netzwerks bewegt. Welche Art von Datenfluss analysiert der Administrator?","options":[["A","East-West"],["B","Point-to-Point"],["C","Horizontal Scaling"],["D","Hub-and-Spoke"]],"answers":["A"],"explanation":"East-West-Traffic bezeichnet Kommunikation zwischen internen Systemen innerhalb desselben Rechenzentrums oder Netzes, z. B. zwischen virtuellen Maschinen. Im Gegensatz dazu bezeichnet North-South-Traffic den Verkehr zwischen internen Systemen und externen Netzen.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":177,"prompt":"Welche Schutzeigenschaft wäre verletzt, wenn ein Mitarbeiter versehentlich Kundendaten löscht?","options":[["A","Integrität"],["B","Vertraulichkeit"],["C","Schwachstelle"],["D","Verfügbarkeit"]],"answers":["A"],"explanation":"Integrität bedeutet, dass Daten korrekt, vollständig und unverändert bleiben, sofern keine autorisierte Änderung erfolgt. Durch versehentliches Löschen sind die ursprünglichen Daten nicht mehr vollständig, wodurch ihre Integrität verletzt wird.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":178,"prompt":"Ein Netzwerktechniker ist nun für das gesamte SNMP-Management der Organisation verantwortlich. Er muss eine SNMP-Version verwenden, die keine Daten im Klartext überträgt. Welche ist die niedrigste SNMP-Version, die diese Anforderung erfüllt?","options":[["A","v1"],["B","v2c"],["C","v2u"],["D","v3"]],"answers":["D"],"explanation":"SNMPv3 unterstützt Authentifizierung und Verschlüsselung. Im Gegensatz zu SNMPv1 und SNMPv2c, die beispielsweise Community Strings im Klartext übertragen, ermöglicht SNMPv3 eine verschlüsselte Kommunikation.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":179,"prompt":"Ein Unternehmen hat mehrere Standorte übernommen, für die keine Dokumentation vorhanden ist. Ein Netzwerkadministrator muss alle verwendeten digitalen Assets identifizieren und dokumentieren. Welche Methode eignet sich dafür am besten?","options":[["A","Availability Monitoring"],["B","Packet Capture"],["C","Physische Inventur"],["D","Network Discovery"]],"answers":["D"],"explanation":"Network Discovery identifiziert Geräte, Dienste und Ressourcen im Netzwerk, beispielsweise anhand von IP-Adressen, offenen Ports und Betriebssysteminformationen. Dadurch kann effizient eine Bestandsaufnahme digitaler Assets erstellt werden.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":180,"prompt":"Ein Netzwerkadministrator hat kürzlich die WLAN-Infrastruktur mit neuen Access Points aufgerüstet. Benutzer melden, dass die WLAN-Verbindung im Stillstand abbricht und sich nach 20 bis 30 Sekunden wieder verbindet. In den Logs sieht der Administrator, dass die Access Points ihre Kanäle wechseln. Was ist die wahrscheinlichste Ursache der Dienstunterbrechungen?","options":[["A","Kanalinterferenzen"],["B","Fehlerhafte Roaming-Konfiguration"],["C","Netzwerküberlastung"],["D","Unzureichende WLAN-Abdeckung"]],"answers":["A"],"explanation":"Die wahrscheinlichste Ursache sind Kanalinterferenzen. Access Points können über Mechanismen wie Dynamic Frequency Selection (DFS) oder automatische Kanalwahl auf weniger belastete Kanäle wechseln. Ein solcher Kanalwechsel führt für verbundene Geräte kurzzeitig zu einer Unterbrechung. Nicht überlappende Kanäle und eine optimierte Platzierung der APs können das Problem reduzieren.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":181,"prompt":"Ein Netzwerkadministrator muss ein Multicast-Netzwerk für Audio- und Videoübertragungen einrichten. Welches der folgenden Netze ist dafür am geeignetsten?","options":[["A","172.16.0.0/24"],["B","192.168.0.0/24"],["C","239.0.0.0/8"],["D","240.0.0.0/24"]],"answers":["C"],"explanation":"239.0.0.0/8 gehört zum administrativ begrenzten IPv4-Multicastbereich und eignet sich für organisationsinterne Multicast-Anwendungen. Die anderen angebotenen Netze sind private Unicast- beziehungsweise reservierte Adressbereiche.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":182,"prompt":"Ein Benutzer stellt über einen Webbrowser eine Verbindung zu einem Unternehmens-VPN her und kann mittels TLS auf das interne Finanzsystem zugreifen, um eine Zeiterfassung einzugeben. Welche Aussage beschreibt die Nutzung des VPNs am besten?","options":[["A","Clientless"],["B","Client-to-Site"],["C","Full Tunnel"],["D","Site-to-Site"]],"answers":["A"],"explanation":"Ein Clientless VPN benötigt keine speziell installierte VPN-Clientsoftware. Der Benutzer verbindet sich über einen Webbrowser, typischerweise mittels SSL/TLS, mit internen Ressourcen. Genau dies wird im beschriebenen Szenario verwendet.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":183,"prompt":"Ein Netzwerkadministrator muss Dienste in eine externe Umgebung verlagern. Es dauert vier Wochen, bis diese Umgebung vollständig betriebsbereit ist. Welches Disaster-Recovery-Konzept beschreibt dies?","options":[["A","Hot Site"],["B","Warm Site"],["C","Cold Site"],["D","Active-Active-Ansatz"]],"answers":["C"],"explanation":"Vier Wochen Wiederanlaufzeit sprechen für eine Cold Site: Sie stellt vor allem Raum, Strom und Kühlung bereit; Systeme, Kommunikation, Software und Daten müssen erst beschafft beziehungsweise eingerichtet werden. Eine Warm Site ist bereits teilweise ausgestattet und wird typischerweise innerhalb von Stunden bis wenigen Tagen betriebsbereit.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":184,"prompt":"Ein Sicherheitsanalyst möchte den Internetzugriff anhand von Website-Reputation und Kategorien steuern. Die Lösung darf keine Änderungen am Verkehrsfluss erfordern. Welche Lösung erfüllt diese Anforderungen am wahrscheinlichsten?","options":[["A","Proxy"],["B","DNS Filtering"],["C","Router-ACL"],["D","Load Balancer"]],"answers":["B"],"explanation":"DNS Filtering kontrolliert den Zugriff anhand von DNS-Anfragen und kann Websites entsprechend ihrer Reputation oder Kategorie blockieren bzw. zulassen, ohne dass der eigentliche Datenverkehr über einen neuen Pfad geleitet werden muss.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":185,"prompt":"Ein WLAN-Techniker möchte eine Technologie einsetzen, durch die Endgeräte automatisch das am besten geeignete Frequenzband auswählen. Welche Technologie sollte er verwenden?","options":[["A","Band Steering"],["B","Wireless LAN Controller"],["C","Richtantenne"],["D","Autonomer Access Point"]],"answers":["A"],"explanation":"Band Steering lenkt WLAN-Geräte automatisch auf das geeignetere Frequenzband, typischerweise 2,4 GHz oder 5 GHz, abhängig von Signalstärke und Auslastung.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":186,"prompt":"Ein Benutzer ruft nach Geschäftsschluss beim Helpdesk an und meldet, dass Dateien auf einem Gerät nicht zugänglich sind und das Hintergrundbild geändert wurde. Der Netzwerkadministrator vermutet einen Einzelfall, der Sicherheitsanalyst hält jedoch einen Ransomware-Angriff für möglich. Welcher Schritt der Fehlerbehebung sollte zuerst durchgeführt werden?","options":[["A","Das Problem identifizieren."],["B","Eine Theorie aufstellen."],["C","Ergebnisse dokumentieren."],["D","Einen Maßnahmenplan erstellen."]],"answers":["A"],"explanation":"Der erste Schritt ist das Identifizieren des Problems. Dazu müssen zunächst alle verfügbaren Informationen und Symptome gesammelt werden, bevor eine Theorie oder ein Maßnahmenplan erstellt wird.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":187,"prompt":"Eine Rechenzentrumsverbindung über VXLAN wurde kürzlich implementiert. Ein Netzwerktechniker beobachtet langsame Leistung und Fragmentierung auf der Verbindung. Welche Technologie behebt das Problem?","options":[["A","802.1Q-Tagging"],["B","Spanning Tree"],["C","Link Aggregation"],["D","Jumbo Frames"]],"answers":["D"],"explanation":"VXLAN kapselt Ethernet-Frames in UDP-Pakete und erzeugt zusätzlichen Overhead. Ist die MTU zu klein, kann Fragmentierung entstehen. Jumbo Frames erhöhen die maximal übertragbare Framegröße und können dadurch Fragmentierung vermeiden und die Leistung verbessern.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":188,"prompt":"Ein neuer Server wird in einer Trusted Zone bereitgestellt und ist nachweislich online; alle erforderlichen Dienste laufen. Benutzer aus einem Perimeter-Netzwerk können jedoch nicht auf den Server zugreifen. Was sollte der Netzwerkadministrator tun?","options":[["A","Einen TXT-Record für den neuen Server erstellen."],["B","Die Firewall-ACL aktualisieren und Zugriff auf den neuen Server erlauben."],["C","Eine statische Route vom Benutzer-VLAN zum neuen Server konfigurieren."],["D","Einen statischen ARP-Eintrag für den Server auf dem Layer-3-Switch anlegen."]],"answers":["B"],"explanation":"Da der Server selbst funktioniert, blockiert am wahrscheinlichsten eine Firewall bzw. ACL den Verkehr aus dem Perimeter-Netz. Die Firewall-ACL muss so angepasst werden, dass der benötigte Zugriff erlaubt wird.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":189,"prompt":"Netzwerkadministratoren verwenden Telnet zur Verwaltung von Netzwerkgeräten im Subnetz 192.168.1.0/24. Welches Tool eignet sich am besten, um die Geräte zu identifizieren?","options":[["A","dig"],["B","nmap"],["C","tracert"],["D","telnet"]],"answers":["B"],"explanation":"nmap kann Geräte in einem Netz erkennen, offene Ports anzeigen und Informationen zu angebotenen Diensten sammeln. Damit eignet es sich zur Identifizierung der Geräte im angegebenen Subnetz.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":190,"prompt":"Ein Netzwerkadministrator hat kürzlich Konfigurationen auf einem Layer-3-Switch aktualisiert. Danach melden Benutzer, dass ein bestimmter Dateiserver nicht mehr erreichbar ist. Was ist die wahrscheinlichste Ursache?","options":[["A","Falsche ACLs"],["B","Switching Loop"],["C","Doppelte IP-Adressen"],["D","Falsche Default Route"]],"answers":["A"],"explanation":"Fehlerhaft konfigurierte ACLs können nach einer Änderung auf einem Layer-3-Switch gezielt den Zugriff auf einen Server blockieren.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":191,"prompt":"Ein Netzwerktechniker möchte eine Lösung implementieren, bei der alle Webserver Ereignisdaten über Port 514 senden. Welcher Dienst erfüllt diese Aufgabe?","options":[["A","Syslog"],["B","SMTP"],["C","DNS"],["D","DHCP"]],"answers":["A"],"explanation":"Syslog wird verwendet, um Log- und Ereignisdaten zentral zu sammeln. Port 514 ist der Standardport für Syslog-Kommunikation.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":192,"prompt":"Ein Sicherheitsadministrator möchte Zero-Day-Angriffe entdecken, bevor sie im Unternehmensnetzwerk eingesetzt werden können. Welche Lösung kann er dafür verwenden?","options":[["A","Zentrales Repository"],["B","Honeypot"],["C","Next-Generation Firewall"],["D","Evil Twin"]],"answers":["B"],"explanation":"Ein Honeypot simuliert absichtlich attraktive oder verwundbare Systeme und lockt Angreifer an. Dadurch können neue Angriffstechniken, einschließlich Zero-Day-Angriffen, in einer kontrollierten Umgebung beobachtet und analysiert werden.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":193,"prompt":"Benutzer in einer Außenstelle haben Probleme bei Videokonferenzen. Worauf sollte sich ein Techniker zuerst konzentrieren?","options":[["A","Quality of Service"],["B","Netzwerksignal"],["C","Time to Live"],["D","Load Balancing"]],"answers":["A"],"explanation":"QoS priorisiert zeitkritischen Verkehr wie Sprache und Video. Videokonferenzen benötigen konstante Bandbreite und geringe Latenz; schlecht konfigurierte QoS-Einstellungen können zu verzögerten oder verworfenen Audio- und Videopaketen führen.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":194,"prompt":"Ein Netzwerkadministrator versucht herauszufinden, an welchem Switch-Interface ein PC angeschlossen ist. Er greift auf den lokalen Switch zu, pingt die IP-Adresse des PCs und verwendet anschließend den Befehl show arp. Welchen Befehl sollte er als Nächstes verwenden?","options":[["A","show route"],["B","show mac-address-table"],["C","show vlan"],["D","show interface"]],"answers":["B"],"explanation":"Nach show arp ist die MAC-Adresse zur IP-Adresse bekannt. Mit show mac-address-table lässt sich anschließend feststellen, an welchem Switchport diese MAC-Adresse gelernt wurde.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":195,"prompt":"Ein Benutzer versucht sich über eine häufig verwendete Verknüpfung an einer Unternehmenswebsite anzumelden und bemerkt anschließend Unstimmigkeiten auf der Website. Was ist die wahrscheinlichste Ursache?","options":[["A","VLAN Hopping"],["B","ARP Spoofing"],["C","DNS Poisoning"],["D","MAC Flooding"]],"answers":["C"],"explanation":"Bei DNS Poisoning werden manipulierte DNS-Informationen verwendet, um Benutzer auf eine falsche Website umzuleiten. Die Seite kann der echten Website ähneln, aber veränderte Inhalte enthalten oder für Phishing genutzt werden.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":196,"prompt":"Wie lautet die korrekte Reihenfolge der Komponenten im Bottom-up-Ansatz des dreistufigen hierarchischen Netzwerkmodells?","options":[["A","Access, Distribution, Core"],["B","Core, Root, Distribution"],["C","Core, Spine, Leaf"],["D","Access, Core, Root"]],"answers":["A"],"explanation":"Von unten nach oben besteht das Drei-Schichten-Modell aus Access Layer, Distribution Layer und Core Layer. Endgeräte befinden sich auf der Access-Ebene, die Distribution-Ebene bündelt und routet den Verkehr, und die Core-Ebene stellt die schnelle Backbone-Verbindung bereit.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":197,"prompt":"Ein Kunde mit einem 2,4-GHz-WLAN berichtet, dass im gesamten Büro seit dem Umsetzen des WAP sporadische Probleme mit Laptops auftreten. Was ist die wahrscheinlichste Ursache?","options":[["A","Das Netzwerk verwendet einen nicht überlappenden Kanal."],["B","Das Signal wird zu stark reflektiert."],["C","Das Netzwerk weist zu viel Störrauschen auf."],["D","Im Büro befindet sich eine Mikrowelle."]],"answers":["C"],"explanation":"Im 2,4-GHz-Band können viele andere Geräte Störungen verursachen. Durch das Versetzen des Access Points kann er näher an Störquellen geraten sein, wodurch übermäßiges Störrauschen und Signalverschlechterung entstehen.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":198,"prompt":"Welche SD-WAN-Funktion ermöglicht es, einen Router direkt an den Installationsort zu versenden, ohne dass dort eine manuelle Konfiguration erforderlich ist?","options":[["A","Zero-Touch Provisioning"],["B","Application Aware"],["C","Transport Agnostic"],["D","Central Policy Management"]],"answers":["A"],"explanation":"Bei Zero-Touch Provisioning (ZTP) holt sich das Gerät nach dem Anschluss automatisch seine Konfiguration von einem zentralen Server oder Managementsystem. Dadurch entfällt die manuelle Konfiguration vor Ort.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":199,"prompt":"Zwischen Switch10 und Switch11 treten hohe Latenz, schlechte Videoleistung und langsame Dateiübertragungen auf. Switch10 arbeitet mit MTU 1600, Full Duplex und VLAN 10. Switch11 arbeitet mit MTU 1500, Auto-Negotiation und VLAN 10; sein Zähler zeigt Giant Frames. Was sollte der Techniker am wahrscheinlichsten tun?","options":[["A","Automatische Aushandlung auf Switch11 deaktivieren."],["B","Den MTU-Wert von Switch10 auf 1500 ändern."],["C","STP auf beiden Switches konfigurieren."],["D","Das Native VLAN auf den Ports ändern."]],"answers":["B"],"explanation":"Die Gegenstellen verwenden unterschiedliche MTU-Werte. Frames mit mehr als 1500 Byte werden an Switch11 als Giants verworfen oder müssen anderweitig behandelt werden. Ein einheitlicher MTU-Wert von 1500 beseitigt diese Abweichung.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":200,"prompt":"Welche der folgenden Routen erhält beim Aufbau einer Routingtabelle für ein bestimmtes Subnetz Vorrang?","options":[["A","Statische Route"],["B","BGP"],["C","OSPF"],["D","Default Route"]],"answers":["A"],"explanation":"Bei Routen zum gleichen Zielpräfix wird die Route mit der niedrigeren Administrative Distance bevorzugt. Eine normale statische Route hat gegenüber OSPF und BGP typischerweise Vorrang; eine Default Route greift nur, wenn keine spezifischere Route vorhanden ist.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":201,"prompt":"Welcher Schritt der Fehlerbehebungsmethodik folgt darauf, dass die Ursache mithilfe einer Top-down-Prüfung des OSI-Modells bestimmt wurde?","options":[["A","Die Theorie testen."],["B","Einen Maßnahmenplan erstellen."],["C","Die vollständige Systemfunktion überprüfen."],["D","Das Problem identifizieren."]],"answers":["A"],"explanation":"Nachdem eine mögliche Ursache ermittelt wurde, wird die entsprechende Theorie getestet, um zu bestätigen, dass sie tatsächlich die Ursache des Problems ist.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":202,"prompt":"Was würde ein Angreifer bei einem Evil-Twin-Angriff tun?","options":[["A","Benutzer dazu bringen, einen Access Point mit derselben SSID wie ein legitimes Netzwerk zu verwenden."],["B","Die Adressauflösung manipulieren, um Geräte auf einen bösartigen Endpunkt umzuleiten."],["C","Eine identische MAC-Adresse präsentieren, um unbefugt Netzwerkressourcen zu nutzen."],["D","Daten zwischen zwei legitimen Endpunkten abfangen."]],"answers":["A"],"explanation":"Bei einem Evil Twin richtet ein Angreifer einen bösartigen Access Point mit derselben SSID wie ein legitimes WLAN ein, damit Benutzer sich versehentlich damit verbinden und der Angreifer deren Datenverkehr abfangen kann.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":203,"prompt":"Ein ISP hat einem Unternehmen den IP-Bereich 98.174.235.142/28 bereitgestellt. Ein Netzwerktechniker konfigurierte einen Router mit der Subnetzmaske 255.255.255.224 und dem Standardgateway 98.174.235.129. Danach kann das Unternehmen keine Verbindung zum ISP herstellen. Welche Änderung würde das Problem beheben?","options":[["A","Die Subnetzmaske auf 255.255.255.240 (/28) ändern."],["B","Das Ethernetkabel zwischen externem Interface und Modem austauschen."],["C","CIDR auf /29 ändern."],["D","Die statische IP auf 98.174.235.128/28 ändern."]],"answers":["A"],"explanation":"Die Adresse 98.174.235.142/28 gehört zum Netz 98.174.235.128/28 mit den nutzbaren Hosts 98.174.235.129 bis 98.174.235.142. Das konfigurierte Gateway 98.174.235.129 liegt darin, aber 255.255.255.224 entspricht /27. Die Maske muss daher auf 255.255.255.240 (/28) geändert werden; 98.174.235.128 wäre die Netzadresse und keine gültige Hostadresse.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":204,"prompt":"Ein Netzwerkadministrator untersucht eine Verbindung zwischen zwei Switches, bei der sporadisch Fehler auftreten. Er muss feststellen, an welchem Port des entfernten Switches das fehlerhafte Kabel angeschlossen ist. Welches Tool eignet sich dafür am besten?","options":[["A","tracert"],["B","LLDP"],["C","nmap"],["D","ping"]],"answers":["B"],"explanation":"LLDP (Link Layer Discovery Protocol) ermöglicht es Netzwerkgeräten, Informationen über ihre Identität, Fähigkeiten und direkten Nachbarn auszutauschen. Dadurch lässt sich unter anderem der zugehörige Port des entfernten Switches ermitteln.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":205,"prompt":"Was ist ein Unterschied zwischen EOL und EOS?","options":[["A","EOL stellt das Produkt ein, kann aber weiterhin Support anbieten."],["B","EOS ersetzt kostenlosen Support durch ein Abonnementmodell."],["C","EOS gilt nur für physische Produkte."],["D","EOL garantiert weiterhin Garantieleistungen."]],"answers":["A"],"explanation":"EOL (End of Life) bedeutet, dass ein Produkt nicht mehr hergestellt oder verkauft wird; für eine begrenzte Zeit kann dennoch Support angeboten werden. EOS (End of Support) bedeutet, dass der Hersteller den Support einschließlich Updates und Fehlerkorrekturen beendet.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":206,"prompt":"Ein Netzwerkarchitekt richtet eine externe Recheneinrichtung ein und muss sicherstellen, dass der Betrieb durch größere Ausfälle nicht beeinträchtigt wird. Welche Lösung sollte er in Betracht ziehen?","options":[["A","Hot Site"],["B","DCI"],["C","Direct Connect"],["D","Active-Passive-Ansatz"]],"answers":["A"],"explanation":"Eine Hot Site ist vollständig ausgestattet und kann bei einem schweren Ausfall sofort den Betrieb übernehmen. Hardware, Software und erforderliche Daten stehen bereits bereit.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":207,"prompt":"Ein Netzwerktechniker testet eine Website auf IPv6-Kompatibilität. Nach dem Versuch, die Website über ihre IPv6-Adresse anzupingen, stellt er fest, dass DNS nicht korrekt eingerichtet wurde. Was sollte er konfigurieren?","options":[["A","Einen PTR-Record aktivieren."],["B","Den bestehenden TXT-Record aktualisieren."],["C","Einen neuen AAAA-Record hinzufügen."],["D","Einen sekundären NS-Record konfigurieren."]],"answers":["C"],"explanation":"Ein AAAA-Record ordnet einen Hostnamen einer IPv6-Adresse zu. Ein A-Record ist dagegen für IPv4-Adressen bestimmt.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":208,"prompt":"Ein kleines Café möchte mehrere 2,4-GHz-Access-Points installieren. Sie sollen viele Benutzer unterstützen und Interferenzen möglichst gering halten. Wie viele 22-MHz-Kanäle kann die Umgebung ohne Überlappung unterstützen?","options":[["A","1"],["B","2"],["C","3"],["D","4"]],"answers":["C"],"explanation":"Im 2,4-GHz-Band werden typischerweise die drei nicht überlappenden Kanäle 1, 6 und 11 verwendet. Dadurch lassen sich gegenseitige Kanalstörungen weitgehend vermeiden.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":209,"prompt":"Ein Unternehmen kauft von einem ISP einen 40-Gbit/s-Breitbanddienst. Was sollte am wahrscheinlichsten auf einem 10G-Switch konfiguriert werden, um die neue Bandbreite zu nutzen?","options":[["A","802.11Q-Tagging"],["B","Jumbo Frames"],["C","Half Duplex"],["D","Link Aggregation"]],"answers":["D"],"explanation":"Mit Link Aggregation können mehrere physische 10-Gbit/s-Verbindungen zu einer logischen Verbindung zusammengefasst werden, beispielsweise 4 x 10 Gbit/s, um insgesamt eine höhere Bandbreite bereitzustellen und zusätzlich Redundanz zu schaffen.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":210,"prompt":"Was sind die wichtigsten Unterschiede zwischen ESP und AH? (Wähle zwei.)","options":[["A","AH stellt durch Verschlüsselung Vertraulichkeit bereit."],["B","ESP authentifiziert IP-Header und Nutzdaten."],["C","ESP stellt durch Verschlüsselung Vertraulichkeit bereit."],["D","AH authentifiziert IP-Header und Nutzdaten."],["E","AH stellt Datenursprungsautorisierung über ein Shared Secret bereit."],["F","ESP stellt Datenursprungsautorisierung über ein Shared Secret bereit."]],"answers":["C","D"],"explanation":"ESP bietet Vertraulichkeit, indem die Nutzdaten verschlüsselt werden. AH bietet Integrität und Authentifizierung für IP-Header und Nutzdaten, stellt jedoch keine Vertraulichkeit durch Verschlüsselung bereit.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":211,"prompt":"Eine Organisation möchte sicherstellen, dass eingehende E-Mails tatsächlich von einer vertrauenswürdigen Quelle gesendet wurden. Welcher DNS-Record wird zur Überprüfung der Quelle verwendet?","options":[["A","TXT"],["B","AAA"],["C","CNAME"],["D","MX"]],"answers":["A"],"explanation":"SPF-Informationen werden typischerweise als TXT-Records im DNS hinterlegt. Sie legen fest, welche Mailserver im Namen einer Domain E-Mails versenden dürfen und helfen damit, die Absenderquelle zu verifizieren.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":212,"prompt":"Welche der folgenden Technologien wird am engsten mit der Segmentierung von Compute-Ressourcen innerhalb eines einzelnen Cloud-Kontos in Verbindung gebracht?","options":[["A","Network Security Group"],["B","IaaS"],["C","VPC"],["D","Hybrid Cloud"]],"answers":["C"],"explanation":"Eine VPC (Virtual Private Cloud) ermöglicht eine logisch isolierte Netzwerkumgebung innerhalb eines Cloud-Kontos. Darin können Subnetze, Routing und Sicherheitsregeln definiert und Compute-Ressourcen segmentiert werden.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":213,"prompt":"Welche der folgenden Größen wird am wahrscheinlichsten heruntergezählt, wenn ein Tool die Entfernung zwischen zwei Orten im Internet misst?","options":[["A","GRE"],["B","TTL"],["C","VPN"],["D","QoS"]],"answers":["B"],"explanation":"Der TTL-Wert (Time to Live) in einem IP-Paket wird bei jedem Router-Hop um eins reduziert. Tools wie traceroute nutzen dieses Verhalten, um die Anzahl und Reihenfolge der Hops zum Ziel zu ermitteln.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":214,"prompt":"In einem privaten Mesh-WLAN treten Latenzprobleme und Frame-Wiederholungen auf. Die Site Survey zeigt drei Access Points mit derselben SSID „Home“, unterschiedlichen BSSIDs, aber alle auf Kanal 11; die RSSI-Werte betragen −83 dBm, −91 dBm und −70 dBm. Was ist die wahrscheinlichste Ursache?","options":[["A","Die SSIDs sollten nicht identisch sein."],["B","Co-Channel-Interferenz durch überlappende Funkzellen"],["C","Die Geräte sind mit dem Mesh-Netzwerk inkompatibel."],["D","Die Knoten haben zu wenig Leistung."]],"answers":["B"],"explanation":"Mehrere nahe Access Points verwenden denselben Kanal. Diese Co-Channel-Überlappung erhöht Wartezeiten und Kollisionen; die daraus entstehenden Wiederholungsübertragungen verschlechtern Latenz und Durchsatz.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":215,"prompt":"Ein Netzwerktechniker implementiert für ein Gebäude ein Subnetz 192.168.100.0/25, ohne vorher den Größenbedarf zu ermitteln. Später stellt sich heraus, dass dort 700 Personen arbeiten werden. Welche Subnetzmaske unterstützt diese Anzahl am effizientesten?","options":[["A","255.255.252.0"],["B","255.255.254.0"],["C","255.255.255.0"],["D","255.255.255.128"]],"answers":["A"],"explanation":"Ein /22 mit der Maske 255.255.252.0 umfasst 1024 Adressen und 1022 nutzbare Hostadressen. Ein /23 bietet nur 510, ein /24 254 und ein /25 126 nutzbare Adressen. Daher ist /22 die kleinste der angebotenen Optionen, die 700 Hosts unterstützt.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":216,"prompt":"Ein Unternehmen baut einen neuen Campus mit kabelgebundenen und drahtlosen Geräten. Das Netzwerk soll Gästen und Mitarbeitern in Pausenräumen einen einfachen Internetzugang ermöglichen. Welche Authentifizierungsmethode eignet sich für Gäste am besten?","options":[["A","ESP"],["B","PSK"],["C","WPA"],["D","IKE"]],"answers":["B"],"explanation":"Ein Pre-Shared Key (PSK) ermöglicht einen einfachen gemeinsamen Zugangsschlüssel für ein Gast-WLAN, ohne dass für jeden Gast ein eigenes Benutzerkonto erforderlich ist. PSK kann beispielsweise im Rahmen von WPA2-PSK verwendet werden.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":217,"prompt":"Ein Techniker setzt nach der Fehlerbehebungsmethodik eine Lösung um, die das gemeldete Problem behebt. Was sollte er als Nächstes tun?","options":[["A","Die Ergebnisse dokumentieren."],["B","Einen Maßnahmenplan erstellen."],["C","Eine Theorie aufstellen."],["D","Das Problem identifizieren."]],"answers":["A"],"explanation":"Nach erfolgreicher Lösung sollte der Techniker die Ergebnisse dokumentieren, einschließlich der durchgeführten Schritte, der umgesetzten Lösung und relevanter Details. Dies unterstützt spätere Fehlerbehebungen und hilft, wiederkehrende Probleme zu erkennen.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":218,"prompt":"Ein Netzwerkadministrator muss 192.168.1.0/24 in zwei gleich große Hälften aufteilen. Welche Subnetzmaske sollte er verwenden?","options":[["A","255.255.0.0"],["B","255.255.254.0"],["C","255.255.255.0"],["D","255.255.255.128"]],"answers":["D"],"explanation":"Durch das Ausleihen eines Hostbits wird aus /24 ein /25. Die Maske 255.255.255.128 teilt das /24-Netz in zwei gleich große Subnetze mit jeweils 128 Adressen, davon 126 nutzbar.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":219,"prompt":"Welches der folgenden Protokolle verwendet Dijkstras Link-State-Algorithmus, um Routen in seiner Routingtabelle zu berechnen?","options":[["A","OSPF"],["B","EIGRP"],["C","BGP"],["D","RIP"]],"answers":["A"],"explanation":"OSPF ist ein Link-State-Routingprotokoll und verwendet Dijkstras Shortest-Path-First-Algorithmus, um anhand der bekannten Netzwerktopologie den besten Pfad zu berechnen.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":220,"prompt":"Welche Verkehrsart verwendet eine DHCP-Discover-Anfrage eines PCs?","options":[["A","Broadcast"],["B","Anycast"],["C","Unicast"],["D","Multicast"]],"answers":["A"],"explanation":"Ein Client besitzt zu diesem Zeitpunkt noch keine eigene IP-Konfiguration und kennt keinen DHCP-Server. Daher sendet er DHCP Discover als Broadcast, typischerweise an 255.255.255.255.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":221,"prompt":"Das VoIP-Telefon und die Workstation eines Benutzers sind über eine Inline-Verkabelung miteinander verbunden. Das VoIP-Telefon startet sporadisch neu, während die Workstation keine Netzwerkprobleme zeigt. Was ist die wahrscheinlichste Ursache?","options":[["A","Das PoE-Leistungsbudget ist überschritten."],["B","Port Security wird verletzt."],["C","Das Signal ist verschlechtert."],["D","Das Ethernetkabel funktioniert nicht."]],"answers":["A"],"explanation":"Ist das PoE-Leistungsbudget eines Switches oder Ports ausgeschöpft, erhält das VoIP-Telefon möglicherweise nicht zuverlässig genügend Strom. Dadurch kann es sporadisch neu starten, während die Datenverbindung der Workstation weiterhin funktioniert.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":222,"prompt":"Ein Netzwerkadministrator installiert ein Netzwerk für ein kleines Unternehmen. Die Switches werden parallel installiert, um bei einem Geräteausfall Redundanz zu bieten. Was sollte konfiguriert werden, um Schleifen zu verhindern?","options":[["A","Spanning Tree"],["B","CRC"],["C","Jumbo Frames"],["D","Link Aggregation"]],"answers":["A"],"explanation":"STP erkennt redundante Ethernet-Pfade und blockiert bei Bedarf einen davon, sodass keine Layer-2-Schleifen und Broadcast-Stürme entstehen.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":223,"prompt":"In einem Unternehmensnetzwerk treten zu Spitzenzeiten hohe Latenz und Paketverlust auf. Netzwerküberwachungstools zeigen erhöhten Datenverkehr auf einem Switch. Was sollte ein Netzwerktechniker implementieren, um die Überlastung zu reduzieren und die Leistung zu verbessern?","options":[["A","Load Balancing"],["B","Port Mirroring"],["C","Quality of Service"],["D","Spanning Tree Protocol"]],"answers":["A"],"explanation":"Load Balancing verteilt Verbindungen oder Datenströme auf mehrere verfügbare Ressourcen beziehungsweise Pfade. Dadurch wird verhindert, dass eine einzelne Komponente zum Engpass wird.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":224,"prompt":"Welcher VPN-Typ stellt sicheren Remotezugriff auf Netzwerkressourcen über ein Webportal bereit?","options":[["A","Proxy"],["B","Clientless"],["C","Site-to-Site"],["D","Direct Connect"]],"answers":["B"],"explanation":"Ein Clientless VPN erlaubt den Zugriff über einen normalen Webbrowser, ohne dass auf dem Endgerät ein eigener VPN-Client installiert werden muss. Authentifizierung und sicherer Zugriff erfolgen über das Webportal.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":225,"prompt":"Welche Aussage erklärt die Rolle der Vertraulichkeit bei ruhenden Daten am besten?","options":[["A","Daten können von jedem im Administrationsnetzwerk eingesehen werden."],["B","Daten können nach geeigneter Schulung remote eingesehen werden."],["C","Daten können nach Erteilung privilegierter Zugriffsrechte eingesehen werden."],["D","Daten können nach Überprüfung des Hashes eingesehen werden."]],"answers":["C"],"explanation":"Vertraulichkeit bedeutet, dass gespeicherte sensible Daten vor unbefugtem Zugriff geschützt sind und nur Personen mit entsprechenden Berechtigungen darauf zugreifen können. Typische Maßnahmen sind Verschlüsselung, Kennwortschutz und Authentifizierung.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":226,"prompt":"Mehrere Benutzer melden während einer Videokonferenz Verbindungsprobleme und Verzögerungen. Der Netzwerkadministrator führt tcpdump aus und beobachtet vermehrte Wiederholungsübertragungen bei anderen Nicht-Video-Anwendungen. Welches Symptom beschreibt die gemeldeten Probleme?","options":[["A","Latenz"],["B","Paketverlust"],["C","Bottlenecking"],["D","Jitter"]],"answers":["B"],"explanation":"Erhöhte Wiederholungsübertragungen weisen auf Paketverlust hin. Verlorene Pakete müssen erneut übertragen werden, was Verzögerungen verursacht und besonders bei zeitkritischen Anwendungen wie Videokonferenzen deutlich wird.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":227,"prompt":"Ein Administrator aktiviert DNS Filtering auf der Firewall, um den Zugriff auf bösartige Websites zu blockieren. Welche zwei weiteren Maßnahmen sollte er durchführen? (Wähle zwei.)","options":[["A","DoH in den Browsern der Benutzer deaktivieren."],["B","Den NS-Record auf die DNS-Filterserver verweisen lassen."],["C","Port 443 zu den bösartigen Websites blockieren."],["D","Port 53 zu Servern im Internet blockieren."],["E","TLS 1.3 in den Browsern deaktivieren."],["F","DNSSEC für Unternehmens-Records implementieren."]],"answers":["A","D"],"explanation":"DoH muss deaktiviert werden, damit Browser den vorgesehenen DNS-Filter nicht über verschlüsselte HTTPS-Anfragen umgehen. Zusätzlich sollte ausgehender Port 53 zu nicht autorisierten Internet-DNS-Servern blockiert werden. DNSSEC prüft die Authentizität von DNS-Daten, erzwingt aber nicht die Nutzung des Filterdienstes.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":228,"prompt":"Welche der folgenden Optionen befasst sich mit der garantierten Verfügbarkeit einer Cloud-Ressource?","options":[["A","IPAM"],["B","SLA"],["C","MTBF"],["D","EOL"]],"answers":["B"],"explanation":"Ein Service Level Agreement (SLA) ist eine formale Vereinbarung zwischen Anbieter und Kunde, in der unter anderem garantierte Verfügbarkeit, Reaktionszeiten und weitere Servicekennzahlen festgelegt werden.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":229,"prompt":"Ein Netzwerkberater muss entscheiden, ob ein Ethernet-Uplink verlegt oder die integrierte 5-GHz-Point-to-Point-Funktion eines WAP verwendet werden soll. Welches Dokument liefert dafür die besten Informationen?","options":[["A","Ergebnisse einer Site Survey"],["B","Physisches Diagramm"],["C","Service Level Agreement"],["D","Logisches Diagramm"]],"answers":["A"],"explanation":"Eine Site Survey liefert Informationen über Signalstärke, Störungen, Hindernisse und geeignete Standorte für Access Points. Diese Daten helfen bei der Entscheidung, ob ein kabelgebundener Uplink oder eine 5-GHz-Funkverbindung geeigneter ist.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":230,"prompt":"Bei der Fehlerbehebung von Verbindungsproblemen erhält ein Junior-Netzwerkadministrator die ausdrückliche Anweisung, zuerst den TCP/IP-Stack des Hosts zu testen. Welchen Befehl sollte er ausführen?","options":[["A","ping 127.0.0.1"],["B","ping 169.254.1.1"],["C","ping 172.16.1.1"],["D","ping 192.168.1.1"]],"answers":["A"],"explanation":"ping 127.0.0.1 testet die lokale Loopback-Adresse und damit den TCP/IP-Stack des eigenen Systems, ohne eine physische Netzwerkverbindung zu benötigen.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":231,"prompt":"Benutzer einer Organisation melden, dass das WLAN in einigen Bereichen des Gebäudes nicht funktioniert. Bei der Netzwerksuche sind andere WLAN-SSIDs sichtbar, die SSID der Organisation jedoch nicht. Was ist die wahrscheinlichste Ursache?","options":[["A","Interferenzen oder Kanalüberlappung"],["B","Unzureichende WLAN-Abdeckung"],["C","Fehlerhafte Roaming-Konfiguration"],["D","Probleme mit Client-Disassociation"]],"answers":["B"],"explanation":"Wenn die eigene SSID in bestimmten Gebäudebereichen überhaupt nicht sichtbar ist, deutet dies am ehesten auf unzureichende WLAN-Abdeckung hin, beispielsweise durch große Entfernung zum Access Point, Wände, Möbel oder ungünstige AP-Platzierung.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":232,"prompt":"Welche der folgenden Einrichtungen eignet sich am besten als zentraler Abschlusspunkt für alle Netzwerkkabel auf einer Etage eines Firmengebäudes?","options":[["A","Patchpanel"],["B","UPS"],["C","IDF"],["D","Rack"]],"answers":["C"],"explanation":"Ein IDF (Intermediate Distribution Frame) ist der Etagen- beziehungsweise Bereichsverteiler, an dem die horizontale Verkabelung einer Etage zusammenläuft. Der MDF ist dagegen der zentrale Hauptverteiler des Gebäudes.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":233,"prompt":"Welche Technologie wird am häufigsten damit in Verbindung gebracht, dass viele Systeme im öffentlichen IP-Adressraum eine einzige IP-Adresse gemeinsam nutzen?","options":[["A","PAT"],["B","NAT"],["C","VIP"],["D","NAT64"]],"answers":["A"],"explanation":"PAT (Port Address Translation) ermöglicht mehreren privaten Geräten, dieselbe öffentliche IP-Adresse zu verwenden. Die einzelnen Verbindungen werden anhand unterschiedlicher Portnummern voneinander unterschieden.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":234,"prompt":"Ein produktiver Webserver lauscht laut netstat auf den TCP-Ports 20, 22, 23, 25, 53, 69, 80 und 443. Welche Maßnahme sollte der Administrator zur Härtung durchführen?","options":[["A","Ungenutzte Ports deaktivieren."],["B","ACLs erzwingen."],["C","Content Filtering durchführen."],["D","Ein Screened Subnet einrichten."]],"answers":["A"],"explanation":"Ein Webserver benötigt normalerweise nur die tatsächlich bereitgestellten Dienste, typischerweise HTTP/HTTPS und gegebenenfalls einen ausdrücklich vorgesehenen Verwaltungszugang. Nicht benötigte Dienste und ihre Ports sollten deaktiviert oder gefiltert werden, um die Angriffsfläche zu verkleinern.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":235,"prompt":"Ein Netzwerktechniker untersucht die Konfiguration eines Access-Ports und stellt fest, dass mehr als ein VLAN eingerichtet ist. Welche Beschreibung passt am besten?","options":[["A","Der Port hat ein Voice-VLAN."],["B","Der Port hat zu viele VLANs."],["C","Der Port hat ein Default-VLAN."],["D","Der Port hat ein Native VLAN."]],"answers":["A"],"explanation":"Ein Access-Port gehört normalerweise zu einem Daten-VLAN. Zusätzlich kann ein Voice-VLAN konfiguriert sein, sodass ein IP-Telefon und ein angeschlossener PC über denselben physischen Port getrennten Sprach- und Datenverkehr übertragen.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":236,"prompt":"Ein Unternehmen verwendet 192.168.1.0/24 für Benutzer, 192.168.2.0/24 für Sprache und 192.168.10.0/24 für Server. Ein Client ist als 192.168.1.50 mit Maske 255.255.0.0, Gateway 192.168.1.200 sowie DNS 192.168.10.10 und 192.168.10.11 konfiguriert und kann den Fileserver 192.168.10.1 nicht erreichen. Welche Änderung behebt das Problem am wahrscheinlichsten?","options":[["A","IPv4-Adresse auf 192.168.10.1 ändern."],["B","Subnetzmaske auf 255.255.255.0 ändern."],["C","DNS-Server auf Internet-IP-Adressen ändern."],["D","Physische Adresse auf 7A-01-7A-21-01-50 ändern."]],"answers":["B"],"explanation":"Mit 255.255.0.0 betrachtet der Client 192.168.10.1 fälschlich als lokales Ziel und sendet nicht über sein Gateway. Die vorgesehene /24-Maske 255.255.255.0 sorgt dafür, dass das Servernetz korrekt geroutet wird.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":237,"prompt":"Ein Netzwerkadministrator muss eine Abteilung mit einem neuen Netzwerksegment verbinden. Der zu verwendende DHCP-Server befindet sich in einem anderen Netzwerk. Was kann der Administrator verwenden?","options":[["A","IP Helper"],["B","Reservation"],["C","Exclusion"],["D","Scope"]],"answers":["A"],"explanation":"Ein IP Helper bzw. DHCP Relay Agent leitet DHCP-Broadcasts aus einem Subnetz als Unicast an einen DHCP-Server in einem anderen Subnetz weiter.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":238,"prompt":"Ein Netzwerktechniker migriert lokale Server zu einem Cloud-Dienstanbieter. Gesucht ist eine Lift-and-Shift-Lösung. Welches Servicemodell erfüllt diese Anforderung?","options":[["A","Infrastructure as a Service"],["B","Infrastructure as Code"],["C","Software as a Service"],["D","Software-Defined Network"]],"answers":["A"],"explanation":"IaaS stellt virtuelle Rechen-, Speicher- und Netzwerkressourcen bereit. Bestehende Server und Workloads können damit mit relativ wenigen Änderungen in virtuelle Maschinen der Cloud verschoben werden.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":239,"prompt":"Ein Netzwerkadministrator führt eine Bewertung durch und findet Geräte, die nicht den Standards entsprechen. Welche der folgenden Konfigurationen beschreibt einen verbindlichen Regelsatz, an den sich Geräte halten sollen?","options":[["A","Production"],["B","Backup"],["C","Candidate"],["D","Golden"]],"answers":["D"],"explanation":"Eine Golden Configuration ist eine freigegebene Standardkonfiguration, die als Sollzustand bzw. Baseline für Geräte dient.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":240,"prompt":"Eine IT-Abteilung bittet einen neu eingestellten Mitarbeiter, vorübergehend seinen privaten Laptop zu verwenden, bis ein Firmengerät bereitsteht. Welche Richtlinie trifft auf diese Situation am ehesten zu?","options":[["A","IAM"],["B","BYOD"],["C","DLP"],["D","AUP"]],"answers":["B"],"explanation":"BYOD (Bring Your Own Device) regelt die Nutzung privater Geräte für geschäftliche Aufgaben, einschließlich Sicherheits-, Zugriffs- und Datenschutzanforderungen.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":241,"prompt":"Welche der folgenden Funktionen ermöglicht die Zugriffskontrolle direkt auf Ebene einer Cloud-VM-Instanz?","options":[["A","Security Group"],["B","Internet Gateway"],["C","Direct Connect"],["D","Network ACL"]],"answers":["A"],"explanation":"Eine Security Group ist eine Cloud-Firewall auf Instanzebene und steuert ein- und ausgehenden Datenverkehr anhand von IP-Adressen, Protokollen und Ports.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":242,"prompt":"In einer Umgebung mit nur einem Router möchte ein Netzwerktechniker Kommunikation zwischen VLANs ermöglichen, ohne zusätzliche Hardware zu kaufen. Welche Lösung sollte er verwenden?","options":[["A","Subinterfaces"],["B","VXLAN"],["C","Layer-3-Switch"],["D","VIP"]],"answers":["A"],"explanation":"Beim Router-on-a-Stick werden auf einem physischen Router-Interface mehrere logische Subinterfaces angelegt, jeweils für ein VLAN. 802.1Q-Tags ermöglichen dann Inter-VLAN-Routing ohne zusätzliche Hardware.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":243,"prompt":"Ein Netzwerkadministrator macht sich wegen On-Path-Angriffen Sorgen und möchte Fully Qualified Domain Names in ausgehender Kommunikation verschlüsseln. Welches Protokoll stellt die passende Sicherheitsschicht bereit?","options":[["A","SSL"],["B","DoH"],["C","TLS"],["D","DNSSEC"]],"answers":["B"],"explanation":"DNS over HTTPS (DoH) kapselt DNS-Anfragen in HTTPS und verschlüsselt damit die abgefragten FQDNs. Dies erschwert Abhören und Manipulation von DNS-Anfragen auf dem Übertragungsweg.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":244,"prompt":"Ein Netzwerkadministrator möchte eingehenden Internetverkehr so beschränken, dass ausschließlich HTTPS zur Unternehmenswebsite erlaubt wird und sämtlicher anderer eingehender Verkehr blockiert wird. Welche Lösung erfüllt dies am besten?","options":[["A","ACL auf der Edge-Firewall"],["B","Port Security auf einem Access-Switch"],["C","Content Filtering auf einem Web-Gateway"],["D","URL Filtering auf einem ausgehenden Proxy"]],"answers":["A"],"explanation":"Eine ACL auf der Edge-Firewall kann gezielt HTTPS über Port 443 erlauben und alle übrigen eingehenden Verbindungen verweigern.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":245,"prompt":"Ein Netzwerktechniker stellt Switches in einer neuen Außenstelle bereit. Hostnamen und STP-Prioritäten wurden vorkonfiguriert. Laut Tabelle haben core-sw01 und access-sw01 beide Priorität 4096; die MAC-Adresse von access-sw01 ist jedoch niedriger. Welcher Switch wird Root Bridge?","options":[["A","core-sw01"],["B","access-sw01"],["C","distribution-sw01"],["D","access-sw02"]],"answers":["B"],"explanation":"STP wählt zuerst die niedrigste Priorität. Bei Gleichstand entscheidet die niedrigere MAC-Adresse. Da access-sw01 die niedrigere MAC-Adresse besitzt, wird dieser Switch Root Bridge.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":246,"prompt":"Welche Lösung muss implementiert werden, um den Hauptsitz eines Unternehmens sicher mit einer Zweigstelle zu verbinden?","options":[["A","Split-Tunnel-VPN"],["B","Clientless VPN"],["C","Full-Tunnel-VPN"],["D","Site-to-Site-VPN"]],"answers":["D"],"explanation":"Ein Site-to-Site-VPN baut einen dauerhaften verschlüsselten Tunnel zwischen zwei Standorten auf und ermöglicht sichere Kommunikation zwischen deren internen Netzen.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":247,"prompt":"Ein Netzwerktechniker muss Netzwerkdienste, einschließlich eines Routers, an einer entfernten Zweigstelle virtualisieren. Welche Lösung erfüllt diese Anforderung?","options":[["A","NFV"],["B","VRF"],["C","VLAN"],["D","VPC"]],"answers":["A"],"explanation":"NFV (Network Functions Virtualization) virtualisiert Funktionen wie Router, Firewalls oder Load Balancer und führt sie softwarebasiert auf Standardhardware bzw. virtuellen Plattformen aus.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":248,"prompt":"Eine Benutzergruppe kann nicht auf Netzwerkressourcen zugreifen. Ein Techniker führt ipconfig auf einem Gerät aus und kann das dort angezeigte Gateway anpingen. Was verhindert am wahrscheinlichsten den Zugriff auf Netzwerkressourcen?","options":[["A","VLAN Hopping"],["B","Rogue DHCP"],["C","Distributed DoS"],["D","Evil Twin"]],"answers":["B"],"explanation":"Ein Rogue DHCP Server kann Clients zwar eine grundsätzlich funktionierende IP-Konfiguration und ein erreichbares Gateway zuweisen, aber falsche DNS-, Subnetz- oder andere Parameter verteilen, wodurch interne Ressourcen nicht korrekt erreichbar sind.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":249,"prompt":"Welche Disaster-Recovery-Kennzahl wird berechnet, indem die gesamten Betriebsstunden durch die Anzahl der Ausfälle geteilt werden?","options":[["A","MTTR"],["B","MTBF"],["C","RPO"],["D","RTO"]],"answers":["B"],"explanation":"MTBF (Mean Time Between Failures) misst die durchschnittliche Betriebszeit zwischen Ausfällen und wird aus Gesamtbetriebszeit geteilt durch Anzahl der Fehler berechnet.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":250,"prompt":"Ein Netzwerkadministrator überwacht die Server des Unternehmens, um sicherzustellen, dass sie verfügbar sind. Welche Technologie sollte er dafür verwenden?","options":[["A","Packet Capture"],["B","Data Usage Reports"],["C","SNMP Traps"],["D","Configuration Monitoring"]],"answers":["C"],"explanation":"SNMP Traps sind ereignisgesteuerte Meldungen, mit denen Geräte bei Ausfällen oder definierten Zuständen selbstständig Benachrichtigungen an ein Managementsystem senden können.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":251,"prompt":"Ein Netzwerktechniker schließt die WLAN-Installation in einem neuen Gebäude ab. Alle Clients sollen sich automatisch mit dem schnellsten unterstützten Netz verbinden. Welche Funktion unterstützt diese Anforderung am besten?","options":[["A","Band Steering aktivieren."],["B","Die 5-GHz-SSID deaktivieren."],["C","Ein Captive Portal hinzufügen."],["D","MAC Filtering konfigurieren."]],"answers":["A"],"explanation":"Band Steering erkennt Dual-Band-Geräte und lenkt sie bevorzugt in das schnellere bzw. weniger belastete Frequenzband, häufig 5 GHz.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":252,"prompt":"Ein Netzwerktechniker stellt fest, dass ein Gerät EOL erreicht hat. Welche Maßnahme sollte er planen?","options":[["A","Retrofitting"],["B","Außerbetriebnahme"],["C","Neustart"],["D","Upgrade"]],"answers":["B"],"explanation":"Bei End of Life sollte das Gerät planmäßig aus dem Produktivbetrieb entfernt, Daten sicher gelöscht und das Gerät ersetzt bzw. ordnungsgemäß entsorgt werden.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":253,"prompt":"Ein Unternehmen führt eine Video-Streaming-Lösung ein, die auf allen Computern einer bestimmten Gruppe abgespielt werden soll. Router-ACLs blockieren jedoch den Verkehr. Welche IP-Adresse sollte in der ACL am ehesten erlaubt werden?","options":[["A","127.0.0.1"],["B","172.17.1.1"],["C","239.1.1.1"],["D","240.0.0.1"]],"answers":["C"],"explanation":"239.1.1.1 ist eine administrativ begrenzte IPv4-Multicastadresse und eignet sich für einen organisationsinternen Gruppenstream. 127.0.0.1 ist Loopback, 172.17.1.1 privater Unicast und 240.0.0.1 liegt im reservierten Bereich.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":254,"prompt":"Welche zwei Maßnahmen gehören zu den besten Techniken zur Gerätehärtung? (Wähle zwei.)","options":[["A","Ungenutzte Ports deaktivieren."],["B","Regelmäßig nach unautorisierten Geräten scannen."],["C","Systemlogs auf Unregelmäßigkeiten überwachen."],["D","Logische Sicherheit wie SSO aktivieren."],["E","Standardkennwörter ändern."],["F","Least-Privilege-Konzepte sicherstellen."]],"answers":["A","E"],"explanation":"Ungenutzte Ports deaktivieren reduziert die Angriffsfläche. Standardkennwörter ändern verhindert, dass allgemein bekannte Herstellerzugangsdaten für unbefugten Zugriff verwendet werden.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":255,"prompt":"Welche der folgenden Angriffsmethoden ermöglicht das Abfangen von Datenverkehr zwischen Quelle und Ziel?","options":[["A","Selbstsigniertes Zertifikat"],["B","VLAN Hopping"],["C","On-Path-Angriff"],["D","Phishing"]],"answers":["C"],"explanation":"Bei einem On-Path-Angriff schaltet sich der Angreifer unbemerkt zwischen zwei legitime Kommunikationspartner, kann Daten mitlesen und gegebenenfalls verändern.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":256,"prompt":"Ein Unternehmen entdeckt in Videoaufnahmen, dass eine unbefugte Person in einer gesicherten Einrichtung einen Rogue Access Point installiert hat. Welche Angriffsmethode ermöglichte den physischen Zutritt am wahrscheinlichsten?","options":[["A","Evil Twin"],["B","Honeytrap"],["C","Wardriving"],["D","Tailgating"]],"answers":["D"],"explanation":"Bei Tailgating folgt eine unbefugte Person einer autorisierten Person durch eine gesicherte Tür, ohne sich selbst ordnungsgemäß zu authentifizieren.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":257,"prompt":"Zwischen zwei Rechenzentren in unterschiedlichen Regionen muss über das Internet eine sichere Kommunikationsverbindung eingerichtet werden. Welches Protokoll eignet sich dafür am besten?","options":[["A","DCI"],["B","GRE"],["C","VXLAN"],["D","IPSec"]],"answers":["D"],"explanation":"IPSec bietet Verschlüsselung, Integrität und Authentifizierung für Daten während der Übertragung und wird häufig für sichere Site-to-Site-VPN-Verbindungen eingesetzt.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":258,"prompt":"Welche Lösung kann als zusätzliche Sicherheitsschicht zwischen einem Unternehmensnetzwerk und Managementschnittstellen von Netzwerkgeräten eingesetzt werden?","options":[["A","Jump Box"],["B","Console Server"],["C","API Interface"],["D","In-Band Management"]],"answers":["A"],"explanation":"Eine Jump Box ist ein gehärteter, kontrollierter Zwischenhost. Administratoren müssen sich zuerst dort anmelden, bevor sie auf Managementschnittstellen kritischer Systeme zugreifen können.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":259,"prompt":"Ein Netzwerkadministrator rüstet einen Server auf und installiert eine neue Netzwerkkarte. Danach können Benutzer den Server nicht mehr erreichen. Was ist die wahrscheinlichste Ursache?","options":[["A","PoE-Leistungsbudget überschritten"],["B","TX/RX vertauscht"],["C","Port-Security-Verletzung"],["D","Falscher Kabeltyp"]],"answers":["C"],"explanation":"Mit der neuen NIC ändert sich die MAC-Adresse. Wenn der Switchport nur die vorherige MAC-Adresse erlaubt, kann Port Security den Port blockieren bzw. in einen Error-Disabled-Zustand versetzen.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":260,"prompt":"Ein Junior-Netzwerktechniker muss aus einer Class-C-Adresse Subnetze mit jeweils 14 Hosts erstellen. Wie viele Hostbits werden benötigt?","options":[["A","Eins"],["B","Zwei"],["C","Drei"],["D","Vier"]],"answers":["D"],"explanation":"Mit vier Hostbits ergeben sich `2^4 - 2 = 14` nutzbare Hostadressen. Damit wird die Anforderung exakt erfüllt.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":261,"prompt":"Welches Prinzip setzt ein Unternehmen am wahrscheinlichsten um, wenn ein Mitarbeiter der Buchhaltung ausschließlich die freigegebenen Ordner der Finanzabteilung sehen kann?","options":[["A","GDPR"],["B","Least-Privilege-Netzwerkzugriff"],["C","Acceptable Use Policy"],["D","End User License Agreement"]],"answers":["B"],"explanation":"Least Privilege bedeutet, dass Benutzer nur auf die Daten und Ressourcen zugreifen dürfen, die sie für ihre Aufgaben tatsächlich benötigen.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":262,"prompt":"Welcher Steckertyp wird am wahrscheinlichsten zum Anschluss einer externen Antenne verwendet?","options":[["A","BNC"],["B","ST"],["C","LC"],["D","MPO"]],"answers":["A"],"explanation":"BNC wird häufig bei Koaxialkabeln und Hochfrequenzanwendungen wie Antennen, CCTV und Funkkommunikation eingesetzt.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":263,"prompt":"Ein Unternehmen hat die meisten Büro-Laptops auf drahtlosen Netzwerkzugriff umgestellt. Nach einem Malware-Angriff mit hohem Verkehrsaufkommen war es wegen der WLAN-Konfiguration schwierig, das Ereignis einem bestimmten Benutzer zuzuordnen. Welche Maßnahme sollte das Unternehmen ergreifen?","options":[["A","Benutzer auf 5 GHz beschränken."],["B","Auf ein Mesh-Netzwerk umstellen."],["C","Von PSK auf Enterprise migrieren."],["D","WPA2-Verschlüsselung implementieren."]],"answers":["C"],"explanation":"Mit WPA2/WPA3-Enterprise und 802.1X/RADIUS erhält jeder Benutzer eigene Zugangsdaten. Aktivitäten lassen sich dadurch einzelnen Benutzern besser zuordnen als bei einem gemeinsam genutzten PSK.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":264,"prompt":"Welches Cloud-Servicemodell erfordert bei der Migration eines Rechenzentrums in die Cloud am wahrscheinlichsten die höchsten anfänglichen Aufwendungen durch den Kunden?","options":[["A","Infrastructure as a Service"],["B","Software as a Service"],["C","Platform as a Service"],["D","Network as a Service"]],"answers":["A"],"explanation":"Bei IaaS trägt der Kunde mehr Verantwortung für Design, Konfiguration und Migration von virtuellen Maschinen, Speicher, Netzwerk und Sicherheitskomponenten. Dadurch ist der anfängliche Aufwand größer als bei stärker verwalteten Servicemodellen.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":265,"prompt":"Nach Eingabe von Benutzername und Kennwort muss ein Benutzer zusätzlich einen Passcode aus einer Smartphone-App eingeben. Welche Authentifizierungstechnologie wird verwendet?","options":[["A","SSO"],["B","LDAP"],["C","MFA"],["D","SAML"]],"answers":["C"],"explanation":"Multi-Factor Authentication kombiniert mindestens zwei unterschiedliche Faktoren: hier Wissen (Kennwort) und Besitz (Smartphone-App bzw. Passcode).","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":266,"prompt":"Welche der folgenden Einrichtungen ist bei einer Störung von Informationssystemen das beste Beispiel für eine Warm Site?","options":[["A","Kombination aus öffentlichen und privaten Cloud-Diensten zur Datenwiederherstellung"],["B","Teilweise Infrastruktur, Software und Daten vor Ort"],["C","Vollständige elektrische Infrastruktur, aber keine Kundengeräte vor Ort"],["D","Vollständige Infrastruktur, aber keine aktuellen Daten vor Ort"]],"answers":["B"],"explanation":"Eine Warm Site besitzt bereits einen Teil der Infrastruktur, installierte Software und teilweise replizierte Daten, benötigt vor der vollständigen Betriebsaufnahme jedoch noch Konfiguration und Aktualisierung.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":267,"prompt":"Welcher Dienst verwendet Port 636?","options":[["A","SMTP"],["B","Syslog"],["C","TFTP"],["D","LDAPS"]],"answers":["D"],"explanation":"LDAPS ist die über SSL/TLS abgesicherte Variante von LDAP und verwendet standardmäßig Port 636.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonz
