epte"},{"n":268,"prompt":"Ein Unternehmen möchte Data Loss Prevention umsetzen, indem auf Workstations der Zugriff auf soziale Netzwerke und persönliche Cloud-Speicher eingeschränkt wird. Welche Filterart sollte eingesetzt werden?","options":[["A","Port Filtering"],["B","DNS Filtering"],["C","MAC Filtering"],["D","Content Filtering"]],"answers":["D"],"explanation":"Content Filtering kann bestimmte Websites, Anwendungen und Inhaltskategorien blockieren und so verhindern, dass sensible Daten über nicht autorisierte Plattformen hochgeladen oder geteilt werden.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":269,"prompt":"Eine Organisation erreicht mit ihrem WLAN keine ausreichende Abdeckung und möchte überall in der Einrichtung eine durchgängige Verbindung ermöglichen. Welche Lösung sollte der Netzwerkadministrator für die beste Abdeckung empfehlen?","options":[["A","Zusätzliche Ad-hoc-Access-Points einsetzen."],["B","Mehr Ethernet-Anschlüsse für Benutzer bereitstellen."],["C","Ein Mesh-Netzwerk im Gebäude einrichten."],["D","Die aktuelle WLAN-Frequenz ändern."]],"answers":["C"],"explanation":"Ein Mesh-Netzwerk nutzt mehrere miteinander verbundene Knoten, um die Funkabdeckung zu erweitern und nahtloses Roaming im Gebäude zu ermöglichen.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":270,"prompt":"Welches Protokoll ermöglicht automatisches Routing-Failover bei einem Active-Passive-Firewall-Paar?","options":[["A","EIGRP"],["B","OSPF"],["C","VRRP"],["D","BGP"]],"answers":["C"],"explanation":"VRRP stellt eine gemeinsame virtuelle IP-Adresse für mehrere Router oder Firewalls bereit. Fällt das aktive Gerät aus, übernimmt das passive Gerät automatisch.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":271,"prompt":"Was ist ein wesentlicher Unterschied zwischen IPS und IDS?","options":[["A","Ein IPS muss inline im Datenverkehr installiert sein, ein IDS nicht."],["B","Ein IPS arbeitet signaturbasiert, ein IDS nicht."],["C","Ein IPS erzeugt weniger False Positives als ein IDS."],["D","Ein IPS benötigt weniger Administrationsaufwand als ein IDS."]],"answers":["A"],"explanation":"Ein IPS sitzt inline und kann schädlichen Verkehr aktiv blockieren. Ein IDS überwacht den Verkehr passiv und meldet verdächtige Aktivitäten, blockiert sie jedoch normalerweise nicht selbst.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":272,"prompt":"Welche Aussage beschreibt den wichtigsten Grund für den Einsatz von BGP?","options":[["A","Eine Schleife innerhalb eines LANs verhindern."],["B","Rekonvergenzzeiten verbessern."],["C","Routing-Updates mit einem anderen ISP austauschen."],["D","Routen mit einem Layer-3-Switch teilen."]],"answers":["C"],"explanation":"BGP wird zum Austausch von Routen zwischen autonomen Systemen verwendet, etwa zwischen einem Unternehmen und verschiedenen ISPs.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":273,"prompt":"Welcher Schritt der Fehlerbehebungsmethodik folgt auf das Testen der Theorie zur Ursachenbestimmung?","options":[["A","Vollständige Systemfunktion überprüfen."],["B","Ergebnisse dokumentieren."],["C","Einen Maßnahmenplan erstellen."],["D","Das Problem identifizieren."]],"answers":["C"],"explanation":"Die CompTIA-Reihenfolge lautet: Problem identifizieren, Theorie aufstellen, Theorie testen, Maßnahmenplan erstellen und Lösung umsetzen, Funktion prüfen, anschließend dokumentieren.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":274,"prompt":"Ein Netzwerkadministrator hat nach der Erweiterung des Büros um eine zusätzliche Etage ein neues VLAN eingerichtet. Benutzer im neuen VLAN erhalten keine IP-Adresse, während bestehende VLANs problemlos funktionieren. Welche Konfiguration sollte aktualisiert werden?","options":[["A","Scope-Größe"],["B","Address Reservations"],["C","Lease Time"],["D","IP Helper"]],"answers":["D"],"explanation":"Befindet sich der DHCP-Server in einem anderen VLAN, muss der Router oder Layer-3-Switch DHCP-Broadcasts über einen IP Helper/DHCP Relay weiterleiten.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":275,"prompt":"Ein Netzwerktechniker muss ein Grenznetz einrichten, das das interne Netzwerk vom öffentlich erreichbaren Internet isoliert. Welche Sicherheitslösung eignet sich am besten?","options":[["A","Trusted Zones"],["B","URL Filtering"],["C","ACLs"],["D","Screened Subnet"]],"answers":["D"],"explanation":"Ein Screened Subnet, häufig als DMZ bezeichnet, platziert öffentlich erreichbare Dienste in einer separaten Sicherheitszone zwischen Internet und internem Netzwerk und reduziert dadurch den direkten Zugriff auf interne Systeme.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":276,"prompt":"Welche Maßnahme verhindert am besten unbefugte Änderungen an Hardware bei der Planung eines MDF-Raums?","options":[["A","Abschließbare Schränke"],["B","Unterbrechungsfreie Stromversorgung"],["C","Port Security"],["D","Mikrosegmentierung"]],"answers":["A"],"explanation":"Abschließbare Schränke sind eine physische Sicherheitsmaßnahme und verhindern, dass unbefugte Personen an Switches, Patchpanels oder anderer Hardware Veränderungen vornehmen.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":277,"prompt":"Nach der Installation eines neuen Wi-Fi-6E-Routers in einem kleinen Büro stellt ein Techniker fest, dass einige WLAN-Geräte die angegebene Geschwindigkeit nicht erreichen. Welche zwei Punkte sollte er prüfen? (Wähle zwei.)","options":[["A","Kompatibilität der Clientgeräte"],["B","Back-End-Verkabelung"],["C","Wetterphänomene"],["D","Anforderungen der Spannungsquelle"],["E","Interferenzniveau"],["F","Rechenleistung"]],"answers":["A","E"],"explanation":"Nicht alle Clients unterstützen Wi-Fi 6E bzw. das 6-GHz-Band. Zusätzlich können Funkstörungen und Hindernisse die reale Leistung beeinträchtigen. Daher sollten Client-Kompatibilität und Interferenzniveau geprüft werden.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":278,"prompt":"Welches Routingprotokoll benötigt eine konfigurierte Autonomous-System-Nummer, um Kommunikation mit Nachbargeräten aufzubauen?","options":[["A","OSPF"],["B","EIGRP"],["C","FHRP"],["D","RIP"]],"answers":["B"],"explanation":"Bei EIGRP müssen benachbarte Router im selben Autonomous System konfiguriert sein, damit sie Routinginformationen miteinander austauschen.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":279,"prompt":"Eine Investmentbank sucht eine Disaster-Recovery-Backup-Lösung. Welcher Backup-Standort ist am kostengünstigsten?","options":[["A","Hot Site"],["B","Cold Site"],["C","Cluster"],["D","Warm Site"]],"answers":["B"],"explanation":"Eine Cold Site stellt im Wesentlichen Raum, Strom und grundlegende Infrastruktur bereit, hält aber keine vollständig betriebsbereiten Systeme vor. Dadurch ist sie günstiger, benötigt im Notfall aber mehr Wiederanlaufzeit.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":280,"prompt":"Ein Firewall-Administrator bildet die interne IP-Adresse eines Servers auf eine externe IP-Adresse für öffentliche Nutzung ab. Wie heißt diese Funktion?","options":[["A","NAT"],["B","VIP"],["C","PAT"],["D","BGP"]],"answers":["A"],"explanation":"NAT (Network Address Translation) übersetzt interne private IP-Adressen in externe öffentliche Adressen und ermöglicht so Kommunikation mit öffentlichen Netzen.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":281,"prompt":"Ein Netzwerktechniker schließt eine neue VoIP-Installation ab, aber die Telefone können den TFTP-Server nicht finden, um ihre Konfigurationsdateien herunterzuladen. Welche DHCP-Funktion würde den Telefonen helfen, den TFTP-Server zu erreichen?","options":[["A","Exclusions"],["B","Lease Time"],["C","Options"],["D","Scope"]],"answers":["C"],"explanation":"Über DHCP Options können Clients zusätzliche Informationen erhalten, beispielsweise die IP-Adresse eines TFTP-Servers. Bei VoIP wird häufig Option 150 verwendet, um den TFTP-Server bekanntzugeben.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":282,"prompt":"Welche der folgenden Situationen stellt North-South-Traffic am besten dar?","options":[["A","Eine Verbindung zwischen einem Computer und einem öffentlichen Webserver"],["B","Datenverkehr zwischen einem Rechenzentrum und einem DR-Standort"],["C","Verkehr zwischen einem Produktionsserver und einem Backupserver"],["D","Routing-Updates zwischen OSPF-Routern"]],"answers":["A"],"explanation":"North-South-Traffic bezeichnet Datenverkehr zwischen internen Ressourcen und externen Netzen. Die Verbindung eines internen Computers zu einem öffentlichen Webserver ist ein typisches Beispiel.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":283,"prompt":"Welche der folgenden Situationen bietet eine Gelegenheit für einen On-Path-Angriff?","options":[["A","Phishing"],["B","Dumpster Diving"],["C","Evil Twin"],["D","Tailgating"]],"answers":["C"],"explanation":"Bei einem Evil-Twin-Angriff betreibt ein Angreifer einen gefälschten Access Point, der ein legitimes WLAN nachahmt. Verbinden sich Benutzer damit, kann der Angreifer als Zwischenstation deren Datenverkehr abfangen und manipulieren.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":284,"prompt":"Ein Netzwerkadministrator richtet ein Netzwerk für einen neuen Standort mit 150 Benutzern ein. Im nächsten Jahr werden zehn weitere Benutzer erwartet. Jeder Benutzer benötigt zwei IP-Adressen, eine für den Computer und eine für das Telefon. Welcher classful IPv4-Adressbereich eignet sich am besten?","options":[["A","Class D"],["B","Class B"],["C","Class A"],["D","Class C"]],"answers":["B"],"explanation":"160 Benutzer benötigen bei zwei Geräten jeweils insgesamt 320 Hostadressen. Ein einzelnes Class-C-Netz bietet nur 254 nutzbare Adressen; der nächstkleinere passende classful Bereich ist daher Class B.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":285,"prompt":"Ein Netzwerkadministrator verwendet 192.168.1.0/24 und muss drei Subnetze mit jeweils 30 Hosts erstellen. Welche Subnetzmaske erfüllt die Anforderungen?","options":[["A","255.255.255.128"],["B","255.255.255.192"],["C","255.255.255.224"],["D","255.255.255.240"]],"answers":["C"],"explanation":"Eine /27-Maske (255.255.255.224) liefert 32 Adressen beziehungsweise 30 nutzbare Hostadressen pro Subnetz. Aus einem /24 entstehen acht /27-Subnetze – damit sind mindestens drei Subnetze mit je 30 Hosts möglich, ohne unnötig viele Adressen zu reservieren.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":286,"prompt":"Das Netzwerkteam muss in zwei getrennten Gebäuden ein WLAN implementieren. Benutzer sollen sich per RADIUS authentifizieren, bevor sie auf interne Ressourcen zugreifen dürfen. Welche WLAN-Technologie sollte eingesetzt werden?","options":[["A","Mesh"],["B","Enterprise"],["C","Ad hoc"],["D","Point-to-Point"]],"answers":["B"],"explanation":"Ein Enterprise-WLAN unterstützt zentralisierte Authentifizierung über 802.1X/RADIUS und eignet sich für komplexere Umgebungen mit mehreren Access Points und Gebäuden.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":287,"prompt":"Ein Netzwerktechniker entdeckt Datenverkehr, der vertrauliche Informationen an ein unbekanntes und nicht autorisiertes Ziel sendet. Was beschreibt die Ursache am besten?","options":[["A","Ransomware"],["B","Darkware"],["C","Malware"],["D","Adware"]],"answers":["C"],"explanation":"Malware ist ein Oberbegriff für schädliche Software. Sie kann Daten ausspionieren und vertrauliche Informationen unbemerkt an externe Ziele übertragen.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":288,"prompt":"Ein Sicherheitsadministrator sucht nach Rogue-Servern im Netzwerk und möchte zusätzlich feststellen, welche Dienste auf ihnen laufen. Welches Tool sollte er verwenden?","options":[["A","tracert"],["B","nmap"],["C","netstat"],["D","ping"]],"answers":["B"],"explanation":"nmap kann Netzbereiche scannen, aktive Systeme erkennen, offene Ports identifizieren und angebotene Dienste bestimmen.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":289,"prompt":"Ein Netzwerkadministrator muss den SNMP-Zugriff mit Authentifizierung und Verschlüsselung absichern. Welche Variante sollte er verwenden?","options":[["A","SNMPv3"],["B","SNMP Community String"],["C","SNMP ACL Access Group"],["D","SNMPv2c"]],"answers":["A"],"explanation":"SNMPv3 unterstützt Authentifizierung und Verschlüsselung und schützt damit Integrität und Vertraulichkeit der Managementkommunikation.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":290,"prompt":"Am Arbeitsplatz eines Benutzers befinden sich eine Workstation und ein IP-Telefon. Die Workstation kann nicht im Internet surfen, das Telefon funktioniert jedoch. Welche Konfiguration ist erforderlich?","options":[["A","Voice VLAN"],["B","Native VLAN"],["C","Data VLAN"],["D","Trunk Port"]],"answers":["C"],"explanation":"Da das IP-Telefon funktioniert, ist die Sprachzuordnung bereits vorhanden. Die dahinter angeschlossene Workstation benötigt die korrekte ungetaggte Zuordnung zum Data VLAN, damit ihr Datenverkehr weitergeleitet wird.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":291,"prompt":"Ein Netzwerktechniker konfiguriert Layer-2-Switches mit 100-Mbit/s-Ports und verbindet mehrere redundante Links zwischen den Switches. Was sollte er konfigurieren?","options":[["A","Spanning Tree Protocol"],["B","Switch Virtual Interfaces"],["C","Native VLAN"],["D","First Hop Redundancy Protocol"]],"answers":["A"],"explanation":"Bei redundanten Layer-2-Verbindungen verhindert STP Netzwerkschleifen und Broadcast-Stürme, indem überflüssige Pfade blockiert werden und bei Ausfall eines Pfads ein anderer übernehmen kann.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":292,"prompt":"Welche Technologie wird am wahrscheinlichsten verwendet, um bei HTTPS Daten während der Übertragung zu verschlüsseln?","options":[["A","SSH"],["B","TLS"],["C","SCADA"],["D","RADIUS"]],"answers":["B"],"explanation":"TLS (Transport Layer Security) verschlüsselt die Kommunikation zwischen Webbrowser und Webserver und bildet die Sicherheitsgrundlage von HTTPS.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":293,"prompt":"Einige der 20 Mitarbeiter im WLAN können nicht auf Netzwerkressourcen zugreifen, obwohl das WLAN verfügbar ist. Ein Administrator hat den WLAN-DHCP-Server wie folgt konfiguriert: • Netzwerk: 192.168.100.0 • Maske: 255.255.255.240 • Gateway: 192.168.100.1 Was ist die Ursache?","options":[["A","Falsche VLAN-Zuweisung"],["B","Falsche ACL-Konfiguration"],["C","Falsche Subnetzmaske"],["D","Falsches Standardgateway"]],"answers":["C"],"explanation":"Die Maske 255.255.255.240 (/28) stellt nur 14 nutzbare Hostadressen bereit. Für 20 Mitarbeiter reicht das nicht. Eine /27-Maske, 255.255.255.224, würde 30 nutzbare Adressen bereitstellen.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":294,"prompt":"Welche der folgenden Angriffsarten verwendet typischerweise kompromittierte Systeme, die Teil eines Botnetzes werden?","options":[["A","Evil-Twin-Angriff"],["B","DDoS-Angriff"],["C","XML Injection"],["D","Brute-Force-Passwortangriff"]],"answers":["B"],"explanation":"Bei einem DDoS-Angriff steuert ein Angreifer zahlreiche kompromittierte Systeme als Botnetz und lässt sie ein Ziel mit sehr viel Datenverkehr überlasten.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":295,"prompt":"Welcher Netzwerkport wird verwendet, wenn ein Client auf einen SFTP-Server zugreift?","options":[["A","22"],["B","80"],["C","443"],["D","3389"]],"answers":["A"],"explanation":"SFTP arbeitet über SSH und verwendet standardmäßig Port 22.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":296,"prompt":"Zwei Unternehmen wurden erfolgreich zusammengeführt. Danach stellt ein Netzwerkadministrator einen Verbindungsengpass fest. Das neue Unternehmen plant einen leistungsfähigen 40-GB-Switch und den Umbau vom Drei-Tier-Modell zu einem Collapsed Core. Was sollte bis zur Beschaffung der neuen Geräte getan werden?","options":[["A","FHRP implementieren."],["B","Eine Änderung der Route-Selection-Metrik konfigurieren."],["C","Einen Load Balancer installieren."],["D","Link Aggregation aktivieren."]],"answers":["D"],"explanation":"Mit Link Aggregation, z. B. LACP/EtherChannel, lassen sich mehrere physische Links zu einem logischen Link bündeln. Dadurch steigt die verfügbare Bandbreite und der Engpass kann bis zum Hardwareaustausch reduziert werden.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":297,"prompt":"Welchen Schritt sollte ein Troubleshooter unmittelbar nach der Umsetzung einer Lösung durchführen?","options":[["A","Lessons Learned prüfen."],["B","Einen Maßnahmenplan erstellen."],["C","Die vollständige Systemfunktion überprüfen."],["D","Aktionen und Ergebnisse dokumentieren."]],"answers":["C"],"explanation":"Nach der Umsetzung muss zuerst geprüft werden, ob die Lösung das Problem tatsächlich behoben hat und das gesamte System korrekt funktioniert.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":298,"prompt":"Benutzer verbinden sich normalerweise per RDP mit einem Terminalserver namens TS19, der auf 10.0.100.19 zeigt. Seit Kurzem ist keine Verbindung mehr möglich. Ein Ping auf 10.0.100.19 liefert „unreachable“. Was ist die wahrscheinlichste Ursache?","options":[["A","Die Benutzer befinden sich im falschen Subnetz."],["B","Der DHCP-Server hat das Lease erneuert."],["C","Die IP-Adresse war nicht reserviert."],["D","Der Hostname wurde geändert."]],"answers":["C"],"explanation":"War die Serveradresse nicht per DHCP reserviert oder statisch eingerichtet, kann sie sich geändert oder an ein anderes Gerät vergeben worden sein. Eine Reservierung für 10.0.100.19 würde dies verhindern.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":299,"prompt":"Welche OSI-Schicht verwendet für die Paketzustellung ein verbindungsloses Protokoll?","options":[["A","Physical"],["B","Network"],["C","Transport"],["D","Application"]],"answers":["B"],"explanation":"Die Network-Schicht (Layer 3) verwendet unter anderem IP. IP arbeitet verbindungslos und überträgt Pakete, ohne vorher eine feste Sitzung aufzubauen.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":300,"prompt":"Ein Unternehmen hat einen Vorfall, bei dem ein Benutzer einen unmanaged Switch mit dem Netzwerk verbunden hat. Welche Technologie sollte eingeführt werden, um ähnliche Vorfälle zu vermeiden, ohne zuvor ein vollständiges Asset-Inventar anzulegen?","options":[["A","Screened Subnet"],["B","802.1X"],["C","MAC Filtering"],["D","Port Security"]],"answers":["D"],"explanation":"Port Security kann die Anzahl bzw. die erlaubten MAC-Adressen an einem Switchport beschränken. Dadurch kann verhindert werden, dass unautorisierte Geräte wie zusätzliche Switches angeschlossen werden.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":301,"prompt":"Welche zwei Vorteile bieten MFA und SSO in einer Unternehmensumgebung? (Wähle zwei.)","options":[["A","Passwort-Resets vollständig beseitigen."],["B","Benutzerkontenverwaltung zentralisieren."],["C","Eine zusätzliche Sicherheitsschicht gegen kompromittierte Zugangsdaten schaffen."],["D","Den Aufwand für Security Tokens reduzieren."],["E","Conditional-Access-Richtlinien erzwingen."],["F","Threat-Feed-Informationen externer Quellen nutzen."]],"answers":["B","C"],"explanation":"SSO zentralisiert und vereinfacht die Anmeldung an mehreren Anwendungen. MFA verlangt zusätzliche Faktoren und schützt dadurch auch dann besser, wenn ein Kennwort kompromittiert wurde.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":302,"prompt":"Nach dem Austausch eines Netzwerk-Switches treten Verbindungsprobleme auf. Es gibt getrennte Subnetze für Benutzer, Voice und Server. Benutzer können Serverressourcen nicht erreichen. Ein separater Voice-Switch verwirft tausende Pakete, obwohl Telefonate funktionieren. Was ist am wahrscheinlichsten das Problem?","options":[["A","Falsches Kabel"],["B","Administrativ deaktivierter Port"],["C","VLAN-Fehlkonfiguration"],["D","Duplex-Einstellung"]],"answers":["C"],"explanation":"Da das Problem direkt nach dem Switchtausch auftritt und mehrere VLANs betroffen sind, ist eine VLAN-Fehlkonfiguration am wahrscheinlichsten. Falsches Tagging oder fehlende VLAN-Zulassung kann den Verkehr zwischen Benutzer- und Servernetz verhindern.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":303,"prompt":"Ein Netzwerkadministrator benötigt ein Subnetz, das mindestens 260 Geräte mit möglichst wenig ungenutzten Adressen unterstützt. Welches Subnetz sollte verwendet werden?","options":[["A","172.16.0.0/24"],["B","172.25.2.0/23"],["C","172.30.1.0/22"],["D","172.33.0.0/21"]],"answers":["B"],"explanation":"Ein /23 bietet 512 Adressen bzw. 510 nutzbare Hostadressen. /24 reicht mit 254 Hosts nicht aus, während /22 und /21 unnötig groß wären.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":304,"prompt":"Welche Lösung ermöglicht sicheren Remotezugriff auf interne Anwendungen?","options":[["A","VPN"],["B","CDN"],["C","SAN"],["D","IDS"]],"answers":["A"],"explanation":"Ein VPN baut einen verschlüsselten Tunnel über das Internet auf und ermöglicht damit sicheren Zugriff auf interne Anwendungen und Dateien.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":305,"prompt":"Ein Junior-Netzwerkadministrator erhält eine SMS von einer Nummer, die sich als Domain-Registrar des Unternehmens ausgibt. Er wird dazu gebracht, globale Administratorzugangsdaten preiszugeben. Welcher Angriff findet statt?","options":[["A","DNS Poisoning"],["B","ARP Spoofing"],["C","Vishing"],["D","Smishing"]],"answers":["D"],"explanation":"Smishing ist Phishing über SMS bzw. Textnachrichten. Ziel ist es, Opfer zur Preisgabe sensibler Informationen wie Zugangsdaten zu bewegen.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":306,"prompt":"Ein Netzwerktechniker möchte eine sichere Lösung implementieren, die bei der Sammlung und Überwachung von Logs im Unternehmensnetz sowohl Authentifizierung als auch Verschlüsselung bietet. Welches Tool erfüllt diese Aufgabe?","options":[["A","Syslog"],["B","RADIUS"],["C","SNMPv3"],["D","API"]],"answers":["C"],"explanation":"SNMPv3 unterstützt Authentifizierung und verschlüsselte Kommunikation und eignet sich daher für sicheres Netzwerkmanagement und Monitoring.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":307,"prompt":"Ein Tourist versucht an einem öffentlichen Ort auf einem Mobilgerät auf Online-Banking zuzugreifen. Welchem Angriff ist er am wahrscheinlichsten ausgesetzt?","options":[["A","Vishing"],["B","Tailgating"],["C","Shoulder Surfing"],["D","Peripheral Attack"]],"answers":["C"],"explanation":"Bei Shoulder Surfing beobachtet eine andere Person den Bildschirm oder die Eingaben des Opfers, um sensible Informationen zu erfassen.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":308,"prompt":"Welche der folgenden Technologien wird verwendet, um ein Unternehmensnetzwerk in mehrere logische Netze aufzuteilen?","options":[["A","Load Balancer"],["B","VLAN"],["C","CDN"],["D","IPS"]],"answers":["B"],"explanation":"VLANs segmentieren ein gemeinsames physisches Netzwerk in getrennte logische Broadcast-Domänen und verbessern dadurch Verwaltung, Sicherheit und Leistung.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":309,"prompt":"Eine medizinische Praxis hat kürzlich ein Gast-WLAN auf dem vorhandenen Router eingerichtet. Seitdem ändern Gäste die Musik auf dem Lautsprechersystem. Welche zwei Maßnahmen sollte die Praxis ergreifen? (Wähle zwei.)","options":[["A","Smart Devices in ein eigenes Netzwerksegment isolieren."],["B","IPS so konfigurieren, dass Gäste keine Änderungen vornehmen können."],["C","Einen neuen AP installieren."],["D","Einen Syslog-Server einrichten."],["E","Standardzugangsdaten ändern."],["F","GRE auf dem WLAN-Router konfigurieren."]],"answers":["A","E"],"explanation":"Die Smart-Geräte sollten in ein separates VLAN bzw. Netzwerksegment verschoben werden, damit Gäste sie nicht erreichen. Außerdem müssen Standardkennwörter geändert werden, da bekannte Herstellerzugangsdaten sonst unbefugten Zugriff ermöglichen.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":310,"prompt":"Ein Netzwerkadministrator muss sämtlichen ein- und ausgehenden Telnet-Verkehr deaktivieren. Welcher Port sollte blockiert werden?","options":[["A","23"],["B","53"],["C","123"],["D","443"]],"answers":["A"],"explanation":"Telnet verwendet Port 23. Durch Blockieren dieses Ports werden Telnet-Verbindungen verhindert.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":311,"prompt":"Welche Phase der Fehlerbehebungsmethodik beinhaltet das Betrachten mehrerer möglicher Ansätze bzw. Ursachen?","options":[["A","Vollständige Funktion überprüfen."],["B","Lösung umsetzen."],["C","Ergebnisse und Maßnahmen dokumentieren."],["D","Eine Theorie zur wahrscheinlichen Ursache aufstellen."]],"answers":["D"],"explanation":"Beim Aufstellen einer Theorie zur wahrscheinlichen Ursache werden mehrere mögliche Erklärungen anhand der Symptome betrachtet und als Hypothesen formuliert.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":312,"prompt":"Nach einer kürzlich erfolgten Unternehmensfusion gehen sehr viele Warnmeldungen wegen extrem hoher Auslastung ein. Was sollte erstellt werden, um neue Alarmierungsanforderungen sinnvoll festzulegen?","options":[["A","SLA"],["B","Netzwerkdiagramm"],["C","Baseline"],["D","Heatmap"]],"answers":["C"],"explanation":"Eine Baseline beschreibt das normale Verhalten und die üblichen Leistungswerte des neuen Gesamtnetzes. Dadurch können realistische Schwellenwerte festgelegt und unnötige Warnungen vermieden werden.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":313,"prompt":"In welchem Dokument werden für einen Cloud-Dienst verbindliche Verfügbarkeitsziele, Reaktionszeiten und gegebenenfalls Ausgleichsleistungen festgelegt?","options":[["A","IPAM"],["B","SLA"],["C","MTBF"],["D","EOL"]],"answers":["B"],"explanation":"Ein Service Level Agreement legt messbare Leistungs- und Verfügbarkeitszusagen sowie Verantwortlichkeiten und mögliche Folgen bei Nichterfüllung fest.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":314,"prompt":"Ein Techniker entwirft eine Cloud-Lösung, die zur aktuellen Unternehmensgröße sowie zur benötigten Rechen- und Speicherkapazität passen soll. Welches Cloud-Servicemodell erfüllt diese Anforderungen?","options":[["A","SaaS"],["B","PaaS"],["C","IaaS"],["D","IaC"]],"answers":["C"],"explanation":"IaaS stellt grundlegende Rechen-, Speicher- und Netzwerkressourcen bereit und kann entsprechend dem benötigten Umfang skaliert werden.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":315,"prompt":"Ein Netzwerkadministrator installiert mehrere neue Tischtelefone und Workstations. Pro Arbeitsplatz gibt es einen Switchport. Er verwendet: `switchport mode access` `switchport voice vlan 69` Mit welchem VLAN wird der Datenverkehr der Workstation getaggt bzw. zugeordnet?","options":[["A","Private VLAN"],["B","Voice VLAN"],["C","Native VLAN"],["D","Data VLAN"]],"answers":["D"],"explanation":"An einem Access-Port wird normaler Workstation-Verkehr dem Data VLAN bzw. Access VLAN zugeordnet. Das konfigurierte Voice VLAN ist ausschließlich für den Sprachverkehr des IP-Telefons vorgesehen.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":316,"prompt":"Welche der folgenden Kategorien ist mit Vermeidung, Akzeptanz, Minderung und Übertragung verbunden?","options":[["A","Risiko"],["B","Exploit"],["C","Bedrohung"],["D","Schwachstelle"]],"answers":["A"],"explanation":"Dies sind typische Risikobehandlungsstrategien im Risikomanagement.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":317,"prompt":"Mehrere Benutzer melden schlechte Leistung beim Zugriff auf Freigaben eines Servers namens File01. Während der Fehlerbehebung vertauscht der Administrator die Ethernetverbindungen von File01 und File02. Kurz danach hat File02 Probleme, File01 dagegen nicht mehr. Was beeinträchtigt die Leistung am wahrscheinlichsten?","options":[["A","Port Security"],["B","Speed-/Duplex-Mismatch"],["C","Reduziertes PoE-Leistungsbudget"],["D","Keep-Alive-Beacon-Fehler"]],"answers":["B"],"explanation":"Da das Problem mit dem Switchport mitwandert, liegt wahrscheinlich ein Speed-/Duplex-Mismatch an diesem Port vor, der Kollisionen und schlechten Durchsatz verursacht.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":318,"prompt":"Ein Netzwerktechniker benötigt ein Glasfaser-Patchkabel mit einem runden Steckverbinder, der durch Drehen verriegelt wird. Wie heißt dieser Steckertyp?","options":[["A","ST"],["B","BNC"],["C","SC"],["D","LC"]],"answers":["A"],"explanation":"Der ST-Stecker (Straight Tip) ist rund und verwendet einen Bajonettverschluss, der durch Drehen verriegelt wird.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":319,"prompt":"Ein Rechenzentrumsadministrator bewertet den Einsatz von Jumbo Frames in einer Storage-Umgebung. Was ist der beste Grund für ihren Einsatz?","options":[["A","Geräte-Overhead reduzieren"],["B","Den aktuellen Root Switch in STP melden"],["C","Routing-Konvergenz verbessern"],["D","Laufwerksdurchsatz erhöhen"]],"answers":["A"],"explanation":"Jumbo Frames transportieren mehr Nutzdaten pro Frame. Dadurch werden weniger Frames benötigt und der Verarbeitungs-Overhead auf Netzwerkgeräten reduziert.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":320,"prompt":"Ein Netzwerkadministrator muss effizient 200 Systeme mit RFC1918-Adressen bereitstellen. Welches Netz sollte er verwenden?","options":[["A","10.10.10.0/8"],["B","150.200.1.0/24"],["C","192.168.1.0/24"],["D","254.169.0.0/24"]],"answers":["C"],"explanation":"192.168.1.0/24 liegt im privaten RFC1918-Bereich und bietet 254 nutzbare Adressen, ausreichend und relativ effizient für 200 Systeme.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":321,"prompt":"Ein Administrator beantragt ein Zertifikat für die Unternehmensdomain. Um die Domaininhaberschaft nachzuweisen, verlangt die Zertifizierungsstelle einen bestimmten DNS-Record. Welcher Record-Typ ist erforderlich?","options":[["A","SOA"],["B","MX"],["C","NS"],["D","TXT"]],"answers":["D"],"explanation":"Zertifizierungsstellen nutzen häufig einen TXT-Record mit einem vorgegebenen Token, um nachzuweisen, dass der Antragsteller die DNS-Zone kontrolliert.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":322,"prompt":"Eine Organisation hat vier Abteilungen, die jeweils Zugriff auf unterschiedliche, nicht überlappende Ressourcen benötigen. Was sollte ein Techniker konfigurieren, um ACLs sinnvoll zu implementieren und zuzuweisen?","options":[["A","VLAN"],["B","DHCP"],["C","VPN"],["D","STP"]],"answers":["A"],"explanation":"VLANs segmentieren die Abteilungen in getrennte Netze. ACLs können anschließend an den jeweiligen VLAN-Interfaces angewendet werden, um den Zugriff zu steuern.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":323,"prompt":"Ein Netzwerkanalyst installiert ein WLAN in einem Unternehmensumfeld. Mitarbeiter müssen sich mit ihren Domänenidentitäten und Zugangsdaten authentifizieren. Welche Maßnahme sollte am Access Point vorgenommen werden?","options":[["A","MAC Security aktivieren."],["B","Für jeden Benutzer einen PSK erzeugen."],["C","WPS implementieren."],["D","WPA3-Enterprise konfigurieren."]],"answers":["D"],"explanation":"WPA3-Enterprise verwendet 802.1X mit einem Authentifizierungsdienst wie RADIUS. So können sich Mitarbeiter mit individuellen Domänenidentitäten anmelden, statt einen gemeinsamen PSK zu verwenden.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":324,"prompt":"Ein Netzwerkadministrator konfiguriert eine drahtlose Verbindung zwischen zwei Lagerhäusern. Welcher WLAN-Netzwerktyp eignet sich am besten?","options":[["A","Ad hoc"],["B","Infrastructure"],["C","Point-to-Point"],["D","Mesh"]],"answers":["C"],"explanation":"Eine Point-to-Point-Funkverbindung bildet eine dedizierte Brücke zwischen zwei Standorten und eignet sich daher für die Verbindung zweier Gebäude.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":325,"prompt":"Ein Netzwerktechniker entwirft ein internes Netzwerk, das sowohl IPv4- als auch IPv6-Routing unterstützen muss. Welches Routingprotokoll kann beide Protokollfamilien unterstützen?","options":[["A","OSPFv3"],["B","RIPv2"],["C","BGP"],["D","EIGRP"]],"answers":["C"],"explanation":"BGP mit Multiprotocol Extensions (MP-BGP) kann sowohl IPv4- als auch IPv6-Routen innerhalb desselben Routing-Frameworks transportieren.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":326,"prompt":"Bei einem Netzwerkaudit stellt ein Administrator fest, dass der Spanning-Tree-Root in VLAN 300 nicht der Konfigurationsbaseline entspricht. Dies könnte bei STP-Updates zu Netzwerkausfällen führen. Was sollte er tun, um die vorgesehene Konfiguration wiederherzustellen?","options":[["A","Den Designated Port des falsch konfigurierten Switches zu einem Root Port ändern."],["B","Den Root Port zu einem Listening Port ändern."],["C","Den blockierten Port zu einem Learning Port ändern."],["D","Bridge-ID/Priorität des falsch konfigurierten Switches erhöhen."]],"answers":["D"],"explanation":"Durch Erhöhen der STP-Priorität wird die Bridge-ID dieses Switches größer, sodass er die Root-Wahl nicht mehr gewinnt und der vorgesehene Root Switch wieder ausgewählt wird.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":327,"prompt":"Ein Netzwerkadministrator verbindet ein Multimode-Glasfaserkabel vom MDF zum Serverraum. An Switch 2 entsteht kein Link. Das Kabel selbst ist fehlerfrei und funktioniert an einem Port von Switch 1, aber nicht an Switch 2. Was sollte als Nächstes geprüft werden?","options":[["A","Glasfaserlänge"],["B","Transceiver-Modell"],["C","Steckertyp"],["D","Portgeschwindigkeit"]],"answers":["B"],"explanation":"Wenn dasselbe Kabel an einem anderen Switch funktioniert, ist wahrscheinlich das SFP-/Transceiver-Modul in Switch 2 inkompatibel oder falsch. Das Modell muss zum verwendeten Multimode-Kabel passen.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":328,"prompt":"Welche Architektur wird am häufigsten mit East-West-Traffic in Verbindung gebracht?","options":[["A","Colocated VMs"],["B","Hybrid Cloud"],["C","Client-Server"],["D","Hub-and-Spoke"]],"answers":["A"],"explanation":"VMs im selben Rechenzentrum kommunizieren hauptsächlich untereinander. Dieser interne horizontale Verkehr wird als East-West-Traffic bezeichnet.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":329,"prompt":"Ein Unternehmen wurde wegen Spam auf eine Sperrliste gesetzt. Der Netzwerkadministrator bestätigt, dass eine Workstation mit Malware infiziert war. Welchen Prozess hat er zur Ermittlung der Ursache verwendet?","options":[["A","Traffic Analysis"],["B","Availability Monitoring"],["C","Baseline Metrics"],["D","Network Discovery"]],"answers":["A"],"explanation":"Traffic Analysis kann ungewöhnliche Datenströme wie massenhaften ausgehenden Spam einem bestimmten infizierten Gerät zuordnen.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":330,"prompt":"Welche zwei Aktionen gehören zum ersten Schritt der Fehlerbehebungsmethodik? (Wähle zwei.)","options":[["A","Offensichtliche Ursachen hinterfragen."],["B","Divide and Conquer anwenden."],["C","Symptome identifizieren."],["D","Eine Theorie aufstellen."],["E","Top-to-Bottom vorgehen."],["F","Benutzer befragen."]],"answers":["C","F"],"explanation":"Im ersten Schritt werden Symptome identifiziert und betroffene Benutzer befragt, um das Problem möglichst genau einzugrenzen.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":331,"prompt":"Welcher Kabeltyp ermöglicht die Nutzung von QSFP-Ports ohne separate Transceiver?","options":[["A","Multimode"],["B","Twinaxial"],["C","RG11"],["D","Category 6"]],"answers":["B"],"explanation":"Twinaxial-DAC-Kabel besitzen integrierte Transceiver und können direkt an QSFP-Ports angeschlossen werden.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":332,"prompt":"Ein Netzwerkadministrator stellt an einigen Switchports ungewöhnlich viele Fehler fest und verfolgt die zugehörige Verkabelung. Was verursacht die Fehler am wahrscheinlichsten?","options":[["A","Geschirmtes Leerrohr"],["B","Plenum-Bereiche"],["C","Spannungstransformatoren"],["D","Hydraulische Hebebühnen"]],"answers":["C"],"explanation":"Spannungstransformatoren erzeugen starke elektromagnetische Felder, die Kupferleitungen stören und dadurch Übertragungsfehler verursachen können.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":333,"prompt":"Ein Netzwerkadministrator untersucht ein Problem mit der IP-Adresse eines Benutzers. Welche OSI-Schicht ist dabei zu berücksichtigen?","options":[["A","Data Link"],["B","Network"],["C","Session"],["D","Presentation"]],"answers":["B"],"explanation":"IP-Adressierung und Routing gehören zur Network-Schicht, Layer 3.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":334,"prompt":"Welche der folgenden Lösungen ermöglicht nach einem Ausfall am wahrscheinlichsten den Zugriff auf möglichst aktuelle Daten?","options":[["A","Backup-Bänder prüfen."],["B","Aus Cloud-Speicher wiederherstellen."],["C","Auf eine Hot Site umschalten."],["D","Einen Snapshot wiederherstellen."]],"answers":["C"],"explanation":"Eine Hot Site ist vollständig vorbereitet und wird fortlaufend repliziert, sodass nach einem Ausfall sehr schnell auf aktuelle Daten und Systeme umgeschaltet werden kann.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":335,"prompt":"Ein Netzwerktechniker kartiert Netzwerkgeräte. Auf dem lokalen Switch zeigt LLDP nur direkt angeschlossene Geräte an. Was sollte der Techniker tun, um alle Netzwerkgeräte zu entdecken?","options":[["A","Alle Management-IP-Adressen in dasselbe Subnetz verschieben."],["B","STP aktivieren."],["C","Sich auf jedem gefundenen Netzwerkgerät anmelden und den Vorgang erneut durchführen."],["D","Die Betriebssysteme auf die aktuelle LLDP-Version aktualisieren."]],"answers":["C"],"explanation":"LLDP zeigt nur direkte Layer-2-Nachbarn. Um die gesamte Topologie zu erfassen, muss der Techniker die gefundenen Geräte nacheinander aufrufen und dort ebenfalls LLDP ausführen.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":336,"prompt":"Welche Lösung kann verwendet werden, wenn ein Server an einem entfernten Standort physisch nicht erreichbar ist?","options":[["A","Out-of-Band-Management"],["B","Crash Cart"],["C","Jump Box"],["D","Console"]],"answers":["A"],"explanation":"Out-of-Band-Management stellt einen separaten Managementpfad bereit, über den ein Server auch bei Ausfall des normalen Netzwerks oder fehlendem physischen Zugang verwaltet werden kann.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":337,"prompt":"Welche Source-Control-Funktion ermöglicht es einem Administrator, eine neue Konfiguration zu testen, ohne die Hauptkonfiguration zu verändern?","options":[["A","Central Repository"],["B","Conflict Identification"],["C","Branching"],["D","Version Control"]],"answers":["C"],"explanation":"Branching erstellt einen getrennten Entwicklungszweig, in dem Änderungen getestet werden können, ohne die primäre Konfiguration zu beeinflussen.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":338,"prompt":"Ein Netzwerktechniker muss Access Points remote ändern, aktualisieren und steuern und benötigt dabei Echtzeittransparenz über HTTPS. Welche Lösung eignet sich am besten?","options":[["A","Web Interface"],["B","Command Line"],["C","SNMP Console"],["D","API Gateway"]],"answers":["D"],"explanation":"Ein API Gateway kann über HTTPS programmierbare REST-Schnittstellen bereitstellen, über die Konfigurationen geändert, Statusdaten abgerufen und Geräte automatisiert gesteuert werden können.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":339,"prompt":"An welchem Ort wird Plenum-Kabel empfohlen?","options":[["A","Stark frequentierte Bereiche"],["B","Außenbereiche"],["C","Innerhalb von Leerrohren"],["D","Lufträume oberhalb einer abgehängten Decke"]],"answers":["D"],"explanation":"Plenum-Bereiche sind Luftführungsräume, z. B. oberhalb abgehängter Decken. Dort werden Kabel mit schwer entflammbarer, rauch- und schadstoffarmer Ummantelung verlangt.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":340,"prompt":"Ein Client kann einen lokalen Datenbankserver erreichen, aber nicht das Internet. Er ist mit 192.168.1.223, Maske 255.255.255.192 (/26), Gateway 192.168.1.190 und DNS 192.168.1.196 konfiguriert. Was verursacht das Problem?","options":[["A","Falscher DNS"],["B","Nicht erreichbares Gateway"],["C","Ausgefallene Root Bridge"],["D","Schlechtes Upstream-Routing"]],"answers":["B"],"explanation":"192.168.1.223/26 liegt im Subnetz 192.168.1.192/26. Das Gateway 192.168.1.190 liegt dagegen im vorherigen Subnetz 192.168.1.128/26 und ist deshalb vom Client auf Layer 2 nicht erreichbar.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":341,"prompt":"Ein Unternehmen hat ein Videokonferenzsystem eingeführt, das viel Bandbreite benötigt. Benutzer melden langsames Internet und insgesamt schlechtere Netzwerkleistung. Welche zwei Ursachen sind am wahrscheinlichsten? (Wähle zwei.)","options":[["A","DNS-Fehlkonfiguration"],["B","Unzureichende Netzwerksicherheit"],["C","Malware oder Virus"],["D","Veraltete Software"],["E","Falsche QoS-Einstellungen"],["F","Netzwerküberlastung"]],"answers":["E","F"],"explanation":"Ohne korrekte QoS-Priorisierung kann Videokonferenzverkehr andere Dienste verdrängen. Gleichzeitig kann der hohe Bandbreitenbedarf zu Netzwerküberlastung führen.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":342,"prompt":"Ein Techniker muss einen Computer im Netzwerk identifizieren, der angeblich nicht autorisierte Inhalte herunterlädt. Was sollte er verwenden?","options":[["A","Anomaly Alerts"],["B","Port Mirroring"],["C","Performance Monitoring"],["D","Packet Capture"]],"answers":["D"],"explanation":"Ein Packet Capture ermöglicht die Analyse konkreter Datenströme und hilft, Quelle und Inhalt der Downloads zu identifizieren.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":343,"prompt":"Welcher Schritt der Fehlerbehebung liefert einem Change Advisory Board die Informationen, die es für eine Entscheidung benötigt?","options":[["A","Problem identifizieren."],["B","Theorie zur Ursache entwickeln."],["C","Theorie testen."],["D","Maßnahmenplan erstellen."]],"answers":["D"],"explanation":"Ein Maßnahmenplan beschreibt die geplante Änderung, Auswirkungen und Vorgehensweise und liefert damit die Grundlage für eine CAB-Entscheidung.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":344,"prompt":"Eine Anwendungssoftware erhält keine Updates und Sicherheitspatches mehr. Die weitere Nutzung könnte das System Angriffen aussetzen. Welcher Begriff beschreibt diese Situation am besten?","options":[["A","SLA"],["B","Licensing"],["C","SIEM"],["D","EOL"]],"answers":["D"],"explanation":"End of Life (EOL) bedeutet, dass der Hersteller das Produkt nicht mehr regulär pflegt und keine Sicherheitsupdates mehr bereitstellt.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":345,"prompt":"Welche Technologie verwendet eine VIP, um Gateway-Redundanz zwischen zwei Routern bereitzustellen?","options":[["A","LACP"],["B","PAT"],["C","FHRP"],["D","BGP"]],"answers":["C"],"explanation":"First Hop Redundancy Protocols, beispielsweise HSRP oder VRRP, verwenden eine gemeinsame virtuelle IP-Adresse als redundantes Standardgateway.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":346,"prompt":"Wie lässt sich die Wahrscheinlichkeit elektrostatischer Entladung am besten reduzieren?","options":[["A","UPS"],["B","Überspannungsschutz"],["C","PDUs"],["D","Temperatur- und Feuchtigkeitsregelung"]],"answers":["D"],"explanation":"Eine geeignete Luftfeuchtigkeit reduziert statische Aufladung und damit das Risiko elektrostatischer Entladung.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":347,"prompt":"Mehrere nicht autorisierte Access Points in der Nähe des Unternehmens senden ähnliche SSIDs aus. Welcher Angriff wird beschrieben?","options":[["A","Evil Twin"],["B","Wi-Fi Jamming"],["C","On-Path"],["D","Wardriving"]],"answers":["A"],"explanation":"Bei einem Evil Twin wird ein Rogue Access Point mit identischer oder sehr ähnlicher SSID betrieben, um Benutzer zum Verbinden mit dem falschen WLAN zu verleiten.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":349,"prompt":"Ein Sicherheitsingenieur verbindet Kameras mit einem 12-Port-PoE-Switch, aber nur acht Kameras starten. Was sollte er zuerst prüfen?","options":[["A","Ethernet-Kabeltyp"],["B","PoE-Leistungsbudget"],["C","Transceiver-Kompatibilität"],["D","DHCP-Adressierung"]],"answers":["B"],"explanation":"Wenn nur ein Teil der PoE-Kameras startet, sollte zuerst die verfügbare Gesamtleistung des Switches geprüft werden. Ist das PoE-Budget erschöpft, können weitere Ports trotz freier Datenports keine Geräte versorgen.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":350,"prompt":"Ein Netzwerkadministrator richtet eine Firewall zum Schutz des Unternehmensnetzwerks vor externen Bedrohungen ein. Was sollte er bei der Konfiguration zuerst berücksichtigen?","options":[["A","Erforderliche Ports, Protokolle und Dienste"],["B","Einbindung einer Deny-All-Regel"],["C","VPN-Zugriff"],["D","Ausgehender Verkehr von öffentlich erreichbaren Servern"]],"answers":["A"],"explanation":"Vor dem Erstellen von Regeln muss festgelegt werden, welche Ports, Protokolle und Dienste geschäftlich erforderlich sind, damit legitimer Verkehr erlaubt und alles andere blockiert werden kann.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":351,"prompt":"Ein neu angeschlossener Arbeitsplatz kann einen entfernten Server nicht anpingen. Sogar `ping 127.0.0.1` auf der Workstation schlägt fehl. Was sollte der Administrator zur Diagnose prüfen?","options":[["A","Lokalen TCP/IP-Stack und NIC-Treiber"],["B","Netzwerküberlastung"],["C","Paketverluste am Router"],["D","DNS-Auflösung"]],"answers":["A"],"explanation":"127.0.0.1 ist die lokale Loopback-Adresse und verlässt den Rechner nicht. Schlägt dieser Ping fehl, liegt das Problem am lokalen TCP/IP-Stack, an der Protokollbindung oder am Treiber – nicht im entfernten Netzwerk.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":352,"prompt":"Ein Unternehmen verlegt Netzwerkkabel oberhalb von Deckenplatten. Die Kabel müssen brandschutzgeeignet sein. Welcher Kabeltyp sollte verwendet werden?","options":[["A","Koaxial"],["B","Plenum"],["C","Crossover"],["D","STP"]],"answers":["B"],"explanation":"Plenum-Kabel sind für Luftführungsräume zugelassen und erzeugen im Brandfall weniger Rauch bzw. schädliche Gase.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":353,"prompt":"Ein VoIP-Telefon erhält Strom, kann aber weder Anrufe tätigen noch empfangen. An einem anderen Switchport funktioniert es. Was war am ursprünglichen Port am wahrscheinlichsten falsch?","options":[["A","Half-Duplex-Konfiguration"],["B","Error-disabled-Zustand"],["C","Falsche VLAN-Zuweisung"],["D","Überschrittenes PoE-Budget"]],"answers":["C"],"explanation":"Das Telefon erhielt Strom, war jedoch wahrscheinlich dem falschen VLAN zugeordnet und konnte daher erforderliche Voice-VLAN-Dienste wie DHCP oder TFTP nicht erreichen.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":354,"prompt":"Ein Netzwerkadministrator konfiguriert einen autonomen Access Point und misst nur 75 Mbit/s Durchsatz. An anderen APs werden 500 Mbit/s erreicht. Was ist die wahrscheinlichste Ursache?","options":[["A","Konfiguration der Kanalbreite"],["B","DNS-Probleme"],["C","Authentifizierungsfehler"],["D","Falsche DHCP-Einstellungen"]],"answers":["A"],"explanation":"Der AP verwendet wahrscheinlich eine schmale Kanalbreite, z. B. 20 MHz. Breitere Kanäle wie 40 oder 80 MHz ermöglichen deutlich höheren Durchsatz.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":355,"prompt":"Welche Technologie eignet sich am besten für ein Unternehmen, das schnellen Zugriff auf häufig genutzte Webinhalte wie Bilder und Videos benötigt?","options":[["A","CDN"],["B","SAN"],["C","Firewall"],["D","Switch"]],"answers":["A"],"explanation":"Ein Content Delivery Network (CDN) speichert häufig genutzte Inhalte auf geografisch verteilten Edge-Servern näher beim Benutzer und reduziert so die Latenz.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":356,"prompt":"Was sollte Bestandteil eines SLA sein?","options":[["A","Patches und Bugfixes"],["B","Licensing"],["C","Inventory Management"],["D","Stakeholders"]],"answers":["A"],"explanation":"Ein SLA kann die bereitgestellten Supportleistungen wie geplante Patches und Bugfixes sowie Leistungs- und Verfügbarkeitszusagen festlegen.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":357,"prompt":"Ein Netzwerkadministrator vermutet, dass an den Mailservern von comptia.org etwas geändert wurde. Welchen Befehl sollte er ausführen, um die Änderung zu überprüfen?","options":[["A","`ping www.comptia.org`"],["B","`dig comptia.org MX`"],["C","`nslookup -type=ns comptia.org`"],["D","`tracert comptia.org`"]],"answers":["B"],"explanation":"Mailserver einer Domain werden über MX-Records veröffentlicht. `dig comptia.org MX` fragt genau diese Einträge ab und zeigt damit eine Änderung ohne die unzuverlässige ANY-Sammelabfrage.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":358,"prompt":"Ein Netzwerktechniker erhält während der Bearbeitung eines anderen Problems ein neues Ticket, das für den Geschäftsbetrieb kritisch ist. Welches Dokument sollte er heranziehen, um die Bearbeitungsreihenfolge zu bestimmen?","options":[["A","NDA"],["B","AUP"],["C","SLA"],["D","MOU"]],"answers":["C"],"explanation":"Das SLA definiert Prioritäten sowie Reaktions- und Lösungszeiten und hilft daher bei der Entscheidung, welches Ticket zuerst bearbeitet werden muss.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":359,"prompt":"Ein Netzwerktechniker untersucht die Verbindung eines neu installierten Servers in einem bestehenden VLAN. Die Serverkonfiguration verwendet /27, während das Router-Interface zum Netz 192.168.100.0/24 gehört. Was beschreibt das Problem?","options":[["A","Der Server hat eine falsche Subnetzmaske."],["B","Es gibt eine doppelte IP-Adresse."],["C","Der DHCP-Pool ist erschöpft."],["D","Dem Router fehlt eine Default Route."]],"answers":["A"],"explanation":"Die Subnetzmasken stimmen nicht überein, wodurch der Server und das Router-Interface unterschiedliche lokale Netzgrenzen annehmen und die Layer-3-Kommunikation fehlschlägt.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":360,"prompt":"Ein Netzwerkadministrator installiert neue Kabel für Computer und Access Points. Einige Geräte verbinden sich nicht. Ein Wechsel auf einen anderen Switchport behebt das Problem nicht. Was sollte als Nächstes geprüft werden?","options":[["A","Power Budget"],["B","Geräteanforderungen"],["C","Portstatus"],["D","Kabelterminierung"]],"answers":["D"],"explanation":"Eine fehlerhafte Kabelterminierung bleibt auch beim Wechsel des Switchports bestehen und kann den Linkaufbau verhindern.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":361,"prompt":"Welche Lösung stellt eine schlanke und private Verbindung zu einem entfernten System bereit?","options":[["A","Site-to-Site-VPN"],["B","Telnet"],["C","Console"],["D","Secure Shell"]],"answers":["D"],"explanation":"SSH stellt über eine einzelne TCP-Verbindung, standardmäßig Port 22, einen verschlüsselten und authentifizierten Remotezugriff bereit, ohne den Overhead eines vollständigen VPNs.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":362,"prompt":"Welches Routingprotokoll wird am häufigsten zur Verbindung von WANs verwendet?","options":[["A","IGP"],["B","EIGRP"],["C","BGP"],["D","OSPF"]],"answers":["C"],"explanation":"BGP ist das verbreitete Exterior-Gateway-Protokoll für den Austausch von Routinginformationen zwischen autonomen Systemen und wird häufig bei WAN-/Provider-Verbindungen eingesetzt.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":363,"prompt":"Ein Serveradministrator stellt einen neuen Webserver mit der IP-Adresse 192.168.16.100 bereit. Die Sicherheitsrichtlinie verlangt, dass alle unsicheren Verbindungsmethoden blockiert werden. Welche Regel erfüllt dies, ohne anderen Verkehr zu verbieten?","options":[["A","Deny any 192.168.16.0 255.255.255.0 80"],["B","Deny 192.168.16.100 255.255.255.255 any"],["C","Deny any 192.168.16.100 255.255.255.255 80"],["D","Permit any 192.168.16.100 255.255.255.255 80"],["E","Permit 192.168.16.100 255.255.255.255 any"]],"answers":["C"],"explanation":"Durch das gezielte Blockieren von Port 80 zum Server wird unverschlüsseltes HTTP verhindert, während anderer Verkehr einschließlich HTTPS auf Port 443 weiterhin möglich bleibt.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":364,"prompt":"Welcher Port sollte für eine sichere Dateiübertragung verwendet werden?","options":[["A","22"],["B","69"],["C","80"],["D","3389"]],"answers":["A"],"explanation":"Port 22 wird für SSH-basierte Dateiübertragungen wie SFTP oder SCP verwendet und verschlüsselt die Daten während der Übertragung.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":365,"prompt":"Ein Unternehmen meldet, dass sein Faxgerät beim Senden keinen Wählton mehr erhält. Das Telefonkabel ist an einem Ende beschädigt. Welchen Steckertyp sollte ein Techniker ersetzen?","options":[["A","F-Type"],["B","RJ45"],["C","SC"],["D","RJ11"]],"answers":["D"],"explanation":"RJ11 ist der typische Stecker für analoge Telefonleitungen und damit auch für klassische Faxgeräte.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":366,"prompt":"Ein Netzwerktechniker installiert einen neuen Access-Layer-Switch, der STP nicht unterstützt, möchte aber eine redundante Verbindung zum Distribution-Switch. Welche Lösung sollte verwendet werden?","options":[["A","Link Aggregation"],["B","Subinterfaces"],["C","Switch Virtual Interfaces"],["D","Half-Duplex-Verbindungen"]],"answers":["A"],"explanation":"Link Aggregation bündelt mehrere physische Ports zu einer logischen Verbindung und bietet damit Redundanz und zusätzliche Bandbreite, ohne separate Layer-2-Pfade zu erzeugen.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":367,"prompt":"Ein Unternehmen hat Arbeitsplätze umgestellt und Benutzer an zuvor genutzte Plätze versetzt. Alle umgezogenen Benutzer haben Verbindungsprobleme. Was ist die wahrscheinlichste Ursache?","options":[["A","Ports sind Error-Disabled."],["B","Ports haben ein falsches Native VLAN."],["C","Ports haben ein MDIX-Problem."],["D","Ports sind als Trunk-Ports konfiguriert."]],"answers":["A"],"explanation":"Wenn Port Security zuvor die MAC-Adressen der früheren Arbeitsplatzgeräte gelernt hat, lösen die umgezogenen Rechner mit neuen MAC-Adressen eine Verletzung aus. Bei der üblichen Shutdown-Aktion wechseln die Ports in den Zustand error-disabled.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":368,"prompt":"Ein neu eröffneter Laden verwendet neue Tablets, PCs und Drucker sowie ältere Kartenlesegeräte. Welcher WLAN-Verschlüsselungsmodus ist am sichersten und zugleich kompatibel?","options":[["A","WPA3"],["B","WPA2"],["C","WPA2/WPA3 Mixed Mode"],["D","WPA/WPA2 Mixed Mode"]],"answers":["C"],"explanation":"WPA2/WPA3 Mixed Mode ermöglicht modernen Geräten WPA3, während ältere Geräte weiterhin WPA2 verwenden können.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":369,"prompt":"Ein Netzwerkadministrator hat einen externen DNS-Eintrag auf einen neuen Server umgestellt. Welches Tool sollte er verwenden, um die neue Konfiguration zu testen?","options":[["A","ping"],["B","tracert"],["C","tcpdump"],["D","nslookup"]],"answers":["D"],"explanation":"Mit nslookup kann überprüft werden, ob der Hostname nun auf die korrekte neue IP-Adresse aufgelöst wird.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":370,"prompt":"Ein Unternehmen erweitert sich um eine weitere Etage. Ein neuer Switch wird mit denselben VLANs wie der vorhandene Stack konfiguriert. Sobald er angeschlossen wird, verlieren alle Benutzer die Verbindung. Was ist die wahrscheinlichste Ursache?","options":[["A","Ungenutzte Ports des neuen Switches sind deaktiviert."],["B","Der neue Switch hat kein Standardgateway."],["C","Der neue Switch ist an einen Access-Port angeschlossen."],["D","Der neue Switch befindet sich in einer Spanning-Tree-Schleife."]],"answers":["D"],"explanation":"Durch den Anschluss wurde wahrscheinlich eine Layer-2-Schleife erzeugt, die zu einem Broadcast-Sturm und damit zum Ausfall der Konnektivität führt.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":371,"prompt":"Was ist der wahrscheinlichste Vorteil, Servergeräte in einem Rack zu installieren?","options":[["A","Einfachere Fehlerbehebung"],["B","Geringerer Stromverbrauch"],["C","Höhere Netzwerkleistung"],["D","Höhere Compute-Dichte"]],"answers":["D"],"explanation":"Racks ermöglichen die vertikale und platzsparende Installation vieler Server und erhöhen damit die Rechendichte pro Stellfläche.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":372,"prompt":"Ein Techniker installiert ein neues SD-WAN-Gerät mit Standardkonfiguration. Das Gerät muss zunächst eine URL im Internet erreichen, um seine Zero-Touch-Konfiguration abzurufen. Über welches VLAN erfolgt dieser erste Datenzugang typischerweise?","options":[["A","Voice VLAN"],["B","Native VLAN"],["C","Data VLAN"],["D","Trunk Port"]],"answers":["C"],"explanation":"Für den anfänglichen Internetzugang verwendet das Gerät das normale Data VLAN. Darüber erreicht es den Bereitstellungsdienst und lädt anschließend seine endgültige SD-WAN-Konfiguration.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":373,"prompt":"Benutzer können Internetseiten nicht über URLs aufrufen. Ping-Tests zeigen, dass der Zugriff per IP-Adresse funktioniert. Welches Tool sollte der Techniker als Nächstes verwenden?","options":[["A","tcpdump"],["B","tracert"],["C","nmap"],["D","dig"]],"answers":["D"],"explanation":"dig fragt DNS direkt ab und hilft festzustellen, warum Namensauflösung fehlschlägt, obwohl die IP-Konnektivität funktioniert.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":374,"prompt":"Welcher Bestandteil eines Disaster-Recovery-Plans hilft zu bestimmen, welche kritischen Systeme nach einem Vorfall zuerst wiederhergestellt werden müssen?","options":[["A","RTO"],["B","SLA"],["C","MTBF"],["D","SIEM"]],"answers":["A"],"explanation":"Der Recovery Time Objective legt fest, wie schnell ein System nach einem Ausfall wieder verfügbar sein muss. Systeme mit besonders kurzem RTO erhalten dadurch höhere Wiederherstellungspriorität.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":375,"prompt":"Welcher VPN-Typ reduziert den Bandbreitenbedarf des Unternehmensnetzwerks am besten?","options":[["A","Split Tunnel"],["B","Site-to-Site"],["C","Full-Tunnel-Client"],["D","GRE Tunnel"]],"answers":["A"],"explanation":"Beim Split Tunnel wird nur Unternehmensverkehr durch das VPN geleitet; normaler Internetverkehr geht direkt ins Internet und belastet die zentrale Verbindung nicht.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":376,"prompt":"Ein ISP stellt einem Unternehmen ein vorkonfiguriertes Modem und fünf öffentliche statische IP-Adressen bereit. Welche zwei Angaben benötigt die Firewall für den Internetzugang? (Wähle zwei.)","options":[["A","NTP-Server"],["B","Standardgateway"],["C","IP-Adresse des Modems"],["D","Eine statische IP-Adresse"],["E","DNS-Server"],["F","DHCP-Server"]],"answers":["B","D"],"explanation":"Das WAN-Interface der Firewall benötigt eine der öffentlichen statischen IP-Adressen und das Standardgateway des ISP, um ausgehenden Verkehr weiterzuleiten.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":377,"prompt":"Bei einer Sicherheitsbewertung versucht ein Prüfer, Benutzerzugangsdaten zu erhalten, indem er sich als Mitarbeiter des Helpdesks ausgibt. Welcher Angriff wird verwendet?","options":[["A","Social Engineering"],["B","Tailgating"],["C","Shoulder Surfing"],["D","Smishing"],["E","Evil Twin"]],"answers":["A"],"explanation":"Das Täuschen und Manipulieren von Personen, um vertrauliche Informationen zu erhalten, ist Social Engineering.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":378,"prompt":"Welches dynamische Routingprotokoll wird im Internet verwendet?","options":[["A","EIGRP"],["B","BGP"],["C","RIP"],["D","OSPF"]],"answers":["B"],"explanation":"BGP ist das Standardprotokoll für den Routenaustausch zwischen autonomen Systemen im Internet.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":379,"prompt":"Ein Techniker installiert ein neues SD-WAN-Gerät mit Standardkonfiguration, erhält eine URL per E-Mail und verbindet das Gerät mit dem Internet, um die Installation automatisch abzuschließen. Wofür ist dies ein Beispiel?","options":[["A","SASE-Geräteinstallation"],["B","Zero-Touch Provisioning"],["C","Infrastructure as Code"],["D","Configuration Management"]],"answers":["B"],"explanation":"Bei Zero-Touch Provisioning ruft ein neues Gerät seine Konfiguration automatisch nach dem erstmaligen Verbinden mit dem Netz ab, ohne manuelle lokale Einrichtung.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":381,"prompt":"Welche der folgenden Möglichkeiten würde es einem Netzwerkadministrator erlauben, von einer gemeinsam genutzten, abgesicherten Arbeitsstation aus remote auf ein geschütztes Subnetz zuzugreifen?","options":[["A","SSH durch die Firewall erlauben."],["B","Sich über ein In-Band-Modem einwählen."],["C","Die Verbindung über einen Jump Host herstellen."],["D","Ein Site-to-Site-VPN konfigurieren."]],"answers":["C"],"explanation":"Ein Jump Host (Bastion Host) dient als kontrollierte Zwischenstation, über die Administratoren von einer gemeinsam genutzten Arbeitsstation aus sicher auf ein geschütztes Subnetz zugreifen können.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":382,"prompt":"Welche der folgenden Arten gezielter Angriffe verwendet mehrere Computer oder Bots, um wiederholt dieselbe Ressource anzufordern?","options":[["A","On-Path-Angriff"],["B","DDoS"],["C","ARP-Spoofing"],["D","MAC-Flooding"]],"answers":["B"],"explanation":"Bei einem Distributed-Denial-of-Service-Angriff (DDoS) wird ein Ziel von mehreren Systemen gleichzeitig mit wiederholten Anfragen überflutet. Dadurch wird die Ressource überlastet und der Dienst gestört oder nicht mehr erreichbar.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":383,"prompt":"Welche der folgenden Möglichkeiten ist die kostengünstigste Methode, um die Anzahl der Steckdosen in einem IDF sicher zu erweitern?","options":[["A","PDU"],["B","Überspannungsschutz"],["C","UPS"],["D","Steckdosenleiste"]],"answers":["A"],"explanation":"Eine rackmontierte PDU (Power Distribution Unit) stellt zusätzliche Steckdosen für Geräte im IDF bereit und unterstützt dabei eine geeignete Lastverteilung und Absicherung. Damit ist sie hier die kostengünstigste sichere Lösung.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":384,"prompt":"Ein Netzwerkadministrator erstellt ein Subnetz, das 45 einzelne Hosts in einem kleinen privaten Netzwerk innerhalb einer großen Netzwerkarchitektur aufnehmen soll. Welche der folgenden Optionen nutzt die Netzwerkadressen bei der Zuweisung dieses Netzes am effizientesten?","options":[["A","10.0.50.128/25"],["B","10.7.142.128/27"],["C","10.152.4.192/26"],["D","10.192.1.64/28"]],"answers":["C"],"explanation":"Ein /26-Subnetz bietet 62 nutzbare Hostadressen. Das reicht für 45 Hosts aus und verschwendet im Vergleich zum größeren /25 weniger Adressen.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":385,"prompt":"Ein Netzwerktechniker behebt ein Problem zwischen einem Webserver und Computern innerhalb eines LANs. Er muss Informationen über die IP-Adressen, Protokolle und Inhalte des Datenverkehrs sammeln. Welche der folgenden Möglichkeiten hilft dem Techniker am besten bei der Fehlersuche?","options":[["A","Flow-Daten"],["B","SNMP-Traps"],["C","Paketmitschnitt"],["D","Serverprotokolle"]],"answers":["C"],"explanation":"Ein Paketmitschnitt (Packet Capture) zeichnet den tatsächlichen Netzwerkverkehr auf, einschließlich IP-Headern, Protokolldetails und Nutzdaten. Dadurch lässt sich genau analysieren, was gesendet und empfangen wird.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":386,"prompt":"Welche OSI-Schicht stellt mit TCP einen verbindungsorientierten und mit UDP einen verbindungslosen Übertragungsdienst bereit?","options":[["A","Bitübertragungsschicht"],["B","Vermittlungsschicht"],["C","Transportschicht"],["D","Anwendungsschicht"]],"answers":["C"],"explanation":"Die Transportschicht bietet mit TCP einen verbindungsorientierten und mit UDP einen verbindungslosen Dienst. UDP überträgt Datagramme ohne vorherigen Verbindungsaufbau.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":387,"prompt":"Welche der folgenden Schichten des OSI-Modells ist dafür verantwortlich, Verbindungen zwischen Knoten aufzubauen, aufrechtzuerhalten und zu beenden?","options":[["A","Bitübertragungsschicht"],["B","Vermittlungsschicht"],["C","Sitzungsschicht"],["D","Transportschicht"]],"answers":["C"],"explanation":"Die Sitzungsschicht (Session Layer) verwaltet Aufbau, Koordination und Abbau von Kommunikationssitzungen zwischen Anwendungen und übernimmt damit die Sitzungssteuerung unabhängig vom eigentlichen Datentransport.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":388,"prompt":"Welches der folgenden Protokolle wird üblicherweise mit TCP-Port 443 in Verbindung gebracht?","options":[["A","Telnet"],["B","SMTP"],["C","HTTPS"],["D","SNMP"]],"answers":["C"],"explanation":"HTTPS verwendet TCP-Port 443, um mit SSL/TLS verschlüsselte Webverbindungen aufzubauen und HTTP-Datenverkehr abzusichern.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":389,"prompt":"Ein Netzwerkingenieur konfiguriert einen neuen Server wie folgt: • IP-Adresse = 192.168.1.15 • Subnetzmaske = 255.255.255.0 • Gateway = 192.168.1.255 Der Server kann andere Hosts im selben Subnetz erreichen, jedoch keine Hosts in anderen Subnetzen. Welche der folgenden Einstellungen ist höchstwahrscheinlich falsch konfiguriert?","options":[["A","Subnetzmaske"],["B","Gateway"],["C","Standardroute"],["D","IP-Adresse"]],"answers":["B"],"explanation":"Das Gateway wurde auf 192.168.1.255 gesetzt. Bei einem /24-Netz ist dies die Broadcast-Adresse und keine gültige Hostadresse. Deshalb kann der Server Datenverkehr nicht über sein eigenes Subnetz hinaus routen.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":390,"prompt":"Ein Netzwerkadministrator muss eine Lösung implementieren, um den Zugriff auf das Internet zu filtern. Welche der folgenden Komponenten sollte der Administrator am ehesten einsetzen?","options":[["A","Router"],["B","Cloud-Gateway"],["C","Proxy"],["D","Intrusion Detection System"]],"answers":["C"],"explanation":"Ein Proxyserver vermittelt den Webverkehr und kann Richtlinien zur Inhalts- und URL-Filterung anwenden. Damit lässt sich steuern, auf welche Internetressourcen Benutzer zugreifen dürfen.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":391,"prompt":"Ein einzelner Benutzer der Finanzabteilung hat keinen Internetzugriff; andere Benutzer derselben Abteilung funktionieren. In seiner Ausgabe von route print fehlt ein Eintrag für 0.0.0.0 mit der Maske 0.0.0.0. Was ist die wahrscheinlichste Ursache?","options":[["A","Die Standardroute fehlt."],["B","Der Wert der Routenmetrik ist falsch."],["C","Die Schnittstelle verweist auf localhost."],["D","Das Standardgateway ist mit einer falschen Subnetzmaske konfiguriert."]],"answers":["A"],"explanation":"Der Eintrag 0.0.0.0/0 ist die IPv4-Standardroute. Ohne ihn kennt die Arbeitsstation für Ziele außerhalb ihrer lokalen und spezifisch eingetragenen Netze keinen nächsten Hop.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":392,"prompt":"Welche der folgenden Aussagen beschreibt, was passiert, wenn bei der Verwendung von UDP ein Paket während der Übertragung verloren geht?","options":[["A","Die Sicherungsschicht erkennt den Fehler und sendet das Paket erneut."],["B","IP verwendet das TTL-Feld, um die Hops des Pakets zu verfolgen, und sendet das Paket bei Bedarf erneut."],["C","Wenn der Absender keine UDP-Bestätigung erhält, wird das Paket erneut gesendet."],["D","Einige Anwendungen erkennen den Verlust und veranlassen bei Bedarf eine erneute Übertragung des Pakets."]],"answers":["D"],"explanation":"UDP ist ein verbindungsloses Protokoll nach dem Prinzip „Fire and Forget“ und besitzt weder Bestätigungen noch eine eingebaute Wiederholungsübertragung. Wenn eine zuverlässige Zustellung erforderlich ist, muss die Anwendung selbst diese Funktion übernehmen.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":393,"prompt":"Nachdem ein Netzwerkpraktikant einen Switch angeschlossen hat, verliert eine große Anzahl von Benutzern in einem Gebäude die Netzwerkverbindung. Welche der folgenden Ursachen ist am wahrscheinlichsten?","options":[["A","VTP-Update"],["B","Problem mit Port Security"],["C","LLDP-Fehlkonfiguration"],["D","Native-VLAN-Mismatch"]],"answers":["A"],"explanation":"Wenn der neue Switch einer VTP-Domäne mit einer höheren Konfigurations-Revisionsnummer beitritt, kann er seine möglicherweise leere oder falsche VLAN-Datenbank an andere Switches verteilen. Dadurch können vorhandene VLAN-Informationen überschrieben werden und zahlreiche Verbindungen ausfallen.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":394,"prompt":"Ein Netzwerkadministrator hat die Wireless Access Points aktualisiert und möchte eine Konfiguration einsetzen, die kompatiblen Geräten höhere Geschwindigkeit und weniger Kanalüberschneidungen bietet. Welche der folgenden Möglichkeiten erreicht dieses Ziel?","options":[["A","802.1X"],["B","MIMO"],["C","ESSID"],["D","Band Steering"]],"answers":["D"],"explanation":"Band Steering lenkt Dual-Band-fähige Clients bevorzugt in das 5-GHz-Band. Dieses bietet höheren Durchsatz und mehr nicht überlappende Kanäle, wodurch sich die Gesamtleistung verbessert.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":395,"prompt":"Ein Techniker installiert neue Netzwerkhardware in Niederlassungen eines Unternehmens. Die Bridge-Priorität muss korrekt eingestellt werden. Welche der folgenden Technologien sollte der Techniker konfigurieren?","options":[["A","Spanning Tree Protocol"],["B","Jumbo Frames"],["C","Perimeter Network"],["D","Port Security"]],"answers":["A"],"explanation":"Die Bridge Priority ist ein konfigurierbarer Parameter des Spanning Tree Protocol (STP) und wird zur Wahl der Root Bridge verwendet. Durch Anpassen der Priorität kann festgelegt werden, welcher Switch als Root Bridge dienen soll.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":396,"prompt":"Welche der folgenden Technologien sollte ein Unternehmen implementieren, damit alle Mitarbeiter im Büro gemeinsam eine einzige IP-Adresse verwenden können?","options":[["A","STP"],["B","BGP"],["C","PAT"],["D","VXLAN"]],"answers":["C"],"explanation":"Port Address Translation (PAT) ermöglicht mehreren internen Hosts, eine einzige externe IP-Adresse zu teilen. Die einzelnen Sitzungen werden über unterschiedliche Quellportnummern voneinander unterschieden.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":397,"prompt":"Was ist der größte Vorteil eines Cold DR Site gegenüber anderen Disaster-Recovery-Standorten?","options":[["A","Redundanz"],["B","Verfügbarkeit"],["C","Sicherheit"],["D","Kosten"]],"answers":["D"],"explanation":"Ein Cold Site verursacht die geringsten laufenden Kosten, weil nur minimale Infrastruktur und Ressourcen vorgehalten werden, bis der Standort tatsächlich aktiviert werden muss.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":398,"prompt":"Ein Netzwerkingenieur muss einen Access Point in einer Außenstelle bereitstellen, der nicht mit dem Wireless LAN Controller kommunizieren soll. Welche der folgenden Bereitstellungsmethoden muss verwendet werden?","options":[["A","ESSID"],["B","Lightweight"],["C","Autonomous"],["D","Ad hoc"]],"answers":["C"],"explanation":"Ein autonomer Access Point (auch „Fat AP“) arbeitet selbstständig und übernimmt seine Wireless-Funktionen lokal, ohne Steuerungsverkehr zu einem zentralen Wireless LAN Controller senden zu müssen.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":399,"prompt":"Ein Techniker möchte NAC in einer drahtlosen Umgebung testen. Welche der folgenden NAC-Techniken sollte für WLAN eingesetzt werden, wenn eine möglichst einfache Implementierung das wichtigste Kriterium ist?","options":[["A","Port Security"],["B","EAPoL"],["C","802.1X"],["D","MAC-Filterung"]],"answers":["D"],"explanation":"MAC-Filterung ist eine der einfachsten Möglichkeiten, den Zugriff auf ein WLAN zu kontrollieren, und damit die am leichtesten zu implementierende NAC-Methode in dieser Umgebung.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":400,"prompt":"Ein Junior-Netzwerkadministrator überprüft das Unternehmensnetzwerk und stellt fest, dass auf einer weitreichenden Mikrowellenverbindung die Anzahl der Eingabefehler kontinuierlich steigt. Welche der folgenden Ursachen ist am wahrscheinlichsten?","options":[["A","Das parabolische Signal ist falsch ausgerichtet."],["B","Das omnidirektionale Signal wird gestört."],["C","Das omnidirektionale Signal ist zu schwach für einen ordnungsgemäßen Empfang."],["D","Das parabolische Signal verwendet falsche Routingprotokolle."]],"answers":["A"],"explanation":"Weitreichende Mikrowellenverbindungen verwenden präzise ausgerichtete Parabolantennen. Bereits eine geringe Fehlausrichtung verschlechtert die Signalstärke und kann Eingabefehler verursachen.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":401,"prompt":"Ein Netzwerkadministrator möchte eine Geofencing-Richtlinie aktualisieren, um den Zugriff auf das Unternehmensnetzwerk abhängig vom Standort einzuschränken. Welche der folgenden Informationen wird der Administrator am ehesten verwenden?","options":[["A","MAC-Filterung"],["B","Administrative Distance"],["C","Bluetooth-Beacon-Signale"],["D","IP-Adressblöcke"]],"answers":["D"],"explanation":"Geofencing auf Netzwerkebene ordnet geografische Regionen häufig bestimmten Bereichen öffentlicher IP-Adressen zu. Zugriffsregeln können anschließend auf diese IP-Adressblöcke angewendet werden, um den Zugriff nach Standort einzuschränken.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":402,"prompt":"Welche der folgenden Technologien wird verwendet, um Inhalte über geografisch verteilte Edge-Server zu speichern und an Clients auszuliefern?","options":[["A","Load Balancer"],["B","CDN"],["C","DNS-Server"],["D","SAN"]],"answers":["B"],"explanation":"Ein Content Delivery Network (CDN) speichert Inhalte auf geografisch verteilten Edge-Servern zwischen und liefert sie von dort aus. Das reduziert die Latenz und entlastet den Ursprungsserver.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":403,"prompt":"Welcher der folgenden Steckverbinder ermöglicht es einem einzelnen QSFP-Transceiver, mehrere physische Verbindungen bereitzustellen?","options":[["A","RJ45"],["B","ST"],["C","LC"],["D","MPO"]],"answers":["D"],"explanation":"Ein MPO-Steckverbinder (Multi-Fiber Push-On) führt mehrere Glasfaserstränge in einem einzigen Gehäuse. Dadurch können die vier oder acht Übertragungskanäle eines QSFP in einzelne physische Verbindungen aufgeteilt werden.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":404,"prompt":"Ein Unternehmen ist besorgt darüber, dass unerlaubte Geräte eine Verbindung zum Netzwerk herstellen, und möchte deshalb eine Filterlösung implementieren. Welche Art der Filterung sollte das Netzwerkteam verwenden?","options":[["A","MAC"],["B","Inhalt"],["C","URL"],["D","IP"]],"answers":["A"],"explanation":"MAC-Filterung erlaubt oder blockiert Netzwerkgeräte anhand ihrer eindeutigen Hardwareadresse. Dadurch können nicht autorisierte beziehungsweise „rogue“ Geräte vom Netzwerkzugang ausgeschlossen werden.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":405,"prompt":"Ein Netzwerkadministrator gestaltet ein WLAN neu, in dem Unternehmens- und Gastbenutzer derzeit dieselbe SSID mit WPA2-PSK verwenden. Welche der folgenden Möglichkeiten sollten konfiguriert werden, um die Sicherheit zu verbessern? (Wähle zwei.)","options":[["A","Wi-Fi Protected Access"],["B","Neue SSID für Auftragnehmer/Gäste"],["C","Passwortauthentifizierung"],["D","Wired Equivalent Privacy"],["E","Captive Portal"],["F","Wi-Fi Protected Setup"]],"answers":["B","E"],"explanation":"Durch getrennte SSIDs lassen sich für Unternehmens- und Gastbenutzer unterschiedliche Sicherheitsrichtlinien wie Verschlüsselung, VLAN-Zuweisung und Firewallregeln anwenden. Dadurch wird verhindert, dass Gäste auf interne Ressourcen zugreifen. Ein Captive Portal ermöglicht eine browserbasierte Anmeldung beziehungsweise die Bestätigung von Nutzungsbedingungen, bevor Gastgeräte Netzwerkzugang erhalten. Das verbessert Kontrolle und Nachvollziehbarkeit.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":406,"prompt":"Ein Netzwerkadministrator migriert das vorhandene Telefonsystem auf VoIP. Der Anbieter verlangt ein separates Sprachnetzwerk, damit die Telefone funktionieren. Welche der folgenden Technologien sollte der Administrator für diese Konfiguration verwenden?","options":[["A","VLAN"],["B","VXLAN"],["C","VPN"],["D","VPC"]],"answers":["A"],"explanation":"Ein VLAN (Virtual LAN) teilt ein physisches Netzwerk in getrennte Broadcast-Domänen auf. Dadurch kann der Sprachverkehr in einem eigenen Voice-VLAN isoliert werden, während weiterhin dieselben physischen Switches verwendet werden.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":407,"prompt":"Computer A und Computer B hängen jeweils an Gi0/1 ihres Switches; beide Ports sind Access-Ports in VLAN 1.
