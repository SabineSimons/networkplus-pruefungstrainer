Die einzige aktive Verbindung zwischen den Switches ist Gi0/9, derzeit als Access-Port in VLAN 8. Gi0/10 ist Access VLAN 5 und administrativ deaktiviert. Welche Maßnahme stellt die Verbindung zwischen den Computern her?","options":[["A","Link Aggregation zwischen Switch A und Switch B auf Gi0/9 und Gi0/10 einrichten."],["B","Spanning Tree auf Switch A und Switch B konfigurieren."],["C","Eine Trunk-Verbindung zwischen Switch A und Switch B einrichten."],["D","Computer A und Computer B in dasselbe /24-Subnetz setzen."]],"answers":["C"],"explanation":"Der aktive Zwischen-Switch-Link überträgt als Access-Port nur VLAN 8 und damit nicht das VLAN 1 der beiden PCs. Ein Trunk zwischen den Switches kann VLAN 1 transportieren und stellt den gemeinsamen Layer-2-Pfad her.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":408,"prompt":"Welche der folgenden Maßnahmen schützt sensible Informationen in einem Netzwerk am unmittelbarsten?","options":[["A","Verschlüsselung von Daten während der Übertragung"],["B","Prinzip der geringsten Rechte"],["C","Rollenbasierte Zugriffskontrollen"],["D","Multifaktor-Authentifizierung"]],"answers":["A"],"explanation":"Die Verschlüsselung von Data in Transit schützt direkt die Vertraulichkeit sensibler Informationen, während sie über das Netzwerk übertragen werden. Angreifer können den Inhalt abgefangener Daten dadurch nicht ohne Weiteres lesen.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":409,"prompt":"Ein Benutzer kann eine Website nicht erreichen und möchte deren IP-Informationen überprüfen. Welches der folgenden Tools wird verwendet, um den autoritativen Server beziehungsweise dessen FQDN über DNS aufzulösen?","options":[["A","ipconfig"],["B","arp"],["C","nslookup"],["D","ping"]],"answers":["C"],"explanation":"Mit nslookup können DNS-Server direkt abgefragt werden. Das Tool kann unter anderem Namensauflösungen durchführen und Informationen über zuständige Nameserver anzeigen.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":410,"prompt":"Benutzer in einem Gebäude des Campusnetzwerks melden einen sehr langsamen Netzwerkzugriff. Ein Netzwerktechniker meldet sich am Router an, um nach Fehlern beim Datenverkehr zu und von diesem Gebäude zu suchen. Welchen der folgenden Befehle wird der Techniker höchstwahrscheinlich ausführen?","options":[["A","show arp"],["B","show config"],["C","show route"],["D","show interface"]],"answers":["D"],"explanation":"Der Befehl show interface zeigt detaillierte Statistiken der Router-Schnittstellen, darunter CRC-, Eingabe-/Ausgabe-und Kollisionsfehler. Diese Werte sind wichtig, um Leistungsprobleme auf der Verbindung zu dem Gebäude zu diagnostizieren.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":411,"prompt":"Welche der folgenden Vorgaben wird durch Gesetzgebung durchgesetzt?","options":[["A","AUP"],["B","GDPR"],["C","Verhaltenskodex"],["D","EULA"]],"answers":["B"],"explanation":"Die GDPR (General Data Protection Regulation / Datenschutz-Grundverordnung) ist ein verbindlicher Rechtsrahmen der Europäischen Union und gesetzlich durchsetzbar. Die anderen Optionen sind interne Regeln beziehungsweise vertragliche Vereinbarungen.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":412,"prompt":"Welche der folgenden Maßnahmen sollte im ersten Schritt der Fehlerbehebungsmethodik durchgeführt werden?","options":[["A","Tests durchführen, um Vermutungen zu überprüfen."],["B","Mehrere Probleme jeweils einzeln behandeln."],["C","Eine Theorie über die mögliche Ursache aufstellen."],["D","Einen Top-down-Ansatz verwenden."]],"answers":["B"],"explanation":"Der erste Schritt lautet Problem identifizieren. Dazu muss zunächst genau abgegrenzt werden, was nicht funktioniert. Treten mehrere Probleme auf, sollten sie einzeln behandelt werden, damit die Diagnose nicht verfälscht wird und die eigentliche Ursache korrekt eingegrenzt werden kann.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":413,"prompt":"Nachdem extrem hohe Temperaturen einen Stromausfall verursacht haben, fahren die Server automatisch herunter, obwohl die USVs der Server noch mehrere Stunden Akkulaufzeit besitzen. Welche der folgenden Maßnahmen sollte ein Techniker empfehlen?","options":[["A","Eine Notstromversorgung für die Klimaanlagen vorsehen."],["B","Türschlösser so konfigurieren, dass sie bei Stromausfall automatisch verriegeln."],["C","Die Akkukapazität der USVs erhöhen."],["D","Ein IoT-fähiges Thermostat hinzufügen."]],"answers":["A"],"explanation":"Wenn auch die Kühlung während eines Stromausfalls weiter mit Energie versorgt wird, steigt die Temperatur im Rechenzentrum nicht so stark an, dass die Server zum Selbstschutz herunterfahren, obwohl ihre eigenen USV-Akkus noch ausreichend geladen sind.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":414,"prompt":"Beim Bereitstellen einer neuen Gruppe von Computern in einem DHCP-Netzwerk stellt ein Netzwerkadministrator fest, dass die neuen Computer keine Verbindung zum Internet herstellen können. Welche der folgenden Ursachen ist am wahrscheinlichsten?","options":[["A","Falsches Standardgateway"],["B","Adresspool erschöpft"],["C","Doppelte IP-Adresse"],["D","Falsche Subnetzmaske"]],"answers":["A"],"explanation":"Wenn DHCP den Clients IP-Adressen zuweist, sie aber trotzdem keine externen Netzwerke erreichen, ist ein falsches oder fehlendes Standardgateway eine wahrscheinliche Ursache. Ohne ein korrektes Gateway existiert keine passende Route aus dem lokalen Subnetz heraus.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":415,"prompt":"Ein Netzwerktechniker entwirft ein LAN für einen neuen Standort. Das Unternehmen erwartet, dass sich mehr als 300 Geräte mit dem Netzwerk verbinden. Welche der folgenden Subnetzmasken stellt das effizienteste Subnetz bereit?","options":[["A","255.255.0.0"],["B","255.255.192.0"],["C","255.255.254.0"],["D","255.255.255.254"]],"answers":["C"],"explanation":"Ein /23-Subnetz (255.255.254.0) stellt 510 nutzbare Hostadressen bereit. Damit reicht es für mehr als 300 Geräte aus und verschwendet deutlich weniger Adressen als größere Netze wie /18 oder /16.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":416,"prompt":"Ein Netzwerkadministrator erhält die Meldung, dass eine 40-Gbit/s-Verbindung ausgelastet ist. Der einzige Server, der an diesem Standort zur Datenerfassung zur Verfügung steht, besitzt lediglich eine 10-Gbit/s-Verbindung zum Netzwerk. Welche Methode eignet sich auf diesem Server am besten, um die Ursache der Auslastung zu ermitteln?","options":[["A","Port Mirroring"],["B","Log-Aggregation"],["C","Flow-Daten"],["D","Paketmitschnitt"]],"answers":["C"],"explanation":"Durch das Exportieren von Flow-Daten wie NetFlow oder IPFIX vom 40-Gbit/s-Switch können Verkehrsmengen nach Quelle, Ziel und Anwendung analysiert werden, ohne den kompletten Datenverkehr mit voller Geschwindigkeit spiegeln oder aufzeichnen zu müssen. Das eignet sich besonders, wenn der Analyseserver nur über 10 Gbit/s angebunden ist.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":417,"prompt":"Ein Techniker ist beunruhigt, nachdem er mehr als 5.000 CRC-Fehler an einem Switchport festgestellt hat. Was sollte der Techniker als Nächstes tun?","options":[["A","Einen anderen Switchport verwenden."],["B","Auf errdisable prüfen."],["C","Das Patchkabel austauschen."],["D","Class of Service aktivieren."]],"answers":["C"],"explanation":"CRC-Fehler weisen häufig auf Probleme der Bitübertragungsschicht hin, etwa elektrische Störungen, beschädigte Kabel oder defekte Steckverbindungen. Eine naheliegende erste Maßnahme ist deshalb der Austausch des Patchkabels. Bleibt das Problem bestehen, können anschließend weitere Ursachen untersucht werden.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":418,"prompt":"Ein Netzwerkingenieur führt ipconfig aus und stellt fest, dass das Standardgateway 0.0.0.0 lautet. Welche der folgenden Adresstypen wird verwendet?","options":[["A","APIPA"],["B","Multicast"],["C","Klasse C"],["D","Experimental"]],"answers":["A"],"explanation":"Wenn ein Gerät keine gültige IP-Konfiguration von einem DHCP-Server erhält, kann es sich selbst eine APIPA-Adresse aus dem Bereich 169.254.0.0/16 zuweisen. APIPA stellt kein Standardgateway bereit, weshalb dort 0.0.0.0 angezeigt werden kann.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":419,"prompt":"Ein Netzwerkadministrator muss bei einem Kunden eine neue WLAN-Lösung bereitstellen. Alle externen Benutzer müssen Anmeldedaten eingeben, bevor sie Zugriff auf das WLAN erhalten. Welche der folgenden Lösungen erfüllt diese Anforderung am besten?","options":[["A","Die Frequenzbänder so einstellen, dass sie sich nicht überlappen."],["B","Lightweight Access Points einrichten."],["C","Enterprise-Authentifizierung aktivieren."],["D","Ein Captive Portal für das Gastnetz hinzufügen."]],"answers":["D"],"explanation":"Für externe beziehungsweise Gastbenutzer ist ein Captive Portal die passendste Lösung: Nach der Verbindung mit dem Gast-WLAN werden sie auf eine Anmeldeseite umgeleitet und müssen dort ihre Zugangsdaten eingeben. Enterprise-Authentifizierung eignet sich dagegen typischerweise für verwaltete interne Identitäten und Endgeräte.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":420,"prompt":"Ein Netzwerkingenieur fügt für eine neue Niederlassung einen Tunnel hinzu. Welche der folgenden Technologien stellt sicher, dass sämtliche Daten innerhalb des Tunnels verschlüsselt werden?","options":[["A","ESP"],["B","SSH"],["C","GRE"],["D","IKE"]],"answers":["A"],"explanation":"ESP (Encapsulating Security Payload) gehört zur IPsec-Protokollfamilie und übernimmt die Verschlüsselung und Authentifizierung der Daten im Tunnel. GRE stellt zwar Tunneling bereit, verschlüsselt die Daten jedoch nicht. IKE dient zur Einrichtung beziehungsweise zum Schlüsselaustausch für IPsec, während ESP die eigentlichen Nutzdaten schützt.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":421,"prompt":"Welche der folgenden Routingtechnologien verwendet eine Liste von Attributen für die Pfadauswahl?","options":[["A","BGP"],["B","RIP"],["C","EIGRP"],["D","OSPF"]],"answers":["A"],"explanation":"BGP (Border Gateway Protocol) verwendet verschiedene Pfadattribute, beispielsweise AS Path, Local Preference und MED, um den besten Pfad zu bestimmen. RIP nutzt dagegen die Hop-Anzahl, EIGRP eine zusammengesetzte Metrik und OSPF Kostenwerte.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":422,"prompt":"Ein Netzwerkadministrator konfiguriert ein Subnetz, das 13 nutzbare IP-Adressen unterstützen muss. Welche der folgenden Subnetzmasken erfüllt diese Anforderung am besten?","options":[["A","255.255.255.128"],["B","255.255.256.192"],["C","255.285.256.224"],["D","255.255.255.240"]],"answers":["D"],"explanation":"Die Maske 255.255.255.240 entspricht /28. Ein /28-Netz enthält 16 Adressen, davon 14 nutzbare Hostadressen, wenn Netzwerk- und Broadcast-Adresse abgezogen werden. Damit reicht es für 13 nutzbare IP-Adressen aus.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":423,"prompt":"Ein Systemadministrator installiert mehrere Webserver und möchte das First Hop Redundancy Protocol zur Steuerung des Routings zu den Servern verwenden. Welche Art von IP-Adresse sollte der Administrator für diesen Routingansatz einsetzen?","options":[["A","Virtuell"],["B","Gateway"],["C","Statisch"],["D","Dynamisch"]],"answers":["A"],"explanation":"First-Hop-Redundancy-Protokolle wie HSRP, VRRP oder GLBP verwenden eine gemeinsam genutzte virtuelle IP-Adresse. Hosts nutzen diese virtuelle Adresse als Standardgateway, sodass die Erreichbarkeit bestehen bleibt, wenn ein physischer Router ausfällt.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":424,"prompt":"Welches der folgenden Geräte eignet sich am besten, um Sicherheit und Filterung zwischen einem privaten und einem öffentlichen Netzwerk bereitzustellen?","options":[["A","Switch"],["B","Firewall"],["C","Bridge"],["D","Gateway"]],"answers":["B"],"explanation":"Eine Firewall wurde speziell dafür entwickelt, Sicherheitsrichtlinien durchzusetzen und den Datenverkehr zwischen unterschiedlichen Netzwerken, beispielsweise einem privaten internen Netzwerk und dem öffentlichen Internet, zu filtern.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":425,"prompt":"Ein Mitarbeiter besitzt einen neuen Laptop und meldet eine langsame Leistung bei der Nutzung des drahtlosen Netzwerks. In der vorherigen Nacht wurde die Switch-Firmware aktualisiert. Ein Netzwerkadministrator meldet sich am Switch an und sieht auf der Schnittstelle dieses Mitarbeiters unter anderem eine sehr hohe Anzahl von Kollisionen. Welche der folgenden Ursachen ist am wahrscheinlichsten?","options":[["A","Das Patchkabel von der Wanddose ist defekt."],["B","Die Bandbreite des Switchports muss erhöht werden."],["C","Multicast ist auf dem Switch falsch konfiguriert."],["D","Die Netzwerkkarte ist auf Half Duplex eingestellt."]],"answers":["D"],"explanation":"Die Schnittstellenstatistik zeigt 89.920 Kollisionen. Das ist ein deutlicher Hinweis auf einen Duplex-Mismatch. Wenn beispielsweise die Netzwerkkarte auf Half Duplex und der Switchport auf Full Duplex arbeitet, entstehen Kollisionen und deutliche Leistungsprobleme. Defekte Kabel verursachen eher CRC- oder Linkfehler.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":426,"prompt":"Wohin sollte ein Installateur bei der Montage von Geräten einen Port-Side Exhaust ausrichten?","options":[["A","Zum Patchpanel"],["B","Zur Vorderseite des IDF"],["C","Zum Warmgang"],["D","Zur Administratorkonsole"]],"answers":["C"],"explanation":"Geräte mit Port-Side Exhaust geben warme Abluft auf der Portseite ab. Diese Seite sollte deshalb zum Warmgang (Hot Aisle) ausgerichtet werden, damit das Hot-Aisle-/Cold-Aisle-Kühlkonzept korrekt funktioniert und Überhitzung vermieden wird.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":427,"prompt":"Welcher der folgenden Ports gehört zu einem sicheren Protokoll?","options":[["A","20"],["B","23"],["C","443"],["D","445"]],"answers":["C"],"explanation":"Port 443 wird von HTTPS verwendet. HTTPS verschlüsselt Webverkehr mit SSL/TLS. Port 20 gehört zu FTP, Port 23 zu Telnet und Port 445 zu SMB; diese sind nicht standardmäßig in derselben Weise als verschlüsseltes Webprotokoll abgesichert.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":428,"prompt":"Ein Ermittler untersucht einen Identitätsdiebstahl. Die betroffene Person erhielt am selben Tag eine RFID-geschützte Zahlungskarte, die auch an diesem Tag kompromittiert wurde. Nach eigener Aussage wurde die Karte nur in einem örtlichen Geschäft verwendet. Der Ermittler stellt fest, dass eine Videokamera im Geschäft so positioniert ist, dass Anmeldedaten beziehungsweise Zahlungsinformationen von Kunden beim Bezahlen beobachtet werden können. Welche Social-Engineering-Technik beschreibt dies am besten?","options":[["A","Shoulder Surfing"],["B","Impersonation"],["C","Vishing"],["D","Tailgating"]],"answers":["A"],"explanation":"Bei Shoulder Surfing werden vertrauliche Informationen wie PINs, Passwörter oder Kartendaten durch Beobachtung ausgespäht. Das kann direkt über die Schulter oder auch über Überwachungskameras erfolgen. Die anderen Optionen bezeichnen Identitätsvortäuschung, Sprach-Phishing beziehungsweise unbefugtes physisches Folgen in einen geschützten Bereich.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":429,"prompt":"Welche der folgenden Komponenten kann Netzwerkgeräte vor Spannungsschwankungen schützen?","options":[["A","MDF"],["B","Steckdosenleisten"],["C","PDU"],["D","UPS"]],"answers":["D"],"explanation":"Eine UPS/USV (Uninterruptible Power Supply) schützt Geräte vor Spannungsschwankungen wie Überspannungen, Spannungseinbrüchen und Stromausfällen. Sie stellt außerdem Batteriestrom bereit und kann die Versorgung stabilisieren. MDF und PDU dienen anderen Zwecken; eine normale Steckdosenleiste bietet keinen entsprechenden Schutz.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":430,"prompt":"Welche der folgenden Lösungen sollte ein Junior-Sicherheitsadministrator empfehlen, um bösartige Netzwerkaktivitäten einzudämmen?","options":[["A","IPS"],["B","Honeypot"],["C","SIEM"],["D","VPN"]],"answers":["A"],"explanation":"Ein IPS (Intrusion Prevention System) überwacht Netzwerkverkehr, erkennt schädliche Aktivitäten und kann diese aktiv blockieren. Ein Honeypot dient eher der Ablenkung und Analyse, ein SIEM sammelt und korreliert Ereignisse, und ein VPN schützt primär die Datenübertragung.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":431,"prompt":"Ein Unternehmen verwendet eine Lösung, die das Passwort regelmäßig wechselt, mit dem Ingenieure auf kritische Systeme zugreifen. Welche der folgenden Optionen beschreibt diese Lösung am besten?","options":[["A","Network Access Control"],["B","TACACS+"],["C","Schlüssel-/Credential-Management"],["D","Multifaktor-Authentifizierung"]],"answers":["C"],"explanation":"Key Management umfasst das Erstellen, Verteilen, Rotieren und Widerrufen von Zugangsdaten, Schlüsseln und Zertifikaten. Das regelmäßige Rotieren von Passwörtern für kritische Systeme ist eine solche Funktion.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":432,"prompt":"Welche der folgenden Lösungen hält Geräte bei einem Stromausfall am besten in Betrieb?","options":[["A","UPS/USV"],["B","Power Load"],["C","PDU"],["D","Spannung"]],"answers":["A"],"explanation":"Eine USV (UPS) liefert bei Ausfall der Netzversorgung Batteriestrom und verhindert damit sofortige Abschaltungen und Datenverlust.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":433,"prompt":"Ein Netzwerkingenieur muss Kabel bestellen, um zwei Gebäude innerhalb derselben Stadt miteinander zu verbinden. Welches Medium sollte er verwenden?","options":[["A","Koaxialkabel"],["B","Twinaxialkabel"],["C","Singlemode-Glasfaser"],["D","Cat 5"]],"answers":["C"],"explanation":"Singlemode-Glasfaser eignet sich wegen geringer Dämpfung und hoher Bandbreite besonders für große Entfernungen zwischen Gebäuden.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":434,"prompt":"Ein Serveradministrator muss dem DNS-Server des Unternehmens einen Eintrag hinzufügen, um den Besitz einer Webdomain nachzuweisen. Name und Wert des Eintrags liegen vor. Welchen Record-Typ sollte er verwenden?","options":[["A","TXT"],["B","A"],["C","PTR"],["D","CNAME"]],"answers":["A"],"explanation":"Ein TXT-Record kann beliebige Textwerte speichern und wird häufig zur Domain-Verifizierung sowie für SPF, DKIM oder DMARC verwendet.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":435,"prompt":"Ein Netzwerktechniker untersucht die Verbindung zur Unternehmenswebsite. Der Befehl traceroute zeigt nur den ersten Hop; danach erscheinen Sternchen. Was sollte der Techniker tun, um den Pfad zum Server zu ermitteln beziehungsweise die Ursache zu prüfen?","options":[["A","Die ACL des Routers überprüfen."],["B","netstat ausführen."],["C","nslookup durchführen."],["D","LDP aktivieren."]],"answers":["A"],"explanation":"Sternchen nach dem ersten Hop deuten häufig darauf hin, dass Zwischenrouter die für traceroute benötigten ICMP-Time-Exceeded-Meldungen blockieren. Eine ACL kann dafür verantwortlich sein.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":436,"prompt":"Eine schwere Naturkatastrophe trifft den Hauptsitz eines Unternehmens und verursacht erhebliche Schäden und Datenverlust. Das Unternehmen muss den Betrieb möglichst schnell wieder aufnehmen. Was muss ein Netzwerkadministrator zuerst tun?","options":[["A","Eine Schadensbewertung durchführen."],["B","Zum Cold Site wechseln."],["C","Kunden über die Katastrophe informieren."],["D","Einen Kommunikationsplan erstellen."]],"answers":["A"],"explanation":"Zuerst muss das Ausmaß der Schäden an Systemen, Infrastruktur und Daten ermittelt werden. Erst danach lässt sich entscheiden, welche Wiederherstellungsmaßnahmen notwendig sind.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":437,"prompt":"Nach der Installation eines neuen Wireless Access Points stellt ein Ingenieur fest, dass das Gerät nicht die angegebene Geschwindigkeit erreicht. Welche Maßnahmen sollte er zur Fehlersuche durchführen? (Wähle zwei.)","options":[["A","Prüfen, ob andere Netzwerkgeräte einen Engpass verursachen."],["B","Die neueste Firmware installieren."],["C","Ein neues VLAN für den Access Point erstellen."],["D","Sicherstellen, dass die SSID nicht länger als 16 Zeichen ist."],["E","Den AP in den autonomen Modus versetzen."],["F","Einen Wireless LAN Controller installieren."]],"answers":["A","B"],"explanation":"Ein Engpass an Uplinks oder Switches kann die WLAN-Leistung begrenzen. Außerdem können Firmware-Updates Leistungs- und Kompatibilitätsprobleme beheben.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":438,"prompt":"Nach einer Unternehmensfusion muss ein Netzwerkadministrator Referenzdokumentation für eine Infrastruktur verschiedener Hersteller erstellen. Welches Protokoll liefert dafür passende Informationen?","options":[["A","ICMP"],["B","CDP"],["C","LLDP"],["D","SIP"]],"answers":["C"],"explanation":"LLDP ist herstellerneutral und übermittelt Informationen zu Identität, Fähigkeiten und Nachbargeräten. Damit eignet es sich für Multivendor-Umgebungen.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":439,"prompt":"Welcher Schritt der Fehlerbehebungsmethodik beinhaltet am ehesten das Gespräch mit einem Benutzer, der ein Ticket eröffnet hat?","options":[["A","Vollständige Systemfunktion überprüfen."],["B","Theorie zur wahrscheinlichen Ursache aufstellen."],["C","Problem identifizieren."],["D","Lösung implementieren."]],"answers":["C"],"explanation":"Beim Identifizieren des Problems werden Symptome, Umstände und weitere Details beim betroffenen Benutzer erfragt.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":440,"prompt":"Wie kann ein Netzwerkadministrator am kostengünstigsten eine dauerhafte, sichere Verbindung zwischen zwei Standorten herstellen?","options":[["A","Site-to-Site-VPN"],["B","GRE-Tunnel"],["C","VXLAN"],["D","Dedizierte Leitung"]],"answers":["A"],"explanation":"Ein Site-to-Site-VPN nutzt das öffentliche Internet für eine verschlüsselte Verbindung zwischen Standorten und ist in der Regel deutlich günstiger als eine dedizierte Leitung.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":441,"prompt":"Ein Netzwerktechniker richtet auf der Etage der Buchhaltung einen Computer für einen Benutzer aus dem Marketing ein. Der Benutzer kann auf das Internet zugreifen, aber nicht auf die freigegebenen Laufwerke des Marketings. Was ist die wahrscheinlichste Ursache?","options":[["A","Duplex-Mismatch am Switchport"],["B","Falsch konfiguriertes Gateway"],["C","Falsche VLAN-Zuweisung"],["D","SVI hat die falsche IP-Adresse"]],"answers":["C"],"explanation":"Der Computer befindet sich wahrscheinlich im VLAN der Buchhaltung statt im Marketing-VLAN. Internetzugriff kann trotzdem funktionieren, während der Zugriff auf abteilungsspezifische Ressourcen fehlt.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":442,"prompt":"Ein Netzwerkadministrator hostet eine lokale Anwendung auf einem Typ-2-Hypervisor. Die Anwendung ist ausschließlich vom Hostcomputer aus erreichbar. Welche Art von Adresse wird der Administrator höchstwahrscheinlich verwenden?","options":[["A","Öffentlich"],["B","Loopback"],["C","Privat"],["D","APIPA"]],"answers":["B"],"explanation":"Eine nur lokal erreichbare Anwendung wird typischerweise über die Loopback-Adresse 127.0.0.1 beziehungsweise localhost angesprochen.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":443,"prompt":"Ein Netzwerkmanager verbindet zwei Switches mit zwei parallelen Links. Welche Konfiguration verhindert Layer-2-Schleifen?","options":[["A","802.1Q-Tagging"],["B","Full Duplex"],["C","Link Aggregation"],["D","QoS"]],"answers":["C"],"explanation":"Link Aggregation fasst mehrere physische Leitungen zu einer logischen Verbindung zusammen. So entstehen durch die parallelen Links keine separaten Layer-2-Pfade, die eine Schleife bilden würden.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":444,"prompt":"Welche Remote-Verbindungsmethode wird verwendet, wenn Daten- und Managementverkehr dieselbe Netzwerkinfrastruktur nutzen?","options":[["A","In-Band"],["B","Native VLAN"],["C","Full-Tunnel"],["D","Site-to-Site"]],"answers":["A"],"explanation":"Bei In-Band-Management wird derselbe Netzwerkpfad für normalen Datenverkehr und Managementzugriffe verwendet.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":445,"prompt":"Welcher Schritt der Fehlerbehebungsmethodik umfasst am ehesten den Vergleich aktueller Durchsatztests mit einer Baseline?","options":[["A","Lösung implementieren."],["B","Vollständige Systemfunktion überprüfen."],["C","Ergebnisse dokumentieren."],["D","Theorie testen."]],"answers":["D"],"explanation":"Der Vergleich mit einer Baseline dient dazu, eine vermutete Ursache zu bestätigen oder auszuschließen und gehört damit zum Testen der Theorie.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":446,"prompt":"Welche der folgenden Tabellen verwendet das Longest Prefix Match, um eine Ausgangsschnittstelle zu bestimmen?","options":[["A","ARP-Tabelle"],["B","MAC-Adresstabelle"],["C","Routingtabelle"],["D","Netstat-Tabelle"]],"answers":["C"],"explanation":"Router verwenden in der Routingtabelle den spezifischsten passenden Präfix, also das Longest Prefix Match, um den nächsten Pfad beziehungsweise die Ausgangsschnittstelle auszuwählen.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":447,"prompt":"Ein Netzwerkadministrator muss sich für Verwaltungszwecke sicher mit einem Ubuntu-Server verbinden. Welches Protokoll erfüllt diese Anforderung am ehesten?","options":[["A","HTTPS"],["B","SFTP"],["C","RDP"],["D","SSH"]],"answers":["D"],"explanation":"SSH ist das Standardprotokoll für sicheren interaktiven Remote-Zugriff auf Linux-Systeme wie Ubuntu.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":448,"prompt":"Welche der folgenden Technologien ermöglicht eine interaktive und sichere Remote-Verwaltung eines Netzwerk-Infrastrukturgeräts?","options":[["A","SSH"],["B","VNC"],["C","RDP"],["D","SNMP"]],"answers":["A"],"explanation":"SSH stellt einen verschlüsselten interaktiven Kommandozeilenzugriff auf Router, Switches und andere Netzwerkgeräte bereit.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":449,"prompt":"Nach einer unternehmensweiten Phishing-Sensibilisierung stellt das Cybersecurity-Team fest, dass zusätzliche Schutzmaßnahmen beim Zugriff der Benutzer auf potenziell schädliche Websites erforderlich sind. Welche Maßnahme eignet sich am besten?","options":[["A","DNS-Filterung implementieren."],["B","ACLs so aktualisieren, dass nur HTTPS erlaubt ist."],["C","Neue IPS-Hardware konfigurieren."],["D","802.1X-Sicherheitsfunktionen einsetzen."]],"answers":["A"],"explanation":"DNS-Filterung verhindert die Namensauflösung bekannter schädlicher Domains und kann Benutzer dadurch bereits vor dem Aufruf von Phishing- oder Malware-Seiten schützen.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":450,"prompt":"Bei einem Sicherheitsaudit stellt eine Beratungsfirma Abweichungen zwischen Dokumentation und tatsächlicher Umgebung fest. Welche der folgenden Möglichkeiten kann festhalten, wer Änderungen vorgenommen hat und welche Änderungen durchgeführt wurden?","options":[["A","Network Access Control"],["B","Configuration Monitoring"],["C","Zero Trust"],["D","Syslog"]],"answers":["B"],"explanation":"Configuration Monitoring erfasst Konfigurationsstände und Änderungen an Geräten. Mit Änderungsprotokollen und zugeordneten Benutzerkonten lässt sich nachvollziehen, wer welche Änderung vorgenommen hat; NAC kontrolliert dagegen primär den Netzwerkzugang von Endgeräten.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":451,"prompt":"Welche der folgenden Bezeichnungen beschreibt eine schädliche Anwendung beziehungsweise schädlichen Code, der eine Softwareschwachstelle ausnutzt?","options":[["A","Risiko"],["B","Schwachstelle"],["C","Exploit"],["D","Bedrohung"]],"answers":["C"],"explanation":"Ein Exploit nutzt gezielt eine vorhandene Schwachstelle aus, um nicht autorisierte Aktionen auszuführen.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":452,"prompt":"Welche der folgenden Technologien ermöglicht es einem normalen Benutzer, sich mit einem einzigen Konto bei mehreren Ressourcen anzumelden?","options":[["A","RADIUS"],["B","MFA"],["C","TACACS+"],["D","SSO"]],"answers":["D"],"explanation":"Single Sign-On (SSO) erlaubt eine einmalige Anmeldung und anschließend den Zugriff auf mehrere Systeme oder Anwendungen ohne erneute Anmeldung bei jeder einzelnen Ressource.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":453,"prompt":"Welche der folgenden Eigenschaften beschreibt die Fähigkeit eines Cloud-Dienstes, Ressourcen bei Bedarf dynamisch anzupassen?","options":[["A","Elastizität"],["B","Multitenancy"],["C","Container"],["D","Skalierbarkeit"]],"answers":["A"],"explanation":"Elastizität bezeichnet das automatische Hinzufügen oder Entfernen von Cloud-Ressourcen abhängig von der aktuellen Nachfrage.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":454,"prompt":"Der CISO eines Unternehmens verlangt, dass Server und Firewalls beim Erstellen von Protokolldateien genaue Zeitstempel verwenden, damit Sicherheitsanalysten Ereignisse bei Untersuchungen miteinander korrelieren können. Was sollte implementiert werden?","options":[["A","Syslog-Server"],["B","SMTP"],["C","NTP"],["D","SNMP"]],"answers":["C"],"explanation":"NTP (Network Time Protocol) synchronisiert die Uhren von Netzwerkgeräten und sorgt damit für konsistente Zeitstempel in Protokolldateien.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":455,"prompt":"Welcher der folgenden Steckverbindertypen wird am häufigsten mit WLAN-Antennen in Verbindung gebracht?","options":[["A","BNC"],["B","SFP"],["C","MPO"],["D","RJ45"]],"answers":["A"],"explanation":"BNC ist ein HF-Koaxialstecker und unter den angebotenen Antworten der einzige typische Antennenanschluss. SFP und MPO gehören zu Netzwerk-/Glasfaserverbindungen, RJ45 zu Twisted-Pair-Ethernet.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":456,"prompt":"Ein Unternehmen hat kürzlich einen neuen Computer mit dem LAN verbunden. Der Benutzer kann das Standardgateway nicht anpingen. Der Techniker sieht in der Konfiguration eine selbst zugewiesene IP-Adresse. Was ist die wahrscheinlichste Ursache?","options":[["A","Der DHCP-Server ist nicht verfügbar."],["B","Eine RFC1918-Adresse wird verwendet."],["C","Der TCP/IP-Stack ist deaktiviert."],["D","Eine statische IP-Adresse ist zugewiesen."]],"answers":["A"],"explanation":"Eine selbst zugewiesene APIPA-Adresse aus 169.254.0.0/16 weist darauf hin, dass der Client keinen DHCP-Server erreichen und deshalb keine reguläre DHCP-Adresse beziehen konnte.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":457,"prompt":"Ein Netzwerkadministrator untersucht ein Verbindungsproblem zwischen zwei Geräten in unterschiedlichen Subnetzen. Beide Geräte können jeweils andere Geräte im eigenen Subnetz erfolgreich anpingen. Was ist die wahrscheinlichste Ursache?","options":[["A","Falsches Standardgateway"],["B","Defektes Ethernetkabel"],["C","Falsche Duplex-Einstellungen"],["D","VLAN-Mismatch"]],"answers":["A"],"explanation":"Lokale Kommunikation funktioniert, aber Kommunikation zwischen Subnetzen benötigt Routing über das Standardgateway. Eine falsche Gateway-Konfiguration passt daher zu den beschriebenen Symptomen.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":458,"prompt":"Ein Netzwerktechniker möchte einen neu gekauften kommerziellen Switch härten. Welche Hardening-Maßnahme schützt am besten gegen die Nutzung öffentlich bekannter Informationen?","options":[["A","Standardpasswort ändern."],["B","Eingehende SSH-Verbindungen blockieren."],["C","Gateway aus der Netzwerkkonfiguration entfernen."],["D","Physischen Zugriff auf den Switch einschränken."]],"answers":["A"],"explanation":"Herstellerseitige Standardzugangsdaten sind häufig öffentlich bekannt. Das sofortige Ändern des Standardpassworts beseitigt dieses direkte Risiko.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":459,"prompt":"Ein neues Backup-System benötigt jede Nacht zu lange, um Dateien auf ein neues SAN zu kopieren. Ein Netzwerkadministrator nimmt eine einfache Änderung am Netzwerk und an den Geräten vor, um die Backup-Zeit zu verringern. Was ändert der Administrator?","options":[["A","QoS"],["B","SDN"],["C","MTU"],["D","VXLAN"],["E","TTL"]],"answers":["C"],"explanation":"Eine größere MTU, beispielsweise durch Jumbo Frames, erlaubt größere Pakete und reduziert den Protokoll-Overhead bei großen Dateiübertragungen.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":460,"prompt":"Benutzer erleben zu Spitzenzeiten starke Verzögerungen bei einer cloudbasierten Anwendung. Die Bandbreite ist stark ausgelastet, obwohl nur wenige Benutzer gleichzeitig diese Anwendung verwenden. Welche Lösung ist am kostengünstigsten?","options":[["A","Anzahl der Benutzer der Anwendung begrenzen."],["B","Eine Direct-Connect-Verbindung zum Cloud-Anbieter mieten."],["C","QoS implementieren und den Anwendungsverkehr priorisieren."],["D","Ein CDN für die Anwendung verwenden."]],"answers":["C"],"explanation":"Mit QoS kann der wichtige Anwendungsverkehr bei Netzüberlastung gegenüber weniger wichtigem Verkehr priorisiert werden, ohne eine teure dedizierte Verbindung einzurichten.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":461,"prompt":"Benutzer verlieren beim Wechsel von einem Raum in einen anderen die WLAN-Verbindung. Die SSID bleibt sichtbar, aber sie müssen sich bei jedem Raumwechsel manuell neu verbinden. Was ist die wahrscheinlichste Ursache?","options":[["A","In jedem Raum gibt es Funkstörungen."],["B","Die WLAN-Abdeckung ist schlecht."],["C","MAC-Filterung ist im WLAN aktiv."],["D","Die Roaming-Konfiguration ist deaktiviert."]],"answers":["D"],"explanation":"Korrekt eingerichtetes Roaming ermöglicht den nahtlosen Wechsel zwischen Access Points. Ist es deaktiviert oder falsch konfiguriert, kann eine manuelle Neuverbindung erforderlich sein.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":462,"prompt":"Ein Netzwerkadministrator muss Daten von neu installierten Firewalls an mehreren Standorten überwachen. Welche Lösung erfüllt diese Anforderung am besten?","options":[["A","IDS"],["B","IPS"],["C","SIEM"],["D","SNMPv2"]],"answers":["C"],"explanation":"Ein SIEM sammelt, aggregiert, analysiert und korreliert Sicherheitsdaten aus mehreren Quellen und Standorten zentral.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":463,"prompt":"Welche der folgenden Beschreibungen ist ein Beispiel für ein Split-Tunnel-VPN?","options":[["A","Nur öffentliche Ressourcen werden über die normale Internetverbindung des Benutzers aufgerufen."],["B","Verschlüsselte Ressourcen werden über separate Tunnel aufgerufen."],["C","Sämtliche Unternehmens- und öffentlichen Ressourcen werden über lokale Server geroutet."],["D","ACLs verteilen Netzwerkverkehr auf unterschiedliche Verbindungen."]],"answers":["A"],"explanation":"Bei Split Tunneling wird nur Unternehmensverkehr durch den VPN-Tunnel geleitet; normaler öffentlicher Internetverkehr nutzt die direkte Internetverbindung des Benutzers.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":464,"prompt":"Die VoIP-Telefonverbindung eines Unternehmens setzt wiederholt aus. Ein Senior-Netzwerkingenieur empfiehlt die Einführung eines Voice-VLANs. Was sollte konfiguriert werden?","options":[["A","802.1Q-Tagging"],["B","Jumbo Frames"],["C","Native VLAN"],["D","Link Aggregation"]],"answers":["A"],"explanation":"Ein Voice-VLAN verwendet IEEE 802.1Q, um Sprachverkehr mit einer VLAN-ID zu kennzeichnen und getrennt vom normalen Datenverkehr zu transportieren beziehungsweise zu priorisieren.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":465,"prompt":"Während eines VoIP-Gesprächs bemerkt ein Benutzer ungleichmäßigen Ton. Ein Netzwerkadministrator stellt fest, dass RTP-Pakete mit unterschiedlich großen Verzögerungen eintreffen. Welches Tool sollte zur Untersuchung verwendet werden?","options":[["A","Toner und Probe"],["B","Protokollanalysator"],["C","Kabeltester"],["D","Spektrumanalysator"]],"answers":["B"],"explanation":"Ein Protokollanalysator wie Wireshark kann RTP-Pakete erfassen und Zeitstempel, Jitter, Verluste und Reihenfolge analysieren.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":466,"prompt":"Ein Administrator muss ein IoT-Gerät mit einer /21-Subnetzmaske konfigurieren. Das Gerät akzeptiert nur die dezimale Punktnotation. Welche Subnetzmaske ist korrekt?","options":[["A","255.255.224.0"],["B","255.255.240.0"],["C","255.255.248.0"],["D","255.255.252.0"]],"answers":["C"],"explanation":"/21 entspricht 255.255.248.0. Im dritten Oktett ergeben fünf gesetzte Bits `11111000`, also den Dezimalwert 248.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":467,"prompt":"Welches der folgenden Tools verwendet ICMP, um zu prüfen, ob ein Netzwerkhost erreichbar ist?","options":[["A","tcpdump"],["B","netstat"],["C","nslookup"],["D","ping"]],"answers":["D"],"explanation":"ping sendet ICMP Echo Requests und wartet auf Echo Replies, um Erreichbarkeit und Round-Trip-Zeit zu prüfen.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":468,"prompt":"Welcher der folgenden Faktoren kann zusätzlich zu einem Passwort für MFA von einem Benutzer verlangt werden?","options":[["A","PIN"],["B","Lieblingsfarbe"],["C","Hardware-Token"],["D","Mädchenname der Mutter"]],"answers":["C"],"explanation":"Ein Passwort ist ein Wissensfaktor. Ein Hardware-Token ist ein Besitzfaktor und liefert damit einen anderen Authentifizierungsfaktor für MFA.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":469,"prompt":"Eine Behörde möchte Websites anhand ihres Ländercodes blockieren können. Welche Technologie erfüllt diese Anforderung am besten?","options":[["A","URL-Filterung"],["B","Inhaltsfilterung"],["C","DNS-Poisoning"],["D","MAC-Filterung"]],"answers":["A"],"explanation":"URL-Filterung kann Domainnamen beziehungsweise länderspezifische Top-Level-Domains erkennen und entsprechende Zugriffe blockieren.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":470,"prompt":"Eine Netzwerkressource befand sich bisher im lokalen Netzwerk und wird nun als SaaS-Lösung gehostet. Benutzer sollen weiterhin über den bisherigen Namen auf die neue Ressource umgeleitet werden. Welcher DNS-Record sollte verwendet werden?","options":[["A","TXT"],["B","AAA"],["C","PTR"],["D","CNAME"]],"answers":["D"],"explanation":"Ein CNAME-Record legt einen Alias vom bisherigen Hostnamen auf den neuen SaaS-Hostnamen an.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":471,"prompt":"Ein Netzwerkingenieur konfiguriert einen Anwendungsserver so, dass dieser seine Ressourcenzuweisung automatisch an eine nicht vorhersehbare Nachfrage anpasst. Welches Konzept wird beschrieben?","options":[["A","Skalierbarkeit"],["B","Software as a Service"],["C","Hybrid Cloud"],["D","Elastizität"]],"answers":["D"],"explanation":"Elastizität bezeichnet das automatische Erhöhen oder Verringern von Ressourcen in Echtzeit entsprechend der aktuellen Nachfrage.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":472,"prompt":"Ein Benutzer meldet fehlgeschlagene Anmeldungen an seinem Laptop und erwähnt, dass die angezeigte Uhrzeit falsch ist. Ein Administrator vermutet ein Problem mit NTP. Was sollte der Administrator als Nächstes tun?","options":[["A","Einen Aktionsplan erstellen."],["B","Eine Lösung implementieren."],["C","Das Problem identifizieren."],["D","Die Theorie testen."]],"answers":["D"],"explanation":"Eine mögliche Ursache wurde bereits vermutet. Der nächste Schritt ist deshalb, die Theorie zu testen, bevor eine Lösung geplant und umgesetzt wird.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":473,"prompt":"Welches Ziel erreicht ein Evil Twin am ehesten?","options":[["A","DNS-Poisoning"],["B","Anmeldedaten erbeuten"],["C","ARP-Spoofing"],["D","Denial of Service"]],"answers":["B"],"explanation":"Ein Evil Twin ist ein gefälschter WLAN-Access-Point, der einen legitimen AP imitiert, damit sich Benutzer verbinden und dabei beispielsweise Anmeldedaten preisgeben.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":474,"prompt":"Welcher Servertyp ist für die Verwaltung und Zuweisung von IP-Adressen an Clients zuständig?","options":[["A","NTP"],["B","FTP"],["C","DHCP"],["D","LDAP"]],"answers":["C"],"explanation":"Ein DHCP-Server weist Netzwerkclients automatisch IP-Adressen und weitere Netzparameter zu und verwaltet diese Leases.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":475,"prompt":"Benutzer melden, dass die Telefone ausgefallen sind. PCs und Drucker sind weiterhin online. Die Telefone zeigen jedoch „Searching for service“ an. Was sollten die Techniker zuerst überprüfen?","options":[["A","PoE-Statistiken am Switch"],["B","DHCP-Optionen"],["C","Data-VLANs an den Switchports"],["D","Standardgateway am Switch"]],"answers":["B"],"explanation":"Die Telefone sind eingeschaltet und können daher die Meldung „Searching for service“ anzeigen; ein allgemeines PoE-Problem ist damit weniger wahrscheinlich. Zu prüfen sind die DHCP-Optionen für den TFTP-/Call-Manager, typischerweise Option 150 beziehungsweise ersatzweise Option 66.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":476,"prompt":"Welcher physische Installationsfaktor ist am wichtigsten, wenn ein Netzwerk-Switch in einem geschlossenen Gehäuse installiert wird?","options":[["A","Feuerlöschung"],["B","Power Budget"],["C","Temperatur"],["D","Luftfeuchtigkeit"]],"answers":["C"],"explanation":"In einem geschlossenen Gehäuse kann sich Wärme stauen. Deshalb ist die Temperatur beziehungsweise ausreichende Kühlung besonders wichtig, um Geräteausfälle zu vermeiden.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":477,"prompt":"Ein Netzwerkingenieur installiert neue PoE-Wireless-APs. Die ersten fünf starten erfolgreich, der sechste startet nicht. Was sollte der Ingenieur zuerst untersuchen?","options":[["A","Signalstärke"],["B","Duplex-Mismatch"],["C","Power Budget"],["D","CRC"]],"answers":["C"],"explanation":"PoE-Switches besitzen ein begrenztes Power Budget. Ist es ausgeschöpft, kann ein weiterer AP nicht mehr ausreichend mit Strom versorgt werden.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":478,"prompt":"Ein Netzwerktechniker tauscht an einem PC eine defekte Netzwerkkarte gegen eine nachweislich funktionierende aus. Der Host ist mit einem Switch verbunden, dessen Ports abgesichert sind. Trotz funktionierender Kabel kann der Host keine Verbindung herstellen. Was verursacht das Problem?","options":[["A","MAC-Adresse der neuen Netzwerkkarte"],["B","BPDU-Guard-Einstellungen"],["C","Link-Aggregation-Einstellungen"],["D","PoE über dem Power Budget"]],"answers":["A"],"explanation":"Port Security kann nur bestimmte MAC-Adressen zulassen. Eine neue NIC besitzt eine andere MAC-Adresse und kann deshalb vom gesicherten Switchport abgewiesen werden.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":479,"prompt":"Ein Netzwerkingenieur hat zusätzliche Access Points installiert, um die WLAN-Abdeckung zu verbessern. Danach berichten Benutzer von wiederholten Verbindungsabbrüchen und Neuverbindungen. Was verursacht das Problem am wahrscheinlichsten?","options":[["A","Durchsatzkapazität"],["B","Roaming-Fehlkonfiguration"],["C","Kanalüberschneidung"],["D","Paketverlust"]],"answers":["C"],"explanation":"Werden zusätzliche APs ohne saubere Kanalplanung installiert, kann Channel Overlap starke Funkinterferenzen verursachen und damit wiederholte Verbindungsabbrüche auslösen.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":480,"prompt":"Ein Netzwerkadministrator möchte für eine spätere Analyse eine Kopie des Netzwerkverkehrs erstellen. Der ursprüngliche Verkehrsfluss soll dabei nicht verändert werden. Welche Möglichkeit erfüllt diese Aufgabe am direktesten?","options":[["A","SPAN-Port"],["B","Network Tap"],["C","Protokollanalysator"],["D","Link Aggregation"]],"answers":["B"],"explanation":"Ein Network Tap erstellt eine passive Kopie des Netzwerkverkehrs zur Analyse, ohne den ursprünglichen Datenfluss zu verändern.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":481,"prompt":"Welche der folgenden Eigenschaften priorisiert ein Router bei der Routenauswahl zuerst?","options":[["A","Präfixlänge"],["B","Metrik"],["C","Administrative Distance"],["D","Standardroute"]],"answers":["A"],"explanation":"Zuerst wird die Route mit der längsten Präfixlänge gewählt, weil sie das spezifischste Zielnetz beschreibt.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":482,"prompt":"Ein Techniker konfiguriert einen neuen Drucker und bindet ihn ins Netzwerk ein. Wie lässt sich am besten sicherstellen, dass der Drucker immer dieselbe IP-Konfiguration behält?","options":[["A","Einen neuen Scope hinzufügen."],["B","Eine Exclusion einrichten."],["C","Die Lease-Zeit verlängern."],["D","Eine Reservation erstellen."]],"answers":["D"],"explanation":"Eine DHCP-Reservation sorgt dafür, dass der Drucker anhand seiner MAC-Adresse immer dieselbe IP-Adresse erhält.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":483,"prompt":"Ein Benutzer ruft www.abc.com auf, aber stattdessen wird www.cba.com angezeigt. Was sollte geändert werden, damit die richtige Website erreicht wird?","options":[["A","CNAME-Record ändern."],["B","PTR-Record aktualisieren."],["C","NTP-Einstellungen ändern."],["D","TXT-Record löschen."]],"answers":["A"],"explanation":"Ein CNAME-Record kann einen Namen als Alias auf einen anderen Hostnamen verweisen. Zeigt er auf das falsche Ziel, muss dieser Eintrag korrigiert werden.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":484,"prompt":"Welcher DNS-Record-Typ wird für eine Auflösung von IP-Adresse zu Name verwendet?","options":[["A","NS"],["B","PTR"],["C","A"],["D","CNAME"]],"answers":["B"],"explanation":"Ein PTR-Record wird bei Reverse-DNS-Lookups verwendet, um eine IP-Adresse einem Host- beziehungsweise Domainnamen zuzuordnen.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":485,"prompt":"Welche der folgenden Optionen steht am stärksten mit einer gemieteten dedizierten Leitung zu einem Public-Cloud-Anbieter in Verbindung?","options":[["A","VPN"],["B","Direct Connect"],["C","Internet Gateway"],["D","Private Cloud"]],"answers":["B"],"explanation":"Direct Connect beziehungsweise vergleichbare Dienste wie Azure ExpressRoute stellen eine private, dedizierte Verbindung zum Cloud-Anbieter bereit, ohne den normalen öffentlichen Internetweg zu nutzen.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":486,"prompt":"Ein Netzwerkingenieur richtet eine neue Verbindung zwischen Core-Switches ein. Auf core-sw01 werden die Interfaces mit `channel-group mode active` als LACP-Port-Channel konfiguriert. Auf core-sw02 sind die Interfaces nur als Trunks konfiguriert, ohne LACP. In welchem Zustand befinden sich die Port-Channel-Interfaces von core-sw01?","options":[["A","CRC-Fehler steigen an."],["B","Error-disabled"],["C","Administratively down"],["D","Suspended"]],"answers":["D"],"explanation":"Eine Seite erwartet eine LACP-Aushandlung, die andere nimmt daran nicht teil. Dadurch schlägt die Aushandlung fehl und die betroffenen Ports auf core-sw01 werden suspended.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":487,"prompt":"Ein Unternehmen migriert ein Rechenzentrum von On-Premises in die Cloud. Welches Tool hilft dabei, Konsistenz, Zuverlässigkeit und Effizienz bei Provisionierung und Verwaltung sicherzustellen?","options":[["A","IaC"],["B","CDN"],["C","SASE"],["D","ZTA"]],"answers":["A"],"explanation":"Infrastructure as Code (IaC) automatisiert die Bereitstellung und Verwaltung von Infrastruktur anhand von Code und sorgt dadurch für wiederholbare, konsistente Konfigurationen.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":488,"prompt":"Ein Netzwerkadministrator möchte eine Geofencing-Richtlinie aktualisieren, um Remote-Zugriff auf das Unternehmensnetz nach Herkunftsland einzuschränken. Was wird er am ehesten verwenden?","options":[["A","MAC-Filterung"],["B","Administrative Distance"],["C","Bluetooth-Beacon-Signale"],["D","IP-Adressblöcke"]],"answers":["D"],"explanation":"Geofencing kann öffentliche IP-Adressbereiche bestimmten Ländern oder Regionen zuordnen und Zugriffe anhand dieser Blöcke erlauben oder sperren.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":489,"prompt":"Was ist der wichtigste Nutzen davon, nach der Behebung eines komplizierten Netzwerkproblems die Lessons Learned zu dokumentieren?","options":[["A","Aktionspläne aufstellen."],["B","Zukünftige Fehlerbehebungszeit verkürzen."],["C","Problematische Mitarbeiter identifizieren."],["D","Hardwarebudget erhöhen."]],"answers":["B"],"explanation":"Dokumentierte Ursachen, Lösungen und Präventionsmaßnahmen können bei ähnlichen Störungen später wiederverwendet werden und verkürzen die Troubleshooting-Zeit.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":490,"prompt":"Ein Netzwerkarchitekt implementiert eine VPN-Lösung für Remote-Mitarbeiter. Die übertragenen Daten sollen gegen Abhören und Manipulation geschützt werden. Welche Lösungen erfüllen diese Anforderungen? (Wähle zwei.)","options":[["A","SSL"],["B","AES"],["C","TKIP"],["D","IPsec"],["E","EAP"],["F","SSH"]],"answers":["B","D"],"explanation":"AES stellt starke Verschlüsselung bereit. IPsec schützt VPN-Tunnel durch Verschlüsselung und Integritätsmechanismen vor Abhören und Manipulation.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":491,"prompt":"Ein Benutzer sieht auf einem PC ein /24-Netz und weist einem neuen Gerät statisch die Adresse 192.168.1.255 zu. Das Gerät funktioniert im Netzwerk nicht. Was erklärt das Problem?","options":[["A","Die IP-Adresse ist statisch."],["B","Die IP-Adresse ist eine Broadcast-Adresse."],["C","Die Adresse liegt außerhalb des DHCP-Bereichs."],["D","Die Subnetzmaske ist falsch."]],"answers":["B"],"explanation":"In einem /24-Netz ist `.255` die Broadcast-Adresse und kann keinem normalen Host zugewiesen werden.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":492,"prompt":"Welches Layer-1-Gerät ist für den Abschluss einer Glasfaserverbindung an einem SFP-fähigen Switch zuständig?","options":[["A","Transceiver"],["B","Modem"],["C","Ethernet-NIC"],["D","Repeater"]],"answers":["A"],"explanation":"Ein SFP-Transceiver wandelt optische und elektrische Signale ineinander um und stellt damit die Glasfaseranbindung des Switches her.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":493,"prompt":"Ein kleines Unternehmen entscheidet zwischen statischem und dynamischem Routing. Was ist der beste Grund, in einem wachsenden Netzwerk dynamisches Routing zu verwenden?","options":[["A","Es ist immer einfacher zu konfigurieren als manuelle Routen."],["B","Es benötigt keine zusätzlichen Sicherheitskontrollen."],["C","Es besitzt automatisch bessere Überwachungsfunktionen."],["D","Änderungen der Netzwerktopologie werden automatisch übernommen."]],"answers":["D"],"explanation":"Dynamische Routingprotokolle lernen und aktualisieren Routen automatisch, wenn sich die Topologie ändert. Das ist in wachsenden Netzen wesentlich effizienter als manuelle Anpassungen statischer Routen.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":494,"prompt":"Ein Mitarbeiter verbindet sich von zu Hause über VPN mit dem Unternehmensnetz. Unternehmensdaten laufen durch das VPN, normaler Internetverkehr über den heimischen ISP. Welche Methode wird verwendet?","options":[["A","IPsec"],["B","Split-Tunnel"],["C","Clientless"],["D","Out-of-Band"]],"answers":["B"],"explanation":"Beim Split Tunneling wird nur Unternehmensverkehr durch das VPN geschickt; sonstiger Internetverkehr verwendet direkt die lokale Internetverbindung.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":495,"prompt":"Drei Access Points sind über Ethernetleitungen in der Decke angeschlossen. Einer davon erreicht das Internet nicht. Welches Tool hilft am besten bei der Fehlersuche?","options":[["A","Network Tap"],["B","Kabeltester"],["C","Visual Fault Locator"],["D","Toner und Probe"]],"answers":["B"],"explanation":"Ein Kabeltester kann Unterbrechungen, Kurzschlüsse, Fehlverdrahtungen und schlechte Abschlüsse in Ethernetleitungen feststellen.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":496,"prompt":"Ein Netzwerkadministrator installiert neue Netzwerkhardware. Der Monitoring-Server kann sich am Gerät authentifizieren, aber dessen spezifischen Hardwarestatus nicht interpretieren. Was sollte der Administrator tun?","options":[["A","Den öffentlichen Community String verwenden."],["B","Die passende MIB importieren."],["C","Einen SPAN-Port einrichten."],["D","SNMPv3 Privacy konfigurieren."]],"answers":["B"],"explanation":"SNMP verwendet MIBs (Management Information Bases), um gerätespezifische Werte zu beschreiben. Mit der passenden MIB kann der Monitoring-Server die gelieferten Daten korrekt interpretieren.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":497,"prompt":"Ein Netzwerkingenieur erhält einen neuen Router für die WAN-Anbindung. An welcher Schicht der hierarchischen Netzwerktopologie sollte er ihn am ehesten anschließen?","options":[["A","Core"],["B","Leaf"],["C","Spine"],["D","Access"]],"answers":["A"],"explanation":"WAN-Router werden typischerweise an der Core-Schicht angebunden, wo Hochgeschwindigkeits-Routing und Verbindungen zu externen Netzen zusammenlaufen.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":498,"prompt":"Ein Netzwerkadministrator erweitert ein Netzwerk über den primären Technikstandort hinaus. Wo sollte er zusätzliche Netzwerk-Switches installieren?","options":[["A","MDF"],["B","VPC"],["C","VXLAN"],["D","IDF"]],"answers":["D"],"explanation":"Ein IDF (Intermediate Distribution Frame) erweitert die Netzwerkinfrastruktur vom zentralen MDF in weitere Bereiche eines Gebäudes oder Campus.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":499,"prompt":"Ein Netzwerkadministrator schließt einen neuen Wireless AP an Port G1/0/1 eines vorhandenen PoE-Switches an. Der AP erhält keinen Strom. Die Power-Statistik zeigt für G1/0/1 Admin State off und Oper State off, obwohl genügend Gesamtleistung verfügbar ist. Was ist die wahrscheinlichste Ursache?","options":[["A","Der Switch ist nicht so konfiguriert, dass dieser Port PoE liefert."],["B","Das Stromkabel des APs ist beschädigt."],["C","Der AP erhält wegen Überlastung keinen Strom."],["D","Die Switch-Firmware muss aktualisiert werden."]],"answers":["A"],"explanation":"PoE ist am betreffenden Port administrativ deaktiviert. Da noch genügend Power Budget vorhanden ist, muss PoE auf G1/0/1 aktiviert werden.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":500,"prompt":"Ein Benutzer kann nach dem Aufbau einer VPN-Verbindung nicht auf einen externen Server eines Kunden zugreifen. Welche Befehle wird ein Supportmitarbeiter am ehesten verwenden, um das Problem zu untersuchen? (Wähle zwei.)","options":[["A","nslookup"],["B","tcpdump"],["C","arp"],["D","dig"],["E","tracert"],["F","route print"]],"answers":["E","F"],"explanation":"tracert zeigt den Netzwerkpfad und mögliche Abbruchstellen. route print zeigt die Routingtabelle und damit, wie der Datenverkehr bei aktiver VPN-Verbindung geroutet wird.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":501,"prompt":"Ein Netzwerktechniker benötigt für Benutzer-Laptops einen privaten Class-A-RFC1918-Adressbereich. Welches Subnetz sollte er wählen?","options":[["A","10.1.1.0/24"],["B","100.1.1.0/24"],["C","172.16.1.0/24"],["D","192.168.1.0/24"]],"answers":["A"],"explanation":"Der private Class-A-Bereich nach RFC1918 ist 10.0.0.0/8. 10.1.1.0/24 liegt innerhalb dieses Bereichs.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":502,"prompt":"Welcher Kabeltyp eignet sich am besten für größere Kabelmengen, die in Deckenbereichen verlegt werden?","options":[["A","Plenum"],["B","Koaxial"],["C","Ethernet"],["D","DAC"]],"answers":["A"],"explanation":"Plenum-rated Kabel besitzen schwer entflammbare und raucharme Isolierungen und sind für Luftführungs- und Deckenhohlräume vorgesehen.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":503,"prompt":"Ein Unternehmen installiert neue Drucker. Die IP-Adressen sollen automatisch vergeben werden, müssen aber dauerhaft gleich bleiben, weil der Helpdesk die Drucker per Browser verwaltet. Welche Option ist am besten?","options":[["A","Längere Lease-Zeit"],["B","Statische Adressen"],["C","DHCP-Reservation"],["D","Relay"]],"answers":["C"],"explanation":"Eine DHCP-Reservation kombiniert automatische Adressvergabe mit einer dauerhaft gleichbleibenden IP-Adresse.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":504,"prompt":"Eine kritische kundenorientierte Anwendung fiel mehrfach aus. Ursache war ein überlasteter Netzwerkrouter. Das Supportteam bemerkte die Störung erst, nachdem Kunden sie meldeten. Wie kann das Problem künftig am besten verhindert beziehungsweise früher erkannt werden?","options":[["A","Packet Capture"],["B","SNMP"],["C","Syslog Collector"],["D","SIEM"]],"answers":["B"],"explanation":"SNMP ermöglicht die proaktive Überwachung von Auslastung und Gerätezustand, sodass ein überlasteter Router erkannt werden kann, bevor Benutzer betroffen sind.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":505,"prompt":"Was beschreibt den Zweck von UPS/USV und PDU in einer Netzwerkinstallation am besten?","options":[["A","Spannungs- und Stromversorgungsanforderungen für Geräte in einem IDF unterstützen."],["B","Stromverbrauch im MDF verwalten."],["C","Mehrere Geräte an eine einzelne Netzwerkverbindung anschließen."],["D","Temperatur in MDF und IDF regeln."]],"answers":["A"],"explanation":"Eine USV liefert stabile und bei Ausfall gepufferte Energie; eine PDU verteilt diese Energie an mehrere Netzwerkgeräte.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":506,"prompt":"Ein Techniker stellt bei der Fehlersuche fest, dass die IP-Adresse eines Computers auf 169.254.0.1 geändert wurde. Was ist die wahrscheinlichste Ursache?","options":[["A","Mehrere Computer besitzen dieselbe IP in der ARP-Tabelle."],["B","Der Computer hat die Adresse automatisch gesetzt, weil DHCP nicht verfügbar war."],["C","Der Computer wurde als NTP-Server eingerichtet."],["D","Der Computer ist in einem VPN und erhält dort die erste andere Adresse."]],"answers":["B"],"explanation":"Eine 169.254.x.x-Adresse ist eine APIPA-Adresse, die ein Client verwendet, wenn kein DHCP-Server erreicht werden kann.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":507,"prompt":"Welches der folgenden Geräte wird verwendet, um eine Glasfaserleitung mit einer Netzwerkschnittstelle zu verbinden?","options":[["A","SC"],["B","DAC"],["C","SFP-Transceiver"],["D","Twinaxialkabel"]],"answers":["C"],"explanation":"Ein SFP-Transceiver stellt die physische/optische Schnittstelle für Glasfaser bereit und wandelt elektrische und optische Signale um.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":508,"prompt":"Ein IT-Techniker konfiguriert einen Switch in einem großen Büro. Der Switch soll Datenverkehr segmentieren und getrennte Broadcast-Domänen bilden. Welche Funktion sollte aktiviert werden?","options":[["A","STP"],["B","VLAN"],["C","LACP"],["D","QoS"]],"answers":["B"],"explanation":"VLANs unterteilen einen Switch logisch in getrennte Broadcast-Domänen und segmentieren den Datenverkehr.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":509,"prompt":"Im Netzwerk eines Unternehmens tritt verdächtig viel Datenverkehr auf. Das Sicherheitsteam stellt fest, dass er von einer unbekannten ausländischen IP-Adresse stammt. Wie lässt sich diese Bedrohung am kostengünstigsten eindämmen?","options":[["A","ACL"],["B","IDS"],["C","NAT"],["D","DoS-Prävention"]],"answers":["A"],"explanation":"Eine ACL kann am Netzrand den Verkehr einer bestimmten Quell-IP blockieren, ohne dass zusätzliche Sicherheitsgeräte benötigt werden.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":510,"prompt":"Welcher Port wird verwendet, um Daten zwischen Mail-Exchange-Servern zu übertragen?","options":[["A","21"],["B","25"],["C","53"],["D","69"]],"answers":["B"],"explanation":"SMTP verwendet Port 25 für die Server-zu-Server-Übertragung von E-Mails.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":511,"prompt":"Zwei Switches an unterschiedlichen Standorten sind über eine 16 km lange Glasfaserstrecke verbunden. Ein Duplex-Patchkabel wird beschädigt und ersetzt. Nach dem Austausch durch ein neues Singlemode-Patchkabel bleiben Link und LEDs trotzdem aus. Was sollte der Techniker zuerst tun?","options":[["A","Den Glasfaser-Transceiver im Switch ersetzen."],["B","Den Switchport herunter- und wieder hochfahren."],["C","Die beiden Glasfaserstecker an einem Ende des neuen Patchkabels vertauschen."],["D","Das Singlemode-Kabel durch Multimode ersetzen."]],"answers":["C"],"explanation":"Duplex-Glasfaser benötigt eine korrekte TX/RX-Kreuzung. Nach einem Kabeltausch ist eine vertauschte Polarität eine typische Ursache für fehlenden Link; das Vertauschen der beiden Stecker korrigiert TX und RX.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":512,"prompt":"Welcher Angriff zwingt einen Switch dazu, Datenverkehr über alle Ports auszugeben?","options":[["A","ARP-Poisoning"],["B","Evil Twin"],["C","MAC-Flooding"],["D","DNS-Spoofing"]],"answers":["C"],"explanation":"MAC-Flooding überlastet die MAC-Adresstabelle des Switches. Kann der Switch Ziel-MACs nicht mehr korrekt zuordnen, kann er Frames wie unbekannten Unicast über mehrere beziehungsweise alle Ports fluten.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":515,"prompt":"Benutzer melden Latenz im Netzwerk. Der Netzwerkingenieur bestätigt, dass die einzige Änderung ein neuer Switch war und alle Benutzer betroffen sind. Er vermutet eine Netzwerkschleife, weil der neue Switch eine niedrigere Bridge-ID besitzt. Welcher Schritt der Troubleshooting-Methodik folgt als Nächstes?","options":[["A","Problem identifizieren."],["B","Theorie testen."],["C","Lösung implementieren."],["D","Vollständige Systemfunktion überprüfen."]],"answers":["B"],"explanation":"Eine Theorie wurde bereits aufgestellt. Als Nächstes muss sie getestet werden, bevor Änderungen umgesetzt werden.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":516,"prompt":"Ein Netzwerktechniker muss in einem Class-Netz insgesamt acht Subnetze erstellen: • drei für 60 Hosts, • drei für 15 Hosts, • zwei für 7 Hosts. Welche Lösung sollte verwendet werden?","options":[["A","CIDR"],["B","APIPA"],["C","VLSM"],["D","RFC 1918"]],"answers":["C"],"explanation":"VLSM (Variable-Length Subnet Masking) ermöglicht unterschiedlich große Subnetze innerhalb desselben Adressbereichs und nutzt Adressen für die verschiedenen Hostzahlen effizient.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":517,"prompt":"Ein Benutzer kann ein lokales Code-Repository nicht erreichen. Der Systemadministrator bestätigt, dass das Repository von anderen Geräten erreichbar ist. Welchen Befehl sollte der Administrator auf dem Gerät des Benutzers zuerst verwenden?","options":[["A","nslookup"],["B","dig"],["C","tcpdump"],["D","tracert"]],"answers":["D"],"explanation":"tracert zeigt den Pfad zum Ziel und hilft festzustellen, an welcher Stelle die Verbindung abbricht.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":518,"prompt":"Ein Netzwerkadministrator möchte die logische Erreichbarkeit eines Layer-2-Switches mit `ping` prüfen. Welche Adresse sollte er anpingen?","options":[["A","MAC-Adresse"],["B","VIP-Adresse"],["C","WAN-Adresse"],["D","SVI-Adresse"]],"answers":["D"],"explanation":"Ein Layer-2-Switch ist für Managementzwecke über die IP-Adresse seines SVI (Switched Virtual Interface) erreichbar.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":519,"prompt":"Welcher Standard ermöglicht Enterprise-Authentifizierung für Network Access Control?","options":[["A","802.1Q"],["B","802.1X"],["C","802.3bt"],["D","802.11h"]],"answers":["B"],"explanation":"802.1X stellt portbasierte Zugriffskontrolle bereit und kann Benutzer oder Geräte über einen Authentifizierungsdienst wie RADIUS prüfen.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":520,"prompt":"Welche Technologie ermöglicht es einer Organisation, einen Identity Provider für die Zugriffsverwaltung über mehrere SaaS-Anwendungen hinweg zu verwenden?","options":[["A","PKI"],["B","SSO"],["C","TACACS+"],["D","RADIUS"]],"answers":["B"],"explanation":"SSO (Single Sign-On) erlaubt die zentrale Authentifizierung über einen Identity Provider und anschließend den Zugriff auf mehrere SaaS-Anwendungen.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":521,"prompt":"Welche Komponente kann in einem Rechenzentrum die Stromversorgung verwalten, steuern und konditionieren?","options":[["A","Power Usage Monitor"],["B","Line Voltage Monitor"],["C","USV/UPS"],["D","PDU"]],"answers":["C"],"explanation":"Eine USV kann Spannung stabilisieren beziehungsweise konditionieren und zusätzlich bei Stromausfall Batteriestrom liefern.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":522,"prompt":"Eine Außenstelle verliert die Internetverbindung. Das letzte protokollierte Ereignis ist eine Anmeldung am Router mit dessen Standardzugangsdaten. Der Netzwerkadministrator kann anschließend selbst nicht mehr auf den Router zugreifen. Was sollte künftig getan werden?","options":[["A","Namen des Routers ändern."],["B","Routerkonfiguration dokumentieren."],["C","Lokalen Benutzernamen und Passwort ändern."],["D","Zweiten Router installieren."]],"answers":["C"],"explanation":"Öffentlich bekannte Standardzugangsdaten ermöglichen unbefugten Zugriff. Sie müssen durch eigene Zugangsdaten ersetzt werden.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":523,"prompt":"Ein Unternehmen muss einen neuen Standort an sein WAN anbinden. Glasfaser ist zu teuer, daher wird eine Funkverbindung zwischen den Standorten verwendet. Welche Netzart beschreibt dies?","options":[["A","Hybrid"],["B","Direct Connect"],["C","Mesh"],["D","Point-to-Point"]],"answers":["D"],"explanation":"Eine gerichtete Funkstrecke zwischen genau zwei Standorten ist eine Point-to-Point-Verbindung.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":524,"prompt":"Ein Gastnetz verwendet 192.168.1.0/28 mit einem DHCP-Pool. Ein Besucher hatte Verbindungsprobleme und stellte deshalb selbst eine statische IP-Adresse ein. Danach berichtet ein anderer Besucher von sporadischen Verbindungsproblemen. Was ist die wahrscheinlichste Ursache?","options":[["A","DHCP-Pool erschöpft"],["B","Doppelte IP-Adressen"],["C","Falsches Standardgateway"],["D","Falsche Subnetzmaske"]],"answers":["B"],"explanation":"Der statisch konfigurierte Besucher hat wahrscheinlich eine Adresse aus dem DHCP-Pool gewählt, die anschließend auch einem anderen Client zugewiesen wurde. Das führt zu einem IP-Adresskonflikt und sporadischen Ausfällen.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":525,"prompt":"Ein Systemadministrator untersucht Verbindungsprobleme zu einem DNS-Server. Ein Remote-Scan zeigt 21/TCP, 22/TCP, 53/TCP, 53/UDP, 161/TCP, 389/TCP und 636/TCP als offen; 25/TCP, 69/TCP, 8080/TCP und 8443/TCP sind geschlossen. Was sollte der Administrator als Nächstes untersuchen?","options":[["A","URL-Filter"],["B","Ungenutzte Dienste"],["C","Firewallregeln"],["D","802.1X am Switch"]],"answers":["C"],"explanation":"Der Scan bestätigt Erreichbarkeit nur aus der Position und zum Zeitpunkt des Scans. Da DNS-Ports grundsätzlich antworten, sollten als Nächstes Firewallregeln auf Quellnetze, Zonen, Richtungen oder zustandsabhängige Filter geprüft werden, die andere DNS-Clients weiterhin blockieren könnten.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":526,"prompt":"Ein Netzwerkadministrator implementiert dynamische Routingprotokolle für ein großes Unternehmensnetz mit Geräten verschiedener Hersteller, mehreren Standorten und hohen Bandbreitenanforderungen. Welche Wahl ist am besten?","options":[["A","IS-IS"],["B","OSPF"],["C","BGP"],["D","RIP"]],"answers":["B"],"explanation":"OSPF ist ein offener Standard, skaliert gut in großen Unternehmensnetzen, unterstützt hierarchisches Design und konvergiert schnell.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":527,"prompt":"Ein Mesh-WLAN besteht aus AP1 mit 802.11ac (Wi-Fi 5) sowie AP2 und AP3 mit 802.11ax (Wi-Fi 6). Für den Backhaul soll die schnellste Frequenz gewählt werden, die alle drei Access Points unterstützen. Welche Frequenz ist geeignet?","options":[["A","2,4 GHz"],["B","5 GHz"],["C","6 GHz"],["D","45 GHz"]],"answers":["B"],"explanation":"802.11ac (Wi-Fi 5) arbeitet im 5-GHz-Band. Daher ist 5 GHz das schnellste gemeinsame Band aller drei Access Points. 6 GHz setzt Wi-Fi 6E oder neuer voraus und wird vom Wi-Fi-5-Gerät nicht unterstützt.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":528,"prompt":"Ein Netzwerkadministrator sucht ein einzelnes Tool, das sowohl Bandbreitenauslastung als auch Schnittstellenstatus überwacht. Welche Lösung erfüllt diese Anforderung am besten?","options":[["A","Nmap-Scan"],["B","SNMP"],["C","Packet Capture"],["D","Syslog"]],"answers":["B"],"explanation":"SNMP kann über MIB-Zähler sowohl Interface-Zustände als auch Traffic- und Bandbreitenwerte zentral überwachen.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":529,"prompt":"Ein Netzwerkadministrator kann Änderungen an einem Netzwerkgerät über einen speziellen, isolierten Port vornehmen. Welche Managementmethode beschreibt dies am besten?","options":[["A","API"],["B","Out-of-Band"],["C","Jump Box"],["D","SSH"]],"answers":["B"],"explanation":"Out-of-Band-Management verwendet einen getrennten Managementport beziehungsweise ein separates Managementnetz außerhalb des normalen Produktionsverkehrs.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":530,"prompt":"Welche der folgenden Aussagen beschreibt das Einschränken des Zugriffs auf Werkzeuge oder Einrichtungen entsprechend der jeweiligen beruflichen Rolle?","options":[["A","Prinzip der geringsten Rechte"],["B","ACL"],["C","MFA"],["D","Allow List"]],"answers":["A"],"explanation":"Das Principle of Least Privilege gewährt Benutzern nur die Rechte und Zugriffe, die sie für ihre Aufgaben tatsächlich benötigen.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":531,"prompt":"Welche Methode wird verwendet, um Benutzer und Geräte zu authentifizieren, die sich mit einem Netzwerk verbinden?","options":[["A","VLAN"],["B","ACL"],["C","NAC"],["D","UTM"]],"answers":["C"],"explanation":"Network Access Control (NAC) prüft Benutzer und Geräte, bevor ihnen Netzwerkzugriff gewährt wird, und lässt nur autorisierte beziehungsweise konforme Teilnehmer zu.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":532,"prompt":"Ein Kunde möchte ein lokales Class-C-Netz in acht Bereiche mit jeweils 30 Geräten aufteilen. Welche Präfixlänge erfüllt diese Anforderung?","options":[["A","/25"],["B","/26"],["C","/27"],["D","/28"]],"answers":["C"],"explanation":"Ein /27 enthält 32 Adressen, davon 30 nutzbare Hosts. Ein /24 lässt sich damit genau in acht /27-Subnetze aufteilen.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":533,"prompt":"Was ist der wichtigste Grund für die Erstellung einer Golden Configuration?","options":[["A","Konfigurationskonsistenz sicherstellen."],["B","Konfigurationsdateien verkleinern."],["C","Konfigurationen automatisch verschlüsseln."],["D","Für jedes Gerät ein individuelles Backup erstellen."]],"answers":["A"],"explanation":"Eine Golden Configuration ist eine geprüfte Standardkonfiguration und dient als einheitliche Baseline, um Configuration Drift und Fehler zu vermeiden.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":534,"prompt":"Ein Netzwerkingenieur möchte einer VPC eine einfache öffentliche Netzwerkverbindung bereitstellen. Was sollte er implementieren?","options":[["A","Direct Connect"],["B","Site-to-Site-VPN"],["C","Internet Gateway"],["D","NFV"]],"answers":["C"],"explanation":"Ein Internet Gateway ermöglicht Ressourcen innerhalb einer VPC die Kommunikation mit dem öffentlichen Internet.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":535,"prompt":"Mitarbeiter berichten, dass Website-Anfragen zu anderen Websites mit unerwarteten Inhalten umgeleitet werden. Welcher Angriff ist am wahrscheinlichsten?","options":[["A","MAC-Flooding"],["B","ARP-Spoofing"],["C","DNS-Poisoning"],["D","VLAN-Hopping"]],"answers":["C"],"explanation":"Beim DNS-Poisoning werden DNS-Informationen manipuliert, sodass legitime Namen auf falsche beziehungsweise bösartige Ziele aufgelöst werden.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":536,"prompt":"Ein globales Unternehmen übernimmt ein geografisch getrenntes lokales Unternehmen. Beide Netze verwenden vollständig ausgelastete, sich überschneidende Adressbereiche: • Global: 10.0.0.0/16 • Lokal: 10.0.0.0/24 Wie kann der Netzwerkingenieur die Unternehmen schnell verbinden und Benutzer möglichst wenig beeinträchtigen?","options":[["A","Statische Route zum lokalen Netz setzen."],["B","Den überlappenden Bereich unverändert routen."],["C","Das lokale Unternehmen komplett neu adressieren."],["D","Für das lokale Unternehmen einen NAT-Bereich verwenden."]],"answers":["D"],"explanation":"Direktes Routing funktioniert bei überlappenden IP-Bereichen nicht eindeutig. NAT kann die Adressen des lokalen Unternehmens übersetzen und ermöglicht damit eine schnelle Verbindung ohne sofortige vollständige Umadressierung.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":537,"prompt":"Ein Angreifer führt remote eine Binärdatei auf einem Server aus. Welcher Begriff beschreibt am besten, was der Angreifer dabei verwendet?","options":[["A","Threat"],["B","Risk"],["C","Vulnerability"],["D","Exploit"]],"answers":["D"],"explanation":"Ein Exploit ist die konkrete Methode beziehungsweise der Code, mit dem eine vorhandene Schwachstelle ausgenutzt wird.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":538,"prompt":"Ein Unternehmen hatte einen Sicherheitsvorfall und sucht eine Lösung, die bekannte Angriffe sammeln, analysieren und schnell korrelieren kann. Welches Softwaretool erfüllt diese Aufgabe?","options":[["A","Syslog Collector"],["B","SIEM"],["C","Packet Capture"],["D","SNMP-Traps"]],"answers":["B"],"explanation":"Ein SIEM sammelt Ereignisse aus vielen Quellen, analysiert und korreliert sie, um bekannte Angriffsmuster schnell zu erkennen.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":539,"prompt":"Nach der Installation eines Mobilfunk-Repeaters berichten Benutzer über Verbindungsprobleme und schnell leere Handyakkus. Was sollte der Techniker zuerst prüfen?","options":[["A","WPS-Konfiguration"],["B","Signalstärke"],["C","Kanalfrequenz"],["D","Power Budget"]],"answers":["B"],"explanation":"Schwache oder stark schwankende Signalstärke kann Mobiltelefone dazu bringen, mit höherer Sendeleistung zu arbeiten und wiederholt nach einer stabilen Verbindung zu suchen, was den Akku belastet.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":540,"prompt":"Welcher Angriff kann Clients in einem kabelgebundenen Netzwerk eine bösartige Standardgateway-IP zuweisen?","options":[["A","Evil Twin"],["B","DNS-Spoofing"],["C","ARP-Poisoning"],["D","Rogue DHCP Server"]],"answers":["D"],"explanation":"Ein Rogue DHCP Server kann Clients manipulierte DHCP-Informationen liefern, darunter ein falsches Standardgateway unter Kontrolle des Angreifers.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":541,"prompt":"Ein Netzwerkadministrator stellt Layer-3-Konnektivität zwischen Layer-2-Segmenten her. Welche Komponente benötigt er dafür?","options":[["A","VIP"],["B","NAT"],["C","SVI"],["D","802.1Q-Tagging"]],"answers":["C"],"explanation":"Ein SVI (Switched Virtual Interface) stellt eine Layer-3-Schnittstelle für ein VLAN bereit und ermöglicht damit Routing zwischen Layer-2-VLANs.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":542,"prompt":"Ein Mitarbeiter schließt einen privaten Laptop an eine Netzwerkdose in einem gesicherten IDF an und erhält keine Netzwerkadresse. Ein Firmenlaptop funktioniert an derselben Dose sofort. Welche Sicherheitsfunktion erklärt dies am besten?","options":[["A","Untrusted Zone"],["B","MAC-Filterung"],["C","ACL"],["D","Screened Subnet"]],"answers":["B"],"explanation":"Bei MAC-Filterung werden nur Geräte mit zugelassenen MAC-Adressen akzeptiert. Der Firmenlaptop ist autorisiert, der private nicht.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":543,"prompt":"Welche Netzwerktopologie verwendet eine direkte Punkt-zu-Punkt-Verbindung zwischen zwei Knoten ohne zentralen Access Point?","options":[["A","Mesh"],["B","Hybrid"],["C","Star"],["D","Ad hoc"]],"answers":["D"],"explanation":"Ein Ad-hoc-Netz verbindet Geräte direkt miteinander, ohne zentrale WLAN-Infrastruktur.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":544,"prompt":"Malware auf dem infizierten Laptop eines Mitarbeiters verursacht einen Ausfall von Unternehmensservern. Welche Lösung sollte ein Netzwerktechniker einsetzen, um solche Vorfälle einzudämmen?","options":[["A","IPS"],["B","NAC"],["C","MFA"],["D","SSL"]],"answers":["B"],"explanation":"NAC kann Geräte vor dem Netzwerkzugang auf Sicherheitszustand und Compliance prüfen und infizierte oder nicht konforme Endgeräte blockieren.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":545,"prompt":"Ein Kunde möchte häufig verwendete Webinhalte zwischenspeichern, damit Seiten nicht jedes Mal vollständig aus dem Internet geladen werden müssen. Was sollte der Netzwerkadministrator empfehlen?","options":[["
