A","Proxyserver"],["B","Code Repository"],["C","Load Balancer"],["D","Open Relay"],["E","Mirrored Port"]],"answers":["A"],"explanation":"Ein Proxyserver kann Webinhalte cachen und wiederholt angeforderte Inhalte lokal bereitstellen.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":546,"prompt":"Welcher physische Installationsfaktor ist am wichtigsten, wenn ein Netzwerk-Switch in einem vollständig geschlossenen Gehäuse installiert wird?","options":[["A","Feuerlöschung"],["B","Power Budget"],["C","Temperatur"],["D","Luftfeuchtigkeit"]],"answers":["C"],"explanation":"In einem geschlossenen Gehäuse ist die Wärmeabfuhr eingeschränkt. Deshalb ist die Temperatur der kritischste Faktor.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":547,"prompt":"Ein Angreifer hat die Hosts-Datei eines Endgeräts verändert. Seitdem wird ein Benutzer von der Unternehmenshomepage auf eine betrügerische Website umgeleitet. Was ist am wahrscheinlichsten passiert?","options":[["A","DNS-Spoofing"],["B","Phishing"],["C","VLAN-Hopping"],["D","ARP-Poisoning"]],"answers":["A"],"explanation":"Die manipulierte Hosts-Datei verändert die lokale Namensauflösung und leitet den legitimen Hostnamen auf eine falsche IP-Adresse um. Unter den angebotenen Begriffen entspricht dieses Umleiten durch gefälschte Namensauflösung am ehesten DNS-Spoofing.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":548,"prompt":"Welcher Begriff beschreibt die maximale Dauer, für die die Technologie einer Organisation während eines einzelnen Vorfalls offline sein darf?","options":[["A","MTBF"],["B","MTTR"],["C","AUP"],["D","RTO"]],"answers":["D"],"explanation":"Das Recovery Time Objective (RTO) legt fest, wie lange ein Dienst maximal ausfallen darf, bevor die Auswirkungen nicht mehr akzeptabel sind.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":549,"prompt":"Ein Unternehmen muss mehrere Niederlassungen verbinden. Das Routingprotokoll soll automatische Lastverteilung und Redundanz bieten und ein Path-Vector-Protokoll sein. Welche Lösung sollte verwendet werden?","options":[["A","RIP"],["B","OSPF"],["C","BGP"],["D","MPLS"]],"answers":["C"],"explanation":"BGP ist das aufgeführte Path-Vector-Routingprotokoll und kann mehrere Pfade beziehungsweise redundante WAN-Verbindungen verwalten.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":550,"prompt":"Entwickler möchten eine mobile Anwendung erstellen und benötigen Runtime-Umgebung, Entwicklungstools und Datenbanken. Für Sicherheitsupdates und Patches möchten sie nicht selbst verantwortlich sein. Welches Servicemodell passt?","options":[["A","Container as a Service"],["B","Infrastructure as a Service"],["C","Platform as a Service"],["D","Software as a Service"]],"answers":["C"],"explanation":"PaaS stellt Entwicklungsplattform, Laufzeit und oft Datenbanken bereit, während der Cloud-Anbieter die darunterliegende Infrastruktur und viele Wartungsaufgaben übernimmt.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":551,"prompt":"Welche OSI-Schicht ist für die Ermittlung des effizientesten Pfades für die Übertragung zuständig?","options":[["A","Layer 1"],["B","Layer 2"],["C","Layer 3"],["D","Layer 5"]],"answers":["C"],"explanation":"Layer 3, die Vermittlungsschicht, übernimmt Routing und Pfadauswahl zwischen Netzwerken.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":552,"prompt":"Ein Netzwerktechniker richtet in einem aus dem Internet erreichbaren Screened Subnet einen Server ein, der einen echten Produktionsserver nachahmt. Was wurde erstellt?","options":[["A","IDS"],["B","Firewall"],["C","Rogue Device"],["D","Honeypot"]],"answers":["D"],"explanation":"Ein Honeypot ist ein Ködersystem, das wie ein legitimes Ziel aussieht und Angreifer anlocken soll, damit deren Aktivitäten beobachtet werden können.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":553,"prompt":"Welcher Port wird üblicherweise auf Clientseite für DHCPDISCOVER-Anfragen eines neuen Rechners verwendet?","options":[["A","53"],["B","68"],["C","69"],["D","80"]],"answers":["B"],"explanation":"DHCP-Clients verwenden UDP-Port 68, während der DHCP-Server typischerweise Port 67 verwendet.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":554,"prompt":"Ein Unternehmen implementiert eine Lösung für den Zugriff auf eine kritische Anwendung. Die Lösung prüft sowohl, ob der Rechner bestimmte Anforderungen erfüllt, als auch, ob der Benutzer Zugriff auf die Anwendung besitzen darf. Was beschreibt diese Lösung?","options":[["A","Policy-based Authentication"],["B","Benutzername und Passwort"],["C","Application Awareness"],["D","Single Sign-On"]],"answers":["A"],"explanation":"Policy-based Authentication kann Geräteanforderungen und Benutzerberechtigungen anhand definierter Richtlinien gemeinsam prüfen, bevor Zugriff gewährt wird.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":555,"prompt":"Welche Angriffsart tritt am wahrscheinlichsten auf, nachdem ein Angreifer einen Evil Twin eingerichtet hat?","options":[["A","On-Path"],["B","DDoS"],["C","ARP-Spoofing"],["D","Phishing"]],"answers":["A"],"explanation":"Verbindet sich ein Opfer mit dem Evil Twin, kann der Angreifer den Verkehr zwischen Opfer und echtem Netzwerk abfangen und weiterleiten. Dadurch wird ein On-Path-Angriff möglich.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":556,"prompt":"Welcher Port wird für die sichere Verwaltung von Identitäten in einer Windows-Domäne verwendet?","options":[["A","68"],["B","389"],["C","445"],["D","636"]],"answers":["D"],"explanation":"LDAPS verwendet Port 636 für verschlüsselte LDAP-Kommunikation.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":557,"prompt":"Welche Methode würde ein Netzwerkadministrator am ehesten verwenden, um ein Netzwerkgerät in einem geschlossenen Netzwerk sicher zu verwalten?","options":[["A","Bastion Host"],["B","Remote Desktop"],["C","SSH"],["D","Split-Tunnel-VPN"]],"answers":["C"],"explanation":"SSH bietet verschlüsselten Remote-Managementzugriff auf Netzwerkgeräte.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":559,"prompt":"Ein Büronetz ist beim Zugriff auf ein gemeinsames Laufwerk deutlich langsam. Ein Systemadministrator möchte die Ursache mit Fokus auf die Netzwerklatenz untersuchen. Welches Tool sollte er zuerst verwenden?","options":[["A","Wireshark"],["B","NetFlow"],["C","Traceroute"],["D","SNMP"]],"answers":["C"],"explanation":"Traceroute zeigt die einzelnen Hops und deren Antwortzeiten und hilft damit schnell zu erkennen, an welcher Stelle des Pfades Latenz entsteht.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":560,"prompt":"Welche der folgenden Aufgaben ist ein typischer Anwendungsfall für eine PaaS-Umgebung?","options":[["A","Mobile Access"],["B","E-Commerce-Site"],["C","Anwendungsentwicklung"],["D","Cloud-native Software"]],"answers":["C"],"explanation":"PaaS stellt Entwicklern Laufzeit, Middleware, Datenbanken und Werkzeuge bereit, um Anwendungen zu entwickeln, zu testen und bereitzustellen, ohne die zugrunde liegenden Server zu verwalten.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":561,"prompt":"Ein Kunde möchte Finanz- und Marketingabteilung voneinander trennen. Das bestehende Class-C-Netz soll in genau zwei Bereiche geteilt werden. Welche Subnetzmaske sollte verwendet werden?","options":[["A","/24"],["B","/25"],["C","/26"],["D","/27"]],"answers":["B"],"explanation":"Ein /24 wird durch Ausleihen eines Hostbits in zwei gleich große /25-Subnetze geteilt.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":562,"prompt":"Ein Unternehmen verwendet OSPF und fügt zusätzlich eine statische Route in die Routingtabelle ein. Welche Maßnahme stellt sicher, dass die über OSPF gelernte Route bevorzugt wird?","options":[["A","ISP-Router als OSPF-Nachbarn hinzufügen."],["B","FHRP aktivieren."],["C","Administrative Distance anpassen."],["D","Auf EIGRP wechseln."]],"answers":["C"],"explanation":"Zwischen Routen aus unterschiedlichen Quellen entscheidet die Administrative Distance. Die OSPF-Route muss eine niedrigere AD als die konkurrierende statische Route erhalten.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":563,"prompt":"Welche OSI-Schicht verwaltet den Austausch von HTTP-Informationen?","options":[["A","Session"],["B","Data Link"],["C","Network"],["D","Application"]],"answers":["D"],"explanation":"HTTP ist ein Protokoll der Anwendungsschicht (Layer 7).","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":564,"prompt":"Welche ICMP-Nachricht sendet ein Router, um einen Host auf ein besseres Routing-Gateway hinzuweisen?","options":[["A","Router Advertisement"],["B","Echo Reply"],["C","Redirect Message"],["D","Network Unreachable"]],"answers":["C"],"explanation":"Ein ICMP Redirect informiert einen Host darüber, dass für ein bestimmtes Ziel ein besserer Next Hop verfügbar ist.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":565,"prompt":"Eine Anwendung kann zunächst erfolgreich eine Verbindung zu einem Server herstellen, aber der anschließende Daten-Synchronisationsprozess schlägt fehl. Welche Tools sollte der Helpdesk verwenden? (Wähle zwei.)","options":[["A","netstat"],["B","arp"],["C","Speed Tester"],["D","nslookup"],["E","Nmap"],["F","ping"]],"answers":["C","F"],"explanation":"Ein Speed Test kann Bandbreitenengpässe erkennen. ping zeigt grundlegende Erreichbarkeit, Latenz und Paketverluste, die eine Synchronisierung beeinträchtigen können.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":566,"prompt":"Mitarbeiter umgehen die URL-Filterung der Unternehmensfirewall, indem sie einen externen Proxyserver verwenden. Wie lässt sich die Nutzung dieses Proxyservers am besten unterbinden?","options":[["A","Jump Box zur Überwachung einrichten."],["B","Eine ACE auf der Firewall für den Proxyserver hinzufügen."],["C","Externe Websites nur über VPN erlauben."],["D","Hosts-Dateien auf den PCs ändern."]],"answers":["B"],"explanation":"Eine Access Control Entry (ACE) kann Verbindungen zu der bekannten Proxy-Adresse direkt an der Firewall blockieren.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":567,"prompt":"Welche Angriffsart tritt nach dem Aufbau eines Evil Twin am wahrscheinlichsten auf?","options":[["A","On-Path"],["B","DDoS"],["C","ARP-Spoofing"],["D","Phishing"]],"answers":["A"],"explanation":"Ein Evil Twin kann sich zwischen Opfer und legitimes Netzwerk schalten und dadurch Datenverkehr abfangen oder manipulieren - ein On-Path-Angriff.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":568,"prompt":"Bei welchem Angriff durchsucht ein Angreifer entsorgte Dokumente nach vertraulichen Benutzerinformationen?","options":[["A","Vishing"],["B","Dumpster Diving"],["C","Shoulder Surfing"],["D","Spoofing"]],"answers":["B"],"explanation":"Dumpster Diving bezeichnet das Durchsuchen weggeworfener Unterlagen oder Datenträger nach verwertbaren vertraulichen Informationen.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":569,"prompt":"Welches der folgenden Protokolle ist ein Link-State-Routingprotokoll?","options":[["A","RIP"],["B","OSPF"],["C","BGP"],["D","Statische Route"]],"answers":["B"],"explanation":"OSPF verteilt Link-State-Informationen, baut daraus eine Topologiedatenbank und berechnet Pfade mit SPF.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":570,"prompt":"Nach Einführung einer BYOD-Richtlinie melden Benutzer in einer Umgebung mit hoher Gerätedichte langsames WLAN. Der Controller zeigt hohe Latenz und starke Airtime-Contention. Was ist die wahrscheinlichste Ursache?","options":[["A","Der AP nutzt 2,4 GHz, das die neuen Geräte nicht unterstützen."],["B","Der AP nutzt 2,4 GHz ohne Band Steering."],["C","Der AP nutzt 5 GHz mit Band Steering."],["D","Der AP nutzt 5 GHz, das die neuen Geräte nicht unterstützen."]],"answers":["B"],"explanation":"Das 2,4-GHz-Band besitzt nur wenige nicht überlappende Kanäle und ist in Umgebungen mit vielen Clients schnell überlastet. Ohne Band Steering bleiben viele Geräte dort, anstatt auf 5 GHz auszuweichen.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":571,"prompt":"Welches Gerät wird verwendet, um ein Netzwerk zu segmentieren und unterschiedliche Subnetze miteinander zu verbinden?","options":[["A","Hub"],["B","Layer-3-Switch"],["C","Bridge"],["D","Repeater"]],"answers":["B"],"explanation":"Ein Layer-3-Switch segmentiert das Netzwerk mit VLANs und routet zugleich zwischen den zugehörigen IP-Subnetzen. Hub, Bridge und Repeater stellen diese Routingfunktion nicht bereit.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":572,"prompt":"Ein Router lernt Routen über verschiedene Methoden. Welche Route wird standardmäßig als Next Hop bevorzugt?","options":[["A","OSPF"],["B","Default"],["C","Static"],["D","BGP"]],"answers":["C"],"explanation":"Eine normale statische Route besitzt standardmäßig eine niedrigere Administrative Distance als OSPF oder BGP und wird deshalb bevorzugt, sofern der Präfixvergleich gleich ist.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":573,"prompt":"Internet-Anwendungen laufen für Benutzer der Finanzabteilung in Timeouts. Das Unternehmen besitzt eine 10-Gbit/s-Internetverbindung. Andere Abteilungen haben keine Probleme und der Core-Switch zeigt gute Leistung. Wie kann der Finanzabteilung am besten mehr beziehungsweise bevorzugte Bandbreite bereitgestellt werden?","options":[["A","Link Aggregation"],["B","Load Balancer"],["C","Jumbo Frames"],["D","Quality of Service"]],"answers":["D"],"explanation":"Mit QoS kann der Verkehr der Finanzabteilung priorisiert beziehungsweise mit einer garantierten Bandbreite versehen werden.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":574,"prompt":"Welches Protokoll sollte ein Techniker zur Verschlüsselung eines Site-to-Site-VPN verwenden?","options":[["A","PPTP"],["B","SSH"],["C","TLS"],["D","IPsec"]],"answers":["D"],"explanation":"IPsec bietet Verschlüsselung, Authentifizierung und Integrität für Site-to-Site-VPNs auf Netzwerkebene.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":575,"prompt":"Welcher der folgenden Ports wird am ehesten für Benutzerauthentifizierung verwendet?","options":[["A","123"],["B","389"],["C","443"],["D","587"]],"answers":["B"],"explanation":"Port 389 wird von LDAP verwendet, das häufig für zentrale Verzeichnisdienste und Benutzerauthentifizierung eingesetzt wird.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":576,"prompt":"Ein Unternehmen erhält vom ISP einen öffentlichen /24-Adressblock, erwartet aber rund 1.000 IP-fähige interne Geräte. Am Internet-Rand wird eine Firewall installiert. Wie sollte die Adressierung umgesetzt werden?","options":[["A","Intern RFC1918-Adressen verwenden und den öffentlichen Block extern an der Firewall mit NAT einsetzen."],["B","VLSM verwenden und ausschließlich den öffentlichen /24 intern und extern aufteilen."],["C","Einen zusätzlichen öffentlichen /23-Block erwerben."],["D","Intern APIPA-Adressen verwenden und den öffentlichen Block extern einsetzen."]],"answers":["A"],"explanation":"Mit RFC1918-Privatadressen steht intern ausreichend Adressraum zur Verfügung. NAT an der Edge-Firewall übersetzt diese Adressen für den Zugriff auf das Internet in den öffentlichen Bereich.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":577,"prompt":"Welche Lösung ermöglicht Anwendungsredundanz unabhängig davon, auf welchem Host innerhalb desselben Netzwerksegments die Anwendung gerade läuft?","options":[["A","VLAN"],["B","VIP"],["C","PAT"],["D","BGP"]],"answers":["B"],"explanation":"Eine virtuelle IP-Adresse (VIP) kann zwischen Hosts verschoben beziehungsweise auf mehrere Systeme abgebildet werden und bietet so einen konstanten Zugriffspunkt bei Failover.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":578,"prompt":"Nach der Installation eines neuen IPS verschlechtert sich die Netzwerkgeschwindigkeit. Speedtests zeigen am Firewall-Punkt normalen Durchsatz, an kabelgebundenen und drahtlosen Endgeräten jedoch stark reduzierte Downloadraten bei weitgehend normalen Uploads. Was ist am wahrscheinlichsten?","options":[["A","Paketverlust"],["B","Bottleneck"],["C","Kanalüberschneidung"],["D","Allgemeine Netzüberlastung"]],"answers":["B"],"explanation":"Die Ergebnisse deuten auf einen Engpass (Bottleneck) im Pfad zwischen Endgeräten und Firewall hin. Das neu installierte IPS kann diesen Flaschenhals verursachen.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":579,"prompt":"Ein Systemadministrator muss verhindern, dass Benutzer anstößige Websites aufrufen. Die Lösung soll flexibel und leicht zu verwalten sein. Welche Filterart sollte implementiert werden?","options":[["A","URL"],["B","Content"],["C","MAC"],["D","IP"]],"answers":["B"],"explanation":"Content Filtering kategorisiert und bewertet Webinhalte und erlaubt eine zentral verwaltete, anpassbare Sperrung unerwünschter Inhaltskategorien.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":580,"prompt":"Wenn ein Benutzer eine E-Mail an den Helpdesk sendet, soll automatisch ein Helpdesk-Ticket erzeugt werden. Welche Technologie erleichtert diese Integration?","options":[["A","GUI"],["B","API"],["C","CLI"],["D","SSH"]],"answers":["B"],"explanation":"Eine API ermöglicht die programmatische Kommunikation zwischen E-Mail- und Ticketsystem und kann den Ticket-Erstellungsprozess automatisieren.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":581,"prompt":"Welches Verschlüsselungsprotokoll wird verwendet, um Webverkehr über HTTPS abzusichern?","options":[["A","TLS"],["B","IPsec"],["C","SSH"],["D","PKI"]],"answers":["A"],"explanation":"HTTPS schützt HTTP-Verkehr mit TLS. Das ältere SSL ist veraltet und wurde durch TLS ersetzt; Zertifikate aus einer PKI unterstützen dabei die Authentisierung.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":582,"prompt":"Ein Netzwerkadministrator plant eine neue WLAN-Implementierung. Benutzer sollen sich überall im Gebäude verbinden können und das Netzwerk soll sich bei Ausfällen selbst heilen können. Welche Netzart sollte vorgeschlagen werden?","options":[["A","Ad-hoc-APs"],["B","Infrastructure"],["C","Point-to-Point"],["D","Mesh"]],"answers":["D"],"explanation":"Ein Mesh-Netzwerk besitzt mehrere untereinander verbundene Knoten und kann Verkehr bei Ausfall eines Pfades automatisch über alternative Wege umleiten.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":583,"prompt":"In einem Gebäude sind mehrere Access Points installiert. Nur in bestimmten Bereichen ist das Signal schwach und die Datenrate niedrig. Was sollte ein WLAN-Techniker zuerst tun?","options":[["A","Zusätzliche APs in den Problemzonen installieren."],["B","Sendeleistung aller APs erhöhen."],["C","Antennen aller APs aufrüsten."],["D","Firmware aller APs aktualisieren."]],"answers":["A"],"explanation":"Schwaches Signal nur in einzelnen Bereichen weist auf Abdeckungslücken hin. Zusätzliche APs in diesen Zonen verbessern Abdeckung und Kapazität.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":584,"prompt":"Ein Angreifer verändert die Hosts-Datei eines Endgeräts. Danach wird ein Benutzer von der Unternehmenshomepage zu einer betrügerischen Website umgeleitet. Was ist am wahrscheinlichsten passiert?","options":[["A","DNS-Spoofing"],["B","Phishing"],["C","VLAN-Hopping"],["D","ARP-Poisoning"]],"answers":["A"],"explanation":"Eine veränderte Hosts-Datei manipuliert die lokale Namensauflösung, sodass ein legitimer Name auf eine bösartige IP-Adresse zeigt. Von den angebotenen Antworten beschreibt DNS-Spoofing diesen Effekt am besten.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":585,"prompt":"Bei einer Hardwareerneuerung sind einige IP-Kameras im dritten Stock offline. Die Switchports zeigen keine Link-LED. Was ist die wahrscheinlichste Ursache?","options":[["A","Das PoE-Power-Budget ist überschritten."],["B","Das VLAN am Switch ist falsch."],["C","Der Network Video Recorder befindet sich nicht im Kamera-VLAN."],["D","Die betroffenen Kameras haben ein Verkabelungsproblem."]],"answers":["A"],"explanation":"IP-Kameras werden häufig über PoE mit Strom und Daten versorgt. Ist das Power Budget des Switches ausgeschöpft, bleiben weitere Kameras ausgeschaltet und der Port zeigt keinen Link.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":586,"prompt":"Welcher Glasfaser-Steckverbinder wird typischerweise innerhalb eines MDF verwendet?","options":[["A","RJ45"],["B","LC"],["C","BNC"],["D","DB9"]],"answers":["B"],"explanation":"LC-Steckverbinder sind kompakt und ermöglichen eine hohe Portdichte in Glasfaser-Patchfeldern und MDFs.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":587,"prompt":"Nach einem Ausfall möchte ein Netzwerkadministrator prüfen, ob Hosts im Netzwerk wieder erreichbar sind. Welche Tools testen die Konnektivität am besten? (Wähle zwei.)","options":[["A","ping"],["B","LLDP"],["C","nslookup"],["D","arp"],["E","traceroute"],["F","SNMP"]],"answers":["A","E"],"explanation":"ping prüft die grundsätzliche IP-Erreichbarkeit. traceroute zeigt zusätzlich den Pfad und mögliche Fehlerstellen auf dem Weg zum Ziel.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":588,"prompt":"Ein Netzwerkingenieur fragt mit `dig` einen Hostnamen ab und erhält eine gültige IP-Adresse. Bei einer Abfrage dieser IP-Adresse wird jedoch kein Hostname zurückgegeben. Welcher DNS-Record fehlt?","options":[["A","MX"],["B","CNAME"],["C","AAAA"],["D","PTR"]],"answers":["D"],"explanation":"Für Reverse DNS wird ein PTR-Record benötigt, der eine IP-Adresse zurück auf einen Hostnamen abbildet.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":589,"prompt":"Ein Netzwerktechniker implementiert einen Switch mit mehreren VLANs. Was muss konfiguriert werden, damit Clients in unterschiedlichen VLANs miteinander kommunizieren können?","options":[["A","VPC"],["B","VXLAN"],["C","ACL"],["D","SVI"]],"answers":["D"],"explanation":"Ein SVI stellt die Layer-3-Schnittstelle für ein VLAN bereit und ermöglicht Inter-VLAN-Routing.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":590,"prompt":"Mitarbeiter melden ein langsames Netzwerk. Der Netzwerkingenieur vermutet einen Upstream-Router als Ursache. Welche Tools sollte er verwenden, um die Problemstelle zu bestimmen?","options":[["A","nslookup und dig"],["B","Nmap und Speed Tester"],["C","traceroute und ping"],["D","tcpdump und Protocol Analyzer"]],"answers":["C"],"explanation":"traceroute zeigt die einzelnen Hops und Verzögerungen; ping prüft Erreichbarkeit und Latenz. Zusammen helfen sie, den problematischen Abschnitt einzugrenzen.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":591,"prompt":"Ein Netzwerkadministrator muss sicherstellen, dass Benutzer Regeln zur Internetnutzung akzeptieren. Welche Lösung hilft dabei?","options":[["A","Captive Portal"],["B","Acceptable Use Policy"],["C","Network Access Control"],["D","DNS-Filterung"]],"answers":["A"],"explanation":"Ein Captive Portal kann Benutzer dazu zwingen, Nutzungsbedingungen aktiv zu bestätigen, bevor ihnen Netzwerkzugriff gewährt wird.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":592,"prompt":"Nach einem Sicherheitsvorfall wird die Unternehmensleitung über die Ergebnisse eines genehmigten Change Requests informiert. Welcher Schritt der Troubleshooting-Methodik wird beschrieben?","options":[["A","Theorie zur wahrscheinlichen Ursache aufstellen."],["B","Lösung implementieren oder eskalieren."],["C","Erkenntnisse, Maßnahmen, Ergebnisse und Lessons Learned dokumentieren."],["D","Aktionsplan erstellen und Auswirkungen identifizieren."]],"answers":["C"],"explanation":"Das Festhalten und Weitergeben von durchgeführten Änderungen und deren Ergebnissen gehört zur Dokumentation der Erkenntnisse und Lessons Learned.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":593,"prompt":"Ein Unternehmen befürchtet, dass Besucher über frei zugängliche Netzwerkdosen in Konferenzräumen auf Unternehmensserver zugreifen könnten. Wie lässt sich diese Schwachstelle am besten reduzieren?","options":[["A","Trusted Zone erstellen."],["B","Ungenutzte Dienste deaktivieren."],["C","MAC-Filterung verwenden."],["D","802.1X implementieren."]],"answers":["D"],"explanation":"802.1X erzwingt portbasierte Authentifizierung, bevor ein angeschlossenes Gerät Netzwerkzugriff erhält.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":594,"prompt":"Ein neues Netzwerk soll 126 Benutzer unterstützen. Welcher CIDR-Bereich nutzt den Adressraum am effizientesten?","options":[["A","10.2.2.0/23"],["B","10.2.2.0/24"],["C","10.2.2.0/25"],["D","10.2.2.0/26"],["E","169.254.0.0/16"]],"answers":["C"],"explanation":"Ein /25 besitzt 128 Adressen und 126 nutzbare Hostadressen und passt damit genau zum Bedarf.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":595,"prompt":"Ein Netzwerktechniker untersucht ein Verbindungsproblem auf einem Server. Welcher Befehl eignet sich am besten, um zu prüfen, ob der Server tatsächlich Netzwerkverkehr empfängt?","options":[["A","traceroute"],["B","tcpdump"],["C","nslookup"],["D","arp"]],"answers":["B"],"explanation":"tcpdump zeichnet Pakete direkt an einer Netzwerkschnittstelle auf und zeigt, ob Verkehr am Server ankommt.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":596,"prompt":"Ein Unternehmen baut ein neues internes Netzwerk auf, in dem alle Geräte IPv6 verwenden. Welches Routingprotokoll ist dafür am besten geeignet?","options":[["A","EIGRP"],["B","OSPFv3"],["C","BGP4"],["D","iBGP"]],"answers":["B"],"explanation":"OSPFv3 unterstützt IPv6 nativ und ist für IPv6-Routing ausgelegt.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":597,"prompt":"Ein Netzwerktechniker misst zwischen zwei Switches hohe Crosstalk-Werte auf dem Kabel. Was trägt am wahrscheinlichsten dazu bei?","options":[["A","Störungen durch benachbarte Leitungen"],["B","Verwendung von Cat 6"],["C","Unzureichende Terminierung"],["D","Fehlendes STP-Kabel"]],"answers":["C"],"explanation":"Eine schlechte Terminierung kann die Verdrillung der Aderpaare zu weit auflösen oder Paare falsch zuordnen, wodurch Übersprechen zunimmt.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":598,"prompt":"Eine NIC besitzt die IP-Adresse 192.168.123.232. Zu welcher klassischen IPv4-Adressklasse gehört sie?","options":[["A","Class A"],["B","Class B"],["C","Class C"],["D","Class D"]],"answers":["C"],"explanation":"Ein erstes Oktett von 192 bis 223 gehört in der klassischen Adressierung zur Class C.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":599,"prompt":"Was ist der beste Anwendungsfall für ein Site-to-Site-VPN?","options":[["A","Zugriff über ein nicht vertrauenswürdiges Netzwerk absichern."],["B","Daten im Ruhezustand verschlüsseln."],["C","Verkehr zwischen zwei internen Subnetzen filtern."],["D","Öffentlich erreichbare Anwendungen hosten."]],"answers":["A"],"explanation":"Ein Site-to-Site-VPN verschlüsselt den Datenverkehr zwischen zwei Netzen über ein unsicheres Transportnetz wie das Internet.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":600,"prompt":"Welches Konzept beschreibt, dass unterschiedliche Kunden dieselbe physische Public-Cloud-Infrastruktur beziehungsweise dasselbe Rechenzentrum nutzen?","options":[["A","Elastizität"],["B","Hybrid Cloud"],["C","Skalierbarkeit"],["D","Multitenancy"]],"answers":["D"],"explanation":"Multitenancy bedeutet, dass mehrere Mandanten dieselbe physische Infrastruktur nutzen, dabei jedoch logisch voneinander getrennt bleiben.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":601,"prompt":"Welche Aussage beschreibt einen DNS-Poisoning-Angriff am besten?","options":[["A","DNS-Adressdatensätze werden regulär auf dem DNS-Server geändert."],["B","Ein Angreifer ersetzt einen legitimen DNS-Server vollständig."],["C","DNS-Clientanfragen werden abgefangen und unmittelbar falsch beantwortet."],["D","Falsche DNS-Records werden in den Cache eines DNS-Servers eingeschleust."]],"answers":["D"],"explanation":"Bei DNS Cache Poisoning werden gefälschte Zuordnungen in einen DNS-Cache eingebracht, sodass spätere Abfragen falsche IP-Adressen erhalten.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":602,"prompt":"Welche Aktion folgt in der Troubleshooting-Methodik, nachdem bestätigt wurde, dass das ursprüngliche Problem behoben ist?","options":[["A","Falls nötig eskalieren."],["B","Problem erneut reproduzieren."],["C","Erkenntnisse dokumentieren."],["D","Den Plan umsetzen."]],"answers":["C"],"explanation":"Nach erfolgreicher Verifikation werden Erkenntnisse, Maßnahmen, Ergebnisse und Lessons Learned dokumentiert.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":603,"prompt":"Ein Netzwerkingenieur möchte eine 802.1X-Architektur einführen, in der BYOD-Geräte sicher auf ein vertrauenswürdiges WLAN zugreifen können. Was sollte implementiert werden?","options":[["A","ACL"],["B","MAC-Filterung"],["C","Port Security"],["D","NAC"]],"answers":["D"],"explanation":"NAC kann mit 802.1X Benutzer und Geräte authentifizieren und zusätzlich ihren Sicherheits- beziehungsweise Compliance-Zustand bewerten.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":604,"prompt":"Welcher Glasfaser-Steckverbinder verwendet eine Dreh-/Bajonettverriegelung?","options":[["A","ST"],["B","SC"],["C","LC"],["D","MPO"]],"answers":["A"],"explanation":"Der ST-Steckverbinder verwendet einen Bajonettmechanismus und wird durch Drehen verriegelt.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":605,"prompt":"Was verwendet ein Router zur Auswahl der bevorzugten Route?","options":[["A","Shortest Prefix Match"],["B","Bevorzugt immer EIGRP"],["C","Longest Prefix Match"],["D","Bevorzugt immer OSPF"]],"answers":["C"],"explanation":"Router wählen zunächst die Route mit dem längsten passenden Präfix, also die spezifischste Route zum Ziel.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":606,"prompt":"Welches Netzwerkgerät eignet sich am besten, um mehrere logische Netzwerke miteinander zu verbinden und Pakete mit möglichst geringer Verzögerung zwischen ihnen weiterzuleiten?","options":[["A","Firewall"],["B","Router"],["C","Layer-2-Switch"],["D","Load Balancer"]],"answers":["B"],"explanation":"Ein Router verbindet unterschiedliche IP-Netze auf Layer 3 und trifft Weiterleitungsentscheidungen anhand seiner Routingtabelle.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":607,"prompt":"Ein Medienunternehmen führt einen globalen Streamingdienst ein. Was sollte es an jedem regionalen Point of Presence anwenden, um lokale Gesetze einzuhalten?","options":[["A","ACL"],["B","Port Security"],["C","Key Management"],["D","Regionale Inhaltsanpassung (Content Altering)"]],"answers":["D"],"explanation":"Eine regionale Inhaltsanpassung kann Inhalte je nach Standort verändern oder ausblenden, damit lokale gesetzliche und regulatorische Vorgaben eingehalten werden.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":608,"prompt":"Ein Systemadministrator möchte Betriebssysteminformationen, laufende Dienste und offene Netzwerkports eines Servers ermitteln. Welches Tool sollte er verwenden?","options":[["A","nslookup"],["B","nmap"],["C","traceroute"],["D","netstat"]],"answers":["B"],"explanation":"Nmap kann offene Ports, Dienste und häufig auch Betriebssysteminformationen eines Zielsystems ermitteln.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":609,"prompt":"Welcher Begriff beschreibt die Zeit zwischen einem störenden Ereignis und dem Zeitpunkt, zu dem betroffene Ressourcen wieder vollständig funktionsfähig sein müssen?","options":[["A","RTO"],["B","MTBF"],["C","PRO"],["D","MTTR"]],"answers":["A"],"explanation":"Das Recovery Time Objective (RTO) gibt die maximal akzeptable Wiederherstellungsdauer nach einem Ausfall an.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":610,"prompt":"Was ist ein typischer Anwendungsfall für PAT?","options":[["A","BGP für Internet-Routing"],["B","Eine einzige öffentliche IP-Adresse verwenden"],["C","Redundante ISPs verwenden"],["D","Dual-Stack-Adressierung verwenden"]],"answers":["B"],"explanation":"PAT ermöglicht vielen internen Hosts, über unterschiedliche Portnummern eine einzige öffentliche IP-Adresse gemeinsam zu verwenden.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":611,"prompt":"Ein neues Büro wird ungefähr 800 Arbeitsstationen besitzen. Der Netzwerkadministrator möchte möglichst wenig IP-Adressen verschwenden. Welches Netz erfüllt die Anforderung am besten?","options":[["A","10.0.100.0/22"],["B","172.16.8.0/23"],["C","172.16.15.0/20"],["D","192.168.4.0/21"]],"answers":["A"],"explanation":"Ein /22 bietet 1022 nutzbare Hostadressen und ist damit groß genug für rund 800 Geräte, aber kleiner als /21 oder /20.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":612,"prompt":"Welche der folgenden Bedrohungen beeinträchtigt direkt die Verfügbarkeit eines webbasierten Kundenportals?","options":[["A","MAC-Flooding"],["B","ARP-Spoofing"],["C","DoS"],["D","Rogue Devices"]],"answers":["C"],"explanation":"Ein Denial-of-Service-Angriff überlastet einen Dienst und verhindert, dass legitime Benutzer darauf zugreifen können.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":613,"prompt":"Welches Cloud-Konzept beschreibt die Fähigkeit, Compute-Ressourcen je nach Bedarf hinzuzufügen oder zu entfernen?","options":[["A","Skalierbarkeit"],["B","Verfügbarkeit"],["C","Elastizität"],["D","Multitenancy"]],"answers":["C"],"explanation":"Elastizität bedeutet, Ressourcen dynamisch entsprechend der aktuellen Last zu erhöhen oder zu reduzieren.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":614,"prompt":"Ein Netzwerkingenieur möchte Erkenntnisse korrelieren und Warnungen bei Brute-Force-Angriffen, DDoS oder Portscans erhalten. Welche Monitoring-Technologie sollte implementiert werden?","options":[["A","Packet Capture"],["B","SNMPv3"],["C","SIEM"],["D","Syslog Collector"]],"answers":["C"],"explanation":"Ein SIEM sammelt Ereignisse aus mehreren Quellen, korreliert sie und erzeugt bei verdächtigen Mustern Warnungen.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":615,"prompt":"Was sollte ein Netzwerkingenieur prüfen, um festzustellen, ob für ein Gerät weiterhin Updates veröffentlicht werden?","options":[["A","Baseline Configuration"],["B","EOL-Dokumentation"],["C","Asset-Inventory-Lizenzierung"],["D","Software Development Life Cycle"]],"answers":["B"],"explanation":"Die End-of-Life-/End-of-Support-Dokumentation des Herstellers zeigt, ob ein Produkt noch unterstützt wird und weiterhin Updates oder Patches erhält.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":616,"prompt":"Welcher Begriff beschreibt ein Ziel für die Datenwiederherstellung?","options":[["A","MTBF"],["B","RPO"],["C","BCP"],["D","MTTR"]],"answers":["B"],"explanation":"Das Recovery Point Objective (RPO) beschreibt, wie viel Datenverlust - gemessen als Zeitraum - maximal akzeptabel ist.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":617,"prompt":"Ein Netzwerkadministrator benötigt eine Lösung, die mögliche Angreifer isoliert beziehungsweise anlockt und dabei hilft, die verwendete Angriffsmethode zu erkennen. Was sollte implementiert werden?","options":[["A","MFA"],["B","Screened Subnet"],["C","Captive Portal"],["D","Honeypot"]],"answers":["D"],"explanation":"Ein Honeypot ist ein Ködersystem, an dem Angriffe beobachtet und analysiert werden können, ohne Produktionssysteme direkt zu gefährden.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":618,"prompt":"Ein Netzwerkingenieur möchte Verkehr über eine Verbindung priorisieren, um die Leitung effizienter zu nutzen. Was sollte implementiert werden?","options":[["A","CDN"],["B","VPN"],["C","TTL"],["D","QoS"]],"answers":["D"],"explanation":"QoS klassifiziert und priorisiert Datenverkehr, sodass wichtige Anwendungen bevorzugt übertragen werden können.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":619,"prompt":"Was ist der letzte Schritt im Ticket-Management-Prozess?","options":[["A","An das Senior Management eskalieren."],["B","Funktionale und nicht funktionale Tests durchführen."],["C","Erkenntnisse, Ergebnisse und Lessons Learned dokumentieren."],["D","Detaillierten Aktionsplan erstellen."]],"answers":["C"],"explanation":"Zum Abschluss werden Lösung, Ergebnis und Lessons Learned dokumentiert, damit ein nachvollziehbarer Datensatz für spätere Fälle vorhanden ist.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":620,"prompt":"Ein Netzwerkadministrator richtet ein neues Discovery-Tool ein und befürchtet, dass Scans den Geschäftsbetrieb stören könnten. Welchen Scan-Typ sollte er konfigurieren?","options":[["A","Authenticated"],["B","Ad hoc"],["C","Unauthenticated"],["D","Scheduled"]],"answers":["D"],"explanation":"Ein geplanter Scan kann außerhalb der Hauptgeschäftszeiten ausgeführt werden und reduziert dadurch das Risiko von Beeinträchtigungen.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":621,"prompt":"Ein Netzwerkadministrator möchte per SNMP automatisch gewarnt werden, wenn sich der Linkstatus eines Switchports ändert. Welche SNMP-Technologie ermöglicht dies?","options":[["A","Trap"],["B","Object Identifier"],["C","String"],["D","MIB"]],"answers":["A"],"explanation":"Ein SNMP Trap ist eine unaufgeforderte Ereignismeldung eines Geräts an das Managementsystem, beispielsweise bei einem Link-Up oder Link-Down.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":622,"prompt":"Welche Zugriffsmethode ermöglicht einem Remote-Benutzer, Ressourcen wie Unternehmens-Cloud oder internes Netzwerk sicher zu nutzen, als wäre er direkt mit dem Netzwerk verbunden?","options":[["A","Jump Host"],["B","SSH"],["C","Client-to-Site-VPN"],["D","GRE-Tunnel"]],"answers":["C"],"explanation":"Ein Client-to-Site-VPN stellt eine verschlüsselte Verbindung von einem einzelnen Remote-Client zum Unternehmensnetz her.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":623,"prompt":"Ein Laptop kann die Intranet-Seite des Unternehmens nicht erreichen. `ipconfig /all` zeigt eine APIPA-Adresse aus 169.254.0.0/16. Was ist die wahrscheinlichste Ursache?","options":[["A","Zu kurze DHCP-Lease-Zeit"],["B","IIS-Serverfehler"],["C","DHCP-Adresspool erschöpft"],["D","IDS-Fehlkonfiguration"]],"answers":["C"],"explanation":"Eine APIPA-Adresse aus 169.254.0.0/16 wird automatisch vergeben, wenn der Client keinen DHCP-Lease erhält. Ein erschöpfter DHCP-Adresspool ist deshalb unter den angebotenen Ursachen die passende Erklärung.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":624,"prompt":"Welche Lösung hilft einem Netzwerkadministrator, Risiken durch externe bösartige Akteure besser zu verstehen und Erkenntnisse darüber zu gewinnen, welche Bedrohungen priorisiert werden sollten?","options":[["A","Compliance Benchmarks"],["B","CIA-Triade"],["C","SAML"],["D","Honeypot"]],"answers":["D"],"explanation":"Ein Honeypot lockt Angreifer an und ermöglicht die Beobachtung ihrer Methoden, wodurch Informationen über reale externe Bedrohungen gesammelt werden können.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":625,"prompt":"Ein Administrator möchte für einen bestimmten Tag das am häufigsten angesteuerte Ziel im Datenverkehr der gesamten Infrastruktur ermitteln. Was sollte er verwenden?","options":[["A","SNMP"],["B","Packet Capture"],["C","NetFlow"],["D","traceroute"]],"answers":["C"],"explanation":"NetFlow fasst Flow-Daten mit Quelle, Ziel und Traffic-Menge zusammen und eignet sich zur zeitbezogenen Analyse der wichtigsten Ziele.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":626,"prompt":"Drei neue Mitarbeiter können nicht auf Unternehmensressourcen zugreifen. Ihre Geräte besitzen 169.254.x.x-Adressen und können nur untereinander kommunizieren. Was muss am ehesten angepasst werden?","options":[["A","Routingtabelle des Gateways"],["B","DNS-Konfiguration des Routers"],["C","DHCP-Pool"],["D","Workstation-Firewall"]],"answers":["C"],"explanation":"Wenn die neuen Geräte nur untereinander kommunizieren, besitzen sie wahrscheinlich keine vollständige, vom Unternehmens-DHCP gelieferte Konfiguration. Der DHCP-Pool muss auf freie Adressen und passende Optionen geprüft beziehungsweise erweitert werden.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":627,"prompt":"Ein Administrator kauft ein Hypervisor-Add-on, das Netzwerkverkehr zwischen virtuellen Maschinen sichtbar macht. Wie wird dieser Verkehr bezeichnet?","options":[["A","North-South"],["B","Egress"],["C","Ingress"],["D","East-West"]],"answers":["D"],"explanation":"Datenverkehr zwischen Systemen innerhalb derselben virtuellen Umgebung wird als East-West-Traffic bezeichnet.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":628,"prompt":"Ein Analyst stellt fest, dass ein umfunktionierter DNS-Server einen offenen Port besitzt, der nicht benötigt wird. Welcher Port sollte deaktiviert werden?","options":[["A","21"],["B","22"],["C","53"],["D","80"]],"answers":["D"],"explanation":"DNS benötigt Port 53. Port 80 gehört zu HTTP und ist für einen reinen DNS-Dienst nicht erforderlich; unnötige Dienste sollten deaktiviert werden.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":629,"prompt":"Ein Netzwerkingenieur möchte sehen, welche Ports und TCP-Verbindungen aktuell von einem Clientgerät aufgebaut sind. Die Ausgabe zeigt lokale und entfernte Adressen sowie Zustände wie ESTABLISHED und TIME_WAIT. Welcher Befehl wurde verwendet?","options":[["A","nslookup"],["B","dig"],["C","nmap"],["D","netstat"]],"answers":["D"],"explanation":"netstat zeigt aktive Netzwerkverbindungen, Ports und Verbindungszustände an.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":631,"prompt":"Ein bestimmter Benutzer kann nicht auf einen Server zugreifen, während andere Benutzer im Unternehmen den Server problemlos erreichen. Switch- und Router-Logs zeigen keine Auffälligkeiten. Welchen Troubleshooting-Schritt sollte der Techniker als Nächstes durchführen?","options":[["A","Firewall-Konfiguration des Clients prüfen."],["B","Firmware der Netzwerkgeräte aktualisieren."],["C","DNS-Konfiguration des Servers prüfen."],["D","Event Logs des Servers prüfen."]],"answers":["A"],"explanation":"Da nur ein einzelner Benutzer betroffen ist, liegt die Ursache wahrscheinlich lokal am Client. Eine Client-Firewall könnte den Verkehr zum Server blockieren.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":632,"prompt":"Ein Unternehmen modernisiert sein WLAN. Bisher sendet jeder AP je nach Standort einen anderen WLAN-Namen aus. Welche Konfiguration ermöglicht einen einzigen WLAN-Namen im gesamten Gebäude?","options":[["A","ESSID"],["B","Wireless Mesh"],["C","Band Steering"],["D","WPA3"]],"answers":["A"],"explanation":"Ein ESSID ermöglicht mehreren Access Points, denselben Netzwerknamen bereitzustellen und unterstützt damit ein zusammenhängendes WLAN mit Roaming.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":633,"prompt":"Ein Netzwerkadministrator muss Core-Switches mit mehreren Verbindungen zwischen Rechenzentren konfigurieren. Gefordert sind Fehlertoleranz, Redundanz, Herstellerkompatibilität, höhere Bandbreite, Kosteneffizienz und einfache Verwaltung. Was sollte konfiguriert werden?","options":[["A","Spanning Tree"],["B","Interface-Geschwindigkeit auf 10 Gbit/s setzen"],["C","Link Aggregation"],["D","Jumbo Frames"]],"answers":["C"],"explanation":"Link Aggregation fasst mehrere physische Links zu einer logischen Verbindung zusammen und bietet Redundanz sowie mehr Bandbreite. Mit LACP ist außerdem herstellerübergreifende Interoperabilität möglich.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":634,"prompt":"Ein Netzwerktechniker muss Dateien remote und sicher übertragen. Welchen Port sollte er verwenden?","options":[["A","20"],["B","22"],["C","23"],["D","25"]],"answers":["B"],"explanation":"Port 22 wird von SSH und darauf aufbauenden sicheren Dateiübertragungen wie SFTP verwendet.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":635,"prompt":"Eine Firewall empfängt Datenverkehr auf Port 80 und leitet ihn an einen internen Server auf Port 88 weiter. Welche Technologie wird verwendet?","options":[["A","TLS"],["B","FHRP"],["C","SSL"],["D","PAT"]],"answers":["D"],"explanation":"PAT kann externe Portnummern auf andere interne Portnummern übersetzen und damit eingehenden Verkehr auf einen internen Dienst weiterleiten.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":636,"prompt":"Ein Cloud-Administrator muss sicherstellen, dass sämtliche Zugriffe auf Social-Media-Websites verboten sind. Welche Lösung sollte eingesetzt werden?","options":[["A","NAC"],["B","Screened Subnet"],["C","VPN"],["D","Content Filter"]],"answers":["D"],"explanation":"Ein Content Filter kann Website-Kategorien wie Social Media anhand definierter Richtlinien sperren.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":637,"prompt":"Welche Lösung wird eingesetzt, um Taktiken, Techniken und Vorgehensweisen bösartiger Akteure zu erfassen und dadurch die Netzwerksicherheit zu verbessern?","options":[["A","Jumpbox"],["B","IDS"],["C","Honeynet"],["D","IPS"]],"answers":["C"],"explanation":"Ein Honeynet besteht aus mehreren Ködersystemen und dient dazu, Verhalten und TTPs von Angreifern zu beobachten und zu analysieren.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":638,"prompt":"Welche OSI-Schicht ist dafür zuständig, Benutzereingaben über eine GUI entgegenzunehmen?","options":[["A","Layer 1"],["B","Layer 3"],["C","Layer 5"],["D","Layer 7"]],"answers":["D"],"explanation":"Die Anwendungsschicht (Layer 7) stellt Schnittstellen bereit, über die Benutzer mit Anwendungen und Netzwerkdiensten interagieren.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":639,"prompt":"Alle Netzwerkports sollen nur authentifizierte Geräte zulassen. Zusätzlich werden geringes Spoofing-Risiko, zentrale Verwaltung und auditierbare Protokolle gefordert. Welche Technologie bietet diese Funktionen?","options":[["A","ACLs"],["B","MAC-Filterung"],["C","802.1X"],["D","Port Security"]],"answers":["C"],"explanation":"802.1X bietet portbasierte Zugriffskontrolle mit zentraler Authentifizierung, beispielsweise über RADIUS, und ermöglicht eine protokollierbare Zugangskontrolle.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":640,"prompt":"Benutzer in einem 186-m²-Büro verlieren beim Herumlaufen regelmäßig die WLAN-Verbindung. Vorne und hinten im Büro befindet sich jeweils ein Access Point. Eine Geräteanalyse zeigt, dass Clients teils an APs mit schwachem Signal festhalten. Was sollte der Ingenieur untersuchen?","options":[["A","Roaming-Konfiguration"],["B","Kanalbreiten"],["C","Verwendete Frequenzbänder"],["D","TX-Leistungspegel"]],"answers":["A"],"explanation":"Das Problem tritt beim Wechsel zwischen Abdeckungsbereichen auf. Clients scheinen nicht sauber zum näheren AP zu wechseln, was auf eine Roaming-Konfiguration hinweist.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":641,"prompt":"Welcher Faktor ist für zukünftiges Wachstum der physischen Ausrüstung in einem IDF am wichtigsten?","options":[["A","Abschließbarkeit"],["B","Verkabelung"],["C","Patchpanel"],["D","Rackgröße"]],"answers":["D"],"explanation":"Die Rackgröße beziehungsweise verfügbare Rack-Kapazität bestimmt direkt, wie viel zusätzliche Hardware später eingebaut werden kann.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":642,"prompt":"Ein Netzwerkadministrator stellt fest, dass drei Computer nicht mehr mit dem Netzwerk kommunizieren. Welcher Befehl hilft am besten festzustellen, ob ein anderes Gerät Pakete auf dem Pfad blockiert?","options":[["A","ipconfig"],["B","traceroute"],["C","nmap"],["D","ping"]],"answers":["B"],"explanation":"traceroute zeigt den Pfad und kann erkennen lassen, an welchem Hop Pakete nicht mehr weitergeleitet beziehungsweise beantwortet werden.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":643,"prompt":"Eine Sicherheitsrichtlinie verlangt, dass sämtlicher Netzwerkverkehr von Remote-Mitarbeitern über das Unternehmens-VPN läuft. Welche Zugriffsmethode beschreibt dies?","options":[["A","Clientless VPN"],["B","Full-Tunnel"],["C","Site-to-Site Tunnel"],["D","Split-Tunnel"]],"answers":["B"],"explanation":"Bei einem Full-Tunnel-VPN läuft der gesamte Clientverkehr einschließlich öffentlichem Internetverkehr durch den VPN-Tunnel und das Unternehmensnetz.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":644,"prompt":"Welchen Port verwendet RDP standardmäßig?","options":[["A","22"],["B","53"],["C","443"],["D","3389"]],"answers":["D"],"explanation":"Remote Desktop Protocol (RDP) verwendet standardmäßig Port 3389.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":645,"prompt":"Welches Cloud-Servicemodell überträgt dem Kunden unter den genannten Optionen die größte Verantwortung?","options":[["A","PaaS"],["B","NaaS"],["C","IaaS"],["D","SaaS"]],"answers":["C"],"explanation":"Bei IaaS stellt der Anbieter vor allem Compute-, Netzwerk- und Speicherinfrastruktur bereit. Betriebssystem, Anwendungen und viele Konfigurationen liegen weiterhin in der Verantwortung des Kunden.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":646,"prompt":"Welcher Verkehrstyp beschreibt eine Kommunikation von einer Quelle zu genau einem Ziel?","options":[["A","Broadcast"],["B","Unicast"],["C","Multicast"],["D","Anycast"]],"answers":["B"],"explanation":"Unicast ist eine Eins-zu-eins-Kommunikation zwischen genau einem Sender und einem Empfänger.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":647,"prompt":"Zusätzliche APs sollen die WLAN-Abdeckung vergrößern, aber es stehen keine Ethernetanschlüsse zur Verfügung. Welche Lösung erfüllt die Aufgabe?","options":[["A","PoE aktivieren"],["B","Band Steering"],["C","Mesh-Bereitstellung"],["D","Richtantennen"]],"answers":["C"],"explanation":"In einem Wireless Mesh können APs ihre Backhaul-Verbindung drahtlos untereinander aufbauen und benötigen nicht zwingend an jedem Standort ein Ethernetkabel.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":648,"prompt":"Eine Imaging-Workstation in einem Krankenhaus hat sporadische Verbindungsabbrüche. Welche Lösung behebt das Problem am wahrscheinlichsten mit geringsten Kosten?","options":[["A","Singlemode-Glasfaser"],["B","Twinaxialkabel"],["C","Spanning Tree"],["D","Shielded Twisted Pair"]],"answers":["D"],"explanation":"Geschirmtes Twisted-Pair-Kabel (STP) reduziert elektromagnetische Störungen, die in Umgebungen mit medizinischen Geräten auftreten können, und ist günstiger als eine Glasfaserumrüstung.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":649,"prompt":"Welche VPN-Konfiguration zwingt einen Remote-Benutzer dazu, auch öffentliche Internetressourcen über das Unternehmensnetz aufzurufen?","options":[["A","Clientless"],["B","Site-to-Site"],["C","SSE"],["D","Full-Tunnel"]],"answers":["D"],"explanation":"Ein Full-Tunnel-VPN leitet sämtlichen Verkehr des Benutzers über das Unternehmensnetz.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":650,"prompt":"Welche Einstellung sollte ein Techniker ändern, damit ein neuer DNS-Eintrag möglichst schnell verbreitet wird?","options":[["A","MX"],["B","CNAME"],["C","PTR"],["D","TTL"]],"answers":["D"],"explanation":"Eine niedrigere TTL (Time to Live) verkürzt die Zeit, für die Resolver einen DNS-Eintrag cachen, und beschleunigt damit die Übernahme von Änderungen.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":651,"prompt":"Welcher 802.11-Standard wurde für die Nutzung des 6-GHz-Bands und Kanalbreiten bis 320 MHz entwickelt?","options":[["A","802.11ac"],["B","802.11ax"],["C","802.11be"],["D","802.11g"]],"answers":["C"],"explanation":"802.11be (Wi-Fi 7) unterstützt 6 GHz und besonders breite Kanäle bis 320 MHz.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":652,"prompt":"Welche Social-Engineering-Art verwendet ausschließlich Textnachrichten als Angriffsweg?","options":[["A","Vishing"],["B","Phishing"],["C","Smishing"],["D","Quishing"]],"answers":["C"],"explanation":"Smishing ist Phishing über SMS beziehungsweise Textnachrichten.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":653,"prompt":"Ein Netzwerkadministrator möchte mit einem Analysetool einen ganz bestimmten Access Point während einer 802.11ax-Migration identifizieren. Welche Kennung sollte angezeigt werden, um genau diesen AP zu identifizieren?","options":[["A","SSID"],["B","RSSI"],["C","Kanalnummer"],["D","BSSID"],["E","ESSID"]],"answers":["D"],"explanation":"Die BSSID entspricht der eindeutigen MAC-basierten Kennung eines konkreten Access Points beziehungsweise Radios und unterscheidet ihn von anderen APs mit derselben SSID.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":654,"prompt":"Ein neuer Mitarbeiter kann keine Verbindung zum Netzwerk herstellen. Die IP-Konfiguration ist korrekt, der TCP/IP-Stack funktioniert, aber das Gateway ist nicht erreichbar. Was sollte der IT-Support als Nächstes prüfen?","options":[["A","DHCP-Konfiguration auf der Workstation"],["B","VLAN-Zuweisung des Switchports"],["C","DHCP-Konfiguration auf dem Router"],["D","Standardgateway auf dem Switch"]],"answers":["B"],"explanation":"Wenn IP-Einstellungen korrekt sind, das lokale Gateway aber nicht erreichbar ist, spricht dies für ein Layer-2-Problem, beispielsweise eine falsche VLAN-Zuweisung am Access-Port.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":655,"prompt":"Welche Technologie ermöglicht vielen Benutzern Internetzugriff über nur zwei öffentliche IP-Adressen?","options":[["A","EIGRP"],["B","PAT"],["C","BGP"],["D","VIP"]],"answers":["B"],"explanation":"PAT unterscheidet viele interne Verbindungen anhand von Portnummern und kann dadurch zahlreiche Clients über wenige öffentliche IP-Adressen ins Internet übersetzen.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":656,"prompt":"Ein neuer Standort benötigt Subnetze für jeweils 75 Hosts. Welches Subnetz ist am effizientesten?","options":[["A","192.168.13.0/25"],["B","192.168.13.0/26"],["C","192.168.13.0/27"],["D","192.168.13.0/28"]],"answers":["A"],"explanation":"Ein /25 bietet 126 nutzbare Hostadressen und ist die kleinste der angegebenen Optionen, die 75 Hosts aufnehmen kann.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":657,"prompt":"Welche Cloud-Lösung ist am kostengünstigsten, wenn ein Unternehmen E-Mail-Dienste bereitstellen möchte?","options":[["A","PaaS"],["B","IaaS"],["C","VPC"],["D","SaaS"]],"answers":["D"],"explanation":"Bei SaaS übernimmt der Anbieter Anwendung, Infrastruktur, Wartung und Updates. Dadurch ist der administrative Aufwand für einen Standarddienst wie E-Mail gering.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":658,"prompt":"Ein neu installierter Switch verbindet sich nicht korrekt mit dem Netzwerk. Auf der Schnittstelle werden Kollisionen beobachtet. Was ist die wahrscheinlichste Ursache?","options":[["A","Falsche Geschwindigkeit"],["B","Jumbo Frames aktiviert"],["C","Falsches VLAN"],["D","Duplex-Mismatch"]],"answers":["D"],"explanation":"Ein Duplex-Mismatch, beispielsweise Half Duplex auf einer Seite und Full Duplex auf der anderen, verursacht typischerweise Kollisionen und schlechte Verbindungsleistung.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":659,"prompt":"Ein Netzwerkadministrator möchte klassifizierte Dienste und Anwendungen im Datenverkehr priorisieren. Welche Technologie sollte verwendet werden?","options":[["A","Load Balancing"],["B","Time to Live"],["C","Quality of Service"],["D","Content Delivery Network"]],"answers":["C"],"explanation":"QoS klassifiziert Datenverkehr und weist wichtigen Anwendungen höhere Priorität beziehungsweise garantierte Ressourcen zu.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":660,"prompt":"Welche Technologie wird am ehesten als Ersatz für ein traditionelles VPN für Remote-Benutzer eingesetzt?","options":[["A","SD-WAN"],["B","SASE"],["C","Site-to-Site-VPN"],["D","Reverse Proxy"]],"answers":["B"],"explanation":"SASE (Secure Access Service Edge) kombiniert Cloud-basierte Netzwerk- und Sicherheitsfunktionen für sicheren Remote-Zugriff und kann klassische Remote-Access-VPN-Modelle ersetzen.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":661,"prompt":"Benutzer melden Leistungsprobleme und ein Netzwerkadministrator beobachtet Broadcast-Stürme. Welches Protokoll sollte konfiguriert werden?","options":[["A","Spanning Tree"],["B","EIGRP"],["C","CDP"],["D","LLDP"],["E","BGP"]],"answers":["A"],"explanation":"STP verhindert Layer-2-Schleifen, indem redundante Pfade blockiert werden, und beseitigt damit eine typische Ursache für Broadcast-Stürme.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":662,"prompt":"Welche Lösung bietet eine zentrale Authentifizierung für den Zugriff auf Netzwerkgeräte und gleichzeitig Protokollierungs-/Accounting-Funktionen?","options":[["A","TACACS+"],["B","SAML"],["C","SSO"],["D","MFA"]],"answers":["A"],"explanation":"TACACS+ stellt zentrale Authentication, Authorization und Accounting-Funktionen für die Administration von Netzwerkgeräten bereit.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":663,"prompt":"Welches Netzwerkgerät verbindet unterschiedliche Netzwerksegmente und steuert anhand von Regeln, welcher Datenverkehr zwischen diesen Segmenten erlaubt ist?","options":[["A","Firewall"],["B","AP"],["C","IDS"],["D","Unmanaged Switch"]],"answers":["A"],"explanation":"Eine Firewall kontrolliert den Verkehr zwischen Netzwerksegmenten anhand definierter Sicherheitsregeln.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":664,"prompt":"Welches Cloud-Servicemodell ermöglicht Kunden am direktesten die Nutzung einer Anwendung des Dienstanbieters?","options":[["A","NaaS"],["B","IaaS"],["C","PaaS"],["D","SaaS"]],"answers":["D"],"explanation":"Bei Software as a Service (SaaS) verwendet der Kunde die vom Anbieter betriebene Anwendung, ohne die darunterliegende Plattform oder Infrastruktur verwalten zu müssen.","topic":"Cloud, WAN & Virtualisierung","domain":"1 · Netzwerkkonzepte"},{"n":665,"prompt":"Welche Zugriffsmethode stellt eine verschlüsselte Remote-CLI-Sitzung zu einem Netzwerkgerät bereit?","options":[["A","Console"],["B","GUI"],["C","SSH"],["D","Telnet"]],"answers":["C"],"explanation":"SSH stellt eine verschlüsselte Kommandozeilensitzung für die sichere Remote-Verwaltung bereit.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":666,"prompt":"Ein Systemadministrator untersucht Probleme mit einem DNS-Server. Ein Remote-Scan zeigt, dass UDP 53 offen, aber TCP 53 geschlossen ist. Was sollte der Administrator untersuchen?","options":[["A","URL-Filter"],["B","Ungenutzte Dienste"],["C","Firewallregeln"],["D","802.1X am Switch"]],"answers":["C"],"explanation":"DNS verwendet sowohl UDP als auch TCP auf Port 53. Wenn TCP 53 blockiert ist, sollten die Firewallregeln geprüft und entsprechend angepasst werden.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":667,"prompt":"Ein einzelnes Gerät verliert immer wieder die WLAN-Verbindung. Ein Netzwerkingenieur möchte genau dieses Gerät in einem Packet Capture isolieren. Welches Merkmal sollte als Filter verwendet werden?","options":[["A","ESSID"],["B","MAC-Adresse"],["C","PSK"],["D","BSSID"]],"answers":["B"],"explanation":"Die MAC-Adresse identifiziert die Netzwerkschnittstelle des konkreten Endgeräts eindeutig und eignet sich daher zum Filtern seines Datenverkehrs.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":668,"prompt":"Welche der folgenden Komponenten bildet typischerweise den zentralen Kernpunkt einer Gebäudenetzwerkverkabelung?","options":[["A","MDF"],["B","MTU"],["C","MPO"],["D","MIB"]],"answers":["A"],"explanation":"Der Main Distribution Frame (MDF) ist der zentrale Verteilpunkt, an dem wichtige Netzwerkverbindungen zusammenlaufen.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":669,"prompt":"Wie greift ein Administrator von einem externen Standort am sichersten auf ein Netzwerkgerät zu?","options":[["A","RDP"],["B","Telnet"],["C","FTPS"],["D","SSH"]],"answers":["D"],"explanation":"SSH verschlüsselt die Remote-Managementverbindung und schützt Anmeldedaten sowie Sitzungsinhalte über unsichere Netze.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":670,"prompt":"Eine Recovery-Strategie verlangt, dass höchstens acht Stunden Datenverlust auftreten dürfen. Welche DR-Metrik beschreibt dies?","options":[["A","RPO"],["B","MTTR"],["C","RTO"],["D","MTBF"]],"answers":["A"],"explanation":"Das Recovery Point Objective (RPO) beschreibt den maximal akzeptablen Datenverlust in Form eines Zeitfensters.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":671,"prompt":"Ein Angriff auf einen internen Server wird auf ein isoliertes Gastnetz zurückverfolgt. Welcher Angriff beschreibt dies am besten?","options":[["A","On-Path"],["B","DNS-Poisoning"],["C","VLAN-Hopping"],["D","ARP-Spoofing"]],"answers":["C"],"explanation":"VLAN-Hopping ermöglicht das unberechtigte Überwinden der vorgesehenen VLAN-Trennung und damit Verkehr vom Gast-VLAN in ein internes VLAN.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":672,"prompt":"Eine öffentliche Bibliothek möchte ein WLAN bereitstellen, bei dem Benutzer sich zunächst verbinden und anschließend über HTTPS mit bereitgestellten Zugangsdaten authentifizieren müssen. Welche Technologie erfüllt diese Anforderung?","options":[["A","WPA3"],["B","Captive Portal"],["C","Single Sign-On"],["D","SAML"]],"answers":["B"],"explanation":"Ein Captive Portal leitet WLAN-Benutzer auf eine webbasierte Anmeldeseite um, bevor Netzwerkzugriff freigeschaltet wird.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":673,"prompt":"Wie heißt der Angriff, bei dem eine Person im Vorbeigehen unbefugt Informationen auf dem Bildschirm eines anderen Benutzers liest?","options":[["A","Dumpster Diving"],["B","Phishing"],["C","Shoulder Surfing"],["D","Tailgating"]],"answers":["C"],"explanation":"Shoulder Surfing bezeichnet das unbemerkte visuelle Ausspähen vertraulicher Informationen auf Bildschirm, Tastatur oder Arbeitsplatz.","topic":"Sicherheit","domain":"4 · Netzwerksicherheit"},{"n":674,"prompt":"Welche Verbindungsmethode ermöglicht einem Netzwerkingenieur die automatisierte Bereitstellung von Konfigurationen auf vielen Netzwerkgeräten?","options":[["A","RDP"],["B","Telnet"],["C","GUI"],["D","API"]],"answers":["D"],"explanation":"Eine API ermöglicht programmatische und automatisierte Interaktionen mit Geräten und eignet sich daher für wiederholbare Konfigurationsbereitstellung.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":675,"prompt":"Ein Unternehmen migriert von analoger Telefonie zu einer gehosteten VoIP-/Softwarelösung mit Video. Seitdem treten bei lokalen Benutzern ab dem Vormittag bis zum Nachmittag Gesprächsabbrüche, beschädigtes Video und langsamer Internetzugriff auf. Remote-Benutzer sind nicht betroffen. Was ist die wahrscheinlichste Ursache?","options":[["A","Roaming-Fehlkonfiguration"],["B","Signalverschlechterung"],["C","Unzureichende Bandbreite"],["D","Falsch verdrahtetes Kabel"]],"answers":["C"],"explanation":"VoIP und Video erhöhen zu den Hauptgeschäftszeiten die lokale Netzwerklast erheblich. Unzureichende Bandbreite passt zu den zeitabhängigen Problemen mehrerer Anwendungen.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":676,"prompt":"Was ist ein Vorteil eines IDS gegenüber einem IPS?","options":[["A","Ein IDS benötigt immer weniger Rechenleistung."],["B","Ein IDS ist bei der Erstbereitstellung weniger störend."],["C","Ein IDS ist leichter gegen Zugriff abzusichern."],["D","Ein IDS ist grundsätzlich genauer."]],"answers":["B"],"explanation":"Ein IDS wird üblicherweise passiv beziehungsweise out-of-band eingesetzt und blockiert keinen Verkehr. Dadurch kann es zunächst überwachen, ohne den Produktionsverkehr direkt zu beeinflussen.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":677,"prompt":"Ein Administrator untersucht ein Layer-3-Kommunikationsproblem zwischen Webserver und Datenbankserver. Der Webserver verwendet /24, der Datenbankserver /25, obwohl beide im Bereich 192.168.1.x miteinander kommunizieren sollen. Welche Änderung behebt das Problem?","options":[["A","Subnetzmaske des Datenbankservers auf 255.255.255.0 ändern."],["B","Subnetzmaske der Firewall auf 255.255.255.128 ändern."],["C","Standardgateway des Datenbankservers auf 1.2.3.4 ändern."],["D","IP des Datenbankservers auf 192.168.1.150 ändern."],["E","Gateway der Firewall auf 192.168.1.1 ändern."]],"answers":["A"],"explanation":"Durch die /25-Maske bewertet der Datenbankserver bestimmte 192.168.1.x-Adressen als anderes Subnetz. Mit 255.255.255.0 (/24) liegen beide Server im selben lokalen Netz.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":678,"prompt":"Ein Netzwerkadministrator verbindet einen Ethernet-Knoten über einen Medienkonverter mit Glasfaser. Es gibt kein Linklicht. Beide Enden sitzen korrekt, Kabeltests sind erfolgreich, der Medienkonverter ist eingeschaltet und der Switchport ist auf Half Duplex eingestellt. Was ist die wahrscheinlichste Ursache?","options":[["A","TX/RX sind vertauscht."],["B","Der Switchport ist falsch konfiguriert."],["C","Ein Kabel hat einen Kurzschluss."],["D","Das Interface hat Fehlerzähler."]],"answers":["A"],"explanation":"Bei Duplex-Glasfaser muss TX der einen Seite auf RX der anderen Seite treffen. Ist die Polarität falsch, entsteht trotz intakter Kabel kein physischer Link.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":679,"prompt":"Ein Netzwerkadministrator muss ein Class-B-Netz in Subnetze mit jeweils mindestens 1.000 Hosts aufteilen. Welche Subnetzmaske sollte verwendet werden?","options":[["A","255.255.0.0"],["B","255.255.252.0"],["C","255.255.255.0"],["D","255.255.255.128"]],"answers":["B"],"explanation":"255.255.252.0 (/22) bietet 1022 nutzbare Hostadressen pro Subnetz und erfüllt damit die Anforderung von 1.000 Hosts.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":680,"prompt":"Mehrere Mitarbeiter in einem Mehrmieter-Bürogebäude melden häufige Verbindungsabbrüche, Buffering und schlechte WLAN-Leistung. Das WLAN nutzt 2,4 GHz, die Signalstärke liegt zwischen -50 und -65 dBm und WPA2 wird verwendet. Was ist die wahrscheinlichste Ursache?","options":[["A","Kanalüberschneidung"],["B","Unzureichende WLAN-Abdeckung"],["C","AP-Antennentyp"],["D","Veraltete Verschlüsselung"]],"answers":["A"],"explanation":"Im 2,4-GHz-Band gibt es nur wenige nicht überlappende Kanäle. In einem Mehrmietergebäude ist starke Nachbarinterferenz beziehungsweise Channel Overlap daher eine wahrscheinliche Ursache, während die gemessenen Signalpegel akzeptabel sind.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":681,"prompt":"Ein Kunde meldet, dass Netzwerkressourcen nach kürzlich vorgenommenen Netzwerkänderungen nicht mehr erreichbar sind. Der Techniker stellt fest, dass ein neues logisches Design das Netzwerk mithilfe von Tags segmentiert. Welches Gerät sollte am wahrscheinlichsten überprüft werden, um die Verbindungen wiederherzustellen?","options":[["A","Access Point"],["B","Firewall"],["C","Switch"],["D","Load Balancer"]],"answers":["C"],"explanation":"VLAN-Tagging wird hauptsächlich auf Switches umgesetzt. Deshalb sollten VLAN-Zuweisungen, Trunk-Ports und zugelassene VLANs auf den Switches geprüft werden.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":682,"prompt":"Ein Techniker steckt ein Ethernetkabel in einen Switchport, um ein neues Gerät anzuschließen. Das Gerät erhält keine aktive Netzwerkverbindung. Zuvor wurden ungenutzte Switchports im Rahmen des Hardening manuell abgeschaltet. Wie lautet der Portstatus?","options":[["A","Error-disabled"],["B","Idle"],["C","Suspended"],["D","Administratively down"]],"answers":["D"],"explanation":"Ein manuell mit `shutdown` deaktivierter Port befindet sich im Zustand administratively down und muss von einem Administrator wieder aktiviert werden.","topic":"Switching, VLAN & STP","domain":"2 · Netzwerkimplementierung"},{"n":683,"prompt":"Nach einer Gebäuderenovierung häufen sich während der Mittagspause Meldungen über ein langsames Netzwerk. Eine Leitung aus dem Serverraum führt durch einen Pausenraum mit bekannten starken Störquellen. Welcher Kabeltyp sollte verwendet werden, um das Problem kostengünstig zu lösen?","options":[["A","Singlemode-Glasfaser"],["B","Multimode-Glasfaser"],["C","Unshielded Twisted Pair"],["D","Shielded Twisted Pair"]],"answers":["D"],"explanation":"Shielded Twisted Pair (STP) reduziert elektromagnetische Störungen und ist in der Regel günstiger als eine Glasfaserlösung.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":684,"prompt":"Ein Benutzer meldet, dass er keinerlei Websites erreichen kann und bereits selbst alles auf seinem Computer überprüft habe. Was sollte der Netzwerkadministrator zuerst tun?","options":[["A","Divide and Conquer anwenden."],["B","Theorie zur wahrscheinlichen Ursache aufstellen."],["C","Den Benutzer befragen."],["D","Erkenntnisse dokumentieren."]],"answers":["C"],"explanation":"Der erste Schritt ist das Identifizieren des Problems. Dazu gehört, den Benutzer zu Symptomen, Umfang, letzten Änderungen und bereits ausgeführten Maßnahmen zu befragen.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":685,"prompt":"Ein Netzwerktechniker fügt eine Sicherheitskamera mit einem Zusatzgerät/Enhancer hinzu. Der Switch besitzt 24 Ports, ein PoE-Budget von 124 W und liefert maximal 16 W pro Port. Sechs APs benötigen jeweils 12 W. Die Kamera benötigt 14 W und der Enhancer 4 W auf derselben Verbindung. Warum funktioniert die Kamera wahrscheinlich nicht?","options":[["A","Zu viel Crosstalk."],["B","Das gesamte PoE-Budget ist überschritten."],["C","Das Kabel ist falsch terminiert."],["D","Die einzelne Verbindung überschreitet die maximal erlaubte Leistung pro Port."]],"answers":["D"],"explanation":"Kamera und Enhancer benötigen zusammen 18 W, der Switch kann pro Port jedoch maximal 16 W liefern. Das Gesamtbudget ist nicht das entscheidende Problem, sondern die Leistungsgrenze des einzelnen Ports.","topic":"Kabel, Stecker & Hardware","domain":"2 · Netzwerkimplementierung"},{"n":686,"prompt":"Einige neu installierte Wireless Access Points senden kein WLAN aus. Was ist die wahrscheinlichste Ursache?","options":[["A","PoE-Power-Budget überschritten"],["B","Falsche VLAN-Zuweisung"],["C","Zu geringe Signalstärke"],["D","Uplink-Transceiver falsch konfiguriert"]],"answers":["A"],"explanation":"Viele APs werden über PoE versorgt. Ist das Power Budget des Switches ausgeschöpft, können zusätzliche APs nicht vollständig starten und deshalb keine SSID ausstrahlen.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":687,"prompt":"Welche Lösung ermöglicht nach einem katastrophalen Ereignis die schnellste Wiederherstellung?","options":[["A","Warm Site"],["B","Asynchrone Replikation"],["C","Cold Site"],["D","Hot Site"]],"answers":["D"],"explanation":"Eine Hot Site ist bereits ausgestattet, konfiguriert und nahezu sofort betriebsbereit und ermöglicht deshalb die schnellste Wiederaufnahme des Betriebs.","topic":"Betrieb, Monitoring & Notfallplanung","domain":"3 · Netzwerkbetrieb"},{"n":688,"prompt":"Nach einem längeren Stromausfall können Benutzer nicht mehr auf einen bestimmten IPv4-Drucker drucken. Was sollte ein Techniker konfigurieren?","options":[["A","DoH"],["B","SLAAC"],["C","IP Helper"],["D","DHCP-Reservation"]],"answers":["D"],"explanation":"Eine DHCP-Reservation stellt sicher, dass der Drucker nach Neustart oder Stromausfall wieder dieselbe IPv4-Adresse erhält und bestehende Druckerzuordnungen gültig bleiben.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":689,"prompt":"Ein Unternehmen führt ein Netzwerk ein, das intern ausschließlich IPv6 verwendet, und muss damit auf das Internet zugreifen. Welche Technologie muss aktiviert werden, damit interne Clients auch IPv4-Server im Internet erreichen können?","options":[["A","MPLS"],["B","NAT64"],["C","GRE"],["D","Statisches Routing"]],"answers":["B"],"explanation":"NAT64 übersetzt zwischen IPv6-Clients und IPv4-Zielen und ermöglicht damit IPv6-only-Systemen den Zugriff auf IPv4-Dienste.","topic":"IP-Adressen & Subnetting","domain":"1 · Netzwerkkonzepte"},{"n":690,"prompt":"Welche Technologie verteilt eingehenden Verkehr von einer Quelle auf mehrere Server, die denselben Dienst bereitstellen?","options":[["A","Router"],["B","Switch"],["C","Firewall"],["D","Load Balancer"]],"answers":["D"],"explanation":"Ein Load Balancer verteilt Anfragen auf mehrere gleichartige Backend-Server und verbessert damit Leistung, Skalierbarkeit und Verfügbarkeit.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":691,"prompt":"Ein Systemadministrator richtet einen neuen Domainserver ein. Welcher Firewallport muss geöffnet werden, damit sichere LDAP-Kommunikation zwischen Domain und Desktops möglich ist?","options":[["A","389"],["B","587"],["C","636"],["D","3389"]],"answers":["C"],"explanation":"LDAPS verwendet TCP-Port 636 für verschlüsselte LDAP-Kommunikation.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":692,"prompt":"Warum wird beim Troubleshooting eines Vorfalls zunächst ein bestimmter Lösungsansatz beziehungsweise eine Vorgehensweise gewählt?","options":[["A","Damit kein Schritt vergessen wird."],["B","Damit die Dokumentation einfacher wird."],["C","Um Ressourcen effizient einzusetzen."],["D","Um festzustellen, ob sich etwas geändert hat."]],"answers":["C"],"explanation":"Die Auswahl einer geeigneten Troubleshooting-Strategie berücksichtigt Umfang, Dringlichkeit, verfügbare Werkzeuge und Ressourcen und vermeidet unnötigen Aufwand.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":693,"prompt":"Ein Systemadministrator härtet IoT-Geräte. Das Threat Modeling zeigt, dass die Geräte vor allem von technisch wenig anspruchsvollen Angreifern ins Visier genommen werden könnten. Welche Aufgabe hat höchste Priorität?","options":[["A","Geräte in einem Screened Subnet bereitstellen."],["B","URL-Filterung einrichten."],["C","Standardpasswörter ändern."],["D","Port Security implementieren."]],"answers":["C"],"explanation":"IoT-Geräte werden häufig mit öffentlich bekannten Standardzugangsdaten angegriffen. Das Ändern dieser Passwörter beseitigt einen besonders einfachen und verbreiteten Angriffsweg.","topic":"Netzwerkgrundlagen","domain":"1 · Netzwerkkonzepte"},{"n":694,"prompt":"Ein Netzwerkadministrator erstellt einen DHCP-Scope mit 100 nutzbaren IP-Adressen. Die ersten zehn Adressen sollen nicht dynamisch vergeben, sondern statisch für Drucker genutzt werden. Welcher DHCP-Parameter eignet sich dafür am besten?","options":[["A","Reservation"],["B","Exclusion"],["C","IP Helper"],["D","Option"]],"answers":["B"],"explanation":"Eine DHCP Exclusion schließt bestimmte Adressen aus dem dynamischen Pool aus, sodass diese gefahrlos statisch vergeben werden können.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":695,"prompt":"Welche OSI-Schicht ist für die logische IP-Adressierung eines Hosts zuständig?","options":[["A","Data Link"],["B","Application"],["C","Network"],["D","Session"]],"answers":["C"],"explanation":"Die Vermittlungsschicht (Network Layer, Layer 3) verwendet logische IP-Adressen für Identifikation und Routing zwischen Netzen.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":696,"prompt":"Welche Recovery-Strategie sollte ein Unternehmen einsetzen, damit Rechenzentrumsdienste nach einem Desaster schnell wiederhergestellt und erreichbar sind?","options":[["A","Backup- und Replikationssoftware"],["B","Active-Passive-Ansatz"],["C","Cloud Computing"],["D","Manueller Remote-Failover"]],"answers":["B"],"explanation":"Bei Active-Passive steht eine passive Ersatzumgebung bereit, die bei Ausfall des Primärsystems übernehmen kann und dadurch eine schnelle Wiederherstellung ermöglicht.","topic":"Ports, Protokolle & Dienste","domain":"1 · Netzwerkkonzepte"},{"n":697,"prompt":"Ein Netzwerkadministrator möchte die Geräte begrenzen, die sich mit einem kleinen WLAN verbinden dürfen. Das Netzwerk umfasst weniger als zehn bekannte Laptops und Änderungen sind nicht zu erwarten. Was ist die einfachste Lösung?","options":[["A","ACLs"],["B","MAC-Filterung"],["C","NAC"],["D","Trusted Zones"]],"answers":["B"],"explanation":"Bei einer sehr kleinen, stabilen Geräteliste ist MAC-Filterung eine einfache Möglichkeit, nur bekannte Geräte zuzulassen.","topic":"WLAN","domain":"2 · Netzwerkimplementierung"},{"n":698,"prompt":"Ein Netzwerkadministrator entdeckt verdächtigen Datenverkehr und kennt bereits dessen Quell-IP. Zusätzlich zu `arp` möchte er das konkrete Quellgerät im Netzwerk lokalisieren. Welchen Befehl sollte er verwenden?","options":[["A","show mac-address-table"],["B","ping"],["C","show interface"],["D","show vlan"],["E","traceroute"]],"answers":["A"],"explanation":"Mit `arp` lässt sich die IP-Adresse einer MAC-Adresse zuordnen. Anschließend zeigt `show mac-address-table`, an welchem Switchport diese MAC-Adresse gelernt wurde.","topic":"Fehlersuche & Werkzeuge","domain":"5 · Netzwerk-Fehlerbehebung"},{"n":699,"prompt":"Welche Administrative Distance besitzen interne BGP-Routen standardmäßig?","options":[["A","20"],["B","110"],["C","170"],["D","200"]],"answers":["D"],"explanation":"iBGP besitzt standardmäßig eine Administrative Distance von 200.","topic":"Routing & NAT","domain":"2 · Netzwerkimplementierung"},{"n":700,"prompt":"Nach der Installation neuer IoT-Geräte im Krankenhaus treten auf deren WLAN sporadische Verbindungsprobleme auf. Die vorhandene Stations-SSID nutzt im 2,4-GHz-Band Kanal 1, das neue IoT-WLAN Kanal 5. Was verursacht das Problem am wahrscheinlichsten?","options":[["A","Schlechter RSSI"],["B","Falsche Kanalbreite"],["C","Frequenz-/Kanalüberschneidung"],["D","Roaming-Fehlkonfiguration"]],"answers":["C"],"explanation":"Im 2,4-GHz-Band sind typischerweise 1, 6 und 11 die nicht überlappenden 20-MHz-Kanäle. Kanal 5 überschneidet sich st
